<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hra 1 — Sekvence</title>
<style>
  /* Stejná obálka jako algorithm-steps.html — žádné vh jednotky. */
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  #frame {
    width: 100%; height: 100%; background: #000;
    border: 1px solid #fff; border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column; padding: 3.5%;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    color: #fff; letter-spacing: -0.02em; user-select: none;
  }
  .hint { font-size: 12px; line-height: 1.25; color: #d0d0d0; margin: 0 0 2% 0; min-height: 30px; }
  .hint b { color: #ffff00; font-weight: 600; }
  .grid-wrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .grid { display: grid; gap: 4px; width: 100%; max-width: 62%; }
  .cell { aspect-ratio: 1/1; border: 1px solid #333; border-radius: 6px; background: #0d0d0d;
          display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
  .cell.goal { border-color: #ffff00; }
  .cell.win { background: #ffff00; }
  .tok { font-size: 22px; line-height: 1; }
  .strip { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 30px;
           margin: 2% 0; padding: 4px; border: 1px dashed #333; border-radius: 8px; }
  .strip:empty::before { content: "Sem přidej kroky ↓"; color: #555; font-size: 11px; }
  .chip { font-size: 16px; width: 26px; height: 26px; border-radius: 6px; border: 1px solid #ffff00;
          background: #1a1a00; color: #fff; display: flex; align-items: center; justify-content: center; }
  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  button { font-family: inherit; font-size: 18px; color: #fff; background: #111; border: 1px solid #444;
           border-radius: 8px; padding: 8px 0; cursor: pointer; }
  button:active { background: #ffff00; color: #000; border-color: #ffff00; }
  button:disabled { opacity: .4; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
  .go { border-color: #ffff00; font-size: 13px; font-weight: 600; }
  .clr { font-size: 13px; }
  .msg { text-align: center; font-size: 12px; min-height: 16px; margin-top: 4px; font-weight: 600; }
  .msg.ok { color: #ffff00; }
  .msg.bad { color: #ff6a6a; }
</style>
</head>
<body>
<div id="frame">
  <p class="hint">Naveď robota <b>🤖</b> ke hvězdě <b>⭐</b>. Program je <b>seznam kroků v pořadí</b> — poskládej je a stiskni <b>Spusť</b>.</p>
  <div class="grid-wrap"><div class="grid" id="grid"></div></div>
  <div class="strip" id="strip"></div>
  <div class="pad">
    <button data-mv="up">▲</button><button data-mv="down">▼</button>
    <button data-mv="left">◀</button><button data-mv="right">▶</button>
  </div>
  <div class="row">
    <button class="clr" id="clr">Znovu</button>
    <button class="go" id="go">Spusť ▶</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
  var COLS = 4, ROWS = 3;
  var START = { x:0, y:0 }, GOAL = { x:3, y:2 };
  var MOVES = { up:{dx:0,dy:-1,g:"▲"}, down:{dx:0,dy:1,g:"▼"}, left:{dx:-1,dy:0,g:"◀"}, right:{dx:1,dy:0,g:"▶"} };
  var program = [], running = false, robot = { x:START.x, y:START.y };

  var grid = document.getElementById("grid");
  var strip = document.getElementById("strip");
  var msg = document.getElementById("msg");
  grid.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)";

  function drawGrid(win){
    grid.innerHTML = "";
    for (var y=0; y<ROWS; y++){
      for (var x=0; x<COLS; x++){
        var c = document.createElement("div");
        c.className = "cell";
        if (x===GOAL.x && y===GOAL.y) c.className += " goal";
        if (win && x===robot.x && y===robot.y) c.className += " win";
        var t = "";
        if (x===robot.x && y===robot.y) t = "🤖";
        else if (x===GOAL.x && y===GOAL.y) t = "⭐";
        if (t) c.innerHTML = '<span class="tok">' + t + '</span>';
        grid.appendChild(c);
      }
    }
  }
  function drawStrip(){
    strip.innerHTML = "";
    program.forEach(function(mv, i){
      var b = document.createElement("button");
      b.className = "chip"; b.textContent = MOVES[mv].g; b.title = "Odebrat";
      b.onclick = function(){ if (running) return; program.splice(i,1); drawStrip(); };
      strip.appendChild(b);
    });
  }
  function setMsg(t, cls){ msg.textContent = t || ""; msg.className = "msg" + (cls ? " " + cls : ""); }

  document.querySelectorAll("[data-mv]").forEach(function(btn){
    btn.onclick = function(){ if (running) return; if (program.length>=10) return; program.push(btn.dataset.mv); drawStrip(); setMsg(""); };
  });
  document.getElementById("clr").onclick = function(){ if (running) return; program=[]; robot={x:START.x,y:START.y}; drawStrip(); drawGrid(); setMsg(""); };

  document.getElementById("go").onclick = function(){
    if (running || !program.length) return;
    running = true; robot = { x:START.x, y:START.y }; drawGrid(); setMsg("");
    var i = 0;
    var t = setInterval(function(){
      if (i >= program.length){
        clearInterval(t); running = false;
        if (robot.x===GOAL.x && robot.y===GOAL.y){ drawGrid(true); setMsg("Cíl! 🎉 Kroky ve správném pořadí = program.", "ok"); }
        else setMsg("Skoro! Robot došel jinam. Uprav pořadí kroků.", "bad");
        return;
      }
      var m = MOVES[program[i]]; i++;
      var nx = robot.x + m.dx, ny = robot.y + m.dy;
      if (nx<0 || nx>=COLS || ny<0 || ny>=ROWS){
        clearInterval(t); running = false;
        setMsg("Ups, robot spadl z mřížky! Zkus jinou cestu.", "bad");
        return;
      }
      robot.x = nx; robot.y = ny; drawGrid();
    }, 430);
  };

  drawGrid(); drawStrip();
})();
</script>
</body>
</html>
