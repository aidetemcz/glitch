<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hra 3 — Ladění (debug)</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  #frame {
    width: 100%; height: 100%; background: #000;
    border: 1px solid #fff; border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column; padding: 3.5%;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    color: #fff; letter-spacing: -0.02em; user-select: none;
  }
  .hint { font-size: 12px; line-height: 1.25; color: #d0d0d0; margin: 0 0 2% 0; min-height: 44px; }
  .hint b { color: #ffff00; font-weight: 600; }
  .grid-wrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .grid { display: grid; gap: 4px; width: 100%; max-width: 62%; }
  .cell { aspect-ratio: 1/1; border: 1px solid #333; border-radius: 6px; background: #0d0d0d;
          display: flex; align-items: center; justify-content: center; font-size: 18px; position: relative; }
  .cell.goal { border-color: #ffff00; }
  .cell.wall { background: #2a2a2a; border-color: #444; }
  .cell.win { background: #ffff00; }
  .cell.crash { border-color: #ff6a6a; }
  .tok { font-size: 20px; line-height: 1; }
  .lbl { font-size: 11px; color: #888; margin: 2% 0 3px; }
  .strip { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 30px;
           padding: 4px; border: 1px dashed #333; border-radius: 8px; }
  .strip:empty::before { content: "prázdný program"; color: #555; font-size: 11px; }
  .chip { font-size: 16px; width: 26px; height: 26px; border-radius: 6px; border: 1px solid #ffff00;
          background: #1a1a00; color: #fff; display: flex; align-items: center; justify-content: center; position: relative; }
  .chip.bad { border-color: #ff6a6a; box-shadow: 0 0 0 2px rgba(255,106,106,.35); }
  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 5px; }
  button { font-family: inherit; font-size: 17px; color: #fff; background: #111; border: 1px solid #444;
           border-radius: 8px; padding: 7px 0; cursor: pointer; }
  button:active { background: #ffff00; color: #000; border-color: #ffff00; }
  button:disabled { opacity: .4; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
  .go { border-color: #ffff00; font-size: 13px; font-weight: 600; }
  .clr { font-size: 13px; }
  .msg { text-align: center; font-size: 12px; min-height: 16px; margin-top: 4px; font-weight: 600; }
  .msg.ok { color: #ffff00; }
  .msg.bad { color: #ff6a6a; }
</style>
</head>
<body>
<div id="frame">
  <p class="hint">Program má <b>chybu</b> — robot 🤖 narazí do zdi ⬛. <b>Spusť</b> ho, najdi špatný krok a <b>oprav pořadí</b>. Ťukni na krok = odebrat.</p>
  <div class="grid-wrap"><div class="grid" id="grid"></div></div>
  <p class="lbl">Program:</p>
  <div class="strip" id="strip"></div>
  <div class="pad">
    <button data-mv="up">▲</button><button data-mv="down">▼</button>
    <button data-mv="left">◀</button><button data-mv="right">▶</button>
  </div>
  <div class="row">
    <button class="clr" id="clr">Vrátit zpět</button>
    <button class="go" id="go">Spusť ▶</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
  var COLS = 4, ROWS = 3;
  var START = { x:0, y:0 }, GOAL = { x:3, y:2 };
  var WALLS = [{x:1,y:0},{x:1,y:1}];
  var MOVES = { up:{dx:0,dy:-1,g:"▲"}, down:{dx:0,dy:1,g:"▼"}, left:{dx:-1,dy:0,g:"◀"}, right:{dx:1,dy:0,g:"▶"} };
  // buggy prefill: hned zprava narazí do zdi na (1,0). Oprava = nejdřív dolů.
  var PREFILL = ["right","right","right","down","down"];
  var program = PREFILL.slice(), running = false, robot = { x:START.x, y:START.y }, badIdx = -1;

  var grid = document.getElementById("grid");
  var strip = document.getElementById("strip");
  var msg = document.getElementById("msg");
  grid.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)";
  function isWall(x,y){ return WALLS.some(function(w){ return w.x===x && w.y===y; }); }

  function drawGrid(state){
    grid.innerHTML = "";
    for (var y=0; y<ROWS; y++){
      for (var x=0; x<COLS; x++){
        var c = document.createElement("div"); c.className = "cell";
        if (isWall(x,y)) c.className += " wall";
        if (x===GOAL.x && y===GOAL.y) c.className += " goal";
        if (state==="win" && x===robot.x && y===robot.y) c.className += " win";
        if (state==="crash" && x===robot.x && y===robot.y) c.className += " crash";
        var t = "";
        if (x===robot.x && y===robot.y) t = "🤖";
        else if (isWall(x,y)) t = "⬛";
        else if (x===GOAL.x && y===GOAL.y) t = "⭐";
        if (t) c.innerHTML = '<span class="tok">' + t + '</span>';
        grid.appendChild(c);
      }
    }
  }
  function drawStrip(){
    strip.innerHTML = "";
    program.forEach(function(mv, i){
      var b = document.createElement("button");
      b.className = "chip" + (i===badIdx ? " bad" : ""); b.textContent = MOVES[mv].g; b.title = "Odebrat";
      b.onclick = function(){ if (running) return; program.splice(i,1); badIdx=-1; drawStrip(); };
      strip.appendChild(b);
    });
  }
  function setMsg(t, cls){ msg.textContent = t || ""; msg.className = "msg" + (cls ? " " + cls : ""); }

  document.querySelectorAll("[data-mv]").forEach(function(btn){
    btn.onclick = function(){ if (running) return; if (program.length>=10) return; program.push(btn.dataset.mv); badIdx=-1; drawStrip(); setMsg(""); };
  });
  document.getElementById("clr").onclick = function(){ if (running) return; program=PREFILL.slice(); robot={x:START.x,y:START.y}; badIdx=-1; drawStrip(); drawGrid(); setMsg(""); };

  document.getElementById("go").onclick = function(){
    if (running || !program.length) return;
    running = true; robot = { x:START.x, y:START.y }; badIdx=-1; drawStrip(); drawGrid(); setMsg("");
    var i = 0;
    var t = setInterval(function(){
      if (i >= program.length){
        clearInterval(t); running = false;
        if (robot.x===GOAL.x && robot.y===GOAL.y){ drawGrid("win"); setMsg("Opraveno! 🎉 Ladění = najít a spravit chybný krok.", "ok"); }
        else setMsg("Robot skončil jinde než u hvězdy. Uprav kroky.", "bad");
        return;
      }
      var m = MOVES[program[i]];
      var nx = robot.x + m.dx, ny = robot.y + m.dy;
      if (nx<0 || nx>=COLS || ny<0 || ny>=ROWS || isWall(nx,ny)){
        clearInterval(t); running = false; badIdx = i; drawStrip();
        setMsg("Narazil na krok " + (i+1) + "! Tady je chyba.", "bad");
        return;
      }
      i++; robot.x = nx; robot.y = ny; drawGrid();
    }, 430);
  };

  drawGrid(); drawStrip();
})();
</script>
</body>
</html>
