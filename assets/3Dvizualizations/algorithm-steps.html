<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algoritmus krok za krokem</title>
<style>
  /* Stejná obálka jako game-of-life.html — žádné vh jednotky (nespolehlivé v iframu
     na mobilním Safari). Iframe v appce je už čtvercový, rámeček ho jen vyplní. */
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  #frame {
    width: 100%;
    height: 100%;
    background: #000;
    border: 1px solid #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-sizing: border-box;
  }
  #algoCanvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="algoCanvas"></canvas>
</div>

<script>
(function(){
  var frame = document.getElementById('frame');
  var canvas = document.getElementById('algoCanvas');
  var ctx = canvas.getContext('2d');
  var S = 0;

  var YELLOW = '#ffff00';

  // program: přesné kroky, které vykonavatel provede doslova
  var PROGRAM = [
    { label: 'polož pero',  pen: true },
    { label: 'jdi vpravo',  dx: 1, dy: 0 },
    { label: 'jdi dolů',    dx: 0, dy: 1 },
    { label: 'jdi vlevo',   dx: -1, dy: 0 },
    { label: 'jdi nahoru',  dx: 0, dy: -1 },
    { label: 'zvedni pero', pen: false }
  ];
  var N = PROGRAM.length;

  // pozice vykonavatele po každém kroku (v buňkách mřížky, krok = 2 buňky)
  var POS = [{ x: 0, y: 0 }];
  // stav pera před každým krokem
  var PEN_BEFORE = [];
  (function(){
    var p = false;
    for (var i = 0; i < N; i++){
      PEN_BEFORE[i] = p;
      var s = PROGRAM[i];
      if (s.pen !== undefined) p = s.pen;
      var l = POS[POS.length - 1];
      POS.push({ x: l.x + (s.dx || 0) * 2, y: l.y + (s.dy || 0) * 2 });
    }
  })();

  // časová osa jedné smyčky (sekundy)
  var INTRO = 0.8, HL = 0.45, MOVE = 0.85, PEN = 0.5, SETTLE = 0.22, DONE = 1.6, FADE = 0.7;
  var timeline = [];
  var TOTAL = 0;
  function addPhase(type, i, dur){
    timeline.push({ type: type, i: i, start: TOTAL, dur: dur });
    TOTAL += dur;
  }
  addPhase('intro', -1, INTRO);
  for (var i = 0; i < N; i++){
    addPhase('hl', i, HL);
    addPhase('act', i, PROGRAM[i].pen !== undefined ? PEN : MOVE);
    addPhase('settle', i, SETTLE);
  }
  addPhase('done', -1, DONE);
  addPhase('fade', -1, FADE);

  function ease(p){
    return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  }
  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function setup(){
    var w = frame.clientWidth;
    var h = frame.clientHeight;
    S = Math.min(w, h);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function cellToPx(c, cell, cx, cy){
    return { x: cx - cell + c.x * cell, y: cy - cell + c.y * cell };
  }

  function draw(now){
    var t = (now / 1000) % TOTAL;

    // aktuální fáze
    var ph = timeline[timeline.length - 1];
    for (var k = 0; k < timeline.length; k++){
      if (t < timeline[k].start + timeline[k].dur){ ph = timeline[k]; break; }
    }
    var local = (t - ph.start) / ph.dur;

    var introP = ph.type === 'intro' ? local : 1;
    var fadeAlpha = ph.type === 'fade' ? 1 - ease(local) : 1;
    var active = (ph.type === 'hl' || ph.type === 'act' || ph.type === 'settle') ? ph.i : -1;
    var completed;                       // kolik kroků je plně provedeno
    if (ph.type === 'intro') completed = 0;
    else if (ph.type === 'hl' || ph.type === 'act') completed = ph.i;
    else if (ph.type === 'settle') completed = ph.i + 1;
    else completed = N;
    var actP = ph.type === 'act' ? ease(local) : 0;

    var w = frame.clientWidth, h = frame.clientHeight;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.translate((w - S) / 2, (h - S) / 2);
    ctx.globalAlpha = fadeAlpha;

    // geometrie
    var cell = S * 0.095;
    var cx = S * 0.70, cy = S * 0.50;
    var fs = Math.max(11, S * 0.048);
    var lineH = S * 0.088;
    var listX = S * 0.115;
    var markX = S * 0.062;
    var listY0 = S * 0.5 - lineH * (N - 1) / 2;

    // mřížka (5×5 bodů)
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    var dotR = Math.max(1, S * 0.004);
    for (var gy = 0; gy < 5; gy++){
      for (var gx = 0; gx < 5; gx++){
        ctx.beginPath();
        ctx.arc(cx + (gx - 2) * cell, cy + (gy - 2) * cell, dotR, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // seznam kroků
    ctx.font = '500 ' + fs + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (var li = 0; li < N; li++){
      var y = listY0 + li * lineH;
      var appear = ph.type === 'intro' ? clamp01((introP - li * 0.09) / 0.35) : 1;
      if (appear <= 0) continue;
      if (li === active){
        // právě prováděný krok — žlutě
        var hlIn = ph.type === 'hl' ? clamp01(local / 0.4) : 1;
        ctx.fillStyle = 'rgba(255,255,0,' + (0.38 + 0.62 * hlIn).toFixed(3) + ')';
        ctx.fillText(PROGRAM[li].label, listX, y);
        // šipka ukazatele
        var ms = fs * 0.32;
        ctx.beginPath();
        ctx.moveTo(markX, y - ms);
        ctx.lineTo(markX + ms * 1.25, y);
        ctx.lineTo(markX, y + ms);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,0,' + hlIn.toFixed(3) + ')';
        ctx.fill();
      } else {
        var done = li < completed || ph.type === 'done' || ph.type === 'fade';
        ctx.fillStyle = 'rgba(255,255,255,' + ((done ? 0.78 : 0.35) * appear).toFixed(3) + ')';
        ctx.fillText(PROGRAM[li].label, listX, y);
      }
    }

    // nakreslené čáry
    ctx.strokeStyle = '#ffffff';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var lw = Math.max(2, S * 0.009);
    var donePulse = ph.type === 'done' ? Math.exp(-4 * local) : 0;
    ctx.lineWidth = lw * (1 + 0.35 * donePulse);
    ctx.beginPath();
    var started = false;
    for (var si = 0; si < N; si++){
      var st = PROGRAM[si];
      if (st.dx === undefined || !PEN_BEFORE[si]) continue;
      var a = cellToPx(POS[si], cell, cx, cy);
      var b = cellToPx(POS[si + 1], cell, cx, cy);
      if (si < completed){
        if (!started){ ctx.moveTo(a.x, a.y); started = true; }
        ctx.lineTo(b.x, b.y);
      } else if (si === active && ph.type === 'act'){
        if (!started){ ctx.moveTo(a.x, a.y); started = true; }
        ctx.lineTo(a.x + (b.x - a.x) * actP, a.y + (b.y - a.y) * actP);
      }
    }
    ctx.stroke();

    // vykonavatel — žlutá tečka (plná = pero dole, prázdná = pero nahoře)
    var epos;
    if (active >= 0 && ph.type === 'act' && PROGRAM[active].dx !== undefined){
      var pa = cellToPx(POS[active], cell, cx, cy);
      var pb = cellToPx(POS[active + 1], cell, cx, cy);
      epos = { x: pa.x + (pb.x - pa.x) * actP, y: pa.y + (pb.y - pa.y) * actP };
    } else {
      epos = cellToPx(POS[Math.min(completed, N)], cell, cx, cy);
    }
    var fillP;
    if (ph.type === 'act' && PROGRAM[active].pen !== undefined){
      fillP = PROGRAM[active].pen ? actP : 1 - actP;   // pokládání / zvedání pera
    } else if (ph.type === 'hl' || ph.type === 'act'){
      fillP = PEN_BEFORE[active] ? 1 : 0;              // stav pera před krokem
    } else if (ph.type === 'settle'){
      var s0 = PROGRAM[ph.i];
      fillP = (s0.pen !== undefined ? s0.pen : PEN_BEFORE[ph.i]) ? 1 : 0;
    } else {
      fillP = 0;                                       // intro, done, fade — pero nahoře
    }
    var er = S * 0.017;
    var pulse = (active >= 0 && ph.type === 'act' && PROGRAM[active].pen !== undefined)
      ? 1 + 0.35 * Math.sin(Math.PI * actP) : 1;
    ctx.globalAlpha = fadeAlpha * introP;
    if (fillP > 0){
      ctx.beginPath();
      ctx.arc(epos.x, epos.y, er * pulse * (0.4 + 0.6 * fillP), 0, Math.PI * 2);
      ctx.fillStyle = YELLOW;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(epos.x, epos.y, er * pulse, 0, Math.PI * 2);
    ctx.strokeStyle = YELLOW;
    ctx.lineWidth = Math.max(1.25, S * 0.0045);
    ctx.stroke();

    ctx.restore();
  }

  function loop(ts){
    requestAnimationFrame(loop);
    draw(ts);
  }

  if (window.ResizeObserver){ new ResizeObserver(setup).observe(frame); }
  window.addEventListener('resize', setup);
  setup();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
