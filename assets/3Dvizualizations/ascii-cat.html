<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII kočka</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #frame {
    width: 100%;
    max-width: 100vh;
    aspect-ratio: 1 / 1;
    background: #000;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 5px;
    overflow: hidden;
    box-sizing: border-box;
  }
  #catCanvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="catCanvas"></canvas>
</div>

<script>
(function(){
  var frame = document.getElementById('frame');
  var canvas = document.getElementById('catCanvas');
  var ctx = canvas.getContext('2d');
  var S = 0;

  // znaky od nejtmavšího po nejjasnější
  var RAMP = ['.', ':', '=', '+', '*', '#', '%', '@'];

  function hash(a, b){
    var v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
    return v - Math.floor(v);
  }
  function norm3(x, y, z){
    var l = Math.hypot(x, y, z) || 1;
    return [x / l, y / l, z / l];
  }

  // ---- stylizovaná 3D kočičí hlava (jednotky ~ poloměr hlavy = 1) ----
  var catPts = [];
  function addPt(p, n, type, jx){
    catPts.push({ x: p[0], y: p[1], z: p[2], nx: n[0], ny: n[1], nz: n[2],
                  type: type || 's', j: jx !== undefined ? jx : hash(p[0] * 57.3, p[1] * 91.7) });
  }

  // hlava: mírně zploštělý elipsoid, oči = důlky se zorničkou
  (function(){
    var RX = 1.0, RY = 0.82, RZ = 0.92;
    var EYES = [norm3(-0.42, -0.10, 0.88), norm3(0.42, -0.10, 0.88)];
    var N = 900;
    for (var i = 0; i < N; i++){
      var y = 1 - 2 * (i + 0.5) / N;
      var r = Math.sqrt(Math.max(0, 1 - y * y));
      var phi = i * 2.399963229728653;
      var d = [Math.cos(phi) * r, y, Math.sin(phi) * r];
      var isPupil = false, skip = false;
      for (var e = 0; e < 2; e++){
        var dot = d[0] * EYES[e][0] + d[1] * EYES[e][1] + d[2] * EYES[e][2];
        var ang = Math.acos(Math.max(-1, Math.min(1, dot)));
        if (ang < 0.15){ isPupil = true; }
        else if (ang < 0.34){ skip = true; }
      }
      if (skip) continue;
      var p = [d[0] * RX, d[1] * RY, d[2] * RZ];
      addPt(p, d, isPupil ? 'p' : 's');
    }
  })();

  // uši: dva kužely nakloněné ven, posazené na temeni
  (function(){
    function ear(side){
      var tilt = side * 0.5;                       // náklon ven
      var cx = side * 0.55, cy = -0.72;
      var K = 9;
      for (var k = 0; k < K; k++){
        var t = k / (K - 1);
        var ry = -0.62 * t;                        // výška prstence (nahoru)
        var rr = 0.30 * (1 - t * 0.92);
        var m = Math.max(3, Math.round(11 * (1 - t) + 3));
        for (var q = 0; q < m; q++){
          var a = (q / m) * Math.PI * 2 + hash(k, side) * 6;
          var lx = Math.cos(a) * rr, lz = Math.sin(a) * rr;
          // normála ven od osy kužele
          var n = norm3(lx, rr * 0.35, lz);
          // náklon kolem osy z
          var px = lx * Math.cos(tilt) - ry * Math.sin(tilt);
          var py = lx * Math.sin(tilt) + ry * Math.cos(tilt);
          var nx = n[0] * Math.cos(tilt) - n[1] * Math.sin(tilt);
          var ny = n[0] * Math.sin(tilt) + n[1] * Math.cos(tilt);
          addPt([cx + px, cy + py, lz], [nx, ny, n[2]], 's');
        }
      }
    }
    ear(-1); ear(1);
  })();

  // glitch pixely poletující kolem hlavy (patří k logu)
  (function(){
    for (var g = 0; g < 14; g++){
      var y = 1 - 2 * (g + 0.5) / 14;
      var r = Math.sqrt(Math.max(0, 1 - y * y));
      var phi = g * 2.399963229728653 + 1.7;
      var rad = 1.28 + hash(g, 7) * 0.34;
      addPt([Math.cos(phi) * r * rad, y * rad * 0.9 - 0.1, Math.sin(phi) * r * rad],
            norm3(Math.cos(phi) * r, y, Math.sin(phi) * r), 'g', hash(g, 13));
    }
  })();

  // ---- otazník: hustě navzorkovaný glyph „?“ jako tenká deska ----
  var qmPts = [];
  (function(){
    var GW = 22, GH = 30;
    var oc = document.createElement('canvas');
    oc.width = GW; oc.height = GH;
    var ox = oc.getContext('2d', { willReadFrequently: true });
    ox.font = '700 28px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ox.textAlign = 'center';
    ox.textBaseline = 'middle';
    ox.fillStyle = '#fff';
    ox.fillText('?', GW / 2, GH / 2 + 1);
    var d = ox.getImageData(0, 0, GW, GH).data;
    for (var gy = 0; gy < GH; gy++){
      for (var gx = 0; gx < GW; gx++){
        if (d[(gy * GW + gx) * 4 + 3] < 128) continue;
        for (var l = 0; l < 2; l++){
          qmPts.push({ x: gx - GW / 2 + 0.5, y: gy - GH / 2 + 0.5, z: (l - 0.5) * 2.2,
                       nx: 0, ny: 0, nz: 1, type: 's', j: hash(gx, gy) });
        }
      }
    }
  })();

  function setup(){
    var w = frame.clientWidth;
    var h = frame.clientHeight;
    S = Math.min(w, h);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // vykreslí rotující bodové mračno se stínováním podle normály
  function drawObject(pts, scale, cx, cy, angle, t, cell){
    var cosA = Math.cos(angle), sinA = Math.sin(angle);
    var PD = S * 2.2;
    var proj = [];
    for (var i = 0; i < pts.length; i++){
      var p = pts[i];
      var x3 = p.x * scale, y3 = p.y * scale, z3 = p.z * scale;
      var xr = x3 * cosA + z3 * sinA;
      var zr = -x3 * sinA + z3 * cosA;
      var nzr = -p.nx * sinA + p.nz * cosA;    // z-složka otočené normály
      var pers = PD / (PD - zr);
      proj.push({ x: cx + xr * pers, y: cy + y3 * pers, z: zr, nz: nzr, p: p });
    }
    proj.sort(function(a, b){ return a.z - b.z; });
    ctx.font = '500 ' + Math.round(cell) + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var j = 0; j < proj.length; j++){
      var q = proj[j];
      var tp = q.p.type;
      if (tp === 'g'){
        // glitch pixel — bliká
        var on = Math.sin(t * (1.5 + q.p.j * 2.5) + q.p.j * 17) > 0.25;
        if (!on) continue;
        var gs = Math.max(1.5, cell * 0.3);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(q.x - gs / 2, q.y - gs / 2, gs, gs);
        continue;
      }
      var facing = tp === 'p' ? Math.max(0, q.nz) : (q.p.nz === 1 ? Math.abs(q.nz) : Math.max(0, q.nz));
      var b = 0.14 + 0.86 * facing;
      b *= 0.9 + 0.1 * Math.sin(t * 2.2 + q.p.j * 6.28);
      if (tp === 'p'){
        // zornička — vždy jasná, jen když je oko přivrácené
        if (q.nz < 0.15) continue;
        ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, b + 0.25).toFixed(3) + ')';
        ctx.fillText('@', q.x, q.y);
        continue;
      }
      if (facing > 0.42){
        var ci = Math.min(RAMP.length - 1, Math.floor((b - 0.1) * RAMP.length + q.p.j * 1.6));
        ctx.fillStyle = 'rgba(255,255,255,' + b.toFixed(3) + ')';
        ctx.fillText(RAMP[Math.max(0, ci)], q.x, q.y);
      } else {
        // odvrácená strana — jen slabé pixely
        var ps = Math.max(1, cell * 0.22);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.10 + 0.14 * Math.max(0, q.nz + 1) / 2).toFixed(3) + ')';
        ctx.fillRect(q.x - ps / 2, q.y - ps / 2, ps, ps);
      }
    }
  }

  function draw(now){
    var t = now / 1000;
    var w = frame.clientWidth, h = frame.clientHeight;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.translate((w - S) / 2, (h - S) / 2);

    // kočka se otáčí doprava, otazník (velký jako hlava) v protisměru
    drawObject(catPts, S * 0.225, S * 0.5, S * 0.68, t * 0.6, t, S * 0.030);
    drawObject(qmPts, S * 0.016, S * 0.5, S * 0.20 + Math.sin(t * 1.3) * S * 0.012, -t * 1.2, t, S * 0.024);

    ctx.restore();
  }

  function loop(ts){
    requestAnimationFrame(loop);
    draw(ts);
  }

  if (window.ResizeObserver){ new ResizeObserver(setup).observe(frame); }
  window.addEventListener('resize', setup);
  setup();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
