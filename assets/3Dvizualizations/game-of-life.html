<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game of Life</title>
<style>
  /* obsah hry vyplní celý rám (iframe) — žádné okraje ani posuvník */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #frame { width: 100%; height: 100%; background: #000; overflow: hidden; position: relative; }
  #golCanvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="golCanvas"></canvas>
</div>

<script>
(function(){
  var container = document.getElementById('frame');
  var canvas = document.getElementById('golCanvas');
  var ctx = canvas.getContext('2d');

  var cellSize = 14;
  var cols = 0, rows = 0;
  var alive, next, age;
  var prevSnap1 = null, prevSnap2 = null;
  var stableCount = 0;
  var lastStep = 0;
  var STEP_MS = 130;

  function idx(x, y){ return y * cols + x; }

  function seed(){
    for (var i = 0; i < alive.length; i++){
      alive[i] = Math.random() < 0.24 ? 1 : 0;
    }
    prevSnap1 = null;
    prevSnap2 = null;
    stableCount = 0;
  }

  function setup(){
    var w = container.clientWidth;
    var h = container.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var n = Math.max(10, Math.floor(Math.min(w, h) / cellSize));
    cols = n;
    rows = n;
    alive = new Uint8Array(cols * rows);
    next = new Uint8Array(cols * rows);
    age = new Float32Array(cols * rows);
    seed();
  }

  function countNeighbors(x, y){
    var c = 0;
    for (var dy = -1; dy <= 1; dy++){
      for (var dx = -1; dx <= 1; dx++){
        if (dx === 0 && dy === 0) continue;
        var nx = (x + dx + cols) % cols;
        var ny = (y + dy + rows) % rows;
        c += alive[idx(nx, ny)];
      }
    }
    return c;
  }

  function sameArray(a, b){
    for (var i = 0; i < a.length; i++){
      if (a[i] !== b[i]) return false;
    }
    return true;
  }

  function step(){
    for (var y = 0; y < rows; y++){
      for (var x = 0; x < cols; x++){
        var i = idx(x, y);
        var n = countNeighbors(x, y);
        var a = alive[i];
        next[i] = a ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
      }
    }
    var tmp = alive;
    alive = next;
    next = tmp;

    var total = 0;
    for (var k = 0; k < alive.length; k++) total += alive[k];

    var same1 = prevSnap1 && sameArray(alive, prevSnap1);
    var same2 = prevSnap2 && sameArray(alive, prevSnap2);
    if (total === 0 || same1 || same2){
      stableCount++;
    } else {
      stableCount = 0;
    }
    prevSnap2 = prevSnap1;
    prevSnap1 = alive.slice();

    if (stableCount > 3){
      seed();
    }
  }

  // slabé (přechodové) pixely jako plus, plně živé jako čtverec
  function drawPlus(x0, y0, size, alpha){
    var gap = 1.5;
    var thick = size * 0.24;
    var len = size - gap * 2;
    ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
    ctx.fillRect(x0 + (size - thick) / 2, y0 + gap, thick, len);
    ctx.fillRect(x0 + gap, y0 + (size - thick) / 2, len, thick);
  }

  function drawSquare(x0, y0, size, alpha){
    var gap = 1.5;
    ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
    ctx.fillRect(x0 + gap, y0 + gap, size - gap * 2, size - gap * 2);
  }

  function draw(){
    var w = container.clientWidth;
    var h = container.clientHeight;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    for (var y = 0; y < rows; y++){
      for (var x = 0; x < cols; x++){
        var i = idx(x, y);
        var target = alive[i] ? 1 : 0;
        age[i] += (target - age[i]) * 0.25;
        var a = age[i];
        if (a <= 0.03) continue;
        var x0 = x * cellSize;
        var y0 = y * cellSize;
        if (a < 0.5){
          drawPlus(x0, y0, cellSize, a);
        } else {
          drawSquare(x0, y0, cellSize, a);
        }
      }
    }
  }

  function loop(ts){
    requestAnimationFrame(loop);
    if (ts - lastStep > STEP_MS){
      step();
      lastStep = ts;
    }
    draw();
  }

  // re-fit při každé změně velikosti rámu (i při prvním reálném rozložení)
  if (window.ResizeObserver){ new ResizeObserver(setup).observe(container); }
  window.addEventListener('resize', setup);
  setup();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
