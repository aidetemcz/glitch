<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibecoding</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #frame {
    width: 100%;
    max-width: 100vh;
    aspect-ratio: 1 / 1;
    background: #000;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 5px;
    overflow: hidden;
    box-sizing: border-box;
  }
  #vcCanvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="vcCanvas"></canvas>
</div>

<script>
(function(){
  var frame = document.getElementById('frame');
  var canvas = document.getElementById('vcCanvas');
  var ctx = canvas.getContext('2d');
  var S = 0;

  var PROMPT = 'udělej mi appku';
  var FINAL_LINES = 1247;
  var STREAM = 90;                 // kolik řádků reálně proteče obrazovkou

  // deterministické „řádky kódu“ — odsazené proužky, občas jasnější klíčové slovo
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(7);
  var LINES = [];
  (function(){
    var ind = 0;
    for (var i = 0; i < STREAM + 10; i++){
      var r = rnd();
      if (r < 0.30) ind = Math.min(3, ind + 1);
      else if (r < 0.55) ind = Math.max(0, ind - 1);
      LINES.push({
        empty: rnd() < 0.07,
        indent: ind,
        kw: rnd() < 0.5 ? 0.05 + rnd() * 0.05 : 0,   // délka „klíčového slova“
        len: 0.10 + rnd() * 0.42,
        a: 0.38 + rnd() * 0.3
      });
    }
  })();

  // časová osa smyčky
  var BLINK = 0.9, TYPE = PROMPT.length * 0.075, WAIT = 0.45, GEN = 5.2,
      STOP = 0.35, APP = 0.9, TALLY = 0.5, HOLD = 2.2, FADE = 0.7;
  var segs = [], T = 0;
  function seg(type, dur){ segs.push({ type: type, start: T, dur: dur }); T += dur; }
  seg('blink', BLINK); seg('type', TYPE); seg('wait', WAIT); seg('gen', GEN);
  seg('stop', STOP); seg('app', APP); seg('tally', TALLY); seg('hold', HOLD); seg('fade', FADE);
  var TOTAL = T;

  function fmt(n){
    var s = String(n), out = '';
    for (var i = 0; i < s.length; i++){
      if (i > 0 && (s.length - i) % 3 === 0) out += ' ';
      out += s[i];
    }
    return out;
  }
  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function smooth(p){ return p * p * (3 - 2 * p); }
  function ease(p){ return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  function setup(){
    var w = frame.clientWidth;
    var h = frame.clientHeight;
    S = Math.min(w, h);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function monoStr(size, weight){
    return (weight || 500) + ' ' + Math.round(size) + 'px ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
  }
  function sansStr(size, weight){
    return (weight || 500) + ' ' + Math.round(size) + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  }

  function draw(now){
    var t = (now / 1000) % TOTAL;
    var sg = segs[segs.length - 1];
    for (var si = 0; si < segs.length; si++){
      if (t < segs[si].start + segs[si].dur){ sg = segs[si]; break; }
    }
    var local = (t - sg.start) / sg.dur;
    var order = ['blink','type','wait','gen','stop','app','tally','hold','fade'];
    var oi = order.indexOf(sg.type);
    function after(name){ return oi > order.indexOf(name); }

    var fadeA = sg.type === 'fade' ? 1 - ease(local) : 1;

    // kolik znaků promptu je napsáno
    var nChars = sg.type === 'blink' ? 0 : (sg.type === 'type' ? Math.floor(local * PROMPT.length) : PROMPT.length);
    // kolik řádků kódu už AI „napsala“
    var shown = 0, genP = 0;
    if (sg.type === 'gen'){ genP = smooth(local); shown = STREAM * genP; }
    else if (after('gen')){ genP = 1; shown = STREAM; }
    var counterN = Math.round(FINAL_LINES * genP);

    var w = frame.clientWidth, h = frame.clientHeight;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.translate((w - S) / 2, (h - S) / 2);
    ctx.globalAlpha = fadeA;
    ctx.textBaseline = 'middle';

    var dimCode = after('stop') ? 0.22 : 1;   // po dokončení kód ustoupí do pozadí

    // prompt člověka — žlutě (pár slov, víc není potřeba)
    var pfs = Math.max(11, S * 0.042);
    ctx.font = monoStr(pfs);
    ctx.textAlign = 'left';
    var px = S * 0.08, py = S * 0.095;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 * dimCode < 0.4 ? 0.4 : 0.55).toFixed(3) + ')';
    ctx.fillText('>', px, py);
    var typed = PROMPT.slice(0, nChars);
    ctx.fillStyle = 'rgba(255,255,0,' + (after('stop') ? 0.55 : 0.95) + ')';
    ctx.fillText(typed, px + pfs * 0.9, py);
    // blikající kurzor promptu
    if (!after('wait')){
      var blinkOn = Math.floor(now / 450) % 2 === 0;
      if (blinkOn || sg.type === 'type'){
        var cw = ctx.measureText(typed).width;
        ctx.fillStyle = 'rgba(255,255,0,0.9)';
        ctx.fillRect(px + pfs * 0.9 + cw + 2, py - pfs * 0.55, pfs * 0.5, pfs * 1.1);
      }
    }

    // počítadlo řádků
    if (shown > 0){
      ctx.font = monoStr(Math.max(10, S * 0.036));
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255,255,255,' + (0.6 * dimCode).toFixed(3) + ')';
      ctx.fillText('řádků: ' + fmt(counterN), S * 0.92, S * 0.095);
    }

    // proud řádků kódu
    if (shown > 0){
      var rowH = S * 0.028;
      var top = S * 0.155, bottom = S * 0.865;
      var rows = Math.floor((bottom - top) / rowH);
      ctx.save();
      ctx.beginPath();
      ctx.rect(S * 0.06, top - rowH, S * 0.88, bottom - top + rowH);
      ctx.clip();
      var scroll = Math.max(0, shown - rows) * rowH;
      var first = Math.max(0, Math.floor(shown) - rows - 1);
      for (var li = first; li < Math.min(LINES.length, Math.ceil(shown)); li++){
        var ln = LINES[li];
        var y = top + li * rowH - scroll + rowH / 2;
        if (y < top - rowH || y > bottom + rowH) continue;
        if (ln.empty) continue;
        var reveal = clamp01(shown - li);      // právě psaný řádek roste zleva
        var lx = S * (0.08 + ln.indent * 0.035);
        var bh = Math.max(2, S * 0.008);
        var kwW = S * ln.kw * reveal;
        var restW = S * ln.len * reveal;
        if (ln.kw > 0){
          ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * dimCode).toFixed(3) + ')';
          ctx.fillRect(lx, y - bh / 2, kwW, bh);
          ctx.fillStyle = 'rgba(255,255,255,' + (ln.a * dimCode).toFixed(3) + ')';
          ctx.fillRect(lx + kwW + S * 0.012, y - bh / 2, restW, bh);
        } else {
          ctx.fillStyle = 'rgba(255,255,255,' + (ln.a * dimCode).toFixed(3) + ')';
          ctx.fillRect(lx, y - bh / 2, restW, bh);
        }
        // kurzor rychlého psaní na špičce rostoucího řádku
        if (reveal < 1 && sg.type === 'gen'){
          ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * dimCode).toFixed(3) + ')';
          ctx.fillRect(lx + kwW + (ln.kw > 0 ? S * 0.012 : 0) + restW + 2, y - rowH * 0.32, S * 0.008, rowH * 0.64);
        }
      }
      ctx.restore();
    }

    // hotová appka + bilance
    if (after('stop')){
      var appP = sg.type === 'app' ? ease(local) : 1;
      var ax = S * 0.345, ay = S * 0.285, aw = S * 0.31, ah = S * 0.27, ar = 8;
      // obrys okna appky se dokreslí
      ctx.beginPath();
      ctx.moveTo(ax + ar, ay);
      ctx.arcTo(ax + aw, ay, ax + aw, ay + ah, ar);
      ctx.arcTo(ax + aw, ay + ah, ax, ay + ah, ar);
      ctx.arcTo(ax, ay + ah, ax, ay, ar);
      ctx.arcTo(ax, ay, ax + aw, ay, ar);
      ctx.closePath();
      ctx.fillStyle = '#000';
      ctx.fill();
      var per = 2 * (aw + ah);
      if (appP < 1){
        ctx.setLineDash([per, per]);
        ctx.lineDashOffset = per * (1 - appP);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = Math.max(1.5, S * 0.0055);
      ctx.stroke();
      ctx.setLineDash([]);
      // jednoduché UI uvnitř
      var uiA = clamp01((appP - 0.6) / 0.4);
      if (uiA > 0){
        ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * uiA).toFixed(3) + ')';
        ctx.fillRect(ax + aw * 0.12, ay + ah * 0.16, aw * 0.5, Math.max(2, S * 0.009));
        ctx.fillStyle = 'rgba(255,255,255,' + (0.4 * uiA).toFixed(3) + ')';
        ctx.fillRect(ax + aw * 0.12, ay + ah * 0.34, aw * 0.76, Math.max(2, S * 0.007));
        ctx.fillRect(ax + aw * 0.12, ay + ah * 0.46, aw * 0.62, Math.max(2, S * 0.007));
        ctx.beginPath();
        ctx.arc(ax + aw * 0.5, ay + ah * 0.74, aw * 0.09, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.8 * uiA).toFixed(3) + ')';
        ctx.lineWidth = Math.max(1.25, S * 0.004);
        ctx.stroke();
      }

      // bilance: pár slov od tebe, hromada řádků od AI
      var t1 = sg.type === 'tally' ? clamp01(local * 2) : (after('tally') ? 1 : 0);
      var t2 = sg.type === 'tally' ? clamp01(local * 2 - 0.6) : (after('tally') ? 1 : 0);
      if (t1 > 0){
        ctx.font = sansStr(Math.max(11, S * 0.046), 600);
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255,255,0,' + t1.toFixed(3) + ')';
        ctx.fillText('ty: 3 slova', S * 0.5, S * 0.66);
      }
      if (t2 > 0){
        ctx.font = sansStr(Math.max(11, S * 0.046));
        ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * t2).toFixed(3) + ')';
        ctx.fillText('AI: 1 247 řádků', S * 0.5, S * 0.74);
      }
    }

    ctx.restore();
  }

  function loop(ts){
    requestAnimationFrame(loop);
    draw(ts);
  }

  if (window.ResizeObserver){ new ResizeObserver(setup).observe(frame); }
  window.addEventListener('resize', setup);
  setup();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
