  - id: programovani-komentare
    nazev: Komentáře
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: |-
      Komentáře jsou části kódu programu určené pro člověka, který kód čte. Počítač je při vykonávání programu ignoruje.

      Komentáře pomáhají čtenáři rychle se orientovat v kódu programu a pochopit účel jeho jednotlivých částí, aniž by musel zkoumat příkaz po příkazu. Pomáhají nejen jiným čtenářům, ale také samotnému autorovi při práci s vlastním kódem, například při jeho úpravách nebo hledání chyby.

      Komentář může vysvětlovat například účel části programu, důvod zvoleného řešení nebo skutečnost, která není z kódu programu snadno patrná. Není potřeba komentovat každý příkaz.

      Komentářů by mělo být tolik a měly by být tak podrobné, aby usnadňovaly orientaci v kódu programu. Příliš mnoho zbytečných nebo příliš podrobných komentářů může naopak čitelnost zhoršit.

      Komentáře společně s vhodnými názvy proměnných a podprogramů zvyšují čitelnost kódu programu a usnadňují jeho další úpravy.
    rvp:
      - kod: INF-INF-002-ZV9-007
        vystup: v blokově orientovaném programovacím jazyce vytvoří přehledný program, používá opakování, větvení programu, proměnné
        poznamka: přímá vazba na požadavek vytvářet přehledný program; metodika explicitně uvádí komentáře, vhodná pojmenování a snadno čitelný kód.
    cile:
      - uroven: porozumeni
        text: Žák chápe, že komentáře pomáhají čtenáři rychle se orientovat v kódu programu a pochopit účel jeho částí.
      - uroven: porozumeni
        text: Žák chápe, že není potřeba komentovat každý příkaz a že množství a podrobnost komentářů je třeba volit s ohledem na jejich účel.
      - uroven: hodnoceni
        text: Žák posoudí, kde komentář pomáhá pochopení a orientaci v kódu programu a kde je naopak zbytečný nebo příliš podrobný.
      - uroven: tvorba
        text: Žák vhodně komentuje kód programu tak, aby komentáře usnadňovaly jeho čtení a orientaci v něm.
    kriteria:
      - text: Žák vysvětlí, pro koho a proč jsou komentáře v kódu programu určeny.
      - text: Žák rozliší užitečný komentář od komentáře, který pouze opakuje zřejmý význam příkazu.
      - text: Žák komentuje kód tak, aby se v něm čtenář snadno orientoval a rozpoznal účel jednotlivých částí. Komentářem vysvětlí také to, co není z kódu snadno patrné.
      - text: Žák posoudí, zda jsou komentáře přiměřeně časté a podrobné a skutečně usnadňují orientaci v kódu programu.
      - text: Žák nepoužívá komentáře jako náhradu za srozumitelné pojmenování proměnných a podprogramů.
    prerekvizity:
      - programovani-overovani
