meta:
  verze: '5.0'
  nazev: Mapa informatických konceptů – znalostní koncepty s popisy (V5)
  popis: 'Nejvyšší úroveň podle *2026 CSTA PK–12 Computer Science Standards*, pod ní skupiny, koncepty a podkoncepty (jen znalosti). Sloupce 1. st. a 2. st. ukazují, zda má položka obsah v *Pojmech a obsazích ke vzdělávacím oborům – Informatika* (NPI): 1. st. = výstupy ZV5, 2. st. = výstupy ZV9. Bez poznámky jde o sloupec Oborové znalosti; jinak poznámka uvádí sloupec, odkud obsah pochází, nebo že je položka nad rámec RVP.


    V5 doplňuje pojmy ze slovníčku AI dětem (aidetem.cz/slovnicek-pojmu) a vybrané pojmy z anglického glosáře Wikipedie (*Glossary of computer science*). Všechny popisy jsou jazykově sjednocené a podrobnější. Sloupec **Zdroj popisu** říká, z čeho popis vychází: *garant IM / Programování / Data (jazykově upraveno)* = obsah textu garanta zachován, jen převeden do jednotného stylu a případně doplněn (původní znění je ve V4); *slovníček AI dětem* = obsah definice ze slovníčku; *nový* = nově napsaný popis.


    Rozsah: 5 oblastí, 27 skupin, 155 konceptů, 286 podkonceptů. Zpracováno 31. 10. 2026.


    Oblast Algoritmy a návrh se zabývá tím, jak problém vymezit, rozložit a vyřešit přesným postupem – algoritmem – a jak navrhovat řešení s ohledem na lidi, kteří je budou používat. Patří sem také umělá inteligence a strojové učení, při kterém postup řešení nevzniká zapsáním jednotlivých kroků, ale učením z dat. Oblast navazuje na Programování, kde se algoritmy zapisují jako programy.'
  zdroj: Mapa_informatickych_konceptu_V5.md
  struktura: temata = oblasti (CSTA 2026), podoblasti = skupiny, concepts = koncepty (vrstva core) a podkoncepty (vrstva navazujici, pole nadrazeny). stupne.zs1/zs2 = obsah v Pojmech a obsazích NPI pro 1. a 2. stupeň ZŠ.
temata:
- id: o-algoritmy-a-navrh
  nazev: Algoritmy a návrh
  nazev_en: Algorithms & Design
  popis: Oblast Algoritmy a návrh se zabývá tím, jak problém vymezit, rozložit a vyřešit přesným postupem – algoritmem – a jak navrhovat řešení s ohledem na lidi, kteří je budou používat. Patří sem také umělá inteligence a strojové učení, při kterém postup řešení nevzniká zapsáním jednotlivých kroků, ale učením z dat. Oblast navazuje na Programování, kde se algoritmy zapisují jako programy.
  barva: '#ffff00'
  podoblasti:
  - id: s-problem
    nazev: Problém
    popis: 'Skupina zahrnuje výchozí bod každého řešení: co je problém a jak ho zadat, s jakými vstupy řešení začíná a jaký má být jeho výstup, jak problém rozložit na menší části a které podrobnosti lze při řešení vynechat.'
  - id: s-algoritmus
    nazev: Algoritmus
    popis: 'Skupina zahrnuje algoritmus jako přesný postup řešení: z čeho se skládá, jaké vlastnosti musí mít, z jakých struktur se staví, jak se zapisuje, jak se posuzuje jeho efektivita a jaké chyby se v něm objevují. Patří sem i příklady algoritmů z běžného života a základní algoritmy hledání a řazení.'
  - id: s-strojove-uceni-a-ai
    nazev: Strojové učení a AI
    popis: Skupina zahrnuje umělou inteligenci, zejména strojové učení, při kterém systém nedostane postup řešení zapsaný v krocích, ale vytvoří si ho z dat. Patří sem to, jak se modely trénují a ověřují, kde a proč chybují, jaké úlohy řeší a jaké druhy umělé inteligence dnes lidé používají, od doporučovacích systémů po velké jazykové modely a chatboty.
  - id: s-navrh
    nazev: Návrh
    popis: 'Skupina zahrnuje navrhování z pohledu lidí, kteří budou řešení používat: zjišťování jejich potřeb, návrh uživatelského rozhraní, jeho použitelnost a přístupnost a také návrh her.'
- id: o-programovani
  nazev: Programování
  nazev_en: Programming
  popis: 'Programování je tvorba programů, tedy převádění algoritmů do zápisu, který dokáže vykonat počítač, a jejich zkoušení a opravování. Oblast zahrnuje pojem program a jeho zápis, řízení běhu programu, práci s daty v programu, podprogramy, chyby a kvalitu kódu i různé druhy jazyků, kterými lidé počítači zadávají, co má dělat. Navazuje na oblast Algoritmy a návrh: program je konkrétní realizací algoritmu v určitém programovacím jazyce.'
  barva: '#ffff00'
  podoblasti:
  - id: s-program
    nazev: Program
    popis: Skupina zahrnuje pojem program, jeho zápis v programovacím jazyce, překlad a spuštění programu, vstupy a výstupy programu a programovací prostředí, ve kterém program vzniká.
  - id: s-rizeni-behu-programu
    nazev: Řízení běhu programu
    popis: 'Skupina zahrnuje způsoby, jimiž program určuje, který příkaz se vykoná jako další: vykonávání v zapsaném pořadí, opakování, větvení podle podmínky, reakci na událost, přechody mezi stavy a herní smyčku. Jde o programové podoby algoritmických struktur z oblasti Algoritmy a návrh, doplněné o mechanismy typické pro interaktivní programy.'
  - id: s-data-v-programu
    nazev: Data v programu
    popis: 'Skupina zahrnuje pojmy, které popisují, jak si program pamatuje a zpracovává hodnoty: proměnnou, datové typy, výraz a logický výraz.'
  - id: s-podprogram
    nazev: Podprogram
    popis: Skupina zahrnuje podprogramy, tedy pojmenované a znovu použitelné části programu, včetně jejich definice, volání, parametrů a návratové hodnoty. Patří sem také knihovny a rozhraní API, díky nimž lze ve vlastním programu využít kód, který napsal někdo jiný.
  - id: s-chyby-a-kvalita-kodu
    nazev: Chyby a kvalita kódu
    popis: 'Skupina zahrnuje chyby v programu a jejich druhy, tedy chyby syntaktické, běhové a funkční, a vlastnosti, podle kterých se posuzuje kvalita kódu programu: čitelnost, komentáře a efektivitu.'
  - id: s-programovaci-jazyky
    nazev: Programovací jazyky
    popis: 'Skupina zahrnuje druhy jazyků, kterými lidé počítači zadávají, co má dělat: blokově orientované a textové programovací jazyky, značkovací a stylové jazyky, dotazovací jazyk SQL a přirozený jazyk jako zadání pro jazykový model. Jazyky se liší způsobem zápisu, přesností pravidel i tím, k jakým účelům slouží.'
- id: o-data-a-analyza
  nazev: Data a analýza
  nazev_en: Data & Analysis
  popis: Data a analýza je oblast, která se zabývá tím, jak data vznikají, jak se v počítači reprezentují a jak se uspořádávají, zpracovávají, zobrazují a modelují. Zahrnuje také informační systémy, které data evidují a zpracovávají pro určitou potřebu. Cílem je umět z dat získat spolehlivé informace a kriticky posoudit závěry, které z nich vyvozují druzí.
  barva: '#ffff00'
  podoblasti:
  - id: s-sber-dat
    nazev: Sběr dat
    popis: Skupina zahrnuje způsoby, jakými lze data získat – pozorováním, měřením, dotazníkem, pomocí senzorů, z existujících zdrojů i automatickým záznamem činnosti zařízení a služeb – a třídění dat podle jejich původu.
  - id: s-data-a-informace
    nazev: Data a informace
    popis: Skupina zahrnuje rozdíl mezi daty a informacemi, kvalitu dat, posuzování zdrojů informací a postupy, kterými se z dat ověřitelně vyvozují závěry, včetně datového cyklu a práce s velkými daty.
  - id: s-reprezentace-dat
    nazev: Reprezentace dat
    popis: 'Skupina zahrnuje způsoby, jak počítač zapisuje data pomocí bitů: jednotky množství dat, kódy a kódování, reprezentaci textu, obrazu, zvuku a videa, dokumenty, soubory a jejich formáty, kompresi a vztah objemu dat k jejich přenosu.'
  - id: s-usporadani-dat
    nazev: Uspořádání dat
    popis: 'Skupina zahrnuje způsoby, jak data uspořádat, aby se s nimi dalo dobře pracovat: rozlišení strukturovaných a nestrukturovaných dat, tabulky a seznamy, tabulkovou evidenci dat s pravidly pro její validitu, provázané tabulky a databáze.'
  - id: s-zpracovani-dat
    nazev: Zpracování dat
    popis: 'Skupina zahrnuje operace, kterými se z dat získává informace: čištění dat, řazení a filtrování, úpravy záznamů, výpočty pomocí vzorců a funkcí, podmíněné formátování a automatizovanou analýzu dat. Patří sem také účel evidence dat a základní statistické pojmy potřebné k vyhodnocení výsledků.'
  - id: s-vizualizace
    nazev: Vizualizace
    popis: 'Vizualizace dat je znázornění dat v grafické podobě, například grafem, diagramem nebo infografikou, jejímž cílem je čitelnější a srozumitelnější náhled na data: lepší porozumění, odhalení souvislostí a případných chyb. Dobrý graf udělá z dat srozumitelný příběh, je-li přehledný, dobře čitelný a správně zvolený; špatně zvolený nebo zmanipulovaný graf naopak umí klamat. Skupina zahrnuje grafy, jejich typy a prvky, zavádějící grafy, piktogramy a infografiku.'
  - id: s-model
    nazev: Model
    popis: 'Skupina zahrnuje modely jako zjednodušené obrazy reality a způsoby jejich zápisu: schémata, diagramy, myšlenkové mapy a mapy, grafy jako sítě vrcholů a hran a simulace.'
  - id: s-informacni-system
    nazev: Informační systém
    popis: Skupina zahrnuje informační systémy, které evidují a zpracovávají data pro určitou potřebu, jejich procesy a tok dat, uživatele v různých rolích, omezení, se kterými je třeba počítat, a webové a mobilní aplikace, přes které se k systémům přistupuje.
- id: o-systemy-a-bezpecnost
  nazev: Systémy a bezpečnost
  nazev_en: Systems & Security
  popis: Oblast Systémy a bezpečnost se zabývá tím, z čeho se skládají digitální zařízení, tedy jejich hardwarem a softwarem, a jak se zařízení propojují do počítačových sítí a internetu. Zahrnuje také ochranu zařízení, dat a účtů před ztrátou, poškozením a zneužitím a ochranu soukromí uživatelů. Porozumění tomu, jak technologie fungují, je předpokladem jejich bezpečného, efektivního a uvážlivého používání.
  barva: '#ffff00'
  podoblasti:
  - id: s-hardware
    nazev: Hardware
    popis: 'Hardware jsou fyzické části digitálních zařízení, tedy vše, čeho se lze dotknout: součásti počítače, různé typy počítačů, vestavěná zařízení a roboti, včetně jejich poruch. Funkční zařízení vzniká teprve spojením hardwaru se softwarem.'
  - id: s-software
    nazev: Software
    popis: Software jsou programy a s nimi související data, které v zařízení běží a určují, co zařízení dělá, od operačního systému po jednotlivé aplikace; bez softwaru je hardware nepoužitelný. Skupina zahrnuje i softwarové problémy, kvůli kterým fyzicky funkční zařízení nepracuje správně.
  - id: s-site-a-internet
    nazev: Sítě a internet
    popis: 'Sítě a internet zahrnují způsoby, jakými se zařízení propojují a předávají si data: od propojení dvou zařízení přes lokální síť až po celosvětový internet a služby, které na něm běží, jako je web, cloud a komunikační platformy. Patří sem i řešení problémů s připojením.'
  - id: s-bezpecnost
    nazev: Bezpečnost
    popis: Bezpečnost zahrnuje rizika, která ohrožují data, zařízení a účty, typy útoků a škodlivého softwaru a opatření, kterými se lze bránit, jako je záloha, autentizace, přístupová práva, šifrování a zabezpečení zařízení. Bezpečnost přitom není jednorázové opatření, ale soubor návyků.
  - id: s-soukromi
    nazev: Soukromí
    popis: Soukromí zahrnuje osobní údaje a digitální stopu, kterou lidé při používání technologií zanechávají, otázku, kdo k těmto údajům má přístup a jak dlouho zůstávají dostupné, i to, jak z nich vzniká digitální identita člověka.
- id: o-informatika-a-spolecnost
  nazev: Informatika a společnost
  nazev_en: Computing & Society
  popis: Oblast Informatika a společnost se zabývá tím, jak digitální technologie vznikají a vyvíjejí se a jak ovlivňují jednotlivce, společnost i životní prostředí. Zahrnuje přínosy a rizika technologií, ekonomiku platforem, šíření informací a manipulaci s nimi, právo, etiku umělé inteligence, zdravý vztah člověka k technologiím i profese, ve kterých lidé technologie vytvářejí.
  barva: '#ffff00'
  podoblasti:
  - id: s-technologie-a-jejich-vyvoj
    nazev: Technologie a jejich vývoj
    popis: Skupina zahrnuje, co jsou technologie a digitální technologie, jak vznikaly a které nové technologie se dnes prosazují. Patří sem také digitalizace a automatizace, které mění práci i každodenní život, a modely popisující, jak se technologie šíří a jak se mění očekávání, která do nich lidé vkládají.
  - id: s-dopady
    nazev: Dopady
    popis: Skupina zahrnuje přínosy a rizika digitálních technologií pro jednotlivce, společnost a životní prostředí. Patří sem role dat a informačních systémů, ekonomika pozornosti, obchodní modely platforem, tedy kdo a jak na technologiích vydělává, a udržitelnost.
  - id: s-informace-a-manipulace
    nazev: Informace a manipulace
    popis: 'Skupina zahrnuje způsoby, jakými se v digitálním prostředí cíleně šíří, zkreslují a vyrábějí informace: propagandu, dezinformace a hoaxy, digitální manipulaci obrazu a zvuku, boty a syntetická média vytvořená umělou inteligencí.'
  - id: s-clovek-a-technologie
    nazev: Člověk a technologie
    popis: 'Skupina zahrnuje, jak digitální technologie používat zdravě, ohleduplně k ostatním, legálně a eticky: digitální wellbeing, kyberšikanu, právo v digitálním prostředí a etiku umělé inteligence. Patří sem i profese, ve kterých lidé digitální technologie vytvářejí a provozují.'
concepts:
- id: k-problem-a-jeho-reseni
  nazev: Problém a jeho řešení
  tema: o-algoritmy-a-navrh
  podoblast: s-problem
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Problém je situace, ve které je potřeba dosáhnout určitého cíle, ale cesta k němu není hned zřejmá. Řešení je postup nebo výsledek, který vede od výchozího stavu k požadovanému cíli. Jeden problém může mít více řešení, která se liší například rychlostí, náročností nebo spolehlivostí, a proto je lze porovnávat. Na začátku stojí problémová situace, ze které se vymezí zadání úlohy. Například problém, jak se dostat včas na trénink na druhém konci města, lze řešit autobusem, na kole nebo s pomocí rodičů.
  zdroj_popisu: nový
  stav: draft
- id: k-problemova-situace
  nazev: Problémová situace
  tema: o-algoritmy-a-navrh
  podoblast: s-problem
  vrstva: navazujici
  nadrazeny: k-problem-a-jeho-reseni
  stupne:
    zs1: true
    zs2: true
  popis: Problémová situace je stav, který je potřeba změnit nebo vyřešit. Nemusí být na první pohled zřejmé, co přesně je třeba řešit ani jakého výsledku se má dosáhnout. Situaci je proto nutné nejprve prozkoumat a zjistit, v čem potíž skutečně spočívá. Například si žáci stěžují, že se o změnách v rozvrhu dozvídají pozdě; než lze hledat řešení, je třeba zjistit, kde informace vázne a jak by měl vypadat žádoucí stav.
  zdroj_popisu: garant IM (jazykově upraveno)
  stav: draft
- id: k-zadani-ulohy
  nazev: Zadání úlohy
  tema: o-algoritmy-a-navrh
  podoblast: s-problem
  vrstva: navazujici
  nadrazeny: k-problem-a-jeho-reseni
  stupne:
    zs1: true
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: 'Zadání úlohy je jasná formulace toho, co se má vyřešit: výchozí stav, požadovaný výsledek, co je k dispozici a jaké podmínky a omezení musí řešení splňovat. Vzniká rozborem problémové situace a umožňuje později ověřit, zda je řešení správné. Nejasné zadání často vede k řešení, které sice funguje, ale neřeší to, co bylo potřeba. Například zadání rozpisu služeb na úklid třídy určuje počet žáků, délku období a požadavek, aby se všichni střídali stejně často.'
  zdroj_popisu: nový
  stav: draft
- id: k-vstup-a-vystup
  nazev: Vstup a výstup
  tema: o-algoritmy-a-navrh
  podoblast: s-problem
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Vstup jsou data nebo podmínky, se kterými řešení začíná; výstup je výsledek, který má řešení vytvořit. Přesně určené vstupy a výstupy jsou součástí zadání úlohy: popisují, co řešení dostane a co z něj má vzniknout, a umožňují řešení ověřit porovnáním skutečného výstupu s očekávaným. Vstupem i výstupem mohou být čísla, text, obrázek nebo třeba poloha robota. Například u výpočtu průměrné známky jsou vstupem jednotlivé známky žáka a výstupem jejich průměr.'
  zdroj_popisu: nový
  stav: draft
- id: k-podproblem
  nazev: Podproblém
  tema: o-algoritmy-a-navrh
  podoblast: s-problem
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Podproblém je menší dílčí úloha, na kterou lze rozdělit složitější problém; takovému rozdělení se říká dekompozice (rozklad) problému. Dílčí úlohy jsou jednodušší než celek, dají se řešit jednotlivě a z jejich řešení se nakonec složí řešení původního problému, takže rozklad snižuje složitost. Dílčí úlohy mohou být vzájemně závislé a vyžadovat určité pořadí řešení, nebo mohou být nezávislé a řešitelné současně. Například přípravu třídního výletu lze rozložit na výběr místa, zajištění dopravy, sestavení rozpočtu a informování rodičů.
  zdroj_popisu: garant IM (jazykově upraveno) – karta „Dekompozice problému“
  stav: draft
- id: k-zavislost-a-poradi-casti
  nazev: Závislost a pořadí částí
  tema: o-algoritmy-a-navrh
  podoblast: s-problem
  vrstva: navazujici
  nadrazeny: k-podproblem
  stupne:
    zs1: false
    zs2: true
  popis: 'Závislost mezi dílčími úlohami znamená, že výsledek jedné z nich je potřeba k řešení druhé. Závislosti určují, v jakém pořadí je nutné části řešit: úlohu lze začít až ve chvíli, kdy jsou hotové všechny části, na kterých závisí, zatímco nezávislé části lze řadit libovolně. Například při přípravě výletu nelze objednat autobus, dokud není známé místo a počet účastníků.'
  zdroj_popisu: nový
  stav: draft
- id: k-paralelismus
  nazev: Paralelismus
  tema: o-algoritmy-a-navrh
  podoblast: s-problem
  vrstva: navazujici
  nadrazeny: k-podproblem
  stupne:
    zs1: false
    zs2: true
  popis: 'Paralelismus je současné řešení více dílčích úloh, které na sobě nezávisejí, například více lidmi nebo více procesory zároveň. Může zkrátit celkovou dobu řešení, ne však libovolně: závislé části musí stále čekat jedna na druhou a dílčí výsledky je nakonec potřeba spojit. Například při skupinové práci si žáci rozdělí kapitoly prezentace a každý připravuje svou část současně s ostatními.'
  zdroj_popisu: nový
  stav: draft
- id: k-abstrakce
  nazev: Abstrakce
  tema: o-algoritmy-a-navrh
  podoblast: s-problem
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Abstrakce je způsob uvažování, při kterém se při řešení problému soustředíme na podstatné informace a vlastnosti, zatímco podrobnosti, které řešení neovlivňují, můžeme zanedbat. Co je podstatné, závisí na účelu: stejnou věc lze pro různé úlohy zjednodušit různě. Abstrakce je základem modelů i algoritmů, které platí pro celou skupinu podobných situací, a ne jen pro jednu. Například pro naplánování cesty autobusem stačí znát zastávky, spoje a časy odjezdů, kdežto barva autobusu nebo jméno řidiče řešení neovlivní.'
  zdroj_popisu: garant IM (jazykově upraveno)
  stav: draft
- id: k-algoritmus
  nazev: Algoritmus
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Algoritmus je přesně popsaný postup řešení problému. Tvoří ho kroky, které lze podle daných pravidel provést, a pro jeden problém mohou existovat různé algoritmy. Na rozdíl od programu není vázán na žádný konkrétní programovací jazyk: je to abstraktní popis logiky řešení krok za krokem, který lze vyjádřit běžnou řečí, vývojovým diagramem nebo pseudokódem. Provést ho může člověk i počítač, tedy vykonavatel. Například písemné sčítání je algoritmus, podle kterého lze sečíst libovolná dvě čísla.'
  zdroj_popisu: garant IM (jazykově upraveno) + slovníček AI dětem
  stav: draft
- id: k-krok-a-instrukce
  nazev: Krok a instrukce
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-algoritmus
  stupne:
    zs1: true
    zs2: true
  popis: Krok je jedna dílčí činnost, ze kterých se algoritmus skládá; instrukce je pokyn, který vykonavateli říká, co má v daném kroku udělat. Instrukce musí být formulovaná tak, aby jí vykonavatel rozuměl a uměl ji provést. V programu odpovídá instrukci příkaz programovacího jazyka. Například v návodu na sestavení poličky je jedním krokem instrukce „přišroubujte boční desku ke dnu“.
  zdroj_popisu: nový
  stav: draft
- id: k-vlastnosti-algoritmu
  nazev: Vlastnosti algoritmu
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Vlastnosti algoritmu jsou požadavky, které musí postup splňovat, aby byl algoritmem. Patří k nim jednoznačnost, elementárnost kroků, konečnost, obecnost a správnost; každá z nich má vlastní popis. Podle těchto vlastností lze posoudit, zda je určitý návod skutečně algoritmem, nebo jen přibližným popisem, který musí vykonavatel doplňovat vlastním úsudkem. Například recept s pokynem „pečte, dokud to nebude hotové“ nechává rozhodnutí na zkušenosti kuchaře.
  zdroj_popisu: garant IM (jazykově upraveno)
  stav: draft
- id: k-jednoznacnost
  nazev: Jednoznačnost
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-vlastnosti-algoritmu
  stupne:
    zs1: false
    zs2: true
  popis: Jednoznačnost je vlastnost algoritmu, podle které musí být každý jeho krok pro vykonavatele srozumitelný a jednoznačně proveditelný, takže vykonavatel přesně ví, co má udělat, a nevolí mezi více výklady. Stejný postup proto může být pro různé vykonavatele popsán různě podrobně. Například pokyn „přidejte trochu cukru“ jednoznačný není, kdežto pokyn „přidejte dvě lžíce cukru“ ano.
  zdroj_popisu: garant IM (jazykově upraveno)
  stav: draft
- id: k-elementarnost-kroku
  nazev: Elementárnost kroku
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-vlastnosti-algoritmu
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Velké myšlenky'
  popis: Elementárnost kroku je vlastnost algoritmu, podle které musí být každý krok dostatečně jednoduchý pro jeho vykonavatele, nikoli pro autora algoritmu. Co je elementární krok, závisí na schopnostech a znalostech vykonavatele. Například pro zkušeného kuchaře je „připravte těsto“ elementární krok, začátečník ho ale potřebuje rozepsat na vážení, míchání a hnětení; pro počítač jsou elementární jen příkazy, které umí přímo vykonat.
  zdroj_popisu: garant IM (jazykově upraveno)
  stav: draft
- id: k-konecnost
  nazev: Konečnost
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-vlastnosti-algoritmu
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Konečnost je vlastnost algoritmu, podle které musí algoritmus řešící úlohu po konečném počtu kroků dospět k výsledku. Proces, který má běžet stále, musí mít definovaný způsob, jak jej ukončit. Konečnost bývá porušena hlavně u opakování, jehož podmínka ukončení nikdy nenastane. Například postup „házejte, dokud na hrací kostce nepadne sedmička“ by na běžné šestistěnné kostce neskončil nikdy, kdežto hra, která běží stále, se ukončí volbou „Konec“.
  zdroj_popisu: garant IM (jazykově upraveno)
  stav: draft
- id: k-obecnost
  nazev: Obecnost
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-vlastnosti-algoritmu
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Velké myšlenky'
  popis: Obecnost je vlastnost algoritmu, podle které algoritmus není určen pouze pro jeden konkrétní případ. Je určen pro určitou množinu přípustných vstupů, pro které poskytuje odpovídající výstupy. Například postup pro výpočet obvodu obdélníku funguje pro libovolné délky stran, ne jen pro obdélník 3 cm × 5 cm.
  zdroj_popisu: garant IM (jazykově upraveno)
  stav: draft
- id: k-spravnost
  nazev: Správnost
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-vlastnosti-algoritmu
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Správnost je vlastnost algoritmu, který při správném provedení řeší zadaný problém, tedy pro přípustné vstupy dává požadované výstupy. Správnost je potřeba ověřovat, například zkoušením na různých vstupech včetně neobvyklých a hraničních případů; vyzkoušení několika příkladů však správnost nedokazuje, jen může odhalit chybu. Například postup hledání nejvyššího žáka ve třídě je dobré vyzkoušet i pro dva stejně vysoké žáky.
  zdroj_popisu: garant IM (jazykově upraveno)
  stav: draft
- id: k-algoritmicke-struktury
  nazev: Algoritmické struktury
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Algoritmické struktury jsou základní stavební prvky algoritmů: posloupnost, větvení a opakování. Určují, v jakém pořadí a za jakých podmínek se kroky provádějí, a jejich vzájemným kombinováním a vnořováním lze zapsat jakýkoli algoritmus. V programu jim odpovídají sekvence příkazů, podmíněný příkaz a cyklus. Například ranní příprava do školy obsahuje posloupnost kroků, větvení „když prší, vezměte si deštník“ i opakování „čistěte si zuby, dokud neuplynou dvě minuty“.'
  zdroj_popisu: nový
  stav: draft
- id: k-posloupnost
  nazev: Posloupnost
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-algoritmicke-struktury
  stupne:
    zs1: true
    zs2: true
  popis: 'Posloupnost je algoritmická struktura, podle které se algoritmus vykonává krok po kroku v určeném pořadí. Další krok začíná až po dokončení předchozího; vykonavatel pořadí kroků nevolí ani nemění. Na pořadí proto záleží: prohozením kroků může vzniknout jiný výsledek nebo postup přestane fungovat. Například při přípravě čaje je nutné vodu nejprve ohřát a teprve potom jí zalít čaj.'
  zdroj_popisu: garant IM (jazykově upraveno) – karta „Posloupnost kroků“
  stav: draft
- id: k-vetveni
  nazev: Větvení
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-algoritmicke-struktury
  stupne:
    zs1: false
    zs2: true
  popis: 'Větvení (rozhodování) je algoritmická struktura, kdy je v posloupnosti kroků podmínka, jejíž splnění určuje další postup. Algoritmus musí určovat, co se má dít při splnění i nesplnění podmínky; jednou z možností je i to, že se bez dalšího kroku pokračuje dál. Například: „Pokud svítí zelená, přejděte přes přechod, jinak počkejte.“'
  zdroj_popisu: garant IM (jazykově upraveno) – karta „Rozhodování“
  stav: draft
- id: k-opakovani
  nazev: Opakování
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-algoritmicke-struktury
  stupne:
    zs1: true
    zs2: true
  popis: Opakování je algoritmická struktura, při které se některé kroky nebo jejich posloupnost vykonávají opakovaně. Počet opakování může být předem určen, nebo může záviset na splnění podmínky. Opakování zkracuje zápis algoritmu, protože opakované kroky není nutné vypisovat znovu. Například „zamíchejte desetkrát“ má pevný počet opakování, kdežto „míchejte, dokud se cukr nerozpustí“ závisí na podmínce.
  zdroj_popisu: garant IM (jazykově upraveno)
  stav: draft
- id: k-zapis-algoritmu
  nazev: Zápis algoritmu
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Zápis algoritmu je způsob, jakým se postup řešení zaznamená, aby mu bylo možné porozumět a provést ho. Zápisy se liší přesností, názorností a tím, pro koho jsou určeny – pro člověka, nebo pro počítač. Stejný algoritmus může mít více zápisů: slovní popis, piktogramy a šipky, vývojový diagram, pseudokód, bloky v blokově orientovaném jazyce nebo kód programu. Například postup výpočtu průměrné známky lze popsat větami, nakreslit jako vývojový diagram i naprogramovat.'
  zdroj_popisu: nový
  stav: draft
- id: k-slovni-popis
  nazev: Slovní popis
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-zapis-algoritmu
  stupne:
    zs1: true
    zs2: true
  popis: Slovní popis je zápis algoritmu běžnou řečí, například v podobě receptu nebo návodu, případně jako strukturovaný popis s číslovanými kroky. Je srozumitelný bez znalosti zvláštních značek, přirozený jazyk ale bývá nepřesný a nejednoznačný, takže si vykonavatel může kroky vyložit jinak, než autor zamýšlel. Číslování kroků zpřehlední jejich pořadí. Například návod k obsluze pračky je slovní popis algoritmu.
  zdroj_popisu: nový
  stav: draft
- id: k-piktogram-a-sipky
  nazev: Piktogram a šipky
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-zapis-algoritmu
  stupne:
    zs1: true
    zs2: false
  popis: Zápis pomocí piktogramů a šipek zaznamenává kroky algoritmu obrázkovými symboly, které určují činnost, a šipkami, které určují pořadí nebo směr pohybu. Nevyžaduje čtení textu, a proto se hodí pro mladší žáky a jednoduché postupy. Například pohyb robota po čtvercové síti lze zapsat řadou šipek ↑ ↑ → ↓, kde každá šipka znamená posun o jedno pole daným směrem.
  zdroj_popisu: nový
  stav: draft
- id: k-vyvojovy-diagram
  nazev: Vývojový diagram
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-zapis-algoritmu
  stupne:
    zs1: true
    zs2: true
  popis: Vývojový diagram je grafický zápis algoritmu pomocí dohodnutých značek spojených šipkami, které určují pořadí kroků; v RVP pro 1. stupeň se objevuje jako blokové schéma. Obdélník znamená činnost, kosočtverec rozhodování s větvemi „ano“ a „ne“, rovnoběžník vstup nebo výstup a zaoblený obdélník začátek a konec. Názorně ukazuje větvení a opakování. Například otázka „Je úkol hotový?“ vede při odpovědi „ne“ šipkou zpět k činnosti „pracovat na úkolu“.
  zdroj_popisu: nový
  stav: draft
- id: k-pseudokod
  nazev: Pseudokód
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-zapis-algoritmu
  stupne:
    zs1: false
    zs2: true
  popis: 'Pseudokód je strukturovaný zápis algoritmu, který připomíná programovací jazyk, ale nemá jeho přísná pravidla zápisu (syntaxi). Používá klíčová slova jako „pokud“, „jinak“, „opakuj“ nebo „dokud“ a odsazení, takže přesně zachycuje strukturu algoritmu, počítač ho ale přímo nevykoná. Slouží lidem k přesnému popisu postupu nezávisle na konkrétním jazyce. Například: „pokud je teplota pod 0, vypiš ‚mrzne‘, jinak vypiš ‚nemrzne‘“.'
  zdroj_popisu: nový
  stav: draft
- id: k-algoritmus-jako-model-reseni
  nazev: Algoritmus jako model řešení
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Algoritmus je model řešení problému: popisuje postup obecně a neurčuje jeden konkrétní výsledek, ale způsob, jak ho získat pro různé vstupy. Stejně jako jiné modely vzniká abstrakcí – vynechává vše, co řešení neovlivňuje, například v jakém jazyce nebo na jakém zařízení bude proveden. Program je pak jednou konkrétní realizací tohoto modelu v určitém programovacím jazyce. Například stejný algoritmus hledání nejkratší cesty lze použít v navigaci pro auto, pro chodce i pro robota ve skladu.'
  zdroj_popisu: nový
  stav: draft
- id: k-efektivita-a-strategie-reseni
  nazev: Efektivita a strategie řešení
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Efektivita vyjadřuje, kolik času, kroků nebo jiných zdrojů řešení spotřebuje k dosažení cíle; strategie řešení je zvolený způsob, jak k problému přistoupit. Efektivitu lze posuzovat na různých úrovních. Při návrhu řešení porovnáváme různé způsoby řešení problému, u algoritmu porovnáváme různé algoritmy řešící stejnou úlohu podle času, počtu kroků nebo dalších potřebných zdrojů, například paměti. Různé strategie tak mohou být různě efektivní. Například součet čísel od 1 do 100 lze získat postupným přičítáním, tedy 99 sčítáními, nebo spojením čísel do 50 dvojic se součtem 101 a jediným násobením 50 × 101 = 5 050.
  zdroj_popisu: garant IM (jazykově upraveno) – karta „Efektivita“
  stav: draft
- id: k-typicke-chyby-v-algoritmech
  nazev: Typické chyby v algoritmech
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Typické chyby v algoritmech jsou chyby v návrhu postupu, kvůli kterým algoritmus nedá správný výsledek nebo ho nelze provést. Nejčastěji jde o chybějící krok, nesprávné pořadí kroků a nejednoznačnost. Chyba v algoritmu se projeví v každém programu, který ho realizuje, i když je kód programu zapsaný bez chyb, proto je výhodné ji odhalit už před programováním, například ručním procházením postupu krok za krokem. Například popis cesty, ve kterém chybí jedna odbočka, zavede na špatné místo kohokoli.
  zdroj_popisu: nový
  stav: draft
- id: k-chybejici-krok
  nazev: Chybějící krok
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-typicke-chyby-v-algoritmech
  stupne:
    zs1: false
    zs2: true
  popis: Chybějící krok je chyba, kdy v algoritmu chybí krok, bez kterého nelze dojít k cíli nebo správně provést další kroky. Člověk si takový krok často domyslí, počítač nebo robot ale provede jen to, co je zapsané. Například v receptu chybí zapnutí trouby, takže koláč zůstane i po hodině v troubě syrový.
  zdroj_popisu: nový
  stav: draft
- id: k-nespravne-poradi
  nazev: Nesprávné pořadí
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-typicke-chyby-v-algoritmech
  stupne:
    zs1: false
    zs2: true
  popis: Nesprávné pořadí je chyba, kdy algoritmus obsahuje všechny potřebné kroky, ale v chybném pořadí. Typicky se nějaká hodnota použije dřív, než byla zjištěna, nebo se krok provede dřív, než jsou splněny jeho předpoklady. Například postup „vypočítejte průměr, potom zadejte známky“ nemůže fungovat, protože bez známek nelze průměr spočítat.
  zdroj_popisu: nový
  stav: draft
- id: k-nejednoznacnost
  nazev: Nejednoznačnost
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-typicke-chyby-v-algoritmech
  stupne:
    zs1: false
    zs2: true
  popis: Nejednoznačnost je chyba, kdy lze krok algoritmu pochopit nebo provést více způsoby, takže různí vykonavatelé dojdou k různým výsledkům. Vzniká hlavně při zápisu v přirozeném jazyce, kde slova jako „trochu“, „chvíli“ nebo „tam“ nemají přesný význam. Například pokyn „na křižovatce zahněte“ neříká, zda vlevo, nebo vpravo.
  zdroj_popisu: nový
  stav: draft
- id: k-algoritmy-z-bezneho-zivota
  nazev: Algoritmy z běžného života
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  poznamka: '1. st.: Činnosti'
  popis: 'Algoritmy z běžného života jsou postupy, které lidé používají při každodenních činnostech: recepty, návody, pravidla her, herní strategie nebo cesta do školy. Ukazují, že algoritmy nejsou jen záležitostí počítačů a že algoritmické myšlení se uplatní i mimo informatiku. Na rozdíl od algoritmů pro počítač bývají méně přesné, protože člověk si chybějící nebo nejasné kroky domyslí podle zkušenosti. Například postup při požárním poplachu ve škole určuje, kdo, kdy a kudy opouští budovu.'
  zdroj_popisu: nový
  stav: draft
- id: k-zakladni-algoritmy
  nazev: Základní algoritmy
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Základní algoritmy jsou známé a dobře prozkoumané algoritmy pro úlohy, které se v informatice stále opakují, například hledání a řazení. Pro stejnou úlohu jich obvykle existuje více a liší se efektivitou, tedy počtem potřebných kroků, i tím, jaké podmínky musí data splňovat. Jsou součástí mnoha programů a aplikací, aniž si toho uživatel všimne. Například vyhledání kontaktu v telefonu nebo seřazení souborů podle data využívá právě takové algoritmy.
  zdroj_popisu: nový
  stav: draft
- id: k-hledani
  nazev: Hledání
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-zakladni-algoritmy
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Hledání je úloha zjistit, zda a kde se hledaná hodnota v datech nachází. Nejjednodušší je postupné (lineární) hledání, které prochází prvky jeden po druhém, dokud hodnotu nenajde nebo nedojde na konec. Funguje vždy, i v neseřazených datech, u velkého množství dat je ale pomalé; v seřazených datech je mnohem rychlejší binární vyhledávání. Například hledání rukavice v krabici se zapomenutými věcmi probíhá postupně, kus po kusu.
  zdroj_popisu: nový
  stav: draft
- id: k-binarni-vyhledavani
  nazev: Binární vyhledávání
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-zakladni-algoritmy
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Binární vyhledávání je algoritmus, který najde pozici hledané hodnoty v seřazených datech. V každém kroku porovná hledanou hodnotu s prostředním prvkem a podle výsledku vyloučí polovinu, ve které hodnota být nemůže. Díky tomu stačí i mezi 1 000 prvky nejvýše 10 porovnání, zatímco postupné hledání jich může potřebovat až 1 000. Například při hádání čísla od 1 do 100 s nápovědou „více“ nebo „méně“ vede tento postup k cíli nejvýše na 7 pokusů.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-razeni
  nazev: Řazení
  tema: o-algoritmy-a-navrh
  podoblast: s-algoritmus
  vrstva: navazujici
  nadrazeny: k-zakladni-algoritmy
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Řazení je uspořádání prvků podle zvoleného kritéria, například podle velikosti, abecedy nebo data. Existuje mnoho algoritmů řazení, například řazení výběrem, vkládáním nebo bublinkové; liší se počtem porovnání a přesunů prvků i tím, jak rychle zpracují téměř seřazená data. Na rozdíl od příkazu „seřadit“ v tabulkovém editoru jde o samotný postup, kterým pořadí vzniká. Například karty v ruce si hráč obvykle řadí vkládáním: každou novou kartu zasune na správné místo.'
  zdroj_popisu: nový
  stav: draft
- id: k-umela-inteligence
  nazev: Umělá inteligence
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Umělá inteligence (AI) je systém, který napodobuje určité aspekty lidského myšlení a konání; žádná z jejích definic ale není ustálená. Obvykle má podobu počítačového programu a slouží k řešení úloh, k nimž byl dříve potřeba značný lidský intelekt a které byly doménou lidí, případně zvířat. Je to také vědní obor s počátky ve 40. a 50. letech 20. století, který se snaží inteligentním systémům porozumět a hlavně je vytvářet. Dnešní umělá inteligence je většinou založená na strojovém učení. Například automatický překlad, rozpoznávání obličejů na fotkách nebo chatbot jsou aplikace umělé inteligence.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-inteligentni-chovani
  nazev: Inteligentní chování
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-umela-inteligence
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Inteligentní chování je schopnost reagovat na situaci nebo změny v okolí tak, aby bylo co nejlépe dosaženo určitého cíle. Projevuje se u lidí, zvířat i strojů, pokaždé jiným způsobem a s jinou hloubkou porozumění, a to zejména vnímáním prostředí, učením ze zkušenosti, řešením problémů, rozhodováním a přizpůsobivostí. Pojem nevyžaduje rozhodnout, zda stroj „opravdu myslí“, ale sleduje pozorovatelné jednání v dané situaci. Například robotický vysavač, který objede nově postavenou židli, se v této situaci chová inteligentně.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-strojove-uceni
  nazev: Strojové učení
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Strojové učení je přístup, při kterém počítač nedostane přesný postup řešení, ale z příkladů v datech si sám vytvoří model, který pak používá na nová data. Podobně jako se člověk učí z příkladů a zkušeností, umožňuje strojové učení systémům umělé inteligence, aby nebyly jen souborem předem naprogramovaných akcí, ale samy přicházely s novými řešeními. Kvalita výsledku závisí na kvalitě a množství dat. Podle způsobu učení se rozlišuje strojové učení s učitelem, bez učitele a posilované. Například filtr nevyžádané pošty nedostane seznam pravidel, ale naučí se spam rozpoznávat z tisíců e-mailů, které lidé označili.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-strojove-uceni-s-ucitelem
  nazev: Strojové učení s učitelem
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-strojove-uceni
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Strojové učení s učitelem je způsob učení, při kterém se model učí z příkladů se známou správnou odpovědí (štítkem). Odpovědi předem přiřadí lidé – anotují data – a plní tak úlohu učitelů, odtud název. Například aplikace rozpoznávající psy a kočky se natrénuje na obrázcích označených „pes“ a „kočka“, potom se jí ukazují obrázky, které ještě neviděla, a sleduje se, zda zvíře určí správně; když chybuje, datová sada se vylepší, například doplněním obrázků, a model se natrénuje znovu. Používá se hlavně pro klasifikaci a predikci.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-strojove-uceni-bez-ucitele
  nazev: Strojové učení bez učitele
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-strojove-uceni
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Strojové učení bez učitele je způsob učení, při kterém model dostane data bez správných odpovědí a sám v nich hledá podobnosti, opakující se vzory a skupiny podobných příkladů. Model neví, co nalezené skupiny znamenají; jejich význam a užitečnost musí posoudit člověk. Například e-shop může tímto způsobem rozdělit zákazníky do skupin s podobným nákupním chováním, aniž by skupiny předem určil.
  zdroj_popisu: nový
  stav: draft
- id: k-posilovane-strojove-uceni
  nazev: Posilované strojové učení
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-strojove-uceni
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Posilované strojové učení (také zpětnovazební učení) je způsob učení, při kterém systém zkouší akce sám metodou pokusu a omylu a dostává za ně zpětnou vazbu v podobě odměny nebo postihu. Na jejím základě si postupně vytváří strategii chování (odborně politiku), která vede k co nejvyšší odměně. Například robot, který se učí projít bludištěm, získává kladnou odměnu za každý krok správným směrem a zápornou za chyby a slepé uličky, až se naučí najít optimální cestu. Používá se také u her nebo při řízení robotů.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-trenovaci-a-testovaci-data
  nazev: Trénovací a testovací data
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Trénovací a testovací data jsou dvě oddělené části dat používané při strojovém učení: z trénovacích dat se model učí, na testovacích se ověřuje, jak dobře funguje. Musí být od sebe oddělené, jinak test neukáže, jak model funguje na datech, která dosud neviděl. Na jejich přípravě, tedy sběru, čištění a anotaci, do velké míry závisí kvalita výsledného modelu. Například ze 100 fotek gest se často zhruba 80 použije k trénování a zbylých 20 k testování.'
  zdroj_popisu: nový
  stav: draft
- id: k-trenovaci-data
  nazev: Trénovací data
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-trenovaci-a-testovaci-data
  stupne:
    zs1: false
    zs2: true
  popis: Trénovací data jsou příklady, ze kterých se model učí. Musí jich být dost, musí být kvalitní a reprezentativní, tedy pokrývat situace, se kterými se model bude při skutečném použití setkávat. Co v trénovacích datech chybí nebo je v nich zkreslené, to se model nenaučí, případně se to naučí chybně. Například model trénovaný jen na fotkách červených jablek může mít potíže poznat jablko zelené.
  zdroj_popisu: nový
  stav: draft
- id: k-testovaci-data
  nazev: Testovací data
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-trenovaci-a-testovaci-data
  stupne:
    zs1: false
    zs2: true
  popis: Testovací data jsou příklady, které model při učení neviděl a na kterých se ověřuje, jak dobře funguje, například jakou má chybovost. Měla by se podobat datům ze skutečného použití. Kdyby se testovací příklady dostaly i do trénovacích dat, výsledek testu by byl zavádějící, podobně jako písemka, jejíž otázky a odpovědi žák znal předem.
  zdroj_popisu: nový
  stav: draft
- id: k-anotace-dat
  nazev: Anotace dat
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-trenovaci-a-testovaci-data
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Anotace dat je přiřazení správné odpovědi (štítku) k datům, například označení, co je na fotografii, nebo zda je e-mail spam. Anotovaná data jsou potřeba pro strojové učení s učitelem. Anotaci obvykle provádějí lidé, a proto je důležité, aby postupovali podle stejných pravidel; chyby a nejednotnost v anotaci se přenesou do modelu. Například když část fotek vlků omylem dostane štítek „pes“, model se naučí obě zvířata zaměňovat.
  zdroj_popisu: nový
  stav: draft
- id: k-model-strojoveho-uceni
  nazev: Model strojového učení
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Model strojového učení je výsledek učení z dat: naučený vztah mezi vstupy a výstupy, podle kterého program řeší určitou úlohu i pro data, která dosud neviděl. Vzniká zjednodušeně ve dvou fázích – při trénování hledá v množství příkladů, jako jsou obrázky, texty nebo videa, vzory a podobnosti, při testování se na nových příkladech ověřuje, jak dobře funguje. Data jsou k tomu potřeba vždy a většinou obsahují člověkem přiřazenou správnou odpověď (anotaci); s větším množstvím kvalitních dat zpravidla roste kvalita modelu. Stejně jako jiné modely je zjednodušenou reprezentací skutečnosti, a proto obsahuje určitou míru chyby. Například model natrénovaný na fotkách psů a koček určí u nové fotky, které zvíře na ní je.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-chybovost-modelu
  nazev: Chybovost modelu
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-model-strojoveho-uceni
  stupne:
    zs1: false
    zs2: true
  popis: 'Chybovost modelu je podíl případů, ve kterých model odpoví špatně. Zjišťuje se na testovacích datech, například jako počet chyb na sto testovacích příkladů: 7 chyb ze 100 znamená chybovost 7 % a úspěšnost 93 %. Celkové číslo může skrývat, že model u některé skupiny případů chybuje mnohem častěji, proto je dobré sledovat i to, kde přesně chybuje. Například model může jablka poznávat téměř bezchybně, ale hrušky často zaměňovat s kdoulemi.'
  zdroj_popisu: nový
  stav: draft
- id: k-neuronova-sit
  nazev: Neuronová síť
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Umělá neuronová síť je model strojového učení inspirovaný tím, jak informace zpracovává mozek, a stejně jako jiné modely se učí z dat, například rozpoznávat obrázky nebo předpovídat počasí. Skládá se z umělých neuronů – velmi jednoduchých jednotek uspořádaných do po sobě jdoucích vrstev, kterými informace proudí od vstupu, například od pixelů obrázku, až do výstupní vrstvy. Každý neuron vynásobí vstupní hodnoty vahami, sečte je a podle aktivační funkce určí svůj výstup; učení spočívá v postupném upravování vah. Neuronové sítě se využívají pro učení s učitelem, bez učitele i pro posilované učení. Jednou z prvních byl perceptron Franka Rosenblatta z konce 50. let 20. století, dnešní hluboké sítě za velkými jazykovými a obrazovými modely mají až biliony vah.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-predpojatost-dat-a-modelu-bias
  nazev: Předpojatost dat a modelu (bias)
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: „zaujatost dat“'
  popis: 'Předpojatost (v RVP zaujatost, anglicky bias) je systematické zkreslení, kdy model pro některé skupiny lidí nebo situace chybuje častěji nebo odpovídá nespravedlivě. Systémy umělé inteligence se učí na datech, která připravují lidé, a špatně připravená, nevyvážená nebo nedostatečná data vedou ke zkresleným odpovědím, protože model se naučí to, co v datech je. Předpojatost může být historická, kdy se do dat promítnou dlouho opakované lidské předsudky, například podle pohlaví nebo původu – systém pak doporučuje na vedoucí pozice spíše muže, protože tomu tak v minulosti bylo. Může být také reprezentační: rozpoznávání tváří natrénované hlavně na lidech ze střední Evropy bude u lidí z jiných částí světa chybovat častěji. Protože AI stále víc ovlivňuje rozhodování, je důležité trénovat ji na vhodných, vyvážených datech.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-cyklus-strojoveho-uceni
  nazev: Cyklus strojového učení
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Cyklus strojového učení je opakovaný postup tvorby modelu: připravit data, natrénovat model, vyzkoušet ho, opravit nebo doplnit data, případně změnit nastavení, a trénovat znovu. Model zřídka funguje dobře napoprvé, a proto se cyklus opakuje, dokud chybovost neklesne na přijatelnou míru. Z chyb modelu se přitom dá vyčíst, jaké příklady v datech chybějí nebo jsou špatně označené. Například když model rozpoznávající gesta selhává při slabém osvětlení, doplní se fotky pořízené v šeru a model se natrénuje znovu.'
  zdroj_popisu: nový
  stav: draft
- id: k-typy-ai-uloh
  nazev: Typy AI úloh
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Typy AI úloh jsou druhy úloh, které systémy umělé inteligence řeší, například klasifikace, predikce a generování. Liší se tím, jaký výstup se od systému očekává: zařazení do kategorie, číselný odhad, nebo nový obsah. Podle typu úlohy se volí druh modelu i způsob jeho ověření – u klasifikace se počítá podíl správně zařazených příkladů, u predikce se sleduje, jak daleko je odhad od skutečné hodnoty. Například určení druhu květiny z fotky je klasifikace, odhad zítřejší teploty predikce a napsání básně generování.'
  zdroj_popisu: nový
  stav: draft
- id: k-klasifikace
  nazev: Klasifikace
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-typy-ai-uloh
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Klasifikace je úloha zařadit vstup do jedné z předem daných kategorií (tříd). Kategorie mohou být dvě, například spam a běžná pošta, nebo jich může být více, například druhy rostlin. Model se klasifikaci obvykle učí strojovým učením s učitelem z příkladů, u kterých je kategorie známá. Například aplikace na rozpoznávání rostlin určí z fotky listu, o jaký druh jde.
  zdroj_popisu: nový
  stav: draft
- id: k-predikce
  nazev: Predikce
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-typy-ai-uloh
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Predikce je úloha odhadnout z dat číselnou hodnotu nebo budoucí vývoj, například teplotu, cenu nebo dobu cesty. Na rozdíl od klasifikace není výsledkem kategorie, ale hodnota na plynulé škále; odhadu číselné hodnoty se odborně říká regrese. Model vychází z dřívějších dat a předpokládá, že zachycené souvislosti platí i dál, proto je každá predikce zatížena nejistotou. Například navigace odhaduje čas příjezdu podle délky trasy a aktuálního i obvyklého provozu.
  zdroj_popisu: nový
  stav: draft
- id: k-generovani
  nazev: Generování
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-typy-ai-uloh
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Generování je úloha vytvořit nový obsah – text, obrázek, zvuk nebo kód – podle vzorů naučených z dat. Na rozdíl od klasifikace a predikce nemá jediný správný výsledek: na stejné zadání může vzniknout pokaždé jiný výstup a jeho kvalitu často posuzuje člověk. Takové úlohy řeší generativní umělá inteligence. Například shrnutí dlouhého článku do pěti vět nebo obrázek podle popisu „kočka ve skafandru“ jsou výsledky generování.'
  zdroj_popisu: nový
  stav: draft
- id: k-oblasti-umele-inteligence
  nazev: Oblasti umělé inteligence
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Oblasti umělé inteligence jsou obory, které se zaměřují na určitý druh dat nebo úloh, například na práci s obrazem, zvukem nebo přirozeným jazykem. Každá oblast řeší vlastní typické úlohy a používá k tomu modely natrénované na odpovídajících datech, dnes nejčastěji neuronové sítě. Patří sem například počítačové vidění, zpracování zvuku včetně separace zvuku a zpracování přirozeného jazyka, další oblastí je třeba robotika. Mnoho aplikací oblasti kombinuje: hlasový asistent v telefonu musí rozpoznat řeč, porozumět otázce a odpověď vyslovit.'
  zdroj_popisu: nový
  stav: draft
- id: k-pocitacove-videni
  nazev: Počítačové vidění
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-oblasti-umele-inteligence
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Počítačové vidění je obor umělé inteligence, který se zabývá tím, jak mohou počítače porozumět obrázkům a videím, a usiluje o automatizaci úloh, které zvládá lidský zrak. Rozvíjelo se ještě předtím, než se umělá inteligence stala známou, hlavně kvůli rozpoznávání vzorů v obraze; s nástupem neuronových sítí se výrazně posunulo a v některých úlohách dnes dosahuje lidské přesnosti nebo ji překonává. Například umožňuje odemknout telefon obličejem (Face ID), vyhledat informace podle fotky v Google Lens nebo rozpoznat dopravní značky a překážky u samořídicích aut.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-separace-zvuku
  nazev: Separace zvuku
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-oblasti-umele-inteligence
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Separace zvuku je technika, při které modely strojového učení, často založené na hlubokých neuronových sítích, rozliší a oddělí jednotlivé zvukové složky v nahrávce, například hlas, hudební nástroje nebo šum. Modely se to učí z velkého množství zvukových nahrávek. Například lze z písně oddělit zpěv a získat podklad pro karaoke, nebo při videohovoru potlačit hluk z ulice.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-zpracovani-prirozeneho-jazyka
  nazev: Zpracování přirozeného jazyka
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-oblasti-umele-inteligence
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Zpracování přirozeného jazyka je obor na pomezí informatiky, lingvistiky a umělé inteligence, který se zabývá tím, jak mohou počítače pracovat s lidským (přirozeným) jazykem v mluvené i psané podobě, například rozpoznávat řeč, překládat nebo vytvářet text. Přirozený jazyk je pro počítač obtížný, protože je mnohoznačný a význam slov závisí na kontextu; mnoho těchto úloh dnes řeší velké jazykové modely. Například automatické titulky k videu vznikají rozpoznáním řeči.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-velky-jazykovy-model
  nazev: Velký jazykový model
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Velký jazykový model (LLM) je model strojového učení natrénovaný na obrovském množství textů (korpusech), například knihách, článcích, Wikipedii nebo archivu webových stránek Common Crawl, který analyzuje a vytváří text a používá se například v chatbotech nebo k překladu. Text skládá tak, že opakovaně odhaduje, jak pravděpodobná jsou různá pokračování (další slovo nebo jeho část, token), a jedno z nich vybere; proto může na stejné zadání odpovědět pokaždé jinak a text tvoří podle naučených vzorů, ne z ověřených faktů. Slova si model reprezentuje jako vektory, tedy body v mnohorozměrném prostoru, jejichž poloha závisí na významu i kontextu: „oko“ v receptu na volské oko leží jinde než oko v biologii. Vývoj zahrnuje výběr korpusů, trénování, testování a úpravy pro bezpečné chování k uživatelům; kvůli nárokům na výpočetní výkon největší modely vytvářejí hlavně velké firmy (například GPT, Claude, Gemini nebo Llama).'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-prompt
  nazev: Prompt
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-velky-jazykovy-model
  stupne:
    zs1: false
    zs2: true
  popis: Prompt je zadání v přirozeném jazyce, kterým uživatel jazykovému modelu sděluje, co má udělat, například otázka, pokyn nebo text k úpravě. Kvalita odpovědi výrazně závisí na tom, jak přesné je zadání a jaký obsahuje kontext, příklady nebo požadavky na podobu výstupu. Například „Vysvětlete fotosyntézu“ vede k obecné odpovědi, kdežto „Vysvětlete fotosyntézu žákovi 7. třídy v pěti větách s příkladem z běžného života“ k odpovědi přizpůsobené.
  zdroj_popisu: nový
  stav: draft
- id: k-halucinace
  nazev: Halucinace
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-velky-jazykovy-model
  stupne:
    zs1: false
    zs2: true
  popis: Halucinace je odpověď jazykového modelu, která zní věrohodně, ale je nepravdivá nebo smyšlená, například citace neexistující knihy nebo vymyšlené datum. Vzniká proto, že model vytváří pravděpodobný text podle naučených vzorů, ne ověřená fakta, a často sám nepozná, že si vymýšlí; působí přitom stejně sebejistě jako u správných odpovědí. Podstatné údaje je proto nutné ověřovat ve spolehlivých zdrojích. Například v životopisu méně známé osobnosti může model uvést ocenění, která nikdy nezískala.
  zdroj_popisu: nový
  stav: draft
- id: k-chatbot
  nazev: Chatbot
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Chatbot je počítačový program, který automaticky vede konverzaci s uživatelem a odpovídá mu podle předem definovaných pravidel nebo s využitím umělé inteligence. Chatboti založení na pravidlech postupují podle napsaných scénářů typu „pokud uživatel napíše X, chatbot odpoví Y“ a hodí se na omezené úlohy, například kontrolu stavu objednávky. AI chatboti postavení na velkých jazykových modelech, jako ChatGPT, Claude nebo Gemini, skládají odpovědi podle naučených vzorů, zvládnou proto téměř libovolné téma, ale mohou halucinovat. První chatbot ELIZA vznikl v roce 1966 na MIT a napodoboval psychoterapeuta; přestože ničemu nerozuměl, lidé mu přisuzovali empatii, a tendenci přičítat programu lidské vlastnosti se dodnes říká ELIZA efekt. Zlomem bylo spuštění ChatGPT v listopadu 2022. Zvláštními podobami chatbota jsou AI asistent a AI společník.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-ai-asistent
  nazev: AI asistent
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-chatbot
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: AI asistent je chatbot přizpůsobený pro konkrétní účel, prostředí nebo cílovou skupinu, kterého lze vytvořit v některých chatovacích aplikacích. Na rozdíl od obecného chatbota, který odpovídá na cokoli a čerpá hlavně z obecných znalostí, má roli a cíl zadané systémovým promptem, přednostně čerpá z konkrétní znalostní báze a odpovídá hlavně na určená témata, případně používá další nástroje. Vytvořit ho lze i bez programování, zadáním instrukcí a nahráním dokumentů, například v nástrojích GPTs, Claude Projects nebo Gems. Například asistent pro učitele matematiky může vycházet ze školní učebnice a odpovídat jen na otázky k učivu.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-ai-spolecnik
  nazev: AI společník
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-chatbot
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'AI společník je aplikace s generativní umělou inteligencí, která komunikuje textem, hlasem nebo videem a napodobuje lidské chování tak, aby působila jako přítel, rádce, terapeut nebo romantický partner. Na rozdíl od běžných chatbotů, které slouží hlavně k práci s informacemi, je navržena pro dlouhodobý citový vztah: pamatuje si dřívější rozhovory, má jméno, „osobnost“ a vzhled (avatar) a reaguje empaticky. Uživatel si k ní může vytvořit parasociální vztah, tedy jednostranné citové pouto podobné vztahu k celebritě, tentokrát ale interaktivní. Pro dospívající je riziková tím, že je dostupná nepřetržitě, nesoudí a může vytlačovat vztahy s vrstevníky, přestože citovou potřebu dlouhodobě naplnit nemůže a její obchodní model stojí na čase stráveném v aplikaci. Známé jsou například Replika nebo Character.AI.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-ai-agent
  nazev: AI agent
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'AI agent je nástroj umělé inteligence, jehož jádrem je velký jazykový model a který dokáže samostatně plnit zadané úkoly: nejen odpovídá, ale jedná – používá nástroje, prohlíží web, pracuje se soubory nebo posílá e-maily. Zatímco chatbot a AI asistent komunikují, agent dostane cíl a sám podniká kroky k jeho dosažení: rozloží úkol na dílčí kroky, v opakované smyčce přemýšlí, jedná a vyhodnocuje výsledek a pamatuje si průběh úkolu. Například na úkol „chci letět do Říma“ chatbot poradí obecně, kdežto agent sám vyhledá let a hotel, připraví rezervaci a po potvrzení uživatelem ji dokončí. Protože agent jedná, jsou i rizika větší: může provést nevratnou akci, nechat se zmanipulovat instrukcemi ukrytými na webu nebo v dokumentu (prompt injection), rozvinout drobnou chybu do řetězce chybných kroků nebo jednat podle halucinace, a často má přístup k citlivým údajům, jako je e-mail nebo platby.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-doporucovaci-system
  nazev: Doporučovací systém
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Doporučovací systém je systém, obvykle založený na strojovém učení, který sleduje a vyhodnocuje chování uživatele a podle toho mu vybírá a řadí obsah nebo nabídky. Doporučuje buď obsah podobný tomu, co uživatel už sledoval, nebo obsah, který se líbil uživatelům s podobným chováním – kdo se dívá na videa s koťaty a tuleni stejně jako jiný uživatel, dostane i další videa, která sledoval on. Chování vyhodnocuje explicitně, například podle hodnocení hvězdičkami, i implicitně, například podle toho, zda uživatel video dokoukal nebo si ho pustil znovu. Používají ho sociální sítě, streamovací služby, e-shopy i vyhledávače. Souvisí s ním personalizace obsahu, filtrační bublina a králičí nora.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-personalizace-obsahu
  nazev: Personalizace obsahu
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-doporucovaci-system
  stupne:
    zs1: true
    zs2: true
  poznamka: '2. st.: Činnosti'
  popis: Personalizace obsahu je přizpůsobení nabízeného obsahu konkrétnímu uživateli na základě dat o něm, například co sledoval, hledal, kde se nachází nebo co se mu líbilo. Dva lidé proto mohou na stejné stránce nebo ve stejné aplikaci vidět různý obsah i reklamy. Personalizace pomáhá najít to, co uživatele zajímá, vyžaduje ale sběr dat o jeho chování a může vést k filtrační bublině. Například každý ze dvou spolužáků vidí na úvodní stránce YouTube jiná doporučená videa.
  zdroj_popisu: nový
  stav: draft
- id: k-filtracni-bublina
  nazev: Filtrační bublina
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-doporucovaci-system
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Filtrační bublina je situace, kdy personalizace uživateli ukazuje hlavně obsah odpovídající jeho dosavadním zájmům a názorům, takže se k němu jiné pohledy dostávají méně často. Pojem zavedl kolem roku 2010 americký internetový aktivista Eli Pariser a rozšířil ho knihou z roku 2011. Bublinu vytváří hlavně výběr algoritmu, uživatel si jí nemusí být vědom a její skutečná síla se ve výzkumech liší. Například kdo často sleduje videa o jedné hře, dostává doporučení hlavně k ní a o jiných hrách se z doporučení dozví jen málo.
  zdroj_popisu: nový
  stav: draft
- id: k-kralici-nora
  nazev: Králičí nora
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-doporucovaci-system
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Králičí nora je situace, kdy člověka sledování odkazů nebo doporučeného obsahu zavede daleko od jeho původního záměru, například při čtení Wikipedie nebo sledování videí na TikToku či YouTube. Termín (anglicky rabbit hole) pochází z knihy Lewise Carrolla Alenka v říši divů, v níž Alenka spadne do králičí nory a objeví podivný a nekonečný svět. Doporučovací systémy k tomu přispívají tím, že po každém videu nabízejí další související obsah. Například žák si chce pustit jedno video o sopkách a po hodině sleduje videa o katastrofických filmech.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-generativni-umela-inteligence
  nazev: Generativní umělá inteligence
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Generativní umělá inteligence je typ umělé inteligence navržený k vytváření nového obsahu, jako jsou texty, obrázky, hudba nebo videa, na základě dat, na kterých byla natrénována. Na rozdíl od systémů, které informace hlavně analyzují nebo třídí, se pomocí algoritmů, jako jsou neuronové sítě, naučí styl a strukturu existujících dat a vytváří podle nich nový obsah, který je často těžko odlišitelný od obsahu vytvořeného lidmi. Velký jazykový model je jedním z jejích druhů, další se specializují na generování obrazu, zvuku a hlasu nebo videa. Například chatbot na požádání napíše báseň a generátor obrázků vytvoří ilustraci podle textového popisu.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-generovani-obrazu
  nazev: Generování obrazu
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-generativni-umela-inteligence
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Generování obrazu je vytváření obrázků generativním modelem na základě textového zadání (promptu), jiného obrázku nebo dalších vstupů. Často se používají difuzní modely: při trénování se do obrázků postupně přidává šum a model se učí ho odstraňovat, při generování pak postupně „čistí“ náhodný šum, až z něj vznikne obraz odpovídající zadání. Dříve měly velký význam generativní adversariální sítě (GAN), v nichž jedna síť obrazy vytváří a druhá posuzuje jejich věrohodnost, takže se obě zlepšují. Například na zadání „zimní krajina jako akvarel“ vytvoří model nový obrázek a umí ho i dál upravovat nebo doplnit chybějící části.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-generovani-zvuku-a-hlasu
  nazev: Generování zvuku a hlasu
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-generativni-umela-inteligence
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Generování zvuku a hlasu je vytváření hudby, zvukových efektů nebo mluvené řeči generativním modelem, například podle textového popisu nebo z napsaného textu. Modely umí napodobit i hlas konkrétního člověka, k čemuž někdy stačí krátká nahrávka jeho řeči. Využívá se při dabingu, tvorbě audioknih nebo u hlasových asistentů, lze ho ale zneužít, například k podvodným hovorům hlasem blízké osoby. Například převod textu na řeč umožňuje nechat si nahlas přečíst článek.
  zdroj_popisu: nový
  stav: draft
- id: k-generovani-videa
  nazev: Generování videa
  tema: o-algoritmy-a-navrh
  podoblast: s-strojove-uceni-a-ai
  vrstva: navazujici
  nadrazeny: k-generativni-umela-inteligence
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Generování videa je vytváření videa generativním modelem podle textového popisu, obrázku nebo jiného videa. Je náročnější než generování obrázku, protože jednotlivé snímky na sebe musí plynule navazovat a postavy i předměty se mezi nimi nesmějí nesmyslně měnit. Výsledky už mohou působit jako skutečný záznam, a proto se generování videa dá zneužít k vytváření deepfake videí. Například z jediné fotografie krajiny lze vytvořit krátké video, ve kterém plují mraky.
  zdroj_popisu: nový
  stav: draft
- id: k-uzivatel-a-jeho-potreby
  nazev: Uživatel a jeho potřeby
  tema: o-algoritmy-a-navrh
  podoblast: s-navrh
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Uživatel je člověk, který řešení používá, a jeho potřeby jsou to, čeho chce s řešením dosáhnout. Návrh vychází z toho, co uživatel potřebuje, co umí a v jaké situaci řešení používá; zjišťuje se to například pozorováním, rozhovorem nebo dotazníkem a výsledkem jsou požadavky na řešení. Různé skupiny uživatelů mohou mít různé potřeby a to, co uživatelé výslovně chtějí, se nemusí shodovat s tím, co skutečně potřebují. Například na webu školy rodiče hledají hlavně kontakty a jídelníček, kdežto žáci rozvrh a změny ve výuce.
  zdroj_popisu: nový
  stav: draft
- id: k-uzivatelske-rozhrani
  nazev: Uživatelské rozhraní
  tema: o-algoritmy-a-navrh
  podoblast: s-navrh
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Uživatelské rozhraní je způsob, kterým uživatel komunikuje s programem. Umožňuje uživateli zadávat vstupy, ovládat program a získávat jeho výstupy, například pomocí oken a tlačítek, dotyků, textových příkazů nebo hlasu. Při návrhu uživatelského rozhraní je důležité dívat se na program z pohledu jeho uživatele. Pro stejný program lze rozhraní navrhnout různými způsoby a jednotlivé varianty mohou mít různé výhody a nevýhody; je přitom třeba zohlednit různé skupiny uživatelů a jejich potřeby. Rozhraní by mělo být navrženo tak, aby uživatel poznal, co může udělat, jak to má udělat a co se po jeho akci stalo. Program by měl uživateli poskytovat srozumitelnou zpětnou vazbu a vhodně reagovat i na neočekávané nebo méně obvyklé vstupy. Při návrhu programu je třeba uvažovat také o tom, jaké důsledky může mít jeho použití pro uživatele, včetně použití, které neodpovídá původnímu účelu programu. Souvisí s ním použitelnost a přístupnost. Například kalkulačka, která po pokusu o dělení nulou zobrazí
    srozumitelné upozornění, místo aby přestala reagovat, vhodně reaguje na neobvyklý vstup.
  zdroj_popisu: garant Programování (jazykově upraveno)
  stav: draft
- id: k-pouzitelnost
  nazev: Použitelnost
  tema: o-algoritmy-a-navrh
  podoblast: s-navrh
  vrstva: navazujici
  nadrazeny: k-uzivatelske-rozhrani
  stupne:
    zs1: false
    zs2: true
  popis: Použitelnost je míra, do jaké může uživatel s rozhraním dosáhnout svého cíle účinně, bez zbytečné námahy a se spokojeností. Ověřuje se pozorováním skutečných uživatelů při práci, protože autor své řešení zná a potíže v něm snadno přehlédne. Souvisí s ní ergonomie, tedy přizpůsobení rozhraní a práce s ním tělesným a duševním možnostem člověka. Například pokud žáci ve školním systému opakovaně nenajdou, kde odevzdat úkol, je rozhraní málo použitelné, i když funkce existuje.
  zdroj_popisu: nový
  stav: draft
- id: k-pristupnost
  nazev: Přístupnost
  tema: o-algoritmy-a-navrh
  podoblast: s-navrh
  vrstva: navazujici
  nadrazeny: k-uzivatelske-rozhrani
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Přístupnost je vlastnost rozhraní, které mohou používat i lidé se zdravotním postižením nebo jiným omezením, například nevidomí se čtečkou obrazovky nebo lidé, kteří nemohou ovládat myš. Patří k ní dostatečný kontrast barev, textové popisy obrázků nebo možnost ovládat vše klávesnicí. Pro webové stránky a aplikace pravidla shrnuje mezinárodní doporučení WCAG organizace W3C. Například titulky u videa pomohou neslyšícím, ale i každému, kdo video sleduje bez zvuku.
  zdroj_popisu: nový
  stav: draft
- id: k-herni-design
  nazev: Herní design
  tema: o-algoritmy-a-navrh
  podoblast: s-navrh
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Herní design je navrhování pravidel, cílů, mechanik a průběhu hry tak, aby byla pro hráče srozumitelná, zajímavá a přiměřeně náročná. Zahrnuje pravidla hry, herní mechaniky, nastavení obtížnosti i zpětnou vazbu hráči; návrh se ověřuje hraním s testovacími hráči a podle jejich zkušenosti opakovaně upravuje. Návrh počítačové hry je zároveň návrhem algoritmu: pravidla musí být úplná a jednoznačná, aby je mohl vykonávat program. Například při tvorbě hry ve Scratchi je třeba rozhodnout, jak se hráč pohybuje, za co získává body a kdy hra končí.'
  zdroj_popisu: nový
  stav: draft
- id: k-pravidla-hry
  nazev: Pravidla hry
  tema: o-algoritmy-a-navrh
  podoblast: s-navrh
  vrstva: navazujici
  nadrazeny: k-herni-design
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Pravidla hry jsou závazné pokyny, které určují, co hráč smí a nesmí, jak se ve hře vyhrává a kdy hra končí. U deskové hry je dodržují a vykládají sami hráči, v počítačové hře je vynucuje program, a proto musí být úplná a jednoznačná. Například v piškvorkách vyhrává ten, kdo jako první vytvoří nepřerušenou řadu pěti svých značek.
  zdroj_popisu: nový
  stav: draft
- id: k-herni-mechanika
  nazev: Herní mechanika
  tema: o-algoritmy-a-navrh
  podoblast: s-navrh
  vrstva: navazujici
  nadrazeny: k-herni-design
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Herní mechanika je konkrétní činnost nebo systém, se kterým hráč ve hře pracuje, například skákání, sbírání předmětů, body nebo životy. Mechaniky jsou stavebními kameny hry: jejich kombinací vzniká to, co hráč ve hře dělá, a stejná mechanika se může objevit v mnoha různých hrách. Například skákání se v plošinovce kombinuje se sbíráním mincí a vyhýbáním se překážkám.'
  zdroj_popisu: nový
  stav: draft
- id: k-obtiznost
  nazev: Obtížnost
  tema: o-algoritmy-a-navrh
  podoblast: s-navrh
  vrstva: navazujici
  nadrazeny: k-herni-design
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Obtížnost je míra náročnosti hry pro hráče. Dobře nastavená obtížnost roste spolu s dovedností hráče, aby hra nebyla ani příliš snadná, ani frustrující; hráč pak může zažívat stav plného soustředění označovaný jako flow. Hry toho dosahují postupně těžšími úrovněmi, volbou obtížnosti nebo automatickým přizpůsobením podle výkonu hráče. Například logická hra začíná jednoduchými hádankami a nové prvky přidává až poté, co hráč zvládne ty předchozí.
  zdroj_popisu: nový
  stav: draft
- id: k-zpetna-vazba-hraci
  nazev: Zpětná vazba hráči
  tema: o-algoritmy-a-navrh
  podoblast: s-navrh
  vrstva: navazujici
  nadrazeny: k-herni-design
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Zpětná vazba hráči je informace, kterou hra hráči dává o důsledcích jeho akcí, například zvuk, animace, změna skóre nebo ukazatel zdraví. Dobrá zpětná vazba přichází hned a je srozumitelná, takže hráč pozná, co se mu podařilo, a může se zlepšovat. Odměny lze ale navrhnout i tak, aby hráče hlavně co nejdéle udržely ve hře, například nepředvídatelnými odměnami; to už patří k návykovému designu. Například zablikání postavy a ubytí života při nárazu do překážky hráči ukáže, že se jí má vyhnout.
  zdroj_popisu: nový
  stav: draft
- id: k-program
  nazev: Program
  tema: o-programovani
  podoblast: s-program
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Program je zápis příkazů algoritmu v programovacím jazyce tak, aby je mohl počítač vykonat. Zatímco algoritmus je obecný popis postupu řešení, který není vázaný na žádný jazyk, program je jeho konkrétní realizací v určitém programovacím jazyce a může využívat i více algoritmů. Při běhu programu počítač vykonává zapsané příkazy; nedomýšlí přitom, co autor zamýšlel, a vykoná přesně to, co je zapsáno. Program může přijímat vstupy, zpracovávat je a vytvářet výstupy. Například hra ve Scratchi je program, který čte stisknuté klávesy, podle nich mění polohu postavy a vykresluje ji na scéně.
  zdroj_popisu: garant Programování (jazykově upraveno) + slovníček AI dětem
  stav: draft
- id: k-zapis-programu
  nazev: Zápis programu
  tema: o-programovani
  podoblast: s-program
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Zápis programu je vyjádření programu v programovacím jazyce; takový zápis se označuje jako kód programu. Existují různé programovací jazyky, které se liší způsobem zápisu i tím, pro jaké účely jsou vhodné. Každý programovací jazyk má pravidla, podle kterých se kód programu zapisuje, a pravidla určující správný zápis se označují jako syntaxe. Pokud pravidla zápisu nejsou dodržena, počítač nedokáže kód programu správně zpracovat. Například ve Scratchi se program skládá z bloků, kdežto v Pythonu se zapisuje jako text, ve kterém záleží i na odsazení řádků.
  zdroj_popisu: garant Programování (jazykově upraveno)
  stav: draft
- id: k-kod-programu
  nazev: Kód programu
  tema: o-programovani
  podoblast: s-program
  vrstva: navazujici
  nadrazeny: k-zapis-programu
  stupne:
    zs1: false
    zs2: true
  popis: 'Kód programu je konkrétní podoba zápisu programu: u textových jazyků řádky textu, u blokově orientovaných jazyků sestava bloků. Slovo kód tu neznamená šifru ani kódování dat, ale samotný text programu, u textových jazyků nazývaný také zdrojový kód. Píše, čte a upravuje ho člověk; aby ho počítač mohl vykonat, převede ho překladač do strojového kódu, nebo ho příkaz po příkazu vykonává interpret. Například tři řádky v Pythonu, které se zeptají na jméno a pozdraví uživatele, jsou kódem jednoduchého programu.'
  zdroj_popisu: nový
  stav: draft
- id: k-syntaxe
  nazev: Syntaxe
  tema: o-programovani
  podoblast: s-program
  vrstva: navazujici
  nadrazeny: k-zapis-programu
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Syntaxe je souhrn pravidel programovacího jazyka, která určují, jak se správně zapisují příkazy a další části kódu programu, například kde musí být závorka, dvojtečka nebo uvozovky. Týká se jen formy zápisu, ne toho, co program dělá: syntakticky správný kód může přesto obsahovat chybu. Každý jazyk má vlastní syntaxi: například v Pythonu se příkazy uvnitř podmínky vymezují odsazením, v JavaScriptu složenými závorkami.'
  zdroj_popisu: nový
  stav: draft
- id: k-preklad-a-spusteni-programu
  nazev: Překlad a spuštění programu
  tema: o-programovani
  podoblast: s-program
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Překlad a spuštění programu je proces, kterým se z kódu programu stane běžící program. Procesor počítače přímo vykonává jen strojový kód, tedy jednoduché instrukce zapsané jako čísla ve dvojkové soustavě, a kódu v programovacím jazyce, jako je Python, sám nerozumí. Proto je potřeba jiný program: překladač převede celý program předem do strojového kódu, interpret čte příkazy a za běhu je postupně sám vykonává; mnoho současných jazyků oba přístupy kombinuje. Spuštěním začíná běh programu, při kterém počítač vykonává jeho příkazy. Například po kliknutí na zelenou vlajku ve Scratchi začne prostředí bloky postupně vykonávat, aniž by uživatel tento proces viděl.'
  zdroj_popisu: nový
  stav: draft
- id: k-prekladac-kompilator
  nazev: Překladač (kompilátor)
  tema: o-programovani
  podoblast: s-program
  vrstva: navazujici
  nadrazeny: k-preklad-a-spusteni-programu
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Překladač (kompilátor) je program, který převede celý kód programu do jiného jazyka, obvykle do strojového kódu, a vytvoří tak spustitelný program. Překlad proběhne jednou předem; přeložený program se pak spouští bez překladače a obvykle běží rychleji, než kdyby ho vykonával interpret. Syntaktické chyby překladač ohlásí ještě před spuštěním. Například program v jazyce C se přeloží do spustitelného souboru, který lze spustit i na počítači bez překladače.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-interpret
  nazev: Interpret
  tema: o-programovani
  podoblast: s-program
  vrstva: navazujici
  nadrazeny: k-preklad-a-spusteni-programu
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Interpret je program, který čte kód programu a jeho příkazy postupně vykonává, aniž by z něj předem vytvořil samostatný spustitelný program. Program lze proto spustit hned po napsání a snadno ho zkoušet po částech; interpret je ale potřeba při každém spuštění a vykonávání bývá pomalejší než u přeloženého programu. Například v Pythonu lze příkaz napsat do interaktivního okna interpretu a výsledek se zobrazí hned po stisku klávesy Enter.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-vstup-a-vystup-programu
  nazev: Vstup a výstup programu
  tema: o-programovani
  podoblast: s-program
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Vstup a výstup programu jsou způsoby, jimiž program během svého běhu komunikuje s okolím. Vstupem program získává informace z okolí, například hodnotu zadanou uživatelem, stisknutí klávesy, kliknutí myší nebo údaj ze senzoru. Výstupem program předává informace nebo se jinak projevuje navenek; výstupem může být například text, obrázek, zvuk, změna zobrazení nebo činnost připojeného zařízení. Vstupy a výstupy mohou nastávat opakovaně v různých okamžicích běhu programu, nejen na jeho začátku a konci. Například program na desce micro:bit může průběžně měřit teplotu a každou novou hodnotu zobrazit na svém displeji.
  zdroj_popisu: garant Programování (jazykově upraveno) – karta „Vstup a výstup“
  stav: draft
- id: k-programovaci-prostredi
  nazev: Programovací prostředí
  tema: o-programovani
  podoblast: s-program
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Programovací prostředí je aplikace nebo webová stránka, ve které se program vytváří, spouští a ladí. Obvykle spojuje více nástrojů: editor kódu programu nebo nabídku bloků, tlačítko pro spuštění, místo pro výstup programu a hlášení chyb, často i krokování, při kterém lze sledovat vykonávání programu příkaz po příkazu včetně měnících se hodnot proměnných. Rozsáhlejší prostředí pro textové jazyky se označují jako integrovaná vývojová prostředí (IDE). Například ve Scratchi je vlevo nabídka bloků, uprostřed plocha pro skládání programu a vpravo scéna, na které se program po spuštění projevuje.'
  zdroj_popisu: nový
  stav: draft
- id: k-sekvence-prikazu
  nazev: Sekvence příkazů
  tema: o-programovani
  podoblast: s-rizeni-behu-programu
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Sekvence příkazů je posloupnost příkazů, které se vykonávají v pořadí, v jakém jsou zapsány. Počítač toto pořadí sám nemění ani tehdy, když by pro dosažení výsledku bylo možné některé příkazy provést v jiném pořadí. Další příkaz se začne vykonávat až po dokončení předchozího, a to i tehdy, když vykonávání příkazu trvá delší dobu nebo je jeho součástí čekání po stanovenou dobu. Sekvence je programovou podobou posloupnosti kroků v algoritmu. Například když ve Scratchi následuje po bloku „bublina Ahoj! 2 sekund“ blok „dopředu o 10 kroků“, postava se pohne až poté, co bublina po 2 sekundách zmizí.
  zdroj_popisu: garant Programování (jazykově upraveno)
  stav: draft
- id: k-opakovani-rizeni-behu-programu
  nazev: Opakování
  tema: o-programovani
  podoblast: s-rizeni-behu-programu
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Opakování je řízení běhu programu, při kterém se skupina příkazů vykoná vícekrát za sebou; v programu se zapisuje pomocí cyklu. Podle toho, co určuje počet opakování, se rozlišuje cyklus s pevným počtem opakování a cyklus s podmínkou. Zvláštním případem je nekonečný cyklus, ve Scratchi blok „opakuj stále“, který se opakuje, dokud program nezastaví uživatel nebo jiný příkaz. Cykly lze do sebe vnořovat, takže tělo jednoho cyklu může obsahovat další cyklus. Například ornament z osmi čtverců, z nichž každý je pootočený o 45°, lze zapsat jako cyklus s osmi opakováními, v jehož těle je vnořený cyklus kreslící jeden čtverec.
  zdroj_popisu: nový
  stav: draft
- id: k-cyklus-s-pevnym-poctem-opakovani
  nazev: Cyklus s pevným počtem opakování
  tema: o-programovani
  podoblast: s-rizeni-behu-programu
  vrstva: navazujici
  nadrazeny: k-opakovani-rizeni-behu-programu
  stupne:
    zs1: true
    zs2: true
  popis: Cyklus s pevným počtem opakování je cyklus, u kterého je počet opakování určen před zahájením jeho vykonávání. Pokud se má určitá činnost provést vícekrát, lze použít cyklus; příkazy, které se v cyklu vykonávají, tvoří tělo cyklu. Při každém průchodu cyklem se vykoná celé jeho tělo. Použití cyklu umožňuje zapsat opakující se činnost pouze jednou místo vícenásobného zápisu stejných nebo odpovídajících příkazů. Například čtverec lze ve Scratchi nakreslit blokem „opakuj 4 krát“, jehož tělo tvoří bloky „dopředu o 100 kroků“ a „otoč se o 90 stupňů“.
  zdroj_popisu: garant Programování (jazykově upraveno) – karta „Opakování s pevným počtem opakování“
  stav: draft
- id: k-cyklus-s-podminkou
  nazev: Cyklus s podmínkou
  tema: o-programovani
  podoblast: s-rizeni-behu-programu
  vrstva: navazujici
  nadrazeny: k-opakovani-rizeni-behu-programu
  stupne:
    zs1: false
    zs2: true
  popis: Cyklus s podmínkou je cyklus, který opakovaně vykonává své tělo podle výsledku podmínky. Počet opakování není předem určen; závisí na hodnotách, které se v průběhu programu mění a ovlivňují výsledek podmínky. Podmínka se vyhodnocuje vždy na stejném místě cyklu. Změna hodnot během vykonávání těla cyklu sama o sobě neznamená, že se podmínka hned znovu vyhodnotí; ověří se až ve chvíli, kdy běh programu na její místo opět dojde. Podle jazyka cyklus pokračuje, dokud podmínka platí (while v Pythonu), nebo dokud nezačne platit (ve Scratchi blok „opakuj dokud nenastane“). Například postava ve hře padá, dokud se nedotkne země, a počet jejích posunů dolů závisí na tom, jak vysoko začala.
  zdroj_popisu: garant Programování (jazykově upraveno)
  stav: draft
- id: k-podmineny-prikaz-vetveni
  nazev: Podmíněný příkaz (větvení)
  tema: o-programovani
  podoblast: s-rizeni-behu-programu
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Podmíněný příkaz je příkaz, který řídí průběh programu podle podmínky. Podmínka může být splněna, nebo nesplněna, a její výsledek rozhoduje o tom, které příkazy se vykonají. Podmíněný příkaz může obsahovat příkazy pouze pro případ, kdy je podmínka splněna; pokud splněna není, tyto příkazy se přeskočí a program pokračuje za podmíněným příkazem. Podmíněný příkaz může také obsahovat dvě větve: jedna se vykoná při splnění podmínky, druhá při jejím nesplnění. Po dokončení zvolené větve program pokračuje za podmíněným příkazem. Například kvíz ve Scratchi porovná blokem „když … tak … jinak“ odpověď se správným řešením: při shodě přičte bod, jinak zobrazí správnou odpověď, a v obou případech pak položí další otázku.'
  zdroj_popisu: garant Programování (jazykově upraveno) – karta „Podmíněný příkaz“
  stav: draft
- id: k-udalost
  nazev: Událost
  tema: o-programovani
  podoblast: s-rizeni-behu-programu
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Událost je situace, která nastane během běhu programu a na kterou program může reagovat, například kliknutí myší, stisk klávesy, zpráva od jiné části programu nebo uplynutí stanoveného času. Program řízený událostmi nemá jen jeden pevný sled příkazů: pro jednotlivé události má připravené skupiny příkazů (obsluhy událostí), které se spustí pokaždé, když daná událost nastane. Pořadí, v jakém se části programu vykonají, tak určuje až chování uživatele nebo okolí. Například ve Scratchi začínají skupiny bloků obvykle blokem události, jako je „po stisku klávesy mezerník“ nebo „po kliknutí na mě“.'
  zdroj_popisu: nový
  stav: draft
- id: k-stav-a-prechod-mezi-stavy
  nazev: Stav a přechod mezi stavy
  tema: o-programovani
  podoblast: s-rizeni-behu-programu
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Stav je situace, ve které se program nebo jeho část v daném okamžiku nachází, například zda postava ve hře stojí, běží, nebo skáče, nebo zda je celá hra v menu, probíhá, či skončila. Stav bývá uložen v hodnotách proměnných a ovlivňuje, jak program reaguje na vstupy: stisk stejné klávesy může v různých stavech vyvolat jinou činnost. Přechod mezi stavy je změna z jednoho stavu do jiného, kterou způsobí událost nebo splnění podmínky. Například stisk mezerníku převede stojící postavu do stavu skoku a dopad na zem ji vrátí do stavu stání.'
  zdroj_popisu: nový
  stav: draft
- id: k-stavovy-automat
  nazev: Stavový automat
  tema: o-programovani
  podoblast: s-rizeni-behu-programu
  vrstva: navazujici
  nadrazeny: k-stav-a-prechod-mezi-stavy
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Stavový automat je model chování, který má konečný počet stavů a pravidla, podle kterých se při určité události nebo podmínce přechází z jednoho stavu do jiného. V každém okamžiku je automat právě v jednom stavu. Zakresluje se obvykle diagramem, ve kterém jsou stavy kroužky a přechody šipky. Například automat na nápoje čeká na mince, po vhození dostatečné částky umožní výběr nápoje a po jeho vydání se vrátí do stavu čekání.
  zdroj_popisu: nový
  stav: draft
- id: k-herni-smycka
  nazev: Herní smyčka
  tema: o-programovani
  podoblast: s-rizeni-behu-programu
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Herní smyčka je hlavní cyklus programu hry, který se po celou dobu hry opakuje mnohokrát za sekundu. Při každém průchodu zpracuje vstupy hráče, aktualizuje stav hry, například polohy postav, skóre nebo srážky objektů, a vykreslí nový snímek. Díky rychlému opakování vzniká dojem plynulého pohybu a hra běží dál, i když hráč zrovna nic nemačká. Například ve Scratchi plní úlohu herní smyčky blok „opakuj stále“, ve kterém se kontroluje stisk šipek a posouvá postava; Scratch přitom překresluje scénu zhruba 30krát za sekundu.
  zdroj_popisu: nový
  stav: draft
- id: k-promenna
  nazev: Proměnná
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Proměnná je pojmenované místo pro hodnotu v programu: umožňuje uchovávat hodnotu pod určitým názvem. V jednom okamžiku má proměnná právě jednu hodnotu. Při přiřazení nové hodnoty se předchozí hodnota nahradí a již není v proměnné dostupná. Název proměnné by měl vystihovat význam hodnoty, která se v ní uchovává; vhodné pojmenování zvyšuje čitelnost kódu programu, ale neurčuje hodnotu proměnné. Hodnota se změní pouze tehdy, když program vykoná příkaz, který ji nastaví nebo změní. Hodnoty mohou být různých typů, například číslo nebo text, a typ hodnoty ovlivňuje, jaké operace lze s hodnotou provádět. Například proměnná skóre ve hře uchovává aktuální počet bodů; samotný název skóre ji nezvýší, body přibudou až ve chvíli, kdy program vykoná příkaz, který skóre změní.'
  zdroj_popisu: garant Programování (jazykově upraveno)
  stav: draft
- id: k-prirazeni-a-zmena-hodnoty
  nazev: Přiřazení a změna hodnoty
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: navazujici
  nadrazeny: k-promenna
  stupne:
    zs1: false
    zs2: true
  popis: 'Přiřazení je příkaz, který do proměnné uloží hodnotu zadanou přímo nebo vypočítanou z výrazu. Novou hodnotu lze vypočítat i z dosavadní hodnoty téže proměnné: zápis skore = skore + 1 v Pythonu není rovnice, ale pokyn vzít současnou hodnotu, přičíst k ní 1 a výsledek uložit zpět. Ve Scratchi tomu odpovídají bloky „nastav … na“ a „změň … o“. Před prvním použitím je potřeba proměnné přiřadit počáteční hodnotu, například skóre na začátku hry nastavit na 0.'
  zdroj_popisu: nový
  stav: draft
- id: k-globalni-a-lokalni-promenna
  nazev: Globální a lokální proměnná
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: navazujici
  nadrazeny: k-promenna
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Globální a lokální proměnná se liší tím, ve které části programu jsou dostupné. Globální proměnná je dostupná v celém programu, lokální jen uvnitř podprogramu nebo jiné části, ve které byla vytvořena, a jinde ji nelze použít ani omylem změnit. Ve Scratchi se při vytváření proměnné volí, zda bude dostupná pro všechny postavy, nebo jen pro jednu. Například skóre hry bývá globální proměnná, kdežto pomocné počítadlo uvnitř podprogramu stačí jako lokální.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-datove-typy
  nazev: Datové typy
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Datový typ je druh hodnoty, který určuje, jakých hodnot může údaj nabývat a jaké operace s ním lze provádět. Základními datovými typy v programu jsou celá a desetinná čísla, text a logická hodnota; více hodnot pod jedním názvem uchovává seznam, který je datovou strukturou. Stejný zápis může u různých typů znamenat jinou operaci: sečtením čísel 2 a 3 vznikne 5, kdežto spojením textů „2“ a „3“ vznikne text „23“, přičemž v Pythonu se obě operace zapisují znakem +. Na typ je proto potřeba dbát hlavně u vstupů. Například v Pythonu vrací funkce input() zadanou hodnotu vždy jako text, a pokud má program s věkem uživatele počítat, musí ho nejprve převést na číslo.'
  zdroj_popisu: nový
  stav: draft
- id: k-cele-a-desetinne-cislo
  nazev: Celé a desetinné číslo
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: navazujici
  nadrazeny: k-datove-typy
  stupne:
    zs1: false
    zs2: true
  popis: Celé a desetinné číslo jsou dva základní číselné datové typy. Celé číslo nemá desetinnou část a hodí se pro počty, například počet životů nebo bodů; desetinné číslo desetinnou část má, například teplota 21,5 °C. V kódu programu se desetinná část obvykle odděluje tečkou, ne čárkou. Desetinná čísla ukládá počítač jen s omezenou přesností, takže například v Pythonu nedá součet 0.1 + 0.2 přesně 0.3, ale 0.30000000000000004.
  zdroj_popisu: nový
  stav: draft
- id: k-text-retezec
  nazev: Text (řetězec)
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: navazujici
  nadrazeny: k-datove-typy
  stupne:
    zs1: false
    zs2: true
  popis: Text (řetězec) je datový typ pro posloupnost znaků, například jméno, větu nebo heslo; znakem může být písmeno, číslice, mezera i emoji. V kódu programu se text obvykle zapisuje do uvozovek, a i číslice v uvozovkách jsou proto text, ne číslo. S textem se provádějí jiné operace než s čísly, například spojování, zjištění délky nebo vyhledání znaku. Například telefonní číslo se ukládá jako text, protože se s ním nepočítá a může začínat znakem +.
  zdroj_popisu: nový
  stav: draft
- id: k-seznam-datova-struktura
  nazev: Seznam (datová struktura)
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: navazujici
  nadrazeny: k-datove-typy
  stupne:
    zs1: false
    zs2: true
  popis: 'Seznam je datová struktura, tedy složený datový typ, který pod jedním názvem uchovává více hodnot v určeném pořadí. K jednotlivým hodnotám (položkám) se přistupuje podle jejich pozice (indexu); položky lze přidávat, mazat, měnit a procházet cyklem. Číslování pozic se v jazycích liší: ve Scratchi má první položka pozici 1, v Pythonu index 0. Například výsledky všech hráčů lze uložit do jednoho seznamu místo mnoha samostatných proměnných.'
  zdroj_popisu: nový
  stav: draft
- id: k-logicka-hodnota
  nazev: Logická hodnota
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: navazujici
  nadrazeny: k-datove-typy
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Logická hodnota je datový typ, který má jen dvě možné hodnoty: pravda, nebo nepravda (v kódu obvykle true a false). Vzniká jako výsledek porovnání a logických výrazů a rozhoduje o tom, zda se vykoná větev podmíněného příkazu nebo další průchod cyklem. Lze ji uložit i do proměnné, která si pamatuje, zda něco nastalo. Například proměnná konec_hry má na začátku hodnotu nepravda a po ztrátě posledního života se nastaví na pravda.'
  zdroj_popisu: nový
  stav: draft
- id: k-rozsah-hodnot
  nazev: Rozsah hodnot
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: navazujici
  nadrazeny: k-datove-typy
  stupne:
    zs1: false
    zs2: true
  popis: 'Rozsah hodnot je vymezení toho, jakých hodnot může údaj v programu smysluplně nabývat, například školní známka 1 až 5. Program by měl hodnoty mimo rozsah rozpoznat a vhodně na ně reagovat, například vyzvat uživatele k novému zadání. Při testování se proto zkoušejí i hraniční hodnoty a hodnoty těsně za hranicí, u známky tedy 1 a 5 i 0 a 6. Omezený rozsah mají i samotné datové typy v počítači: v mnoha jazycích má celé číslo největší možnou hodnotu.'
  zdroj_popisu: nový
  stav: draft
- id: k-vyraz
  nazev: Výraz
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Výraz je část kódu programu, kterou počítač vyhodnotí, a získá tak hodnotu. Skládá se z hodnot zapsaných přímo, proměnných, operátorů (například +, -, * a /) a volání funkcí. Na rozdíl od příkazu, který něco vykoná, výraz vytváří hodnotu, kterou lze přiřadit do proměnné, vypsat nebo použít v podmínce. Při vyhodnocení se dosadí aktuální hodnoty proměnných a operace se provádějí podle priority jako v matematice. Ve Scratchi odpovídají výrazům bloky, které se vkládají do jiných bloků: zaoblené, u logických výrazů šestiúhelníkové. Například výraz cena * pocet + postovne má při ceně 50, počtu 3 a poštovném 70 hodnotu 220.'
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-logicky-vyraz
  nazev: Logický výraz
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Logický výraz je výraz, jehož výsledkem je logická hodnota pravda, nebo nepravda. Používá se v podmínkách podmíněných příkazů a cyklů s podmínkou, kde jeho výsledek rozhoduje o dalším průběhu programu. Nejčastěji vzniká porovnáním hodnot a složitější podmínky se z jednodušších skládají pomocí logických spojek. Protože výsledek závisí na aktuálních hodnotách proměnných, může se během běhu programu měnit. Ve Scratchi mají bloky logických výrazů šestiúhelníkový tvar. Například výraz životy = 0 je ve hře nepravdivý, dokud hráč nepřijde o poslední život.
  zdroj_popisu: nový
  stav: draft
- id: k-porovnani
  nazev: Porovnání
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: navazujici
  nadrazeny: k-logicky-vyraz
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'Porovnání je operace, která porovná dvě hodnoty a jako výsledek vrátí logickou hodnotu. Základní porovnání jsou rovná se, nerovná se, je větší (nebo rovno) a je menší (nebo rovno). V textových jazycích se rovnost často zapisuje dvojitým rovnítkem (==), aby se odlišila od přiřazení (=). Výsledek může záviset na datovém typu: čísla 10 a 9 splňují 10 > 9, ale texty se například v Pythonu porovnávají znak po znaku, takže text „10“ je menší než „9“; Scratch takové texty porovná jako čísla.'
  zdroj_popisu: nový
  stav: draft
- id: k-logicke-spojky-a-nebo-ne
  nazev: Logické spojky (a, nebo, ne)
  tema: o-programovani
  podoblast: s-data-v-programu
  vrstva: navazujici
  nadrazeny: k-logicky-vyraz
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Logické spojky jsou operace, které spojují jednodušší podmínky do složitější nebo obracejí jejich výsledek. Spojení podmínek spojkou „a“ platí, jen když platí obě podmínky; spojení spojkou „nebo“ platí, když platí aspoň jedna z nich, tedy i obě zároveň; spojka „ne“ výsledek podmínky obrátí. Ve Scratchi jim odpovídají bloky „a“, „nebo“ a „ne“, v Pythonu and, or a not. Například účast v soutěži pro žáky od 10 do 15 let hlídá podmínka věk ≥ 10 a věk ≤ 15.
  zdroj_popisu: nový
  stav: draft
- id: k-podprogram
  nazev: Podprogram
  tema: o-programovani
  podoblast: s-podprogram
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Podprogram je pojmenovaná část kódu programu, která obsahuje příkazy pro určitou ucelenou činnost. Název podprogramu by měl vystihovat jeho činnost, aby bylo možné poznat, co má program v daném místě udělat, aniž by bylo nutné zkoumat příkazy uvnitř podprogramu. Podprogram lze volat z různých míst programu. Pomocí podprogramů lze program rozdělit na menší, srozumitelně pojmenované části a stejný kód není nutné zapisovat na více místech. Použití podprogramů zvyšuje čitelnost kódu programu a usnadňuje jeho úpravy: pokud je potřeba danou činnost změnit, stačí upravit podprogram na jednom místě a změna se projeví při všech jeho voláních. Ve Scratchi se podprogramy vytvářejí jako vlastní bloky, v textových jazycích se obvykle nazývají funkce nebo procedury. Například podprogram nakresli_domek lze při kreslení ulice zavolat několikrát, a má-li se změnit tvar střechy, upraví se jen na jednom místě.'
  zdroj_popisu: garant Programování (jazykově upraveno) – karta „Podprogram (bez parametrů)“
  stav: draft
- id: k-definice-a-volani
  nazev: Definice a volání
  tema: o-programovani
  podoblast: s-podprogram
  vrstva: navazujici
  nadrazeny: k-podprogram
  stupne:
    zs1: false
    zs2: true
  popis: Definice a volání jsou dvě části práce s podprogramem. Definice podprogram pojmenuje a určí příkazy, které obsahuje, sama je ale nevykoná. Volání podprogram na daném místě programu spustí a po jeho dokončení program pokračuje příkazem za místem volání; podprogram může volat i jiný podprogram. Například ve Scratchi se vlastní blok vytvoří tlačítkem „Vytvořit blok“, jeho definice začíná blokem „scénář pro“ a volání znamená vložit nový blok do programu.
  zdroj_popisu: nový
  stav: draft
- id: k-parametr
  nazev: Parametr
  tema: o-programovani
  podoblast: s-podprogram
  vrstva: navazujici
  nadrazeny: k-podprogram
  stupne:
    zs1: false
    zs2: true
  popis: Parametr je pojmenovaný vstup podprogramu, kterým podprogram při volání dostane hodnotu a podle ní upraví svou činnost. V definici podprogramu má parametr jen název a uvnitř podprogramu se s ním pracuje podobně jako s proměnnou; konkrétní hodnotu dosadí až volání. Díky parametrům lze jeden podprogram použít pro různé případy. Například podprogram ctverec s parametrem delka nakreslí při volání ctverec(50) malý a při volání ctverec(200) velký čtverec.
  zdroj_popisu: nový
  stav: draft
- id: k-navratova-hodnota
  nazev: Návratová hodnota
  tema: o-programovani
  podoblast: s-podprogram
  vrstva: navazujici
  nadrazeny: k-podprogram
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Návratová hodnota je výsledek, který podprogram po svém skončení předá zpět na místo, odkud byl zavolán. Podprogram s návratovou hodnotou se obvykle nazývá funkce a jeho volání lze použít jako hodnotu ve výrazu, přiřadit do proměnné nebo vypsat. Ve Scratchi vlastní bloky návratovou hodnotu mít nemohou a výsledek se předává přes proměnnou. Například funkce prumer vrátí průměr zadaných známek a program podle něj rozhodne, jakou zprávu zobrazí.
  zdroj_popisu: nový
  stav: draft
- id: k-knihovna-a-api
  nazev: Knihovna a API
  tema: o-programovani
  podoblast: s-podprogram
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Knihovna a API jsou prostředky, které umožňují ve vlastním programu využít hotový kód nebo služby, které vytvořil někdo jiný, aniž by bylo nutné je programovat znovu. Stačí vědět, co daná část umí a jak se používá, a není nutné rozumět jejímu vnitřnímu fungování. Současné aplikace obvykle využívají mnoho převzatých částí. S převzatým kódem se ale přebírá i závislost na jeho autorech: chyba nebo změna v knihovně či službě se může projevit i ve vlastním programu. Například ve Scratchi lze přidat rozšíření pro kreslení perem nebo pro hudbu, která doplní nové bloky.'
  zdroj_popisu: nový
  stav: draft
- id: k-knihovna
  nazev: Knihovna
  tema: o-programovani
  podoblast: s-podprogram
  vrstva: navazujici
  nadrazeny: k-knihovna-a-api
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Knihovna je sbírka hotových podprogramů a dalšího kódu pro určitou oblast, například pro práci s grafikou, daty, zvukem nebo časem. Po připojení knihovny k programu se její podprogramy volají stejně jako vlastní. Mnoho knihoven je dostupných zdarma jako open source, i u nich je ale potřeba dodržet podmínky licence. Například v Pythonu se příkazem import turtle připojí knihovna želví grafiky a program pak může kreslit příkazy forward a left.
  zdroj_popisu: nový
  stav: draft
- id: k-api
  nazev: API
  tema: o-programovani
  podoblast: s-podprogram
  vrstva: navazujici
  nadrazeny: k-knihovna-a-api
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'API (rozhraní pro programování aplikací, Application Programming Interface) je dohodnutý způsob, jak může program využívat funkce jiného programu, knihovny nebo online služby: určuje, jaké požadavky lze poslat a v jaké podobě přijde odpověď. Program tak nemusí znát vnitřní fungování služby. Například aplikace s počasím pošle přes API meteorologické služby název města a dostane zpět předpověď; podobně lze přes API poslat dotaz velkému jazykovému modelu.'
  zdroj_popisu: nový
  stav: draft
- id: k-chyba-bug
  nazev: Chyba (bug)
  tema: o-programovani
  podoblast: s-chyby-a-kvalita-kodu
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Chyba (bug) je nedostatek v programu, kvůli kterému se program nechová podle očekávání: nejde spustit, předčasně se zastaví, nebo dává nesprávné výsledky. Podle toho, kdy a jak se projeví, se rozlišují chyby syntaktické, běhové a funkční. Příčina může být v zápisu kódu programu i v samotném algoritmu, přičemž chyba v algoritmu se projeví v každém programu, který ho realizuje. Chyby se odhalují testováním programu na různých vstupech; jejich hledání a odstraňování se nazývá ladění (debugging) a často při něm pomáhá krokování. Například když postava ve hře prochází zdí, hledá se místo v kódu, kde chybí nebo selhává kontrola dotyku se zdí.'
  zdroj_popisu: nový
  stav: draft
- id: k-syntakticka-chyba
  nazev: Syntaktická chyba
  tema: o-programovani
  podoblast: s-chyby-a-kvalita-kodu
  vrstva: navazujici
  nadrazeny: k-chyba-bug
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Syntaktická chyba je porušení syntaxe, tedy pravidel zápisu programovacího jazyka, například chybějící závorka, uvozovka nebo dvojtečka. Program s takovou chybou obvykle nelze vůbec spustit. Programovací prostředí ji zpravidla samo ohlásí a označí řádek, kde ji zjistilo; skutečná příčina ale může být i o řádek výš. V blokově orientovaných jazycích syntaktické chyby téměř nevznikají, protože tvar bloků chybné spojení nedovolí.
  zdroj_popisu: nový
  stav: draft
- id: k-behova-chyba
  nazev: Běhová chyba
  tema: o-programovani
  podoblast: s-chyby-a-kvalita-kodu
  vrstva: navazujici
  nadrazeny: k-chyba-bug
  stupne:
    zs1: false
    zs2: true
  popis: Běhová chyba je chyba, která se projeví až za běhu programu, i když je jeho zápis syntakticky správný. Vzniká, když program narazí na operaci, kterou nelze provést, například dělení nulou nebo práci s neexistující položkou seznamu, a často se projeví jen při některých vstupech. Textové jazyky, jako je Python, program obvykle zastaví s chybovým hlášením; Scratch se nezastaví a pokračuje s náhradní hodnotou, například nekonečnem nebo prázdným textem.
  zdroj_popisu: nový
  stav: draft
- id: k-funkcni-logicka-chyba
  nazev: Funkční (logická) chyba
  tema: o-programovani
  podoblast: s-chyby-a-kvalita-kodu
  vrstva: navazujici
  nadrazeny: k-chyba-bug
  stupne:
    zs1: false
    zs2: true
  popis: Funkční (logická) chyba je chyba, při které program běží bez chybového hlášení, ale dává nesprávné výsledky nebo se chová jinak, než měl. Příčinou bývá například špatná podmínka, nesprávné pořadí příkazů nebo chybný počet opakování. Počítač ji sám neodhalí; odhalí ji až testování, při kterém se skutečné výsledky porovnávají s očekávanými. Například program na výpočet průměru dělí součet známek vždy třemi, i když žák dostal známek pět.
  zdroj_popisu: nový
  stav: draft
- id: k-citelnost-kodu
  nazev: Čitelnost kódu
  tema: o-programovani
  podoblast: s-chyby-a-kvalita-kodu
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Čitelnost kódu je vlastnost kódu programu, která vyjadřuje, jak snadno mu člověk porozumí. Počítači na ní nezáleží, kód ale čtou a upravují lidé – spolužáci, učitel i sám autor po čase. Čitelnost zvyšují výstižné názvy proměnných a podprogramů, rozdělení programu do podprogramů, přehledné uspořádání a odsazení a komentáře tam, kde kód sám nestačí. Čitelný kód se snáze kontroluje, upravuje a sdílí. Nejkratší zápis nemusí být nejčitelnější, proto se hledá rovnováha mezi úsporností a přehledností. Například název proměnné pocet_zivotu prozradí její účel na první pohled, název x nikoli.
  zdroj_popisu: nový
  stav: draft
- id: k-komentar
  nazev: Komentář
  tema: o-programovani
  podoblast: s-chyby-a-kvalita-kodu
  vrstva: navazujici
  nadrazeny: k-citelnost-kodu
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: 'Komentář je část kódu programu určená pro člověka, který kód čte; počítač ho při vykonávání programu ignoruje. Komentáře pomáhají čtenáři rychle se orientovat v kódu programu a pochopit účel jeho jednotlivých částí, aniž by musel zkoumat příkaz po příkazu. Pomáhají nejen jiným čtenářům, ale také samotnému autorovi při práci s vlastním kódem, například při jeho úpravách nebo hledání chyby. Komentář může vysvětlovat například účel části programu, důvod zvoleného řešení nebo skutečnost, která není z kódu programu snadno patrná; není potřeba komentovat každý příkaz. Komentářů by mělo být tolik a měly by být tak podrobné, aby usnadňovaly orientaci v kódu programu – příliš mnoho zbytečných nebo příliš podrobných komentářů může naopak čitelnost zhoršit. Komentáře společně s vhodnými názvy proměnných a podprogramů zvyšují čitelnost kódu programu a usnadňují jeho další úpravy. V Pythonu se komentář zapisuje za znak #, ve Scratchi jako žlutý lísteček připojený k bloku. Například komentář
    „v bonusovém kole se body zdvojnásobují“ vysvětlí, proč je v kódu násobení dvěma.'
  zdroj_popisu: garant Programování (jazykově upraveno) – karta „Komentáře“
  stav: draft
- id: k-efektivita-programu
  nazev: Efektivita programu
  tema: o-programovani
  podoblast: s-chyby-a-kvalita-kodu
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Efektivita programu je hledisko, podle kterého se posuzují a porovnávají různá řešení téže úlohy. Stejnou úlohu lze často naprogramovat různými způsoby; jednotlivá řešení mohou vést ke stejnému výsledku, ale lišit se například množstvím vykonávaných činností, složitostí, čitelností nebo snadností dalších úprav. Jedním z hledisek efektivity je množství činností, které program vykoná, aby dosáhl požadovaného výsledku: ze dvou řešení se stejným výsledkem může jedno provést méně příkazů, použít kratší cestu k cíli nebo se vyhnout činnostem, které pro dosažení výsledku nejsou potřeba. Délka kódu programu sama o sobě neurčuje jeho efektivitu, protože kratší zápis nemusí znamenat, že program při svém běhu vykoná méně činností. Při posuzování řešení se zohledňuje také čitelnost kódu programu a snadnost jeho dalších úprav; jednodušší a přehlednější řešení se obvykle snáze kontroluje, upravuje a opravuje. Neexistuje vždy jedno nejlepší řešení: při porovnávání záleží na účelu programu a na
    tom, co je v dané situaci důležité. Například jméno v abecedně seřazeném seznamu lze hledat procházením položku po položce, nebo opakovaným půlením seznamu; obě řešení najdou totéž, ale druhé u dlouhého seznamu provede mnohem méně porovnání, i když je jeho kód delší.'
  zdroj_popisu: garant Programování (jazykově upraveno) – karta „Efektivita“
  stav: draft
- id: k-blokove-orientovany-jazyk
  nazev: Blokově orientovaný jazyk
  tema: o-programovani
  podoblast: s-programovaci-jazyky
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Blokově orientovaný jazyk je programovací jazyk, ve kterém se program skládá z grafických bloků, které do sebe zapadají podobně jako dílky stavebnice. Bloky jsou rozdělené do barevných kategorií a jejich tvar určuje, jak je lze spojovat; například do místa pro podmínku lze vložit jen blok, jehož výsledkem je logická hodnota. Díky tomu téměř nevznikají syntaktické chyby a lze se soustředit na logiku programu. Příkazy není nutné si pamatovat, protože jsou nabídnuté v paletě bloků. Například ve Scratchi nebo v prostředí MakeCode pro micro:bit lze takto programovat hry, animace i řízení robotů.
  zdroj_popisu: nový
  stav: draft
- id: k-textovy-programovaci-jazyk
  nazev: Textový programovací jazyk
  tema: o-programovani
  podoblast: s-programovaci-jazyky
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Textový programovací jazyk je programovací jazyk, ve kterém se program zapisuje jako text podle přesných pravidel syntaxe. Program lze psát v libovolném textovém editoru, obvykle se ale používá programovací prostředí, které barevně zvýrazňuje části kódu a upozorňuje na chyby. Oproti blokově orientovaným jazykům je zápis stručnější a lépe se hodí pro rozsáhlé programy, vyžaduje ale přesné dodržování syntaxe, často včetně rozlišování velkých a malých písmen. Například v Pythonu se píší školní úlohy i programy pro analýzu dat, v JavaScriptu interaktivní webové stránky.
  zdroj_popisu: nový
  stav: draft
- id: k-znackovaci-a-stylovy-jazyk
  nazev: Značkovací a stylový jazyk
  tema: o-programovani
  podoblast: s-programovaci-jazyky
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Značkovací a stylový jazyk jsou počítačové jazyky, které nepopisují postup, ale strukturu a vzhled dokumentu, typicky webové stránky. Značkovací jazyk označuje význam jednotlivých částí obsahu, například nadpis nebo odstavec, a stylový jazyk určuje, jak mají tyto části vypadat. Nejsou to programovací jazyky v pravém smyslu, protože nejsou určené k zápisu algoritmů s podmínkami a cykly; chování stránky zajišťuje programovací jazyk, například JavaScript. Například webová stránka školy má obsah zapsaný v HTML a vzhled určený v CSS.
  zdroj_popisu: nový
  stav: draft
- id: k-html
  nazev: HTML
  tema: o-programovani
  podoblast: s-programovaci-jazyky
  vrstva: navazujici
  nadrazeny: k-znackovaci-a-stylovy-jazyk
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: HTML (HyperText Markup Language) je značkovací jazyk, ve kterém se zapisuje obsah a struktura webových stránek. Jednotlivé části obsahu se ohraničují značkami (tagy) ve špičatých závorkách, které určují jejich význam, například nadpis, odstavec, odkaz nebo obrázek. Prohlížeč značky nezobrazuje, ale podle nich stránku sestaví. Například zápis <h1>Školní jídelna</h1> označí text jako hlavní nadpis stránky.
  zdroj_popisu: nový
  stav: draft
- id: k-css
  nazev: CSS
  tema: o-programovani
  podoblast: s-programovaci-jazyky
  vrstva: navazujici
  nadrazeny: k-znackovaci-a-stylovy-jazyk
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'CSS (kaskádové styly) je stylový jazyk, který určuje vzhled prvků webové stránky, například barvy, písmo, velikosti a rozmístění na obrazovce. Každé pravidlo CSS určuje, kterých prvků se týká a jaké vlastnosti jim nastavuje. Díky oddělení vzhledu od obsahu lze jedním souborem stylů změnit vzhled celého webu nebo stránku přizpůsobit různě velkým obrazovkám. Například pravidlo h1 { color: blue; } obarví všechny hlavní nadpisy stránky modře.'
  zdroj_popisu: nový
  stav: draft
- id: k-dotazovaci-jazyk-sql
  nazev: Dotazovací jazyk (SQL)
  tema: o-programovani
  podoblast: s-programovaci-jazyky
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Dotazovací jazyk SQL je jazyk pro práci s daty v relačních databázích. Dotaz v něm popisuje, jaká data se mají vybrat, přidat, změnit nebo smazat, ale ne postup, jak je v databázi najít; ten zvolí sám databázový systém. Dotazem lze data filtrovat podle podmínky, řadit nebo z nich počítat souhrny, jako jsou počty a průměry. Například dotaz SELECT jmeno FROM zaci WHERE trida = '8.A' vybere z tabulky žáků jména všech žáků třídy 8.A.
  zdroj_popisu: nový
  stav: draft
- id: k-prirozeny-jazyk-jako-zadani
  nazev: Přirozený jazyk jako zadání
  tema: o-programovani
  podoblast: s-programovaci-jazyky
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Přirozený jazyk jako zadání je způsob tvorby programu, při kterém člověk běžnou řečí popíše, co má program dělat, a kód programu podle tohoto zadání (promptu) vytvoří velký jazykový model. Výsledkem je kód v běžném programovacím jazyce, který model sestaví podle naučených vzorů. Stejné zadání proto může pokaždé vést k jinému kódu a kód může obsahovat chyby, a je ho tedy potřeba číst, testovat a ověřovat stejně jako kód napsaný člověkem. Například žák může požádat AI asistenta o program v Pythonu pro hru „hádej číslo“ a poté zkontrolovat, zda hra správně reaguje i na neplatné vstupy.
  zdroj_popisu: nový
  stav: draft
- id: k-vibe-coding
  nazev: Vibe Coding
  tema: o-programovani
  podoblast: s-programovaci-jazyky
  vrstva: navazujici
  nadrazeny: k-prirozeny-jazyk-jako-zadani
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Vibe coding je způsob tvorby programu, při kterém autor popisuje AI, co chce, a vygenerovaný kód přijímá a upravuje hlavně podle toho, jak výsledek funguje, aniž by kód podrobně četl. Chyby řeší tak, že AI popíše, co nefunguje, a nechá ji kód upravit. Takto může například žák rychle vytvořit jednoduchou webovou hru i bez znalosti programování, kódu ale nerozumí a nemůže zaručit jeho správnost ani bezpečnost. Termín použil Andrej Karpathy v únoru 2025.
  zdroj_popisu: nový
  stav: draft
- id: k-nejednoznacnost-prirozeneho-jazyka
  nazev: Nejednoznačnost přirozeného jazyka
  tema: o-programovani
  podoblast: s-programovaci-jazyky
  vrstva: navazujici
  nadrazeny: k-prirozeny-jazyk-jako-zadani
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Nejednoznačnost přirozeného jazyka je vlastnost běžné řeči, kvůli které lze stejnou větu pochopit více způsoby. Člověk si chybějící informace domyslí podle situace, jazykový model ale může zvolit jiný výklad, než autor zamýšlel. Programovací jazyky mají naopak přesná pravidla a každý příkaz v nich má jednoznačný význam. Například zadání „seřaď žáky podle výsledků“ neříká, zda od nejlepšího, nebo od nejhoršího, ani jak řadit při shodě bodů.
  zdroj_popisu: nový
  stav: draft
- id: k-sber-dat
  nazev: Sběr dat
  tema: o-data-a-analyza
  podoblast: s-sber-dat
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Sběr dat je získávání údajů potřebných k zodpovězení určité otázky nebo k vyřešení problému. Data lze získat pozorováním, měřením, dotazníkem, pomocí senzorů, vyhledáním v existujících zdrojích nebo automatickým záznamem činnosti zařízení a služeb. Před sběrem je třeba ujasnit si, co přesně chceme zjistit, od koho a v jakém rozsahu, protože způsob sběru ovlivňuje, jak přesná, úplná a spolehlivá data budou; u údajů o lidech je navíc třeba chránit jejich soukromí. Například na otázku, jak žáci chodí do školy, lze odpovědět dotazníkem ve třídách nebo pozorováním u vchodu, a každý způsob přinese trochu jiná data.
  zdroj_popisu: nový
  stav: draft
- id: k-pozorovani
  nazev: Pozorování
  tema: o-data-a-analyza
  podoblast: s-sber-dat
  vrstva: navazujici
  nadrazeny: k-sber-dat
  stupne:
    zs1: true
    zs2: false
  poznamka: 'RVP: Činnosti'
  popis: Pozorování je způsob sběru dat, při kterém zaznamenáváme, co vidíme nebo slyšíme, aniž do sledovaného dění zasahujeme. Předem je třeba určit, co se bude sledovat a jak se to bude zapisovat, například čárkami do připravené tabulky, aby se záznamy různých pozorovatelů daly porovnat. Například žáci mohou 15 minut počítat vozidla projíždějící kolem školy a zvlášť zapisovat osobní auta, autobusy a nákladní vozy.
  zdroj_popisu: nový
  stav: draft
- id: k-mereni
  nazev: Měření
  tema: o-data-a-analyza
  podoblast: s-sber-dat
  vrstva: navazujici
  nadrazeny: k-sber-dat
  stupne:
    zs1: true
    zs2: false
  poznamka: 'RVP: Činnosti'
  popis: Měření je zjišťování hodnoty určité veličiny pomocí měřidla, například teploměru, metru nebo stopek. Výsledkem je číslo s jednotkou, například 21 °C nebo 3 m; bez jednotky naměřená hodnota nedává smysl. Každé měření má omezenou přesnost danou měřidlem i tím, kdo měří, proto se často opakuje a výsledky se porovnávají. Například při měření běhu na 60 m se časy dvou časoměřičů se stopkami mohou lišit o desetiny sekundy.
  zdroj_popisu: nový
  stav: draft
- id: k-dotaznik-a-formular
  nazev: Dotazník a formulář
  tema: o-data-a-analyza
  podoblast: s-sber-dat
  vrstva: navazujici
  nadrazeny: k-sber-dat
  stupne:
    zs1: true
    zs2: true
  popis: 'Dotazník je sada otázek, kterými se zjišťují názory, zvyky nebo údaje lidí; formulář slouží k vyplnění údajů do připravených polí, například jména nebo třídy. Online formulář ukládá odpovědi rovnou do tabulky. Uzavřené otázky nabízejí odpovědi na výběr a snadno se vyhodnocují, otevřené dávají prostor pro vlastní odpověď. Na formulaci záleží: návodná otázka jako „Souhlasíte, že přestávky jsou příliš krátké?“ odpovědi zkresluje.'
  zdroj_popisu: nový
  stav: draft
- id: k-senzor-jako-zdroj-dat
  nazev: Senzor jako zdroj dat
  tema: o-data-a-analyza
  podoblast: s-sber-dat
  vrstva: navazujici
  nadrazeny: k-sber-dat
  stupne:
    zs1: true
    zs2: false
  poznamka: navazuje na Senzor (Systémy)
  popis: Senzor je zdrojem dat, která vznikají automatickým měřením veličin z okolí, například teploty, světla nebo pohybu. Na rozdíl od ručního měření může měřit nepřetržitě a v pravidelných intervalech, takže vzniká velké množství hodnot doplněných časovým údajem. Porouchaný nebo špatně umístěný senzor ale dává data, která neodpovídají skutečnosti. Například školní meteostanice může každých 10 minut zaznamenat teplotu a vlhkost vzduchu.
  zdroj_popisu: nový
  stav: draft
- id: k-vyhledavani-v-existujicich-zdrojich
  nazev: Vyhledávání v existujících zdrojích
  tema: o-data-a-analyza
  podoblast: s-sber-dat
  vrstva: navazujici
  nadrazeny: k-sber-dat
  stupne:
    zs1: true
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Vyhledávání v existujících zdrojích je získávání dat, která už dříve shromáždil někdo jiný, například statistický úřad, dopravce nebo vědecký tým. Patří sem statistiky, jízdní řády, mapy nebo otevřená data, která instituce zveřejňují k volnému použití. U převzatých dat je třeba zjistit, kdo je pořídil, kdy a jakým způsobem a za jakých podmínek je smíme použít. Například počet obyvatel obce lze dohledat v datech Českého statistického úřadu.
  zdroj_popisu: nový
  stav: draft
- id: k-automaticky-sber-dat-logy
  nazev: Automatický sběr dat (logy)
  tema: o-data-a-analyza
  podoblast: s-sber-dat
  vrstva: navazujici
  nadrazeny: k-sber-dat
  stupne:
    zs1: false
    zs2: true
  poznamka: navazuje na Digitální stopu
  popis: Automatický sběr dat je zaznamenávání údajů, které zařízení a služby provádějí samy při svém provozu. Vznikají tak ve velkém množství záznamy (logy), například o přihlášení, kliknutích, prohlížených stránkách nebo poloze. Provozovatelé je využívají k odhalování chyb, zlepšování služeb, doporučování obsahu i cílení reklamy, často aniž si to uživatel uvědomuje. Například hudební aplikace zaznamenává přeskočené skladby a podle toho nabízí další.
  zdroj_popisu: nový
  stav: draft
- id: k-druhy-dat-podle-puvodu
  nazev: Druhy dat podle původu
  tema: o-data-a-analyza
  podoblast: s-sber-dat
  vrstva: core
  stupne:
    zs1: true
    zs2: false
  popis: Druhy dat podle původu jsou kategorie, do kterých se data třídí podle toho, odkud pocházejí a kdo je vytvořil. Osobní data se týkají jednoho člověka, například jeho výšky nebo oblíbeného jídla; školní data vznikají ve škole, například rozvrh nebo docházka; online data vznikají při používání internetu a aplikací; senzorická data naměří zařízení; společenská data popisují větší skupiny lidí, například výsledky voleb nebo statistiky obyvatelstva. Kategorie se mohou překrývat, například známky jsou zároveň školní i osobní data. Původ napovídá, kdo za data odpovídá, jak jsou spolehlivá a zda je třeba chránit soukromí.
  zdroj_popisu: nový
  stav: draft
- id: k-data-a-informace
  nazev: Data a informace
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Data a informace jsou dva úzce související, ale odlišné pojmy: data jsou zaznamenané údaje, informace je význam, který z nich získáme, když je zasadíme do souvislostí a vyložíme. Stejná data proto mohou různým lidem nebo v různé situaci přinést různou informaci, a kdo souvislosti nezná, nemusí z nich získat žádnou. Data i informace si lidé předávají v podobě sdělení. Například číslo 39 jako tělesná teplota ve stupních Celsia znamená horečku, kdežto v obchodě s obuví jde o velikost bot.'
  zdroj_popisu: nový
  stav: draft
- id: k-data
  nazev: Data
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-data-a-informace
  stupne:
    zs1: true
    zs2: true
  popis: Data jsou údaje, které lze použít k řešení problémů, k rozhodování nebo k pochopení světa kolem nás; když jim přiřadíme smysl nebo význam, vzniká informace. Počítače a další zařízení pracují s digitálními daty, která popisují část reálného světa ve formě vhodné k počítačovému zpracování. Mohou to být texty (znaky, slova, čísla), tabulky, obrázky (fotografie, kresby, grafy, GIFy), videa, zvukové nahrávky nebo 3D objekty. Například záznam z dovolené, telefonní hovor, hudba, model pro 3D tisk i postava ve hře jsou data.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-informace
  nazev: Informace
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-data-a-informace
  stupne:
    zs1: true
    zs2: true
  popis: 'Informace je vysvětlení (interpretace) dat: vzniká, když data uspořádáme a použijeme tak, aby dávala smysl, a pomáhá porozumět světu nebo se správně rozhodnout. Pyramida DIKW popisuje cestu od dat přes informace ke znalosti, tedy pochopeným a propojeným informacím, a k moudrosti, tedy schopnosti znalosti správně uplatnit při rozhodování. Výstupem systémů strojového učení, které se v datech učí rozpoznávat vzory, je obvykle informace, například „na obrázku je s 92% pravděpodobností kočka“. Pochopit, proč tomu tak je, a moudře se rozhodnout zůstává na člověku, proto je třeba výstupy AI kriticky vykládat a ověřovat.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-sdeleni
  nazev: Sdělení
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-data-a-informace
  stupne:
    zs1: false
    zs2: true
  popis: Sdělení je obsah, který odesílatel předává příjemci v určité podobě, například jako zprávu, graf, článek nebo dopravní značku. Aby z něj příjemce získal informaci, musí rozumět jeho jazyku nebo kódu a znát souvislosti; různí příjemci proto mohou stejné sdělení pochopit různě. Sdělení se předává kanálem, například řečí, písmem nebo přes internet, a cestou se může zkreslit. Například zpráva v jazyce, kterému příjemce nerozumí, pro něj zůstává jen daty bez informace.
  zdroj_popisu: nový
  stav: draft
- id: k-kvalita-dat
  nazev: Kvalita dat
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  poznamka: '2. st.: kvalita trénovacích dat'
  popis: Kvalita dat je míra, do jaké jsou data vhodná pro daný účel. Posuzuje se podle několika hledisek, zejména přesnosti, aktuálnosti, důvěryhodnosti a úplnosti; stejná data přitom mohou pro jeden účel stačit a pro jiný ne. Z nekvalitních dat vycházejí nespolehlivé závěry a totéž platí pro modely strojového učení, do jejichž výsledků se přenesou chyby a nevyváženost trénovacích dat. Například teplota naměřená před týdnem je nevhodná pro rozhodnutí, co si dnes obléct, ale pro záznam o počasí v minulém týdnu je v pořádku.
  zdroj_popisu: nový
  stav: draft
- id: k-presnost
  nazev: Přesnost
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-kvalita-dat
  stupne:
    zs1: true
    zs2: false
  popis: 'Přesnost vyjadřuje, jak dobře data odpovídají skutečnosti. Snižují ji odhady místo měření, nepřesná měřidla, překlepy při zápisu nebo nevhodné zaokrouhlování. Potřebná přesnost závisí na účelu: pro výběr oblečení stačí venkovní teplota v celých stupních, tělesnou teplotu je třeba znát na desetiny stupně. Například údaj „asi 20 °C“ odhadnutý bez teploměru je méně přesný než hodnota změřená teploměrem.'
  zdroj_popisu: nový
  stav: draft
- id: k-aktualnost
  nazev: Aktuálnost
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-kvalita-dat
  stupne:
    zs1: true
    zs2: false
  popis: Aktuálnost vyjadřuje, zda data odpovídají současnému stavu. Některá data zastarávají rychle, například poloha autobusu nebo počasí, jiná se mění jen zřídka, například rozloha státu. U každého údaje je proto užitečné vědět, kdy vznikl nebo kdy byl naposledy aktualizován. Například loňský jízdní řád už nemusí platit a podle něj lze autobus snadno zmeškat.
  zdroj_popisu: nový
  stav: draft
- id: k-duveryhodnost
  nazev: Důvěryhodnost
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-kvalita-dat
  stupne:
    zs1: true
    zs2: false
  popis: Důvěryhodnost vyjadřuje, do jaké míry lze datům věřit podle toho, kdo je získal, jakým způsobem a s jakým záměrem. Důvěryhodnější jsou data, u kterých je známý autor i postup jejich získání a která lze ověřit v jiném, nezávislém zdroji. Opatrnost je na místě, když ten, kdo data zveřejňuje, má zájem na určitém výsledku. Například výsledky testu výrobku od nezávislé zkušebny jsou důvěryhodnější než údaje z reklamy jeho výrobce.
  zdroj_popisu: nový
  stav: draft
- id: k-uplnost
  nazev: Úplnost
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-kvalita-dat
  stupne:
    zs1: true
    zs2: false
  popis: Úplnost vyjadřuje, zda data obsahují všechny údaje potřebné pro daný účel. Chybět mohou jednotlivé hodnoty, například nevyplněná odpověď v dotazníku, ale i celé skupiny záznamů, například lidé, kteří se průzkumu nezúčastnili. Chybějící data mohou závěry zkreslit, zvlášť když nechybějí náhodně. Například když polovina třídy nevyplní otázku na čas strávený u obrazovky, průměr spočítaný z ostatních odpovědí nemusí odpovídat celé třídě.
  zdroj_popisu: nový
  stav: draft
- id: k-princip-gigo
  nazev: Princip GIGO
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-kvalita-dat
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Velké myšlenky'
  popis: Princip GIGO (z anglického garbage in, garbage out, doslova „odpad dovnitř, odpad ven“) vyjadřuje, že chybná nebo nesmyslná vstupní data vedou k nesmyslnému výstupu. Program chybná data obvykle nerozpozná a zpracuje je jako správná, takže výsledek může vypadat věrohodně, i když je špatný. Platí to pro výpočty v tabulce i pro modely strojového učení naučené na chybných datech. Například když se do tabulky omylem zapíše známka 5 místo 1, vyjde špatný průměr bez jakéhokoli varování.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-zdroj-informaci
  nazev: Zdroj informací
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Zdroj informací je místo, dokument nebo osoba, od které informace pochází, například kniha, webová stránka, databáze, odborník nebo očitý svědek. Primární zdroj přináší informaci z první ruky, sekundární ji přebírá a zpracovává. Kvalitu zdroje je třeba posuzovat podle několika hledisek: zda informace souvisí s řešenou otázkou (relevance), zda údaje zachycují to, co tvrdí (validita), zda jsou výsledky stálé (reliabilita) a zda zdroj prošel odbornou kontrolou (recenze). Například článek o výsledcích výzkumu na zpravodajském webu je sekundární zdroj, odborná studie, ze které vychází, je zdroj primární.'
  zdroj_popisu: nový
  stav: draft
- id: k-relevance
  nazev: Relevance
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-zdroj-informaci
  stupne:
    zs1: false
    zs2: true
  popis: Relevance vyjadřuje, zda informace skutečně souvisí s otázkou, kterou řešíme, a pomáhá na ni odpovědět. Informace může být pravdivá a přesná, a přesto pro daný účel nepoužitelná. Relevanci posuzujeme už při vyhledávání, protože vyhledávač může nabídnout výsledky, které obsahují hledaná slova, ale týkají se něčeho jiného. Například při hledání informací o jaguárech jako zvířatech nejsou relevantní stránky o automobilech značky Jaguar.
  zdroj_popisu: nový
  stav: draft
- id: k-validita
  nazev: Validita
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-zdroj-informaci
  stupne:
    zs1: false
    zs2: true
  popis: Validita (platnost) vyjadřuje, zda údaj nebo měření skutečně zachycuje to, co tvrdí, že zachycuje. Je třeba ji posoudit vždy, když se zkoumaná vlastnost nedá změřit přímo a místo ní se měří něco, co s ní jen souvisí. I přesný údaj může být nevalidní, a vést tak k chybnému závěru. Například počet hodin strávených nad učebnicí neměří, kolik se žák naučil, a počet sledujících na sociální síti neměří, jak odborně spolehlivý je autor.
  zdroj_popisu: nový
  stav: draft
- id: k-reliabilita
  nazev: Reliabilita
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-zdroj-informaci
  stupne:
    zs1: false
    zs2: true
  popis: 'Reliabilita (spolehlivost) vyjadřuje stálost měření nebo zjišťování: zda by opakované měření stejným způsobem a za stejných podmínek dospělo ke stejnému nebo velmi podobnému výsledku. Měření může být reliabilní, a přesto nevalidní, když spolehlivě měří něco jiného, než co chceme zjistit. Například váha, která při opakovaném vážení téhož předmětu ukazuje pokaždé jinou hmotnost, není reliabilní.'
  zdroj_popisu: nový
  stav: draft
- id: k-recenzovany-zdroj
  nazev: Recenzovaný zdroj
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-zdroj-informaci
  stupne:
    zs1: false
    zs2: true
  popis: Recenzovaný zdroj je text, který před zveřejněním posoudili nezávislí odborníci z daného oboru (recenzenti), například článek v odborném časopise. Recenzenti ověřují, zda jsou postupy a závěry správně podložené, a mohou požadovat opravy nebo text odmítnout. Recenze snižuje riziko chyb, ale nezaručuje, že je vše pravdivé; pozdější výzkumy mohou závěry upřesnit nebo vyvrátit. Například studie v recenzovaném lékařském časopise je spolehlivějším zdrojem než příspěvek na blogu.
  zdroj_popisu: nový
  stav: draft
- id: k-vedecky-pristup-k-datum
  nazev: Vědecký přístup k datům
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Vědecký přístup k datům je postup, který z dat vyvozuje závěry ověřitelným způsobem. Začíná otázkou a hypotézou, pokračuje plánovaným sběrem a analýzou dat a končí závěrem a posouzením jeho spolehlivosti. Postup musí být popsaný tak, aby ho mohl kdokoli zopakovat a výsledek zkontrolovat, a závěr se mění, když nová data ukážou něco jiného. Například když třída zkoumá, zda rostliny na okně rostou rychleji než ve stínu, předem stanoví, jak a jak dlouho bude výšku rostlin měřit, a teprve z naměřených hodnot vyvodí závěr.
  zdroj_popisu: nový
  stav: draft
- id: k-hypoteza
  nazev: Hypotéza
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-vedecky-pristup-k-datum
  stupne:
    zs1: false
    zs2: true
  popis: Hypotéza je předpoklad o tom, jak se věci mají, formulovaný tak, aby ho bylo možné daty potvrdit nebo vyvrátit. Dobrá hypotéza je konkrétní a ověřitelná a vzniká před sběrem dat, ne až podle výsledků. Data, která hypotéze odpovídají, ji podporují, ale definitivně ji nedokazují. Například hypotézu „žáci, kteří víc spí, mají lepší známky“ lze ověřovat porovnáním doby spánku a průměrných známek žáků.
  zdroj_popisu: nový
  stav: draft
- id: k-analyza-dat
  nazev: Analýza dat
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-vedecky-pristup-k-datum
  stupne:
    zs1: false
    zs2: true
  popis: Analýza dat je zkoumání dat s cílem najít v nich vzory, souvislosti nebo odpověď na položenou otázku. Využívá výpočty, například průměru nebo četnosti, porovnávání skupin, řazení a filtrování i grafy, ve kterých jsou trendy lépe vidět. Analýze obvykle předchází čištění dat a její výsledky je třeba vykládat s ohledem na to, jak data vznikla. Například porovnáním průměrných časů na 60 m lze zjistit, zda se třída od podzimu do jara zlepšila.
  zdroj_popisu: nový
  stav: draft
- id: k-zaver-a-jeho-spolehlivost
  nazev: Závěr a jeho spolehlivost
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: navazujici
  nadrazeny: k-vedecky-pristup-k-datum
  stupne:
    zs1: false
    zs2: true
  popis: 'Závěr je odpověď na výzkumnou otázku podložená daty. U každého závěru je třeba posoudit, nakolik je spolehlivý: zda bylo dat dost, zda byla reprezentativní, zda se při sběru a analýze nestala chyba a zda závěr z dat opravdu plyne, nebo jde jen o shodu okolností. Dobrý závěr uvádí i svá omezení, tedy pro koho a za jakých podmínek platí. Například z průzkumu v jedné třídě nelze vyvozovat, jak se chovají všichni žáci v Česku.'
  zdroj_popisu: nový
  stav: draft
- id: k-datovy-cyklus
  nazev: Datový cyklus
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'Datový cyklus je posloupnost kroků, kterými prochází práce s daty. Lze ji popsat jako příběh o pěti krocích: sběr, čištění, analýza, vizualizace a interpretace. Před začátkem tohoto příběhu se formuluje výzkumný úkol, tedy si ujasníme, jaký příběh chceme vyprávět: provedeme přípravu, ve které určíme, co chceme zjistit a jaká jsou pravidla a možnosti. Když se některý krok přeskočí, například čištění, zkreslí se i výsledek na konci. Interpretace často přinese nové otázky, a práce s daty tak může začít znovu, proto se mluví o cyklu. Například při školním průzkumu cesty do školy nejprve stanovíme, co chceme zjistit, pak sebereme odpovědi, sjednotíme a opravíme chybné zápisy, spočítáme výsledky, vytvoříme graf a vyložíme, co z něj plyne.'
  zdroj_popisu: garant Data (jazykově upraveno)
  stav: draft
- id: k-velka-data
  nazev: Velká data
  tema: o-data-a-analyza
  podoblast: s-data-a-informace
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Velká data (big data) jsou různorodá data v mnoha formátech, která se liší velikostí i strukturou: obrázky, videa, zvukové nahrávky, texty i digitální stopy v podobě údajů o chování uživatelů. Vznikají díky rychlému vývoji internetu, jehož obsah z velké míry vytvářejí sami uživatelé, díky internetu věcí, jehož zařízení získávají data z nejrůznějších zdrojů, a díky výraznému zlevnění ukládání a zpracování dat. Je jich tolik, že jejich zpracování vyžaduje nové přístupy, například ukládání a zpracování na velkém množství počítačů a úložišť; to platí i pro moderní metody strojového učení. Například záznamy o tom, která videa miliony lidí denně sledují, jsou velká data.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-digitalni-a-analogova-data
  nazev: Digitální a analogová data
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Digitální data jsou nespojitá (diskrétní) reprezentace informací: hodnoty jsou zapsané znaky z omezené sady, například čísly nebo písmeny, a v počítači nakonec jako posloupnost bitů. Analogová data se naopak mění plynule a mohou nabývat libovolné hodnoty v určitém rozsahu, jako výška sloupce kapaliny v teploměru nebo drážka gramofonové desky. Převod analogových dat na digitální se nazývá digitalizace; hodnoty se při ní zjišťují jen v jednotlivých okamžicích nebo bodech a zaokrouhlují, takže se část podrobností ztratí, digitální data ale lze kopírovat a přenášet bez ztráty kvality. Například ručičkové hodinky ukazují čas analogově, displej mobilu digitálně.'
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-bit-a-bajt
  nazev: Bit a bajt
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Bit a bajt jsou základní jednotky, kterými se měří množství dat. Veškerá data v počítači – text, obrázky, zvuk i programy – jsou nakonec uložená jako posloupnosti bitů, které se seskupují do bajtů, a pro větší objemy se používají násobné jednotky. Při zápisu je třeba jednotky rozlišovat: bit se značí malým písmenem b, bajt velkým B. Například jedno písmeno anglické abecedy zabere v textovém souboru obvykle jeden bajt, tedy osm bitů.'
  zdroj_popisu: nový
  stav: draft
- id: k-bit
  nazev: Bit
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-bit-a-bajt
  stupne:
    zs1: false
    zs2: true
  popis: 'Bit (z anglického binary digit, dvojková číslice) je nejmenší jednotka informace, která může nabývat jen jedné ze dvou hodnot, obvykle zapisovaných jako 0 a 1. Odpovídá odpovědi na otázku typu ano/ne; v počítači ho fyzicky představuje například vyšší, nebo nižší napětí v obvodu. Skupina n bitů může nabývat 2ⁿ různých hodnot: dva bity čtyř, tři bity osmi. Například jedním bitem lze zapsat, zda je světlo rozsvícené, nebo zhasnuté.'
  zdroj_popisu: nový
  stav: draft
- id: k-bajt
  nazev: Bajt
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-bit-a-bajt
  stupne:
    zs1: false
    zs2: true
  popis: Bajt je skupina osmi bitů. Může nabývat 256 různých hodnot (2⁸), například celých čísel od 0 do 255. V bajtech a jejich násobcích se udává velikost souborů i kapacita paměti a úložišť. Například jeden znak v kódu ASCII zabere jeden bajt a jeden bajt zabere i jedna složka barvy pixelu v modelu RGB, vyjádřená číslem 0–255.
  zdroj_popisu: nový
  stav: draft
- id: k-nasobne-jednotky-kb-mb-gb
  nazev: Násobné jednotky (kB, MB, GB)
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-bit-a-bajt
  stupne:
    zs1: false
    zs2: true
  popis: Násobné jednotky slouží k vyjádření větších objemů dat. Podle předpon soustavy SI je kilobajt (kB) 1 000 bajtů, megabajt (MB) milion bajtů, gigabajt (GB) miliarda bajtů a terabajt (TB) bilion bajtů. Některé operační systémy počítají po násobcích 1 024 (2¹⁰), přesně jde o jednotky KiB, MiB a GiB, ale označují je stejně jako jednotky SI, proto se údaje o velikosti mohou lišit. Například disk prodávaný jako 1 TB zobrazí systém Windows jako přibližně 931 GB.
  zdroj_popisu: nový
  stav: draft
- id: k-typy-dat-ciselna-textova-obrazova-zvukova
  nazev: Typy dat (číselná, textová, obrazová, zvuková)
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Typy dat jsou kategorie dat podle toho, co zachycují: čísla, text, obraz nebo zvuk, případně jejich kombinaci, například video. Každý typ se v počítači kóduje jinak a liší se i operace, které s ním dávají smysl: čísla lze sčítat a porovnávat podle velikosti, text řadit podle abecedy a vyhledávat v něm slova, obraz zvětšovat nebo ořezávat a zvuk zesilovat nebo stříhat. Typ dat proto určuje, jakým programem a jakým způsobem je lze zpracovat. Například výšky žáků ve třídě lze zprůměrovat, kdežto jejich jména lze seřadit nebo spočítat, ale ne zprůměrovat.'
  zdroj_popisu: nový
  stav: draft
- id: k-kod-a-kodovani
  nazev: Kód a kódování
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Kód je soubor pravidel, který určuje, jak se znaky, čísla nebo jiné údaje zapisují pomocí jiných znaků nebo signálů. Kódování je způsob, jak podle daných pravidel reprezentovat data, aby je počítač mohl ukládat, přenášet a zpracovávat; určuje například, jak jsou pomocí bitů reprezentovány znaky, barvy nebo zvuk. Různé typy kódování se volí podle toho, zda je potřeba ušetřit místo, zachovat kvalitu, nebo data zabezpečit. Speciálním případem je komprese dat, která může být bezeztrátová, kdy lze původní data přesně obnovit, nebo ztrátová, kdy se část informace vypouští. Kódy používají lidé i bez počítačů, například Morseovu abecedu, Braillovo písmo nebo notový zápis.
  zdroj_popisu: garant Data (jazykově upraveno) – karta „Kódování dat, jejich účel a přenos“
  stav: draft
- id: k-kodovani-a-dekodovani
  nazev: Kódování a dekódování
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-kod-a-kodovani
  stupne:
    zs1: false
    zs2: true
  popis: 'Kódování a dekódování jsou dva opačné převody: kódování převádí informaci do kódu podle daných pravidel, dekódování ji podle stejných pravidel převádí zpět. Odesílatel i příjemce proto musí používat stejný kód, jinak příjemce sdělení nerozluští nebo ho pochopí chybně. V počítači probíhají oba převody neustále, například při ukládání a otevírání souboru. Například mobil při telefonování kóduje hlas do bitů a telefon příjemce je dekóduje zpět na zvuk.'
  zdroj_popisu: nový
  stav: draft
- id: k-dvojkova-soustava
  nazev: Dvojková soustava
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-kod-a-kodovani
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Dvojková (binární) soustava je poziční číselná soustava se základem 2, která zapisuje čísla jen číslicemi 0 a 1. Každá pozice má dvojnásobnou hodnotu než pozice vpravo od ní (1, 2, 4, 8, 16…), podobně jako v desítkové soustavě desetinásobnou. Počítače ji používají, protože dvě hodnoty lze elektronicky spolehlivě rozlišit a každá číslice odpovídá jednomu bitu. Například číslo 1011 ve dvojkové soustavě má hodnotu 8 + 0 + 2 + 1 = 11.
  zdroj_popisu: nový
  stav: draft
- id: k-morseova-abeceda
  nazev: Morseova abeceda
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-kod-a-kodovani
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Morseova abeceda je kód, který písmena a číslice vyjadřuje kombinacemi krátkých a dlouhých signálů, zapisovaných jako tečky a čárky. Lze ji přenášet zvukem, světlem i elektrickým signálem, proto se dříve používala v telegrafu a v námořní a letecké komunikaci. Častá písmena mají krátké kódy, například E je jen jedna tečka, a zprávy jsou tak kratší. Například nouzový signál SOS se zapisuje · · · – – – · · ·.
  zdroj_popisu: nový
  stav: draft
- id: k-braillovo-pismo
  nazev: Braillovo písmo
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-kod-a-kodovani
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Braillovo písmo je hmatové písmo pro nevidomé, pojmenované po svém francouzském autorovi Louisi Braillovi. Základem je šestibod – políčko se šesti body ve dvou sloupcích po třech, z nichž některé jsou vystouplé; to dává 64 kombinací (2⁶) včetně prázdného políčka. Písmeno tvoří jedno políčko, číslice a velká písmena se zapisují s předznamenáním, tedy dalším políčkem před znakem. Braillovo písmo bývá například na krabičkách léků nebo na tlačítkách výtahu.
  zdroj_popisu: nový
  stav: draft
- id: k-rimske-cislice
  nazev: Římské číslice
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-kod-a-kodovani
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: 'Římské číslice jsou zápis čísel pomocí znaků I (1), V (5), X (10), L (50), C (100), D (500) a M (1 000). Hodnota se určuje sčítáním a odčítáním znaků podle jejich pořadí: menší znak za větším se přičítá, menší znak před větším se odečítá (IV = 4, VI = 6). Na rozdíl od desítkové soustavy nejde o poziční soustavu a chybí v ní znak pro nulu, proto se s římskými číslicemi obtížně počítá. Například letopočet 2026 se zapíše jako MMXXVI.'
  zdroj_popisu: nový
  stav: draft
- id: k-notovy-zapis
  nazev: Notový zápis
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-kod-a-kodovani
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Notový zápis je kód, kterým se zapisuje hudba. Poloha noty na osnově z pěti linek určuje výšku tónu, tvar noty jeho délku a další značky například tempo nebo hlasitost. Hudebník podle zápisu skladbu zahraje, tedy ji dekóduje, a díky společným pravidlům zahraje stejnou melodii hudebník kdekoli na světě. Například celá nota trvá stejně dlouho jako dvě noty půlové nebo čtyři čtvrťové.
  zdroj_popisu: nový
  stav: draft
- id: k-carovy-kod
  nazev: Čárový kód
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-kod-a-kodovani
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Čárový kód je údaj, obvykle číslo, zakódovaný do svislých čar a mezer různé šířky, který rychle a bez překlepů přečte optický snímač. Na zboží se nejčastěji používá kód EAN-13 se třinácti číslicemi, jehož poslední číslice je kontrolní a umožní odhalit chybu při čtení. Kód obvykle nese jen číslo výrobku, název a cenu si pokladna dohledá v databázi obchodu. Například při placení na pokladně stačí přiložit kód ke čtečce a zboží se samo načte.
  zdroj_popisu: nový
  stav: draft
- id: k-qr-kod
  nazev: QR kód
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-kod-a-kodovani
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: QR kód je dvourozměrný kód z tmavých a světlých čtverečků, který pojme mnohem více dat než čárový kód, například webovou adresu, kontakt nebo údaje pro platbu. Tři velké čtverce v rozích pomáhají čtečce rozpoznat polohu a natočení kódu, takže ho snadno načte i fotoaparát mobilu. Díky opravným údajům jde kód přečíst i při poškození, podle zvolené úrovně až zhruba 30 % plochy. Například QR kód na faktuře umožní zaplatit bez opisování čísla účtu.
  zdroj_popisu: nový
  stav: draft
- id: k-paritni-bit-a-kontrolni-soucet
  nazev: Paritní bit a kontrolní součet
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-kod-a-kodovani
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'Paritní bit a kontrolní součet jsou doplňkové údaje přidané k datům, podle kterých lze poznat, že při přenosu nebo uložení došlo k chybě. Paritní bit doplní počet jedniček ve skupině bitů na sudý (případně lichý): skupina 1011001 má čtyři jedničky, takže při sudé paritě se přidá 0. Odhalí změnu jednoho bitu, ale změnu dvou bitů nepozná. Kontrolní součet se počítá z celých dat a odhalí většinu chyb; podobně funguje kontrolní číslice v čísle knihy ISBN.'
  zdroj_popisu: nový
  stav: draft
- id: k-text
  nazev: Text
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Text je v počítači posloupnost znaků, z nichž každý je uložený jako číslo podle kódové tabulky. Znakem je písmeno, číslice, interpunkční znaménko, mezera i neviditelný řídicí znak, například konec řádku. Kódová tabulka určuje jen to, o který znak jde; jak bude znak vypadat na obrazovce, určuje písmo (font). Když se text otevře s jinou kódovou tabulkou, než ve které byl uložen, objeví se místo některých znaků nesmyslné symboly, takzvaný „rozsypaný čaj“. Nejznámějšími kódovými tabulkami jsou ASCII a Unicode. Například slovo „Ahoj“ se v ASCII uloží jako čísla 65, 104, 111 a 106.
  zdroj_popisu: nový
  stav: draft
- id: k-ascii
  nazev: ASCII
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-text
  stupne:
    zs1: false
    zs2: true
  popis: ASCII (American Standard Code for Information Interchange) je kódová tabulka z roku 1963, která 128 znakům přiřazuje čísla 0–127, takže na znak stačí 7 bitů. Obsahuje písmena anglické abecedy, číslice, interpunkci, mezeru a řídicí znaky, například konec řádku. Česká písmena s diakritikou v ní nejsou, proto vznikla různá, navzájem neslučitelná rozšíření. Například velké A má kód 65 a malé a kód 97; velká a malá písmena anglické abecedy se tak liší o 32.
  zdroj_popisu: nový
  stav: draft
- id: k-unicode
  nazev: Unicode
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-text
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Unicode je mezinárodní standard, který přiřazuje jedinečné číslo znakům téměř všech písem světa včetně české diakritiky, matematických symbolů a emoji; zahrnuje přes 150 000 znaků. Nejčastěji se ukládá v kódování UTF-8, které používá 1 až 4 bajty na znak: znaky ASCII zapíše stejně jako ASCII jedním bajtem, česká písmena s diakritikou dvěma a většinu emoji čtyřmi. UTF-8 používá naprostá většina webů. Například písmeno č má v Unicode číslo U+010D.'
  zdroj_popisu: nový
  stav: draft
- id: k-obraz
  nazev: Obraz
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Obraz je v počítači uložený jedním ze dvou základních způsobů: jako rastrová grafika, tedy mřížka barevných bodů (pixelů), nebo jako vektorová grafika, tedy popis geometrických tvarů. V obou případech jsou barvy zapsané čísly podle barevného modelu. Volba způsobu závisí na účelu: rastr se hodí pro fotografie a obrazy s jemnými přechody barev, vektor pro loga, schémata a písmo. Například fotografie z mobilu je uložená jako rastr, často ve formátu JPEG, logo školy může být uložené jako vektor ve formátu SVG.'
  zdroj_popisu: nový
  stav: draft
- id: k-pixel
  nazev: Pixel
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-obraz
  stupne:
    zs1: false
    zs2: true
  popis: Pixel je nejmenší bod rastrového obrázku nebo displeje, který má v daném okamžiku jednu barvu. Barva každého pixelu je v počítači uložená jako číslo nebo trojice čísel. Například fotografie s rozlišením 4000 × 3000 se skládá z 12 milionů pixelů.
  zdroj_popisu: nový
  stav: draft
- id: k-rozliseni
  nazev: Rozlišení
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-obraz
  stupne:
    zs1: false
    zs2: true
  popis: Rozlišení je počet pixelů obrázku nebo displeje, udávaný jako šířka × výška, například 1920 × 1080 (Full HD, asi 2 miliony pixelů). Vyšší rozlišení zachytí více detailů, ale soubor je větší. U tisku se rozlišení udává v bodech na palec (DPI); pro kvalitní tisk se obvykle používá 300 DPI. Například fotografie, která na mobilu vypadá ostře, může být na velkém plakátu rozmazaná, protože na každý centimetr připadne málo pixelů.
  zdroj_popisu: nový
  stav: draft
- id: k-barevny-model-rgb-cmyk
  nazev: Barevný model (RGB, CMYK)
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-obraz
  stupne:
    zs1: false
    zs2: true
  popis: Barevný model je způsob, jak barvu zapsat čísly. Model RGB skládá barvu z červeného, zeleného a modrého světla a používá se u displejů; každá složka se často zapisuje číslem 0–255, takže lze rozlišit přes 16 milionů barev. Model CMYK skládá barvu z azurové, purpurové, žluté a černé barvy a používá se v tisku. Například v modelu RGB zapisuje trojice (255, 0, 0) čistě červenou, (0, 0, 0) černou a (255, 255, 255) bílou.
  zdroj_popisu: nový
  stav: draft
- id: k-rastrova-grafika
  nazev: Rastrová grafika
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-obraz
  stupne:
    zs1: false
    zs2: true
  popis: Rastrová grafika je způsob uložení obrázku jako mřížky pixelů, z nichž každý má zapsanou svou barvu. Hodí se pro fotografie a obrazy s jemnými přechody barev; běžné formáty jsou JPEG, PNG nebo GIF. Při zvětšení obrázek ztrácí ostrost a jsou vidět jednotlivé čtverečky pixelů. Například fotografie z mobilu nebo obrázek nakreslený v programu Malování jsou rastrová grafika.
  zdroj_popisu: nový
  stav: draft
- id: k-vektorova-grafika
  nazev: Vektorová grafika
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-obraz
  stupne:
    zs1: false
    zs2: true
  popis: Vektorová grafika je způsob uložení obrázku jako popisu geometrických tvarů – bodů, úseček, křivek a ploch – s jejich polohou, barvou a tloušťkou čáry. Počítač tvary při každém zobrazení znovu vykreslí, proto lze obrázek zvětšit bez ztráty kvality. Hodí se pro loga, ikony, schémata a mapy, ne pro fotografie; vektorově je popsaná i většina písem. Běžným formátem je SVG. Například logo školy lze bez rozmazání vytisknout na vizitku i na transparent.
  zdroj_popisu: nový
  stav: draft
- id: k-zvuk
  nazev: Zvuk
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Zvuk je vlnění, při kterém se prostředím, nejčastěji vzduchem, šíří změny tlaku. Mikrofon tyto změny převádí na elektrický signál a počítač ho ukládá jako řadu čísel, která popisují výchylku zvukové vlny v jednotlivých okamžicích. Věrnost záznamu určuje vzorkovací frekvence, tedy kolikrát za sekundu se výchylka změří, a bitová hloubka, tedy kolika bity se každá naměřená hodnota zapíše. Zvuk se ukládá nekomprimovaný, například ve formátu WAV, nebo komprimovaný, například ve formátu MP3. Například minuta stereofonní nahrávky v kvalitě hudebního CD zabere bez komprese zhruba 10 MB.
  zdroj_popisu: nový
  stav: draft
- id: k-vzorkovani
  nazev: Vzorkování
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-zvuk
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Vzorkování je měření výchylky zvukové vlny v pravidelných okamžicích; každá naměřená hodnota se nazývá vzorek. Vzorkovací frekvence udává počet vzorků za sekundu v hertzích, u hudebního CD je to 44 100 Hz, což stačí na všechny tóny, které člověk slyší (zhruba do 20 000 Hz). Více vzorků znamená věrnější záznam, ale větší soubor. Například klasický telefonní hovor se vzorkuje jen 8 000krát za sekundu, takže řeč je srozumitelná, ale hudba zní ploše.
  zdroj_popisu: nový
  stav: draft
- id: k-video
  nazev: Video
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'Video je rychlý sled obrázků (snímků), obvykle doplněný zvukovou stopou; když se snímky střídají dostatečně rychle, vnímá člověk plynulý pohyb. Nekomprimované video zabírá obrovské množství dat, proto se téměř vždy ukládá komprimované: kromě zmenšení jednotlivých snímků se využívá toho, že se po sobě jdoucí snímky většinou liší jen málo, a ukládají se hlavně změny. Snímky, zvukové stopy a případně titulky se ukládají společně do jednoho souboru, například ve formátu MP4. Například jedna sekunda nekomprimovaného videa ve Full HD při 30 snímcích za sekundu by zabrala přibližně 190 MB.'
  zdroj_popisu: nový
  stav: draft
- id: k-snimek-a-snimkova-frekvence
  nazev: Snímek a snímková frekvence
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-video
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Snímek je jeden obrázek videa. Snímková frekvence udává počet snímků za sekundu (fps); filmy v kině se obvykle natáčejí s 24 snímky za sekundu, hry a sportovní přenosy často s 60. Čím vyšší je snímková frekvence, tím plynulejší je pohyb, ale tím víc dat video zabere. Například zpomalený záběr vznikne tak, že se natočí s vysokou snímkovou frekvencí, třeba 240 fps, a přehraje se pomaleji.
  zdroj_popisu: nový
  stav: draft
- id: k-zvukova-stopa
  nazev: Zvuková stopa
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-video
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Zvuková stopa je zvukový záznam uložený spolu s videem a synchronizovaný se snímky, aby například pohyb rtů odpovídal řeči. Video může obsahovat více zvukových stop, například v různých jazycích nebo s audiopopisem pro nevidomé, a přehrávač umožní mezi nimi přepínat. Při střihu lze zvukovou stopu upravit, ztlumit nebo nahradit jinou, například hudbou. Například film na streamovací službě často nabízí českou i původní anglickou zvukovou stopu.
  zdroj_popisu: nový
  stav: draft
- id: k-dokument
  nazev: Dokument
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Dokument je soubor, který kromě obsahu nese i informace o jeho uspořádání a vzhledu, například textový dokument, prezentace nebo webová stránka. Obsah, struktura a vzhled tvoří tři vrstvy dokumentu, které lze do velké míry měnit nezávisle na sobě. Díky tomu lze stejný text vytisknout, zobrazit na mobilu nebo převést do jiného formátu. Například referát napsaný v textovém editoru lze uložit ve formátu DOCX pro další úpravy nebo jako PDF, které vypadá stejně na každém zařízení.
  zdroj_popisu: nový
  stav: draft
- id: k-obsah
  nazev: Obsah
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-dokument
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Obsah je vlastní sdělení dokumentu: text, obrázky, tabulky, grafy nebo odkazy, tedy to, co má čtenář z dokumentu získat. Zůstává stejný, i když se změní vzhled dokumentu nebo když se dokument převede do jiné podoby. Nezaměňuje se s obsahem ve smyslu seznamu kapitol v knize. Například referát o sopkách má stejný obsah, ať je vytištěný na papíře, nebo promítnutý jako prezentace.'
  zdroj_popisu: nový
  stav: draft
- id: k-struktura
  nazev: Struktura
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-dokument
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Struktura je členění obsahu dokumentu na části s určitou rolí, například nadpisy různých úrovní, odstavce, seznamy, tabulky a kapitoly. Když jsou části označené svou rolí, třeba stylem nadpisu, program umí automaticky vytvořit obsah dokumentu nebo přeskakovat mezi kapitolami; podle nadpisů procházejí dokument i nevidomí se čtečkou obrazovky. Například text, který je jen zvětšený a tučný, vypadá jako nadpis, ale program ho za nadpis nepovažuje.
  zdroj_popisu: nový
  stav: draft
- id: k-vzhled
  nazev: Vzhled
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-dokument
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Vzhled je grafická podoba dokumentu: písmo, velikost a barva textu, zarovnání, řádkování, okraje nebo pozadí. Lze ho měnit, aniž se změní obsah a struktura, nejlépe pomocí stylů, které určují vzhled všech částí se stejnou rolí najednou. U webových stránek se vzhled popisuje odděleně od obsahu v jazyce CSS. Například škola může používat šablonu, díky které mají všechny její dokumenty stejné písmo a barvy.'
  zdroj_popisu: nový
  stav: draft
- id: k-komprese
  nazev: Komprese
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Komprese je zmenšení objemu dat tak, aby zabírala méně místa na úložišti nebo se rychleji přenesla. Využívá toho, že se v datech opakují stejné nebo předvídatelné části, které lze zapsat úsporněji, případně vypouští informace, které člověk nepostřehne. Podle toho, zda lze původní data přesně obnovit, rozlišujeme bezeztrátovou a ztrátovou kompresi. Například fotografie z mobilu se často ukládají ve formátu JPEG, který jejich velikost zmenší na zlomek původní velikosti.
  zdroj_popisu: nový
  stav: draft
- id: k-ztratova-komprese
  nazev: Ztrátová komprese
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-komprese
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Ztrátová komprese zmenšuje data tak, že z nich nevratně vypustí část informace, obvykle tu, kterou člověk nepostřehne, například jemné rozdíly odstínů nebo zvuky přehlušené hlasitějšími zvuky. Dosahuje mnohem většího zmenšení než bezeztrátová komprese a používá se u fotografií (JPEG), hudby (MP3) a videa. Při silnější kompresi nebo opakovaném ukládání se kvalita zhoršuje. Například mnohokrát přeposlaná fotografie bývá rozmazanější a jsou na ní vidět čtverečky.
  zdroj_popisu: nový
  stav: draft
- id: k-bezeztratova-komprese
  nazev: Bezeztrátová komprese
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-komprese
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'Bezeztrátová komprese zmenšuje data tak, že je lze přesně obnovit do původní podoby, bit po bitu. Využívá toho, že se v datech opakují stejné nebo předvídatelné části: například řetězec AAAAABBB lze zapsat zkráceně jako 5A3B. Zmenšení bývá menší než u ztrátové komprese, ale nic se neztratí, proto je nezbytná u textu, programů a tabulek. Například soubory rozbalené z archivu ZIP nebo obrázek ve formátu PNG se přesně shodují s originálem.'
  zdroj_popisu: nový
  stav: draft
- id: k-soubor
  nazev: Soubor
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Soubor je pojmenovaný celek dat uložený na disku, flash disku, v cloudu nebo na jiném úložišti. Kromě názvu má soubor formát, velikost a další údaje, například datum vytvoření. Soubory se ukládají do složek, které mohou obsahovat další složky, a umístění souboru popisuje cesta, například Dokumenty/Škola/referat.docx. Podle obsahu se rozlišují datové a spustitelné soubory. Například fotografie z výletu je v telefonu uložená jako soubor IMG_2041.jpg ve složce s fotografiemi.
  zdroj_popisu: nový
  stav: draft
- id: k-typ-a-format-souboru
  nazev: Typ a formát souboru
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-soubor
  stupne:
    zs1: true
    zs2: true
  popis: 'Typ souboru vyjadřuje, jaký druh dat soubor obsahuje, například text, obrázek nebo zvuk; formát určuje, jak přesně jsou data v souboru zakódovaná. Jeden typ může mít více formátů s různými vlastnostmi: obrázek lze uložit jako JPEG, který zabere méně místa, nebo jako PNG s průhledným pozadím. Formát rozhoduje, jakým programem lze soubor otevřít; mezi formáty lze převádět, například příkazem Uložit jako. Například tabulku známek lze uložit ve formátu XLSX, ODS nebo CSV.'
  zdroj_popisu: nový
  stav: draft
- id: k-otevreny-format
  nazev: Otevřený formát
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-soubor
  stupne:
    zs1: false
    zs2: true
  popis: Otevřený formát je formát souboru, jehož popis (specifikace) je veřejně dostupný a který smí kdokoli bez omezení a poplatků používat ve svých programech. Data v něm lze otevřít v programech různých výrobců a zůstanou čitelná i po letech, i kdyby původní program zanikl. Opakem je uzavřený (proprietární) formát, který ovládá jedna firma. Otevřené jsou například formáty PDF, PNG, CSV nebo ODT, který otevře LibreOffice, Word i Google Dokumenty.
  zdroj_popisu: nový
  stav: draft
- id: k-pripona-souboru
  nazev: Přípona souboru
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-soubor
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Přípona souboru je označení připojené za tečku na konec názvu souboru, které naznačuje, co soubor obsahuje nebo k čemu slouží, například .txt, .jpg, .mp3 nebo .docx. Podle přípony operační systém vybírá program, kterým soubor otevře. Přejmenováním přípony se ale obsah ani formát souboru nezmění. Některé systémy známé přípony ve výchozím nastavení skrývají, takže škodlivý program pojmenovaný faktura.pdf.exe se může tvářit jako dokument PDF.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-datovy-a-spustitelny-soubor
  nazev: Datový a spustitelný soubor
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-soubor
  stupne:
    zs1: false
    zs2: true
  popis: Datové a spustitelné soubory se liší tím, co obsahují. Spustitelný soubor obsahuje program, tedy zakódované instrukce, podle kterých počítač po spuštění vykonává určené úlohy. Datový soubor obsahuje data, například text nebo obrázek, a smysl dává až tehdy, když ho zpracuje nějaký program. Spustitelné soubory z neznámých zdrojů mohou obsahovat škodlivý kód. Například hra je spustitelný soubor, kdežto uložená pozice ve hře je datový soubor.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-csv
  nazev: CSV
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: navazujici
  nadrazeny: k-soubor
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: CSV (z anglického comma-separated values, hodnoty oddělené čárkou) je textový formát pro ukládání tabulkových dat. Každý řádek tvoří jeden záznam a hodnoty jsou oddělené čárkou, v českém prostředí často středníkem, protože čárka slouží jako desetinná čárka. CSV neukládá formátování ani vzorce, zato ho otevře téměř každý tabulkový procesor i textový editor, a hodí se proto pro výměnu dat. Například řádek „Jana;8.A;42“ může zapisovat jméno, třídu a počet bodů.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-objem-dat-a-prenos
  nazev: Objem dat a přenos
  tema: o-data-a-analyza
  podoblast: s-reprezentace-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Objem dat určuje, kolik místa data zaberou na úložišti a jak dlouho bude trvat jejich přenos. Přenosová rychlost se udává v bitech za sekundu, například v Mb/s, velikost souborů obvykle v bajtech; protože bajt má osm bitů, připojení 100 Mb/s přenese nejvýše 12,5 MB za sekundu. Nejvyšší rychlost, kterou připojení umožňuje, se označuje jako šířka pásma; skutečná rychlost bývá nižší a u běžných připojení bývá stahování rychlejší než nahrávání. Například film o velikosti 4 GB se při rychlosti 100 Mb/s stáhne nejdříve za 5 minut a 20 sekund.
  zdroj_popisu: nový
  stav: draft
- id: k-strukturovana-a-nestrukturovana-data
  nazev: Strukturovaná a nestrukturovaná data
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'Strukturovaná a nestrukturovaná data jsou dva druhy dat, které se liší tím, zda mají pevně daný řád. Strukturovaná data mají jasný řád, například tabulka s řádky a sloupci, ve které má každý údaj své místo; nestrukturovaná data takový řád nemají, jde například o volný text, fotografie nebo videa. Každý druh se ukládá i zpracovává jinak: strukturovaná data lze přímo řadit, filtrovat a sčítat, z nestrukturovaných je potřeba informace teprve vytěžit, často s pomocí umělé inteligence. Nestrukturovaných dat je dnes většina. Například v e-shopu jsou cena a počet kusů na skladě strukturovaná data, zatímco recenze zákazníků a fotografie zboží nestrukturovaná.'
  zdroj_popisu: garant Data (jazykově upraveno) – karta „Strukturovaná vs. nestrukturovaná data“
  stav: draft
- id: k-tabulka
  nazev: Tabulka
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Tabulka je uspořádání dat do řádků a sloupců, ve kterém má každý údaj své pevné místo. Díky tomu lze údaje snadno vyhledávat, porovnávat a dále zpracovávat, například řadit nebo sčítat. Tabulku tvoří řádky, sloupce a buňky a obvykle má záhlaví, které popisuje, co jednotlivé údaje znamenají. Tabulky lze vytvářet na papíře, v textovém editoru i v tabulkovém procesoru, který s daty umí také počítat. Například rozvrh hodin je tabulka, ve které řádky odpovídají dnům a sloupce vyučovacím hodinám.
  zdroj_popisu: nový
  stav: draft
- id: k-radek-a-sloupec
  nazev: Řádek a sloupec
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-tabulka
  stupne:
    zs1: true
    zs2: true
  popis: 'Řádky a sloupce tvoří mřížku tabulky: řádek je vodorovná řada buněk, sloupec svislá. Údaje v jednom řádku obvykle patří k jedné věci a údaje v jednom sloupci popisují stejnou vlastnost, proto je lze mezi sebou porovnávat. V tabulkovém procesoru se sloupce označují písmeny (A, B, C…) a řádky čísly (1, 2, 3…). Například v tabulce výsledků závodu patří každý řádek jednomu závodníkovi a sloupce obsahují jméno, třídu a čas.'
  zdroj_popisu: nový
  stav: draft
- id: k-bunka
  nazev: Buňka
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-tabulka
  stupne:
    zs1: false
    zs2: true
  popis: Buňka je políčko tabulky v průsečíku jednoho řádku a jednoho sloupce, které obsahuje jeden údaj. V tabulkovém procesoru může buňka obsahovat také vzorec a má adresu složenou z písmene sloupce a čísla řádku, například B3; podle adresy se na ni mohou odkazovat vzorce v jiných buňkách. Například v rozvrhu je v buňce na průsečíku řádku „pondělí“ a sloupce „1. hodina“ zapsaný jeden předmět.
  zdroj_popisu: nový
  stav: draft
- id: k-souhrnna-statisticka-tabulka
  nazev: Souhrnná (statistická) tabulka
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-tabulka
  stupne:
    zs1: false
    zs2: true
  popis: 'Souhrnná (statistická) tabulka je tabulka, která nezobrazuje jednotlivé záznamy, ale výsledky jejich zpracování: součty, počty, průměry nebo podíly za vybrané skupiny. Vzniká z rozsáhlejší tabulky dat, například pomocí funkcí nebo kontingenční tabulky v tabulkovém procesoru. Aby byla čitelná, potřebuje výstižný název, popsané řádky a sloupce, jednotky a údaj o zdroji dat. Například ze stovek odpovědí v dotazníku může vzniknout souhrnná tabulka s počtem žáků jednotlivých tříd, kteří do školy jezdí autobusem, chodí pěšky nebo jezdí na kole.'
  zdroj_popisu: nový
  stav: draft
- id: k-seznam
  nazev: Seznam
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: core
  stupne:
    zs1: true
    zs2: false
  popis: Seznam je řada položek zapsaných pod sebou nebo za sebou, ve které každá položka představuje jednu věc nebo jeden údaj. Na rozdíl od tabulky se u položek seznamu obvykle nesleduje více vlastností ve sloupcích, a proto se seznam hodí pro jednoduchý výčet. Podle toho, zda záleží na pořadí položek a zda mají položky vlastní podpoložky, se rozlišuje seznam uspořádaný, neuspořádaný a víceúrovňový. V programování se seznamem označuje také datová struktura, která uchovává více hodnot pod jedním názvem. Například jména spolužáků přihlášených na školní výlet tvoří seznam.
  zdroj_popisu: nový
  stav: draft
- id: k-usporadany-seznam
  nazev: Uspořádaný seznam
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-seznam
  stupne:
    zs1: true
    zs2: false
  poznamka: 'RVP: Činnosti'
  popis: 'Uspořádaný seznam je seznam, ve kterém mají položky určené pořadí: buď jsou seřazené podle zvoleného kritéria, například podle abecedy nebo velikosti, nebo na jejich pořadí záleží, jako u kroků postupu. V textovém editoru se obvykle zapisuje jako číslovaný seznam. Například jména v třídní knize jsou seřazená podle abecedy a návod na pokus bývá rozepsaný do očíslovaných kroků.'
  zdroj_popisu: nový
  stav: draft
- id: k-neusporadany-seznam
  nazev: Neuspořádaný seznam
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-seznam
  stupne:
    zs1: true
    zs2: false
  poznamka: 'RVP: Činnosti'
  popis: 'Neuspořádaný seznam je seznam, ve kterém na pořadí položek nezáleží: když se položky přeházejí, význam seznamu se nezmění. V textovém editoru se obvykle zapisuje jako seznam s odrážkami. Například u seznamu věcí na výlet nezáleží na tom, zda je svačina uvedená před pláštěnkou, nebo až za ní.'
  zdroj_popisu: nový
  stav: draft
- id: k-viceurovnovy-seznam
  nazev: Víceúrovňový seznam
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-seznam
  stupne:
    zs1: true
    zs2: false
  poznamka: 'RVP: Činnosti'
  popis: Víceúrovňový seznam je seznam, jehož položky mohou mít vlastní podpoložky a ty případně další. Podpoložky se zapisují s odsazením pod nadřazenou položku, takže seznam zachycuje, co do které skupiny patří, a vyjadřuje tak hierarchii. Například v seznamu zvířat se savci dělí na skupiny, jako jsou šelmy, a mezi šelmy patří kočka; stejně je uspořádaný i obsah knihy s kapitolami a podkapitolami.
  zdroj_popisu: nový
  stav: draft
- id: k-tabulkova-evidence-dat
  nazev: Tabulková evidence dat
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Tabulková evidence dat je nejběžnější způsob, jak evidovat data: údaje se ukládají do tabulky, ve které každý řádek tvoří jeden záznam a každý sloupec jedno pole neboli atribut, tedy vlastnost, kterou sledujeme, například jméno, věk nebo datum narození. Konkrétní buňka tabulky pak obsahuje hodnotu atributu u daného záznamu. Aby bylo možné s daty správně pracovat a později je například efektivně čistit, je nutné rozlišovat datové typy, například text, celé číslo, desetinné číslo, datum nebo logickou hodnotu ano/ne. Takto fungují školní systémy, e-shopy i většina aplikací „na pozadí“. Například evidence školní knihovny má pro každou výpůjčku jeden řádek se sloupci jméno čtenáře, název knihy a datum vrácení.'
  zdroj_popisu: garant Data (jazykově upraveno)
  stav: draft
- id: k-zaznam
  nazev: Záznam
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-tabulkova-evidence-dat
  stupne:
    zs1: false
    zs2: true
  popis: 'Záznam je jeden řádek tabulkové evidence, který obsahuje všechny údaje o jednom evidovaném objektu, například o žákovi, knize nebo objednávce. Skládá se z hodnot jednotlivých polí a měl by být jednoznačně odlišitelný od ostatních záznamů, nejčastěji pomocí identifikátoru (ID). Například v evidenci kroužků tvoří jeden záznam údaje o jedné přihlášce: jméno žáka, třída, název kroužku a datum přihlášení.'
  zdroj_popisu: nový
  stav: draft
- id: k-pole-atribut
  nazev: Pole (atribut)
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-tabulkova-evidence-dat
  stupne:
    zs1: false
    zs2: true
  popis: Pole (atribut) je jeden sloupec tabulkové evidence, který u všech záznamů zachycuje stejnou sledovanou vlastnost. Každé pole má název, uvedený obvykle v záhlaví sloupce, a datový typ, který určuje, jaké hodnoty do něj lze zapsat. Hodnota pole u jednoho záznamu je obsah jedné buňky. Například evidence knih má pole název, autor, rok vydání a počet stran.
  zdroj_popisu: nový
  stav: draft
- id: k-datovy-typ-pole
  nazev: Datový typ pole
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-tabulkova-evidence-dat
  stupne:
    zs1: false
    zs2: true
  popis: Datový typ pole určuje, jaké hodnoty smí pole obsahovat a co s nimi lze dělat, například text, celé číslo, desetinné číslo, datum nebo logická hodnota ano/ne. Správně zvolený datový typ umožňuje s hodnotami počítat, řadit je podle velikosti nebo podle data a zabránit chybnému zápisu. Například telefonní číslo se ukládá jako text, protože se s ním nepočítá a může začínat znakem +.
  zdroj_popisu: nový
  stav: draft
- id: k-atomizace
  nazev: Atomizace
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-tabulkova-evidence-dat
  stupne:
    zs1: false
    zs2: true
  popis: Atomizace je rozdělení údajů na nejmenší smysluplné části tak, aby každá byla uložená ve vlastním poli. Atomizovaná data lze snadno řadit, filtrovat a kontrolovat, protože každou část lze zpracovat samostatně; co je ještě smysluplná část, záleží na účelu evidence. Například když jsou jméno a příjmení v jednom poli, nelze žáky jednoduše seřadit podle příjmení; podobně se adresa dělí na ulici, číslo domu, obec a PSČ.
  zdroj_popisu: nový
  stav: draft
- id: k-provazanost-tabulek-a-relacni-model
  nazev: Provázanost tabulek a relační model
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Provázanost tabulek je propojení více tabulek evidence tak, aby společně tvořily jeden celek. Reálné informační systémy totiž zřídka vystačí s jedinou tabulkou. Aby se data nemusela opakovat (redundance) a aby se předešlo chybám, rozdělují se do více specializovaných tabulek. Tyto tabulky se mezi sebou propojují pomocí klíčů, tedy jedinečných identifikátorů záznamu, například ID žáka nebo čísla objednávky. Vzniká tak relační model, který tvoří základ složitějších databází školních systémů či e-shopů. Například evidence knihovny může mít zvlášť tabulku čtenářů, tabulku knih a tabulku výpůjček, ve které je u každé výpůjčky jen ID čtenáře a ID knihy.
  zdroj_popisu: garant Data (jazykově upraveno)
  stav: draft
- id: k-klic-primarni-a-cizi
  nazev: Klíč (primární a cizí)
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-provazanost-tabulek-a-relacni-model
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Klíč je údaj, podle kterého se záznamy rozlišují a propojují. Primární klíč jednoznačně určuje každý záznam tabulky, takže se jeho hodnota nesmí opakovat, například ID žáka; jméno se k tomu nehodí, protože dva žáci se mohou jmenovat stejně. Cizí klíč je pole v jiné tabulce, které na primární klíč odkazuje, a tím obě tabulky propojuje. Například v tabulce známek není jméno žáka, ale jen jeho ID, podle kterého lze ostatní údaje dohledat v tabulce žáků.
  zdroj_popisu: nový
  stav: draft
- id: k-redundance-dat
  nazev: Redundance dat
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-provazanost-tabulek-a-relacni-model
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Redundance dat je zbytečné opakování stejných údajů na více místech evidence. Zvětšuje objem dat, a hlavně vede k nesrovnalostem: když se údaj změní jen na jednom místě, evidence si začne odporovat. Proto se data rozdělují do provázaných tabulek, ve kterých je každý údaj uložený jen jednou. Například když je adresa čtenáře zapsaná u každé jeho výpůjčky, musela by se po přestěhování opravit u všech výpůjček.'
  zdroj_popisu: nový
  stav: draft
- id: k-validita-dat
  nazev: Validita dat
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Validita dat je soulad dat s pravidly, která pro ně v evidenci platí, například s předepsaným tvarem, rozsahem hodnot nebo úplností. Pravidla pro zadávání dat, jako je povinné pole, správný formát nebo kontrola duplicity, brání tomu, aby se do evidence dostaly chybné nebo neúplné údaje; kontrolu může provádět formulář nebo tabulkový procesor už při zadávání. Validní údaj ale ještě nemusí být pravdivý. Jde o jiný význam slova než validita u zdrojů informací, která posuzuje, zda údaj zachycuje to, co tvrdí. Například přihláška na kroužek nedovolí zadat věk 150 let.
  zdroj_popisu: nový
  stav: draft
- id: k-povinne-pole
  nazev: Povinné pole
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-validita-dat
  stupne:
    zs1: false
    zs2: true
  popis: Povinné pole je pole, které musí být vyplněné, jinak systém záznam neuloží nebo formulář neodešle. Nastavuje se u údajů, bez kterých by záznam nešlo zpracovat nebo by nedával smysl. V online formulářích bývá povinné pole označené hvězdičkou. Například přihláška na školní akci bez jména žáka nemá smysl, proto je jméno povinné.
  zdroj_popisu: nový
  stav: draft
- id: k-spravny-format
  nazev: Správný formát
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-validita-dat
  stupne:
    zs1: false
    zs2: true
  popis: Správný formát znamená, že údaj odpovídá předepsanému tvaru, například datum ve tvaru den.měsíc.rok, PSČ jako pět číslic nebo e-mailová adresa se znakem @. Kontrola formátu odhalí překlepy a nesmyslné zápisy už při zadávání a díky jednotnému tvaru lze data později řadit a porovnávat. Například formulář odmítne telefonní číslo, ve kterém jsou písmena.
  zdroj_popisu: nový
  stav: draft
- id: k-kontrola-duplicity
  nazev: Kontrola duplicity
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-validita-dat
  stupne:
    zs1: false
    zs2: true
  popis: Kontrola duplicity je ověření, že se stejný záznam neuloží do evidence dvakrát. Systém přitom porovnává údaje, které by měly být jedinečné, například e-mailovou adresu nebo číslo čtenářského průkazu. Duplicitní záznamy zkreslují výsledky, například součty a počty, a ztěžují opravy, protože údaj je pak třeba měnit na více místech. Například rezervační systém nedovolí přihlásit stejného žáka na jeden kroužek dvakrát.
  zdroj_popisu: nový
  stav: draft
- id: k-databaze
  nazev: Databáze
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Databáze je uspořádaný celek vzájemně souvisejících dat uložený tak, aby v něm šlo rychle vyhledávat, řadit a měnit údaje a aby s ním mohlo pracovat více uživatelů a programů najednou. Spravuje ji program zvaný systém řízení báze dat, který hlídá pravidla pro data, přístupová práva a to, aby se současné změny navzájem nepřepsaly. Podle způsobu ukládání dat se rozlišují například databáze relační, dokumentové a vektorové. Například když si dva žáci ve stejnou chvíli rezervují poslední volné místo na kroužku, databáze zajistí, že ho dostane jen jeden z nich.
  zdroj_popisu: nový
  stav: draft
- id: k-relacni-databaze
  nazev: Relační databáze
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-databaze
  stupne:
    zs1: false
    zs2: true
  popis: Relační databáze je databáze, která ukládá data v tabulkách propojených klíči podle relačního modelu. Každá tabulka má pevně dané sloupce s datovými typy a databáze při ukládání hlídá nastavená pravidla. Pracuje se s ní obvykle pomocí dotazovacího jazyka SQL, kterým se popisuje, jaká data se mají získat, třeba všechny žáky z 8.A. Například školní informační systém ukládá žáky, třídy, předměty a známky do provázaných tabulek relační databáze.
  zdroj_popisu: nový
  stav: draft
- id: k-online-databaze
  nazev: Online databáze
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-databaze
  stupne:
    zs1: false
    zs2: true
  popis: Online databáze je databáze dostupná přes internet, se kterou uživatel pracuje přes webové rozhraní nebo aplikaci. Data jsou uložená na serveru, takže je mohou současně používat lidé z různých míst a všichni vidí aktuální stav. Online databáze bývají veřejné, jako katalogy knihoven nebo databáze filmů, nebo přístupné jen po přihlášení. Například v online katalogu městské knihovny lze z domova zjistit, zda je kniha právě k vypůjčení.
  zdroj_popisu: nový
  stav: draft
- id: k-dokumentova-databaze
  nazev: Dokumentová databáze
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-databaze
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Dokumentová databáze je databáze, která ukládá data jako samostatné dokumenty s volnější strukturou, například ve formátu JSON, místo tabulek s pevnými sloupci. Každý dokument může mít jiné položky, a proto se hodí pro obsah, který nemá pevný tvar. Patří mezi takzvané NoSQL databáze, které neukládají data do tabulek relačního modelu. Například v databázi receptů může mít každý recept jiný počet ingrediencí i kroků a celý se uloží jako jeden dokument.
  zdroj_popisu: nový
  stav: draft
- id: k-vektorova-databaze
  nazev: Vektorová databáze
  tema: o-data-a-analyza
  podoblast: s-usporadani-dat
  vrstva: navazujici
  nadrazeny: k-databaze
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Vektorová databáze je databáze, která ukládá data jako vektory, tedy řady čísel zachycující význam textu, obrázku nebo zvuku, a umí v nich vyhledávat podle podobnosti. Vektory (embeddings) vytváří model strojového učení tak, aby obsahy s podobným významem měly podobná čísla. Využívají ji hlavně systémy umělé inteligence. Například školní chatbot díky ní najde pravidla omlouvání absence, i když se žák zeptá „co dělat, když jsem byl nemocný“.
  zdroj_popisu: nový
  stav: draft
- id: k-cisteni-dat
  nazev: Čištění dat
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: 'Čištění dat je úprava dat před jejich zpracováním tak, aby byla úplná, jednotná a bez chyb. Skutečná data bývají „špinavá“: chybějí v nich hodnoty, některé záznamy se opakují a stejné údaje jsou zapsané v různých formátech. Čištění často zabere většinu práce s daty, bez něj ale i sebelepší analýza dá nesmyslný výsledek. Například v dotazníku se stejná třída může objevit jako „8.A“, „8 A“ i „osmá A“ a před sečtením odpovědí je potřeba zápis sjednotit.'
  zdroj_popisu: garant Data (jazykově upraveno) – karta „Čištění reálných dat“
  stav: draft
- id: k-razeni-a-filtrovani
  nazev: Řazení a filtrování
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  poznamka: '1. st.: Činnosti'
  popis: 'Řazení a filtrování jsou základní operace, kterými se data zpřehledňují, aby v nich šlo rychle najít potřebné údaje. Nemění hodnoty v záznamech: řazení mění pořadí záznamů, filtrování jen to, které záznamy jsou zobrazené. Při řazení se v tabulce musí přesouvat celé řádky, jinak se údaje různých záznamů pomíchají. Obě operace lze kombinovat. Například z tabulky přihlášek lze vyfiltrovat jen žáky 6. ročníku a ty pak seřadit podle data přihlášení.'
  zdroj_popisu: nový
  stav: draft
- id: k-razeni-zpracovani-dat
  nazev: Řazení
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: navazujici
  nadrazeny: k-razeni-a-filtrovani
  stupne:
    zs1: true
    zs2: true
  poznamka: '1. st.: Činnosti'
  popis: 'Řazení je uspořádání záznamů podle hodnot ve zvoleném sloupci vzestupně, tedy od nejmenší hodnoty nebo od A do Z, nebo sestupně. Čísla se řadí podle velikosti, texty podle abecedy a data podle času, proto záleží na správném datovém typu. Řadit lze i podle více sloupců: další sloupec rozhoduje o pořadí záznamů se shodnou hodnotou v prvním. Například žáky lze seřadit podle příjmení a ty se stejným příjmením podle křestního jména.'
  zdroj_popisu: nový
  stav: draft
- id: k-filtrovani
  nazev: Filtrování
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: navazujici
  nadrazeny: k-razeni-a-filtrovani
  stupne:
    zs1: false
    zs2: true
  popis: Filtrování je zobrazení jen těch záznamů, které splňují zvolenou podmínku; ostatní se skryjí, ale nesmažou, takže se po zrušení filtru znovu ukážou. Podmínek lze zadat i více najednou, například podle hodnot ve dvou sloupcích. Filtr pomáhá najít potřebné údaje i ve velkých tabulkách. Například z tabulky výpůjček lze vyfiltrovat knihy, které ještě nebyly vráceny.
  zdroj_popisu: nový
  stav: draft
- id: k-operace-se-zaznamy-pridani-oprava-smazani
  nazev: Operace se záznamy (přidání, oprava, smazání)
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Operace se záznamy jsou základní úpravy evidence dat: přidání nového záznamu, oprava údajů v existujícím záznamu a smazání záznamu, který už není potřeba. Pro každou operaci je vhodné stanovit pravidla, kdo ji smí provádět a za jakých podmínek, protože chybná oprava nebo smazání může evidenci znehodnotit. Smazaný záznam bývá obtížné obnovit, proto některé systémy záznam místo smazání jen označí jako neplatný. Například kniha, která se ze školní knihovny ztratila, se nemusí z evidence smazat, ale označí se jako vyřazená, aby zůstala zachovaná historie výpůjček.'
  zdroj_popisu: nový
  stav: draft
- id: k-vzorec-a-funkce
  nazev: Vzorec a funkce
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Vzorec a funkce jsou nástroje tabulkového procesoru, které z dat v tabulce automaticky počítají nové hodnoty, například součty, průměry nebo ceny. Protože vzorec nepracuje jen s pevně zapsanými čísly, ale hlavně s adresami buněk, výsledky se při změně vstupních údajů samy přepočítají. Díky tomu lze stejný výpočet použít pro stovky řádků a vyhnout se chybám při ručním počítání. Například v tabulce třídního fondu se po zapsání nové platby hned upraví celková vybraná částka.
  zdroj_popisu: nový
  stav: draft
- id: k-vzorec
  nazev: Vzorec
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: navazujici
  nadrazeny: k-vzorec-a-funkce
  stupne:
    zs1: false
    zs2: true
  popis: Vzorec je výpočet zapsaný do buňky tabulkového procesoru, který začíná znakem = a pracuje s hodnotami jiných buněk, s čísly a s početními operacemi (+, -, *, /). V buňce se zobrazuje výsledek, samotný vzorec je vidět v řádku vzorců. Vzorec může obsahovat i funkce. Například vzorec =B2*C2 vynásobí cenu jednoho kusu v buňce B2 počtem kusů v buňce C2.
  zdroj_popisu: nový
  stav: draft
- id: k-funkce-suma-prumer-pocet
  nazev: Funkce (SUMA, PRŮMĚR, POČET…)
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: navazujici
  nadrazeny: k-vzorec-a-funkce
  stupne:
    zs1: false
    zs2: true
  popis: Funkce je předpřipravený pojmenovaný výpočet, který se ve vzorci zapisuje názvem a v závorce oblastí buněk nebo hodnotami, například =SUMA(B2:B30). SUMA sečte hodnoty, PRŮMĚR spočítá aritmetický průměr, POČET spočítá buňky s čísly, MIN a MAX najdou nejmenší a největší hodnotu a KDYŽ vrátí výsledek podle splnění podmínky. V anglických verzích programů se funkce jmenují například SUM nebo AVERAGE. Například funkcí PRŮMĚR lze spočítat průměrný výsledek třídy v testu.
  zdroj_popisu: nový
  stav: draft
- id: k-relativni-a-absolutni-adresa-bunky
  nazev: Relativní a absolutní adresa buňky
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: navazujici
  nadrazeny: k-vzorec-a-funkce
  stupne:
    zs1: false
    zs2: true
  popis: Relativní a absolutní adresa buňky určují, co se stane s odkazem na buňku, když se vzorec zkopíruje jinam. Relativní adresa (B2) se posune spolu se vzorcem, takže stejný výpočet lze rychle použít v celém sloupci. Absolutní adresa ($B$2) zůstane stejná a hodí se pro odkaz na jednu pevnou hodnotu; znak $ lze dát i jen před sloupec nebo jen před řádek. Například při přepočtu cen z eur na koruny je kurz v jedné buňce a vzorce na něj odkazují absolutní adresou.
  zdroj_popisu: nový
  stav: draft
- id: k-podminene-formatovani
  nazev: Podmíněné formátování
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Podmíněné formátování je automatická změna vzhledu buňky, například barvy výplně nebo písma, podle toho, zda její hodnota splňuje zadanou podmínku. Když se hodnota změní, změní se i vzhled buňky. Pomáhá rychle najít důležité, neobvyklé nebo chybné údaje a umožňuje vytvořit jednoduchou vizualizaci přímo v tabulce, například barevnou škálu. Například v tabulce teplot lze všechny hodnoty pod nulou automaticky obarvit modře.
  zdroj_popisu: nový
  stav: draft
- id: k-ucel-evidence-dat
  nazev: Účel evidence dat
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Účel evidence dat je problém nebo potřeba, kterou má evidence řešit; evidence totiž není samoúčelná. Účel určuje, jaké údaje je třeba sbírat a jak podrobně, jaké výstupy má evidence poskytovat a které údaje naopak nejsou potřeba. Sbírat jen nezbytné údaje je důležité i kvůli ochraně osobních údajů. Například evidence půjčování sportovního vybavení potřebuje jméno žáka, půjčenou věc a datum vrácení, ale ne jeho adresu nebo datum narození.
  zdroj_popisu: nový
  stav: draft
- id: k-statisticke-pojmy
  nazev: Statistické pojmy
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Statistické pojmy jsou základní pojmy, pomocí kterých se data shrnují a vyhodnocují, například průměr, medián, vzorek, reprezentativnost nebo korelace. Jejich znalost je základem statistické gramotnosti, tedy schopnosti nenechat se čísly zmást, která patří ke klíčovým občanským dovednostem. Korelace, kdy se dvě veličiny mění spolu, neznamená kauzalitu, kdy jedna způsobuje druhou; malý nebo nereprezentativní vzorek klame a graf lze snadno „natáhnout“ k požadovanému závěru. Například výsledek ankety mezi pěti kamarády nevypovídá o tom, co si myslí celá škola.
  zdroj_popisu: garant Data (jazykově upraveno) – karta „Statistická gramotnost“
  stav: draft
- id: k-prumer-a-median
  nazev: Průměr a medián
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: navazujici
  nadrazeny: k-statisticke-pojmy
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Průměr a medián jsou dva způsoby, jak jedním číslem vyjádřit typickou hodnotu dat. Průměr je součet hodnot dělený jejich počtem, medián je prostřední hodnota seřazených dat; při sudém počtu hodnot je to průměr dvou prostředních. Medián je extrémními hodnotami ovlivněn méně než průměr. Například když pět žáků dostává kapesné 300 Kč měsíčně a jeden 3 000 Kč, průměr je 750 Kč, ale medián jen 300 Kč.
  zdroj_popisu: nový
  stav: draft
- id: k-korelace-a-kauzalita
  nazev: Korelace a kauzalita
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: navazujici
  nadrazeny: k-statisticke-pojmy
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'Korelace znamená, že se dvě veličiny mění společně: když roste jedna, roste, nebo naopak klesá i druhá. Kauzalita znamená, že změna jedné veličiny změnu druhé skutečně způsobuje. Korelace sama kauzalitu nedokazuje, protože obě veličiny může ovlivňovat třetí činitel nebo může jít o náhodu; příčinnou souvislost lze ověřit například pokusem. Například prodej zmrzliny a počet utonulých rostou oba kvůli teplému počasí, ne proto, že by zmrzlina způsobovala utonutí.'
  zdroj_popisu: nový
  stav: draft
- id: k-reprezentativnost
  nazev: Reprezentativnost
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: navazujici
  nadrazeny: k-statisticke-pojmy
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Reprezentativnost je vlastnost vzorku, který svým složením odpovídá celé skupině, o které se má něco zjistit, například podle věku, bydliště nebo ročníku. Z nereprezentativního vzorku vycházejí zkreslené závěry, i když je velký; stejně se posuzují i trénovací data ve strojovém učení. Například průzkum, jak žáci jezdí do školy, provedený jen mezi žáky čekajícími na zastávce autobusu, by podíl dojíždějících autobusem výrazně přecenil.
  zdroj_popisu: nový
  stav: draft
- id: k-automatizovana-analyza-dat
  nazev: Automatizovaná analýza dat
  tema: o-data-a-analyza
  podoblast: s-zpracovani-dat
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Automatizovaná analýza dat je zpracování a vyhodnocení dat pomocí programu místo ruční práce. Když je dat příliš mnoho na ruční zpracování v tabulkovém procesoru, zpracují se kódem, typicky v jazyce Python s knihovnou pandas. Výhodou je, že je takové zpracování rychlé, opakovatelné a doložitelné: kdokoli spustí stejný postup a dostane stejný výsledek. Má ale i nevýhody. Vytvoření a odladění programu může zabrat více času než jednorázové ruční zpracování. Chyba v programu může ovlivnit všechny zpracovávané záznamy, takže hrozí systematické chyby. U malé sady dat může být zpracování robustním automatickým systémem dokonce pomalejší než ruční. Například odpovědi z dotazníku pro celou školu lze programem každý týden znovu načíst, vyčistit a shrnout do grafu jediným spuštěním.'
  zdroj_popisu: garant Data (jazykově upraveno)
  stav: draft
- id: k-graf
  nazev: Graf
  tema: o-data-a-analyza
  podoblast: s-vizualizace
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Graf je grafické znázornění číselných dat, ve kterém jsou hodnoty vyjádřené délkou, výškou, polohou, plochou nebo barvou. Na rozdíl od tabulky ukazuje data jako celek, a proto usnadňuje porovnávání hodnot a odhalování trendů, výkyvů i chyb v datech. V tabulkovém procesoru se graf vytváří z vybraných buněk a při změně dat se sám upraví. Aby byl srozumitelný, musí mít vhodný typ a potřebné prvky. Například z grafu denních teplot za měsíc je na první pohled vidět, kdy se ochladilo.
  zdroj_popisu: nový
  stav: draft
- id: k-typy-grafu
  nazev: Typy grafů
  tema: o-data-a-analyza
  podoblast: s-vizualizace
  vrstva: navazujici
  nadrazeny: k-graf
  stupne:
    zs1: false
    zs2: true
  popis: Typy grafů se liší tím, co v datech zvýrazňují, a proto se volí podle toho, co má graf ukázat. Sloupcový graf slouží k porovnání hodnot, spojnicový ukazuje vývoj v čase, výsečový podíl částí na celku a bodový vztah dvou veličin. Pro postupy a hierarchie se používají procesní a strukturální diagramy, pro vztahy relační a síťové diagramy (viz skupina Model). Například vývoj počtu návštěv školního webu po měsících se nejlépe ukáže spojnicovým grafem, zatímco počty žáků v jednotlivých třídách sloupcovým.
  zdroj_popisu: garant Data (jazykově upraveno) – karta „Vizualizace a tvorba grafu“
  stav: draft
- id: k-prvky-grafu-osa-legenda-meritko
  nazev: Prvky grafu (osa, legenda, měřítko)
  tema: o-data-a-analyza
  podoblast: s-vizualizace
  vrstva: navazujici
  nadrazeny: k-graf
  stupne:
    zs1: false
    zs2: true
  popis: 'Prvky grafu jsou části, bez kterých graf nelze správně přečíst: název, osy s popisem a jednotkami, měřítko a legenda, která vysvětluje, co znamenají jednotlivé barvy nebo značky. U diagramů a síťových grafů k nim patří i popisky prvků a vyznačené vazby mezi nimi. Na měřítku os závisí, zda graf ukazuje rozdíly věrně. Například bez popisu svislé osy nelze poznat, zda sloupce ukazují počty žáků, nebo procenta.'
  zdroj_popisu: garant Data (jazykově upraveno) – karta „Vizualizace a tvorba grafu“
  stav: draft
- id: k-zavadejici-graf
  nazev: Zavádějící graf
  tema: o-data-a-analyza
  podoblast: s-vizualizace
  vrstva: navazujici
  nadrazeny: k-graf
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Zavádějící graf je graf, který vede k mylnému závěru, i když jsou data v něm pravdivá. Klame například useknutou svislou osou, která nezačíná nulou a malý rozdíl zobrazí jako velký, nerovnoměrným měřítkem, účelově vybraným časovým úsekem nebo prostorovým efektem zkreslujícím velikost ploch. Může vzniknout omylem i záměrně, proto je u grafu dobré zkontrolovat osy a měřítko. Například sloupcový graf s osou začínající na 95 % může ze dvou téměř stejných výsledků udělat zdánlivě velký rozdíl.
  zdroj_popisu: nový
  stav: draft
- id: k-piktogram-a-infografika
  nazev: Piktogram a infografika
  tema: o-data-a-analyza
  podoblast: s-vizualizace
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Piktogram a infografika jsou obrazové způsoby předávání informací, které kombinují symboly, obrázky, text a čísla. Využívají toho, že obraz lze pochopit rychleji než text, a často i bez znalosti jazyka. Aby splnily svůj účel, musí být jednoznačné a nesmějí obsah zkreslovat. Například plakát o třídění odpadu může pomocí symbolů a několika čísel ukázat, kam patří který druh odpadu a kolik se ho ve škole vytřídí.
  zdroj_popisu: nový
  stav: draft
- id: k-piktogram
  nazev: Piktogram
  tema: o-data-a-analyza
  podoblast: s-vizualizace
  vrstva: navazujici
  nadrazeny: k-piktogram-a-infografika
  stupne:
    zs1: true
    zs2: false
  popis: Piktogram je zjednodušený obrázek, který vyjadřuje pojem nebo pokyn bez slov, například značka únikového východu nebo zákazu kouření. V piktogramovém grafu představuje každý symbol určitý počet kusů, takže hodnotu ukazuje počet symbolů v řadě. Například v grafu oblíbených zvířat ve třídě může jeden obrázek psa znamenat dva žáky.
  zdroj_popisu: nový
  stav: draft
- id: k-infografika
  nazev: Infografika
  tema: o-data-a-analyza
  podoblast: s-vizualizace
  vrstva: navazujici
  nadrazeny: k-piktogram-a-infografika
  stupne:
    zs1: false
    zs2: true
  popis: 'Infografika je obrazová prezentace informací a dat, která kombinuje grafy, piktogramy, krátké texty a obrázky, aby téma vysvětlila rychle a přehledně. Na rozdíl od jednoho grafu podává ucelené sdělení: vede čtenáře od hlavní myšlenky k podrobnostem. Při tvorbě je třeba vybrat to podstatné, uvést zdroj dat a dbát na to, aby grafické prvky údaje nezkreslovaly. Například infografika o spotřebě vody v domácnosti může spojit čísla, ikony a jednoduchý graf.'
  zdroj_popisu: nový
  stav: draft
- id: k-model
  nazev: Model
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Model je zjednodušený obraz reality, který zachycuje jen ty prvky, vlastnosti a vztahy, které jsou důležité pro daný účel; nepodstatné podrobnosti vynechává. Protože každý model vzniká z určitého hlediska a pro určitý účel, lze pro stejnou skutečnost vytvořit různé modely a žádný z nich není jediný správný. Z modelu lze vyčíst informace, předvídat, co se stane, nebo situaci vysvětlit ostatním. Například cestu do školy lze zachytit mapou s ulicemi, slovním popisem odboček i seznamem zastávek autobusu.
  zdroj_popisu: nový
  stav: draft
- id: k-prvek-modelu
  nazev: Prvek modelu
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-model
  stupne:
    zs1: true
    zs2: true
  popis: Prvek modelu je objekt, který model zachycuje, například zastávka v plánu metra, osoba v rodokmenu nebo místnost v plánu školy. Prvky mohou být věci, osoby, role, zdroje nebo události a mají vlastnosti, které model uvádí jen tehdy, když jsou pro jeho účel důležité. Například v rodokmenu se u osoby obvykle uvádí jméno a rok narození, ale ne barva očí.
  zdroj_popisu: nový
  stav: draft
- id: k-vztah-mezi-prvky
  nazev: Vztah mezi prvky
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-model
  stupne:
    zs1: true
    zs2: true
  popis: 'Vztah mezi prvky je spojení nebo závislost mezi prvky modelu, například trasa mezi zastávkami nebo příbuzenský vztah v rodokmenu. Vztahy mohou vyjadřovat pořadí, příčinu a důsledek, nadřazenost nebo vzdálenost a často nesou nejdůležitější informaci modelu: pomáhají předvídat důsledky a hledat řešení. Například v modelu koloběhu vody vede vztah od vypařování k tvorbě mraků a od nich k dešti.'
  zdroj_popisu: nový
  stav: draft
- id: k-zjednoduseni-co-model-nezachycuje
  nazev: Zjednodušení (co model nezachycuje)
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-model
  stupne:
    zs1: true
    zs2: true
  popis: Zjednodušení znamená, že každý model něco vynechává nebo upravuje, aby byl přehledný a sloužil svému účelu. Proto je třeba vědět, k čemu model slouží a k čemu se naopak nehodí, a nevyvozovat z něj závěry o tom, co nezachycuje. Například plán pražského metra zachycuje pořadí stanic a přestupy, ale ne skutečné vzdálenosti a směry, takže podle něj nelze odhadnout délku cesty pěšky.
  zdroj_popisu: nový
  stav: draft
- id: k-schema-a-diagram
  nazev: Schéma a diagram
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Schéma a diagram jsou grafické modely, které znázorňují prvky a vztahy mezi nimi pomocí značek, tvarů, čar a šipek. Na rozdíl od grafu číselných dat zachycují hlavně uspořádání, postup nebo strukturu. Aby je mohl přečíst každý, používají dohodnuté značky nebo vysvětlivky. Například návod na sestavení skříně ukazuje pomocí obrázků a šipek, který díl kam patří a v jakém pořadí se díly spojují.
  zdroj_popisu: nový
  stav: draft
- id: k-schema
  nazev: Schéma
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-schema-a-diagram
  stupne:
    zs1: true
    zs2: true
  popis: Schéma je zjednodušené zakreslení uspořádání nebo fungování něčeho, ve kterém jsou části znázorněné dohodnutými značkami a jejich propojení čarami. Neusiluje o věrný vzhled, ale o to, aby bylo vidět, z čeho se věc skládá a jak spolu části souvisejí. Například schéma elektrického obvodu ukazuje, jak je baterie propojená s vypínačem a žárovkou, a blokové schéma počítače vztah procesoru, paměti a vstupních a výstupních zařízení.
  zdroj_popisu: nový
  stav: draft
- id: k-diagram
  nazev: Diagram
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-schema-a-diagram
  stupne:
    zs1: true
    zs2: true
  popis: 'Diagram je grafické znázornění vztahů, postupů nebo struktury, které pomocí tvarů, čar a šipek ukazuje, jak spolu prvky souvisejí. Druhů diagramů je mnoho a každý se hodí k jinému účelu: vývojový diagram zachycuje postup, rodokmen příbuzenské vztahy a Vennův diagram průniky skupin. Například Vennovým diagramem lze ukázat, kteří žáci chodí do sportovního kroužku, kteří do výtvarného a kteří do obou.'
  zdroj_popisu: nový
  stav: draft
- id: k-myslenkova-mapa
  nazev: Myšlenková mapa
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-schema-a-diagram
  stupne:
    zs1: true
    zs2: false
  popis: Myšlenková mapa je diagram, ve kterém se od ústředního pojmu uprostřed paprskovitě větví související myšlenky, podtémata a jejich podrobnosti. Pomáhá uspořádat nápady, najít souvislosti a zapamatovat si látku; větve se často odlišují barvami a doplňují obrázky. Například před psaním referátu o lese lze doprostřed napsat „les“ a od něj vést větve rostliny, živočichové a význam lesa pro člověka.
  zdroj_popisu: nový
  stav: draft
- id: k-mapa
  nazev: Mapa
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-schema-a-diagram
  stupne:
    zs1: true
    zs2: false
  popis: 'Mapa je zmenšený a zjednodušený obraz území, který v daném měřítku zachycuje vybrané prvky, například cesty, budovy, vodstvo nebo terén. Jako každý model vybírá jen to, co je pro její účel důležité, proto se turistická mapa liší od plánu města. Měřítko udává, kolikrát je skutečnost zmenšená, a legenda vysvětluje použité značky. Například na mapě v měřítku 1 : 50 000 odpovídá 1 cm vzdálenosti 500 m ve skutečnosti.'
  zdroj_popisu: nový
  stav: draft
- id: k-graf-jako-sit-vrcholy-a-hrany
  nazev: Graf jako síť (vrcholy a hrany)
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Graf jako síť je model, který zachycuje objekty jako vrcholy a vztahy mezi nimi jako hrany, například zastávky a spoje mezi nimi nebo lidi a jejich přátelství. Nezáleží v něm na přesné poloze bodů ani tvaru čar, ale jen na tom, co je s čím propojené. Hrany mohou mít ohodnocení a orientaci a v grafu lze hledat cesty, například tu nejkratší. Jde o jiný pojem než graf zobrazující číselná data. Například síť linek městské dopravy lze zakreslit jako graf, ve kterém vyhledávač spojení hledá cestu mezi dvěma zastávkami.
  zdroj_popisu: nový
  stav: draft
- id: k-vrchol-a-hrana
  nazev: Vrchol a hrana
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-graf-jako-sit-vrcholy-a-hrany
  stupne:
    zs1: false
    zs2: true
  popis: 'Vrchol a hrana jsou dvě základní součásti grafu: vrchol představuje objekt, hrana spojení mezi dvěma vrcholy. Vrcholy se kreslí jako body nebo kroužky, hrany jako čáry mezi nimi a z jednoho vrcholu může vést libovolný počet hran. Počet hran, které z vrcholu vedou, se nazývá stupeň vrcholu a ukazuje, kolik má objekt spojení. Například v grafu kamarádství ve třídě jsou vrcholy žáci a hrana spojuje každé dva žáky, kteří se kamarádí.'
  zdroj_popisu: nový
  stav: draft
- id: k-ohodnoceni-hrany
  nazev: Ohodnocení hrany
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-graf-jako-sit-vrcholy-a-hrany
  stupne:
    zs1: false
    zs2: true
  popis: Ohodnocení hrany je číslo přiřazené hraně, které vyjadřuje například vzdálenost, dobu cesty nebo cenu. Graf s ohodnocenými hranami se nazývá ohodnocený graf a umožňuje porovnávat cesty nejen podle počtu hran, ale i podle součtu jejich ohodnocení. Například v grafu cyklotras může být každá hrana ohodnocená délkou úseku v kilometrech.
  zdroj_popisu: nový
  stav: draft
- id: k-orientace-hrany
  nazev: Orientace hrany
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-graf-jako-sit-vrcholy-a-hrany
  stupne:
    zs1: false
    zs2: true
  popis: Orientace hrany je směr, který hraně určuje, že vede jen od jednoho vrcholu k druhému, a ne zpět; kreslí se jako šipka. Graf s orientovanými hranami se nazývá orientovaný graf a hodí se pro vztahy, které nemusí platit oboustranně. Například jednosměrnou ulici lze projet jen jedním směrem a na sociální síti platí, že když jeden uživatel sleduje druhého, neznamená to, že druhý sleduje jeho.
  zdroj_popisu: nový
  stav: draft
- id: k-cesta-a-nejkratsi-cesta
  nazev: Cesta a nejkratší cesta
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-graf-jako-sit-vrcholy-a-hrany
  stupne:
    zs1: false
    zs2: true
  popis: Cesta je posloupnost hran, po které se lze dostat z jednoho vrcholu do druhého tak, že každá další hrana navazuje na předchozí. Mezi dvěma vrcholy může vést více cest; nejkratší cesta je ta, která má nejmenší součet ohodnocení hran, případně v neohodnoceném grafu nejmenší počet hran. Například navigace v mobilu hledá nejkratší nebo nejrychlejší cestu v grafu silnic, jehož hrany jsou ohodnocené délkou nebo dobou jízdy.
  zdroj_popisu: nový
  stav: draft
- id: k-strom-hierarchicka-struktura
  nazev: Strom (hierarchická struktura)
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: navazujici
  nadrazeny: k-graf-jako-sit-vrcholy-a-hrany
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Strom je graf, ve kterém jsou všechny vrcholy propojené a mezi každými dvěma vrcholy vede právě jedna cesta, takže v něm nejsou žádné okruhy. Často zachycuje hierarchickou strukturu: má jeden výchozí vrchol zvaný kořen, z něj se větví potomci a vrcholy bez potomků se nazývají listy; každý vrchol kromě kořene má právě jednoho rodiče. Například složky v počítači tvoří strom: disk obsahuje složky, ty další složky a soubory.'
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-simulace
  nazev: Simulace
  tema: o-data-a-analyza
  podoblast: s-model
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Simulace je využití modelu k napodobení toho, jak se systém chová v čase nebo za různých podmínek. Model se nastaví podle zvolených pravidel a počátečních hodnot a obvykle počítač krok za krokem vypočítává, jak se situace vyvíjí; změnou podmínek lze porovnat různé možnosti. Simulace umožňuje zkoumat situace, které by ve skutečnosti byly nebezpečné, drahé, příliš pomalé nebo nemožné, její výsledek je ale jen tak spolehlivý jako model, ze kterého vychází. Například simulace šíření nemoci ve škole může ukázat, jak by se počet nemocných změnil, kdyby část žáků zůstala doma.
  zdroj_popisu: nový
  stav: draft
- id: k-informacni-system
  nazev: Informační systém
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Informační systém je software, který eviduje a zpracovává data pro určitou potřebu, například školní matrika, rezervační systém nebo e-shop. K datům v něm přistupují různí uživatelé v různých rolích, například žák, učitel, rodič, zákazník nebo správce (administrátor), přičemž každá role má nastavená jiná přístupová práva: co může vidět, vkládat nebo upravovat. Umět posoudit, k čemu systém slouží, kdo a jak v něm s daty pracuje a zda je pro svůj účel opravdu užitečný, patří k základní digitální gramotnosti. Například v elektronické žákovské knížce učitel známky zapisuje, zatímco žák a rodič je mohou jen číst.'
  zdroj_popisu: garant Data (jazykově upraveno) – karta „Informační systémy“
  stav: draft
- id: k-procesy-v-informacnim-systemu
  nazev: Procesy v informačním systému
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: navazujici
  nadrazeny: k-informacni-system
  stupne:
    zs1: false
    zs2: true
  popis: 'Procesy v informačním systému jsou činnosti, které se v systému s daty pravidelně provádějí: zadávání a aktualizace dat, uplatňování přístupových pravidel a vytváření výstupů, například přehledů a reportů. V širším pojetí tvoří procesy spolu s daty, uživateli a technologiemi informační systém jako propojený celek. Například na konci pololetí systém z průběžných známek vytvoří přehled, ze kterého učitel vychází při klasifikaci.'
  zdroj_popisu: nový
  stav: draft
- id: k-tok-dat
  nazev: Tok dat
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: navazujici
  nadrazeny: k-informacni-system
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: 'Tok dat je cesta, kterou data informačním systémem procházejí: odkud přicházejí, kdo je zadává, kde se zpracovávají a ukládají, komu se zobrazují a jak se cestou mění. Popis toku dat pomáhá pochopit, jak systém funguje uvnitř, a odhalit místa, kde může dojít k chybě nebo k úniku údajů. Například známka z testu putuje od učitele, který ji zapíše, přes uložení na serveru až k rodiči, který ji uvidí v aplikaci.'
  zdroj_popisu: nový
  stav: draft
- id: k-uzivatelske-role
  nazev: Uživatelské role
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Uživatelské role jsou skupiny uživatelů informačního systému, které mají stejné úkoly, a proto i stejná přístupová práva. Práva se nenastavují každému člověku zvlášť, ale celé roli, takže nový uživatel po zařazení do role hned získá vše, co ke své práci potřebuje, a nic navíc. Jeden člověk může mít i více rolí, například učitel, který je zároveň rodičem žáka školy. Například ve školním systému mají jiná práva žáci, rodiče, učitelé, vedení školy a správce.
  zdroj_popisu: nový
  stav: draft
- id: k-uzivatel
  nazev: Uživatel
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: navazujici
  nadrazeny: k-uzivatelske-role
  stupne:
    zs1: true
    zs2: true
  popis: Uživatel je člověk, který informační systém používá ke své práci nebo pro svou potřebu, například žák, rodič nebo učitel ve školním informačním systému. V systému ho zastupuje uživatelský účet, ke kterému se přihlašuje, a podle své role vidí a smí měnit jen určitá data. Například zákazník e-shopu si může prohlížet zboží a své objednávky, ale ne objednávky jiných zákazníků.
  zdroj_popisu: nový
  stav: draft
- id: k-spravce
  nazev: Správce
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: navazujici
  nadrazeny: k-uzivatelske-role
  stupne:
    zs1: true
    zs2: true
  popis: 'Správce (administrátor) je člověk, který informační systém spravuje: zakládá a ruší uživatelské účty, přiděluje role a přístupová práva a stará se o provoz, zálohování a bezpečnost systému. Má nejširší práva a s nimi i největší odpovědnost, protože jeho chyba nebo zneužití jeho účtu může ohrozit data všech uživatelů. Například správce školního systému na začátku roku založí účty novým žákům a zařadí je do tříd.'
  zdroj_popisu: nový
  stav: draft
- id: k-omezeni-informacnich-systemu
  nazev: Omezení informačních systémů
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Omezení informačních systémů jsou okolnosti, kvůli kterým systém nemusí fungovat vždy a bezchybně: výpadky, závislost na připojení, aktualizace a lidské chyby. Protože se na informační systémy spoléhá mnoho lidí, je třeba s jejich selháním počítat a mít připravené náhradní řešení, například zálohy dat nebo papírový postup. Například když nefunguje elektronická třídní kniha, učitel zapíše docházku na papír a do systému ji doplní později.'
  zdroj_popisu: nový
  stav: draft
- id: k-vypadek
  nazev: Výpadek
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: navazujici
  nadrazeny: k-omezeni-informacnich-systemu
  stupne:
    zs1: false
    zs2: true
  popis: Výpadek je doba, kdy informační systém není dostupný nebo nefunguje správně, například kvůli poruše serveru, výpadku elektřiny, útoku nebo plánované údržbě. Plánované výpadky se obvykle oznamují předem a probíhají v době, kdy systém používá nejméně lidí. Například e-shop může být v noci na hodinu nedostupný kvůli údržbě a zákazníci v tu dobu nemohou objednávat.
  zdroj_popisu: nový
  stav: draft
- id: k-zavislost-na-pripojeni
  nazev: Závislost na připojení
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: navazujici
  nadrazeny: k-omezeni-informacnich-systemu
  stupne:
    zs1: false
    zs2: true
  popis: Závislost na připojení znamená, že online systém bez připojení k internetu nefunguje, nebo funguje jen omezeně, protože data i výpočty jsou uložené na serveru. Některé aplikace proto umožňují pracovat i offline a změny odešlou, až se připojení obnoví. Například bez signálu nelze v aplikaci dopravce koupit jízdenku, ale dříve stažená jízdenka se zobrazit může.
  zdroj_popisu: nový
  stav: draft
- id: k-aktualizace
  nazev: Aktualizace
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: navazujici
  nadrazeny: k-omezeni-informacnich-systemu
  stupne:
    zs1: false
    zs2: true
  popis: Aktualizace jsou změny informačního systému, které opravují chyby, zlepšují zabezpečení a přidávají funkce. Mohou ale přinést nové chyby, změnit způsob ovládání nebo systém na nějakou dobu omezit, proto se před nasazením testují a uživatelé o nich bývají informováni. Například po aktualizaci školního systému se může změnit rozmístění tlačítek a uživatelé si musí zvyknout na nové ovládání.
  zdroj_popisu: nový
  stav: draft
- id: k-lidska-chyba
  nazev: Lidská chyba
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: navazujici
  nadrazeny: k-omezeni-informacnich-systemu
  stupne:
    zs1: false
    zs2: true
  popis: Lidská chyba je chyba uživatele nebo správce, například překlep při zadávání, omylem smazaná data, odeslání údajů nesprávnému příjemci nebo špatně nastavená přístupová práva. Patří k častým příčinám problémů v informačních systémech. Předcházet jí pomáhá kontrola zadávaných údajů, potvrzení před smazáním, zálohy a přidělování jen nezbytných práv. Například překlep v e-mailové adrese rodiče způsobí, že mu nepřicházejí zprávy ze školy.
  zdroj_popisu: nový
  stav: draft
- id: k-webova-a-mobilni-aplikace
  nazev: Webová a mobilní aplikace
  tema: o-data-a-analyza
  podoblast: s-informacni-system
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Webová a mobilní aplikace jsou dva způsoby přístupu k informačnímu systému. Webová aplikace běží v prohlížeči bez instalace, takže ji lze použít na jakémkoli zařízení s připojením; mobilní aplikace se instaluje do telefonu nebo tabletu a může využívat jeho funkce, například fotoaparát, polohu nebo oznámení. Obě obvykle pracují se stejnými daty uloženými na serveru. Například do školního systému se lze přihlásit na webu z počítače i v mobilní aplikaci, která navíc upozorní na novou známku.
  zdroj_popisu: nový
  stav: draft
- id: k-soucasti-pocitace
  nazev: Součásti počítače
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Součásti počítače jsou hlavní části, ze kterých se počítač skládá a které spolu spolupracují při zpracování dat. Procesor vykonává instrukce programů, operační paměť uchovává právě zpracovávaná data, úložiště uchovává data trvale a vstupní a výstupní zařízení předávají data mezi počítačem a okolím. Součásti propojuje základní deska a energii jim dodává zdroj nebo baterie. Vhodnost počítače pro určitý účel popisují parametry součástí, například frekvence procesoru v GHz nebo velikost paměti a úložiště v GB. Například pro střih videa je potřeba výkonnější procesor a větší paměť než pro psaní textu.
  zdroj_popisu: nový
  stav: draft
- id: k-procesor
  nazev: Procesor
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-soucasti-pocitace
  stupne:
    zs1: false
    zs2: true
  popis: Procesor (CPU) je součást počítače, která vykonává instrukce programů a provádí výpočty. Jeho výkon ovlivňuje počet jader, která mohou pracovat současně, a taktovací frekvence udávaná v gigahertzech; například 3 GHz znamenají 3 miliardy taktů za sekundu. Počítače a telefony mají kromě hlavního procesoru i grafický procesor (GPU), který zvládá mnoho jednoduchých výpočtů najednou a využívá se pro grafiku i pro umělou inteligenci.
  zdroj_popisu: nový
  stav: draft
- id: k-operacni-pamet
  nazev: Operační paměť
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-soucasti-pocitace
  stupne:
    zs1: false
    zs2: true
  popis: Operační paměť (RAM) je rychlá paměť, ve které jsou uložené právě spuštěné programy a data, se kterými pracují. Procesor z ní čte a zapisuje mnohem rychleji než z úložiště, po vypnutí počítače se však její obsah ztratí, a proto je potřeba rozpracovanou práci uložit do souboru. Například když je otevřeno mnoho programů a záložek prohlížeče najednou a operační paměť nestačí, počítač se výrazně zpomalí.
  zdroj_popisu: nový
  stav: draft
- id: k-uloziste
  nazev: Úložiště
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-soucasti-pocitace
  stupne:
    zs1: false
    zs2: true
  popis: Úložiště je paměť, která uchovává programy a data trvale, i po vypnutí zařízení. Má mnohem větší kapacitu než operační paměť, ale je pomalejší. Patří sem SSD disky bez pohyblivých částí, pevné disky (HDD) s rotujícími plotnami, paměťové karty a flash disky; kapacita se udává v gigabajtech (GB) nebo terabajtech (TB). Například telefon s úložištěm 128 GB pojme desítky tisíc fotografií.
  zdroj_popisu: nový
  stav: draft
- id: k-vstupni-a-vystupni-zarizeni
  nazev: Vstupní a výstupní zařízení
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-soucasti-pocitace
  stupne:
    zs1: false
    zs2: true
  popis: Vstupní zařízení předávají data do počítače, například klávesnice, myš, mikrofon, kamera nebo skener; výstupní zařízení je předávají z počítače ven, například monitor, reproduktory nebo tiskárna. Některá zařízení jsou vstupní i výstupní zároveň, například dotykový displej nebo náhlavní souprava se sluchátky a mikrofonem. K počítači se připojují kabelem, nejčastěji přes USB, nebo bezdrátově.
  zdroj_popisu: nový
  stav: draft
- id: k-typy-pocitacu
  nazev: Typy počítačů
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Počítače se dělí na typy podle velikosti, výkonu, způsobu ovládání a účelu, všechny však pracují na stejném principu: přijímají vstupy, zpracovávají je podle programu a vytvářejí výstupy. Vedle osobních počítačů, notebooků a mobilních zařízení existují počítače skryté uvnitř jiných zařízení, které řídí jejich činnost. Mimo dohled běžného uživatele pracují také servery, které poskytují služby v síti, a superpočítače pro náročné výpočty, jako je předpověď počasí. Například telefon, herní konzole i počítač v pračce mají procesor, paměť a program, jen každý slouží jinému účelu.'
  zdroj_popisu: nový
  stav: draft
- id: k-osobni-pocitac-a-notebook
  nazev: Osobní počítač a notebook
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-typy-pocitacu
  stupne:
    zs1: false
    zs2: true
  popis: Osobní počítač (PC) je počítač určený pro práci jednoho uživatele; může být stolní, nebo přenosný (notebook). Ovládá se obvykle klávesnicí a myší nebo touchpadem a hodí se pro delší práci, jako je psaní textů, programování nebo úprava videa. Notebook má displej, klávesnici a baterii v jednom těle, stolní počítač bývá výkonnější. Například ve školní učebně bývají stolní počítače, žáci ale často pracují i na noteboocích.
  zdroj_popisu: nový
  stav: draft
- id: k-mobilni-zarizeni
  nazev: Mobilní zařízení
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-typy-pocitacu
  stupne:
    zs1: false
    zs2: true
  popis: 'Mobilní zařízení je malý přenosný počítač ovládaný hlavně dotykovým displejem, například chytrý telefon nebo tablet. Má baterii, fotoaparát, připojení k mobilní síti nebo Wi‑Fi a řadu senzorů, například přijímač GPS, akcelerometr nebo snímač otisku prstu. Díky senzorům a stálému připojení mohou aplikace reagovat na to, kde se uživatel nachází a co dělá: mapa podle GPS ukazuje aktuální polohu a krokoměr počítá kroky podle pohybu telefonu.'
  zdroj_popisu: nový
  stav: draft
- id: k-skryty-vestaveny-pocitac
  nazev: Skrytý (vestavěný) počítač
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-typy-pocitacu
  stupne:
    zs1: false
    zs2: true
  popis: Skrytý (vestavěný) počítač je počítač zabudovaný uvnitř jiného zařízení, který řídí jeho činnost a běží v něm stále stejný program. Obvykle nemá klávesnici ani monitor, ovládá se tlačítky zařízení, a uživatel ho proto často jako počítač vůbec nevnímá. Skryté počítače jsou v autech, výtazích, semaforech, hračkách i domácích spotřebičích. Například pračka podle zvoleného programu sama řídí napouštění vody, ohřev a otáčení bubnu.
  zdroj_popisu: nový
  stav: draft
- id: k-vestavene-zarizeni
  nazev: Vestavěné zařízení
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'Vestavěné zařízení je zařízení řízené vestavěným počítačem, které vnímá své okolí a působí na ně. Pracuje v opakující se smyčce: senzory zjišťují stav okolí, mikrokontrolér podle programu vyhodnotí naměřené hodnoty a rozhodne, co udělat, a aktuátory provedou akci. Na rozdíl od osobního počítače plní jeden určený úkol a často pracuje bez zásahu člověka. Například automatické dveře v obchodě zaznamenají pohybovým čidlem příchozího, řídicí jednotka vyhodnotí signál a motor dveře otevře.'
  zdroj_popisu: nový
  stav: draft
- id: k-senzor
  nazev: Senzor
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-vestavene-zarizeni
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Senzor (také snímač, čidlo nebo detektor) je obecně zdroj informací pro řídicí systém. V užším smyslu je to součástka, která měří určitou veličinu a převádí ji na signál, obvykle elektrický, optický nebo mechanický, se kterým pak počítač pracuje jako s daty. Existují například teplotní, světelná, zvuková a pohybová čidla, snímače vlhkosti, hladiny vody, tlaku, průtoku nebo prachu, ultrazvukové snímače vzdálenosti i elektronický jazyk, který rozpoznává chutě. Například ultrazvukový senzor na robotovi změří vzdálenost od překážky.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-aktuator
  nazev: Aktuátor
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-vestavene-zarizeni
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Aktuátor (akční člen) je součástka, která podle pokynu řídicího počítače působí na okolí: převádí elektrický signál na pohyb, světlo, zvuk nebo teplo. Je tak protějškem senzoru, který okolí naopak měří. Typickými aktuátory jsou motor, servomotor, LED, bzučák nebo elektromagnetický ventil. Například servomotor v robotickém rameni natočí kloub přesně o zadaný úhel.'
  zdroj_popisu: nový
  stav: draft
- id: k-mikrokontroler
  nazev: Mikrokontrolér
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: navazujici
  nadrazeny: k-vestavene-zarizeni
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Mikrokontrolér je malý počítač v jednom čipu, který obsahuje procesor, paměť a vstupy a výstupy pro připojení senzorů a aktuátorů. Je určený k řízení jednoho zařízení: obvykle v něm běží jediný program, má malou spotřebu energie a je levný, proto je v mnoha spotřebičích, hračkách i autech. Ve škole se s mikrokontroléry pracuje například na deskách micro:bit nebo Arduino, do kterých žáci nahrávají vlastní program.'
  zdroj_popisu: nový
  stav: draft
- id: k-robot
  nazev: Robot
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: core
  stupne:
    zs1: true
    zs2: false
  poznamka: 'RVP: Činnosti'
  popis: Robot je stroj, který pracuje s určitou mírou samostatnosti (autonomie). Vykonává určené úkoly – někdy přesně podle postupu, který mu popsali lidé (algoritmu), jindy se konkrétní úlohy naučí plnit sám pomocí strojového učení. Své okolí vnímá pomocí senzorů, reaguje na ně a zasahuje do něj, případně si o něm pomocí umělé inteligence vytváří vlastní představu. Návrhem, stavbou, řízením a využitím robotů se zabývá robotika, která propojuje strojírenství, elektroniku a informatiku. Například robotický vysavač mapuje byt, objíždí překážky a sám se vrací do nabíječky.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-hardwarova-porucha
  nazev: Hardwarová porucha
  tema: o-systemy-a-bezpecnost
  podoblast: s-hardware
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Hardwarová porucha je porucha fyzické součásti zařízení, například vadná baterie, prasklý displej, poškozený kabel nebo konektor, nefunkční klávesnice nebo selhávající disk. Na rozdíl od softwarového problému ji obvykle nevyřeší restart ani přeinstalace programu a projevuje se zpravidla bez ohledu na to, jaký program právě běží. Často vyžaduje opravu nebo výměnu součástky odborníkem, kterému je vhodné přesně popsat příznaky; u nového zařízení se na ni může vztahovat záruka. Například když telefon po pádu přestane reagovat na dotyk jen v části displeje, jde nejspíš o poškozenou dotykovou vrstvu.
  zdroj_popisu: nový
  stav: draft
- id: k-operacni-system
  nazev: Operační systém
  tema: o-systemy-a-bezpecnost
  podoblast: s-software
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Operační systém je základní software zařízení, který řídí hardware, spravuje prostředky počítače a umožňuje spouštět ostatní programy. Načítá se při spuštění zařízení a stojí mezi aplikacemi a hardwarem: aplikace nemusí znát podrobnosti konkrétního hardwaru, protože s ním komunikují přes operační systém. Mezi nejrozšířenější operační systémy patří Windows, macOS a Linux pro počítače a Android a iOS pro mobilní zařízení. Například stejná aplikace pro psaní poznámek může běžet na různých noteboocích, protože práci s jejich klávesnicí, displejem a diskem zajišťuje operační systém.'
  zdroj_popisu: nový
  stav: draft
- id: k-funkce-operacniho-systemu
  nazev: Funkce operačního systému
  tema: o-systemy-a-bezpecnost
  podoblast: s-software
  vrstva: navazujici
  nadrazeny: k-operacni-system
  stupne:
    zs1: false
    zs2: true
  popis: Operační systém přiděluje spuštěným programům čas procesoru a operační paměť, takže může najednou běžet více programů. Dále spravuje soubory a složky na úložišti, ovládá připojená zařízení pomocí ovladačů, spravuje uživatelské účty a jejich oprávnění, zajišťuje základní zabezpečení a poskytuje uživatelské rozhraní, například plochu, nabídky a okna. Například připojenou tiskárnu operační systém rozpozná a zpřístupní všem programům.
  zdroj_popisu: nový
  stav: draft
- id: k-typy-operacnich-systemu-pocitac-mobil
  nazev: Typy operačních systémů (počítač, mobil)
  tema: o-systemy-a-bezpecnost
  podoblast: s-software
  vrstva: navazujici
  nadrazeny: k-operacni-system
  stupne:
    zs1: false
    zs2: true
  popis: 'Operační systémy se liší podle zařízení, pro která jsou určené: pro počítače jsou to například Windows, macOS, Linux nebo ChromeOS, pro mobilní zařízení Android a iOS. Mobilní systémy jsou přizpůsobené dotyku a aplikace se do nich instalují obvykle z oficiálního obchodu, počítačové se ovládají hlavně myší a klávesnicí a programy do nich lze instalovat z různých zdrojů. Například Android používají telefony mnoha výrobců, kdežto iOS běží jen na zařízeních firmy Apple.'
  zdroj_popisu: nový
  stav: draft
- id: k-asociace-souboru
  nazev: Asociace souborů
  tema: o-systemy-a-bezpecnost
  podoblast: s-software
  vrstva: navazujici
  nadrazeny: k-operacni-system
  stupne:
    zs1: false
    zs2: true
  popis: Asociace souborů je nastavení operačního systému, které určuje, jakým programem se otevře soubor daného typu, obvykle podle přípony v názvu. Výchozí program lze změnit nebo soubor jednorázově otevřít jiným programem, například volbou „Otevřít v programu“. Spustitelné soubory programů se neotevírají v jiné aplikaci, ale přímo se spouštějí. Například soubor .pdf se po dvojitém kliknutí otevře v programu, který je pro PDF nastavený jako výchozí.
  zdroj_popisu: nový
  stav: draft
- id: k-aplikace
  nazev: Aplikace
  tema: o-systemy-a-bezpecnost
  podoblast: s-software
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Aplikace je program určený uživateli k řešení konkrétní úlohy, například k psaní textu, kreslení, výpočtům v tabulce, komunikaci, učení nebo hraní. Na rozdíl od systémového softwaru, jako je operační systém, neslouží k řízení samotného zařízení; aplikace běží na operačním systému a využívá jeho služby. Aplikace se do zařízení instalují, nebo se používají přes webový prohlížeč bez instalace. Pro řešení úlohy je důležité vybrat aplikaci vhodnou pro daný účel. Například prezentaci lze vytvořit v prezentačním programu, kdežto pro úpravu fotografie se hodí grafický editor.
  zdroj_popisu: nový
  stav: draft
- id: k-editor
  nazev: Editor
  tema: o-systemy-a-bezpecnost
  podoblast: s-software
  vrstva: navazujici
  nadrazeny: k-aplikace
  stupne:
    zs1: true
    zs2: false
  popis: Editor je aplikace pro vytváření a úpravy obsahu určitého typu, například textu, obrázků, zvuku nebo videa; podle toho se rozlišuje textový, grafický, zvukový nebo video editor. Na rozdíl od prohlížeče obrázků nebo dokumentů, který obsah jen zobrazí, umožňuje editor obsah měnit a výsledek uložit do souboru. Například v grafickém editoru lze fotografii oříznout, upravit její jas a uložit ji jako nový soubor.
  zdroj_popisu: nový
  stav: draft
- id: k-softwarovy-problem
  nazev: Softwarový problém
  tema: o-systemy-a-bezpecnost
  podoblast: s-software
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Softwarový problém je situace, kdy je zařízení fyzicky v pořádku, ale nefunguje správně kvůli chybě v programu, v jeho nastavení nebo v operačním systému. Může se projevit tak, že program přestane reagovat, nečekaně se ukončí, zobrazí chybové hlášení nebo dělá něco jiného, než uživatel očekává. Obvykle pomůže restart programu nebo zařízení, kontrola nastavení, aktualizace nebo přeinstalace programu; složitější problém je vhodné popsat a předat správci nebo podpoře. Například když se po aktualizaci přestane spouštět jedna aplikace, ale ostatní fungují, jde nejspíš o softwarový problém.
  zdroj_popisu: nový
  stav: draft
- id: k-program-bez-odezvy
  nazev: Program bez odezvy
  tema: o-systemy-a-bezpecnost
  podoblast: s-software
  vrstva: navazujici
  nadrazeny: k-softwarovy-problem
  stupne:
    zs1: false
    zs2: true
  popis: 'Program bez odezvy je program, který přestal reagovat na vstupy uživatele: okno nejde zavřít a tlačítka nefungují. Může to být proto, že čeká na něco, co nepřichází, například na odpověď serveru, zpracovává příliš náročnou úlohu, nebo se zacyklil. Nejprve je dobré chvíli počkat; pokud program nereaguje ani potom, lze ho vynuceně ukončit, ve Windows například ve Správci úloh, a spustit znovu. Neuložená práce se přitom může ztratit.'
  zdroj_popisu: nový
  stav: draft
- id: k-chybne-nastaveni
  nazev: Chybné nastavení
  tema: o-systemy-a-bezpecnost
  podoblast: s-software
  vrstva: navazujici
  nadrazeny: k-softwarovy-problem
  stupne:
    zs1: false
    zs2: true
  popis: Chybné nastavení je stav, kdy zařízení nebo program nefunguje podle očekávání kvůli nevhodně zvolené volbě, ne kvůli chybě v programu. Často jde o drobnost, kterou uživatel změnil omylem nebo zapomněl vrátit, například ztlumený zvuk, špatně zvolenou výchozí tiskárnu, zapnutý režim letadlo nebo nesprávné datum a čas. Například když žáka při videohovoru nikdo neslyší, může mít v aplikaci vybraný jiný mikrofon, než který používá.
  zdroj_popisu: nový
  stav: draft
- id: k-pocitacova-sit
  nazev: Počítačová síť
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Počítačová síť je propojení dvou nebo více zařízení, která si mohou vyměňovat data a sdílet prostředky, například tiskárnu, úložiště nebo připojení k internetu. Zařízení mohou být propojená kabelem nebo bezdrátově a domlouvají se podle společných pravidel, kterým se říká protokoly. Podle rozlohy se rozlišují například lokální sítě v rámci budovy a rozlehlé sítě, které propojují vzdálená místa; největší sítí je internet, který vznikl propojením mnoha dalších sítí. Například ve škole jsou počítače, tiskárny a server propojené do jedné sítě, takže žáci mohou tisknout z kterékoli učebny.
  zdroj_popisu: nový
  stav: draft
- id: k-online-a-offline
  nazev: Online a offline
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: true
    zs2: false
  popis: Online a offline jsou dva stavy zařízení nebo aplikace podle toho, zda jsou připojené k síti. Online znamená, že zařízení je připojené k síti, obvykle k internetu, a může komunikovat s jinými zařízeními a službami; offline pracuje bez připojení. Některé aplikace bez připojení nefungují vůbec, jiné offline fungují omezeně a změny odešlou až po obnovení připojení. Například mapu si lze předem stáhnout do telefonu a používat ji offline, aktuální dopravní informace se ale bez připojení nezobrazí.
  zdroj_popisu: nový
  stav: draft
- id: k-prenos-dat
  nazev: Přenos dat
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Přenos dat je předávání dat mezi zařízeními po kabelu nebo bezdrátově, například pomocí rádiových vln. Jednotlivé způsoby přenosu se liší rychlostí, dosahem, spolehlivostí a spotřebou energie, a proto se pro každou situaci hodí jiný: kabel pro rychlé a stabilní spojení, Wi‑Fi pro připojení v budově, Bluetooth pro propojení zařízení na blízko a mobilní síť pro připojení téměř kdekoli. Například fotografii z telefonu lze do počítače přenést kabelem USB, přes Bluetooth nebo přes cloud.'
  zdroj_popisu: nový
  stav: draft
- id: k-kabelovy-prenos-usb-ethernet
  nazev: Kabelový přenos (USB, ethernet)
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-prenos-dat
  stupne:
    zs1: true
    zs2: true
  popis: Při kabelovém přenosu putují data po kabelu jako elektrické signály, nebo v případě optického kabelu jako světelné impulzy. USB propojuje zařízení na krátkou vzdálenost, například telefon s počítačem nebo tiskárnu s notebookem, a často je zároveň napájí či nabíjí. Ethernet připojuje počítače a další zařízení do lokální sítě síťovým kabelem. Kabelové spojení bývá rychlejší a stabilnější než bezdrátové, zařízení ale nelze volně přenášet.
  zdroj_popisu: nový
  stav: draft
- id: k-wi-fi
  nazev: Wi‑Fi
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-prenos-dat
  stupne:
    zs1: true
    zs2: true
  popis: Wi‑Fi je technologie bezdrátového připojení zařízení k lokální síti pomocí rádiových vln, obvykle s dosahem desítek metrů. Zařízení se připojují k přístupovému bodu nebo routeru, který síť vysílá pod určitým názvem; u zabezpečené sítě chrání přístup heslo a přenášená data se šifrují. Signál slábne se vzdáleností a každou zdí. Například o patro výš může být signál domácího routeru tak slabý, že se video začne sekat.
  zdroj_popisu: nový
  stav: draft
- id: k-bluetooth
  nazev: Bluetooth
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-prenos-dat
  stupne:
    zs1: true
    zs2: true
  popis: Bluetooth je technologie bezdrátového propojení zařízení na krátkou vzdálenost, obvykle do zhruba 10 m. Před prvním použitím se zařízení obvykle musí spárovat, poté se spojí automaticky, kdykoli jsou v dosahu. Bluetooth má nízkou spotřebu energie, a proto se hodí pro malá zařízení na baterie, je ale pomalejší než Wi‑Fi. Například přes Bluetooth se k telefonu připojují bezdrátová sluchátka, chytré hodinky nebo reproduktor.
  zdroj_popisu: nový
  stav: draft
- id: k-mobilni-sit
  nazev: Mobilní síť
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-prenos-dat
  stupne:
    zs1: true
    zs2: true
  popis: Mobilní síť je bezdrátová síť operátora tvořená vysílači (základnovými stanicemi), z nichž každý pokrývá určitou oblast. Umožňuje telefonovat a připojit se k internetu přes mobilní data téměř všude, kde je signál; telefon se do ní přihlašuje pomocí SIM karty. Mobilní sítě se vyvíjejí po generacích, od 2G (GSM) po dnešní rychlejší 4G a 5G. Například při cestě vlakem se telefon postupně přepojuje mezi vysílači, aby se spojení nepřerušilo.
  zdroj_popisu: nový
  stav: draft
- id: k-stahovani-a-nahravani
  nazev: Stahování a nahrávání
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-prenos-dat
  stupne:
    zs1: true
    zs2: false
  poznamka: 'RVP: Činnosti'
  popis: Stahování (download) je přijetí dat ze vzdáleného systému, typicky ze serveru, do vlastního zařízení. Nahrávání (upload) je naopak odeslání dat do vzdáleného systému, například na server nebo jinému uživateli, aby si příjemce uložil jejich kopii. U domácího i mobilního připojení bývá rychlost stahování vyšší než rychlost nahrávání. Například uložení fotografie do cloudu je nahrávání, stažení pracovního listu ze školního úložiště je stahování.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-streamovani
  nazev: Streamování
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-prenos-dat
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Streamování je přenos dat, při kterém se obsah zpracovává a přehrává postupně, zatímco se další části teprve přenášejí. Data tvoří proud (stream), jehož části přicházejí v čase jedna po druhé, podobně jako zboží na běžícím pásu, a nezpracovávají se najednou ve velké dávce. Uživatel tak nemusí čekat na stažení celého souboru, potřebuje ale stálé připojení a přenese velké množství dat. Takto funguje například sledování videí, poslech hudby online nebo živé přenosy.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-klient-a-server
  nazev: Klient a server
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Klient a server je způsob fungování sítě, ve kterém klient o něco žádá a server požadavek vyřizuje a posílá odpověď. Jeden server obvykle obsluhuje mnoho klientů současně a stejný počítač může být pro jednu službu klientem a pro jinou serverem. Odlišným modelem je síť rovnocenných zařízení (peer-to-peer), kde si zařízení vyměňují data přímo mezi sebou bez centrálního serveru. Například prohlížeč (klient) požádá webový server o stránku a ten ji pošle zpět.
  zdroj_popisu: nový
  stav: draft
- id: k-klient
  nazev: Klient
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-klient-a-server
  stupne:
    zs1: false
    zs2: true
  popis: Klient je zařízení nebo program, který se obrací na server s požadavkem na data nebo službu a zpracovává jeho odpověď. Klientem je například webový prohlížeč, e-mailová aplikace nebo aplikace sociální sítě v telefonu. Klient sám většinou neuchovává hlavní data služby, ale získává je od serveru, a proto bez připojení často funguje jen omezeně. Když se například otevře e-mailová aplikace, stáhne ze serveru nově přijaté zprávy.
  zdroj_popisu: nový
  stav: draft
- id: k-server
  nazev: Server
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-klient-a-server
  stupne:
    zs1: true
    zs2: true
  popis: Server je počítač nebo program, který poskytuje data a služby jiným zařízením v síti, například ukládá webové stránky, e-maily nebo soubory. Obvykle běží nepřetržitě a bývá výkonnější a spolehlivější než běžný počítač; servery velkých služeb jsou v datových centrech. Když server nefunguje, je služba nedostupná pro všechny své uživatele najednou. Například školní server může uchovávat sdílené složky tříd, ke kterým se žáci připojují ze svých počítačů.
  zdroj_popisu: nový
  stav: draft
- id: k-lokalni-sit
  nazev: Lokální síť
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Lokální síť (LAN) je počítačová síť v omezeném prostoru, například ve škole, v kanceláři nebo v domácnosti. Zařízení jsou v ní propojená kabelem přes switch nebo bezdrátově přes přístupový bod Wi‑Fi a k internetu se připojují přes router. Lokální síť obvykle spravuje jeden vlastník, který určuje, kdo se k ní smí připojit a co v ní smí dělat. Například ve školní síti mohou žáci tisknout na síťovou tiskárnu a pracovat se sdílenými složkami, i když zrovna nefunguje připojení k internetu.
  zdroj_popisu: nový
  stav: draft
- id: k-switch
  nazev: Switch
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-lokalni-sit
  stupne:
    zs1: false
    zs2: true
  popis: Switch (síťový přepínač) je zařízení, které propojuje kabely více zařízení v lokální síti. Data, která od některého zařízení přijme, posílá jen tomu zařízení, kterému jsou určena, a ne všem ostatním, takže síť zbytečně nezatěžuje. Příjemce pozná podle hardwarové adresy jeho síťové karty (MAC adresy). Například ve školní učebně vedou síťové kabely od všech počítačů do jednoho switche, který je propojuje mezi sebou i se zbytkem sítě.
  zdroj_popisu: nový
  stav: draft
- id: k-pristupovy-bod-wi-fi
  nazev: Přístupový bod Wi‑Fi
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-lokalni-sit
  stupne:
    zs1: false
    zs2: true
  popis: Přístupový bod Wi‑Fi (AP) je zařízení, přes které se bezdrátová zařízení připojují do lokální sítě. Vysílá síť pod určitým názvem a předává data mezi bezdrátovými zařízeními a kabelovou částí sítě. Doma bývá přístupový bod součástí routeru, ve větších budovách se jich používá více, aby signál pokryl všechny místnosti. Například ve škole může být přístupový bod v každé třídě a telefon se při přechodu mezi nimi sám přepojí.
  zdroj_popisu: nový
  stav: draft
- id: k-internet
  nazev: Internet
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Internet je celosvětová síť vzájemně propojených sítí, která pomocí kabelů a bezdrátových spojů, včetně mobilních sítí a satelitů, spojuje miliardy zařízení domácností, škol, firem i úřadů. Zařízení si v něm předávají data v paketech podle společných pravidel (protokolů, zejména TCP/IP), díky kterým si rozumějí zařízení různých výrobců. Internet vznikl z americké sítě ARPANET spuštěné v roce 1969 a dnes na něm běží řada služeb, například web, e-mail, streamování, online hry, cloudové aplikace nebo komunikace chytrých zařízení. Obsah internetu slouží také jako trénovací data pro modely umělé inteligence a část nového obsahu už vytváří AI.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-router
  nazev: Router
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-internet
  stupne:
    zs1: false
    zs2: true
  popis: Router (směrovač) je zařízení, které propojuje různé sítě a pro každý paket určuje, kudy má putovat dál k cíli. Rozhoduje podle cílové IP adresy a tabulky známých cest; internet tvoří obrovské množství routerů, které si pakety předávají. Například domácí router připojuje lokální síť k internetu a často v sobě spojuje i switch, přístupový bod Wi‑Fi a modem, takže všechna zařízení v domácnosti sdílejí jedno připojení.
  zdroj_popisu: nový
  stav: draft
- id: k-ip-adresa
  nazev: IP adresa
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-internet
  stupne:
    zs1: false
    zs2: true
  popis: IP adresa je číselná adresa zařízení v síti, podle které se mu doručují data, podobně jako dopis podle poštovní adresy. Původní podoba (IPv4) se zapisuje jako čtyři čísla od 0 do 255 oddělená tečkami, například 195.113.0.6; protože takových adres nestačí, zavádí se delší podoba IPv6. Zařízení v domácí nebo školní síti mají obvykle místní adresy, například 192.168.1.10, a do internetu vystupují pod společnou veřejnou adresou routeru.
  zdroj_popisu: nový
  stav: draft
- id: k-paket
  nazev: Paket
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-internet
  stupne:
    zs1: false
    zs2: true
  popis: Paket je malá část dat, na kterou se zpráva nebo soubor při přenosu sítí rozdělí. Každý paket nese kromě části dat také adresu odesílatele a příjemce a údaj o svém pořadí; jednotlivé pakety mohou putovat různými cestami a v cíli se znovu složí ve správném pořadí. Pokud se některý paket ztratí, stačí znovu poslat jen jej, ne celou zprávu. Například fotografie poslaná přes chat se rozdělí na stovky až tisíce paketů.
  zdroj_popisu: nový
  stav: draft
- id: k-datove-spoje
  nazev: Datové spoje
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-internet
  stupne:
    zs1: false
    zs2: true
  popis: Datové spoje jsou fyzická spojení, po kterých data mezi zařízeními a sítěmi putují. Patří sem optické kabely, které přenášejí data jako světelné impulzy velkou rychlostí na velké vzdálenosti, metalické kabely vedoucí elektrické signály a rádiové a satelitní spoje. Většinu dat mezi kontinenty přenášejí podmořské optické kabely. Například data ze serveru v USA putují do Evropy nejspíš kabelem po dně Atlantiku.
  zdroj_popisu: nový
  stav: draft
- id: k-role-zarizeni-odesilatel-prijemce
  nazev: Role zařízení (odesílatel, příjemce)
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-internet
  stupne:
    zs1: true
    zs2: false
  popis: 'Při přenosu dat má každé zúčastněné zařízení určitou roli: odesílatel data posílá a příjemce je přijímá. Role nejsou pevně dané – stejné zařízení je jednou odesílatelem a podruhé příjemcem, při videohovoru dokonce obojím současně. Na přenosu se často podílí i server, který data předává dál. Například při poslání zprávy v chatu je odesílatelem telefon pisatele, příjemcem telefon kamaráda a mezi nimi zprávu předává server aplikace.'
  zdroj_popisu: nový
  stav: draft
- id: k-modem
  nazev: Modem
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-internet
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Modem je zařízení, které převádí digitální data do podoby vhodné pro přenosové médium, například telefonní linku nebo kabel kabelové televize, a na druhé straně je převádí zpět. Odesílající modem data zakóduje do nosného signálu (modulace), přijímající modem je z něj opět získá (demodulace); ze spojení modulátor-demodulátor vznikl i jeho název. Například DSL modem umožňuje připojit domácnost k internetu přes telefonní vedení a často bývá součástí domácího routeru.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-web
  nazev: Web
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Web (World Wide Web) je služba internetu tvořená webovými stránkami, které jsou uložené na webových serverech, vzájemně propojené odkazy a zobrazují se v prohlížeči; každá stránka má svou adresu URL. Web a internet nejsou totéž: internet je síť, která data přenáší, web je jednou z mnoha služeb, které na ní běží, vedle e-mailu, chatu nebo online her. Web navrhl v roce 1989 Tim Berners-Lee ve výzkumném středisku CERN. Například zpravodajský portál, e-shop nebo stránky školy jsou součástí webu.'
  zdroj_popisu: nový
  stav: draft
- id: k-webova-stranka
  nazev: Webová stránka
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-web
  stupne:
    zs1: false
    zs2: true
  popis: Webová stránka je dokument na webu, zapsaný obvykle v jazyce HTML, který určuje jeho strukturu, a doplněný o obrázky, styly v CSS, které určují vzhled, a skripty, které zajišťují interaktivitu. Prohlížeč tyto části stáhne ze serveru a sestaví z nich zobrazenou stránku. Více souvisejících stránek pod jednou doménou tvoří webové sídlo (web). Například webové sídlo školy obsahuje samostatné stránky s rozvrhem, jídelníčkem a aktualitami.
  zdroj_popisu: nový
  stav: draft
- id: k-webovy-server
  nazev: Webový server
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-web
  stupne:
    zs1: false
    zs2: true
  popis: Webový server je server, který uchovává webové stránky a další soubory webu a posílá je prohlížečům, které o ně požádají. Komunikuje s nimi podle protokolu HTTP, v šifrované podobě HTTPS. Stránky může posílat hotové, nebo je pro každého návštěvníka sestavit až ve chvíli požadavku, například podle toho, kdo je přihlášený. Například po přihlášení do školního systému webový server sestaví stránku s rozvrhem a známkami právě přihlášeného žáka.
  zdroj_popisu: nový
  stav: draft
- id: k-prohlizec
  nazev: Prohlížeč
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-web
  stupne:
    zs1: true
    zs2: true
  popis: Prohlížeč je aplikace pro zobrazování webových stránek, například Chrome, Firefox, Safari nebo Edge. Po zadání adresy URL nebo kliknutí na odkaz požádá webový server o stránku, stáhne její části a zobrazí ji; zároveň spouští skripty stránky a ukládá historii, záložky a cookies. V prohlížeči dnes běží i mnohé aplikace, například online kancelářské programy nebo školní systémy.
  zdroj_popisu: nový
  stav: draft
- id: k-odkaz
  nazev: Odkaz
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-web
  stupne:
    zs1: false
    zs2: true
  popis: Odkaz (hypertextový odkaz) je prvek webové stránky, obvykle zvýrazněný text, tlačítko nebo obrázek, který po kliknutí otevře jinou stránku, jiné místo na stejné stránce nebo soubor. Obsahuje adresu URL cíle, kterou lze zobrazit najetím myší; text odkazu přitom může slibovat něco jiného, než kam odkaz skutečně vede. Odkazy propojují stránky celého webu v jednu síť. Například články na Wikipedii odkazují na hesla souvisejících pojmů.
  zdroj_popisu: nový
  stav: draft
- id: k-url
  nazev: URL
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-web
  stupne:
    zs1: false
    zs2: true
  popis: URL je adresa konkrétního zdroje na webu, například stránky, obrázku nebo souboru. Skládá se z protokolu (https), názvu serveru, tedy domény, a cesty ke konkrétnímu zdroji na serveru. Například v adrese https://cs.wikipedia.org/wiki/Internet je https protokol, cs.wikipedia.org doména a /wiki/Internet cesta ke stránce. Podle domény v URL lze také ověřit, na jaké stránce se uživatel skutečně nachází.
  zdroj_popisu: nový
  stav: draft
- id: k-vyhledavac
  nazev: Vyhledávač
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-web
  stupne:
    zs1: false
    zs2: true
  popis: Vyhledávač je služba, která pomocí programů zvaných crawleři systematicky prochází web, ukládá obsah nalezených stránek do svého indexu a na dotaz vrací seřazený seznam výsledků, například Google nebo Seznam. Pořadí určují algoritmy podle shody s dotazem, kvality stránky i údajů o uživateli; mezi výsledky bývají i placené odkazy označené jako reklama. Stále častěji výsledky doplňuje i shrnutí vytvořené umělou inteligencí, které může obsahovat chyby.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-webova-infrastruktura
  nazev: Webová infrastruktura
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Webová infrastruktura je soubor služeb a systémů, díky kterým je web dostupný na internetu pod srozumitelnou adresou. Tvoří ji zejména registrace domén, systém doménových jmen (DNS), který jména převádí na IP adresy, a hosting, který poskytuje servery pro uložení webu. Kdo chce zveřejnit vlastní web, potřebuje obvykle všechny tři části: doménu, hosting a nastavení DNS, které doménu propojí se serverem. Například když škola spouští nové stránky, zaregistruje si doménu, pronajme si hosting a v DNS nastaví, na kterém serveru web běží.'
  zdroj_popisu: nový
  stav: draft
- id: k-domena
  nazev: Doména
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-webova-infrastruktura
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Doména (doménové jméno) je srozumitelný název, pod kterým je na internetu dostupný web nebo jiná služba, například e-mail. Části domény se oddělují tečkami a čtou se zprava: nejvyšší úroveň tvoří národní nebo obecná doména, například cz nebo com, a nalevo od ní je jméno, které si vlastník registruje u registrátora na určitou dobu. Například v adrese www.seznam.cz je cz doména nejvyšší úrovně, seznam.cz doména druhého řádu a www její subdoména.'
  zdroj_popisu: nový
  stav: draft
- id: k-dns
  nazev: DNS
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-webova-infrastruktura
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: DNS (systém doménových jmen) je služba internetu, která převádí doménová jména na IP adresy, podobně jako telefonní seznam převádí jména lidí na telefonní čísla. Když uživatel zadá do prohlížeče adresu, zařízení se nejprve zeptá serveru DNS na IP adresu příslušného serveru a teprve pak se k němu připojí. Například bez fungujícího DNS by bylo nutné místo seznam.cz zadávat číselnou IP adresu serveru.
  zdroj_popisu: nový
  stav: draft
- id: k-hosting
  nazev: Hosting
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-webova-infrastruktura
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Hosting je služba, při které poskytovatel pronajímá místo a výkon na svém serveru, aby na něm zákazník mohl uložit soubory webu a web byl nepřetržitě dostupný na internetu. Poskytovatel se stará o provoz, připojení a zabezpečení serveru, zákazník spravuje jen obsah. Hosting může být placený, nebo zdarma s omezeními, například s reklamou nebo menším prostorem: osobním stránkám žáka bezplatný hosting stačí, e-shop potřebuje výkonnější placený.'
  zdroj_popisu: nový
