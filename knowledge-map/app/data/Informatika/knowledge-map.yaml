  - id: programovani-podminky-v-kodu
    nazev: Podmíněný příkaz
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: |-
      Podmíněný příkaz umožňuje řídit průběh programu podle podmínky. Podmínka může být splněna, nebo nesplněna. Výsledek podmínky rozhoduje o tom, které příkazy se vykonají.

      Podmíněný příkaz může obsahovat příkazy pouze pro případ, kdy je podmínka splněna. Pokud podmínka splněna není, tyto příkazy se přeskočí a program pokračuje za podmíněným příkazem.

      Podmíněný příkaz může také obsahovat dvě větve. Jedna se vykoná při splnění podmínky, druhá při jejím nesplnění. Po dokončení zvolené větve program pokračuje za podmíněným příkazem.
    rvp:
      - kod: INF-INF-002-ZV9-007
        vystup: v blokově orientovaném programovacím jazyce vytvoří přehledný program, používá opakování, větvení programu, proměnné
        poznamka: závazné OVU výslovně požaduje větvení programu.
    cile:
      - uroven: porozumeni
        text: Žák chápe, že výsledek podmínky rozhoduje o tom, které příkazy se vykonají. Chápe také, že nesplnění podmínky samo o sobě neznamená ukončení programu.
      - uroven: aplikace
        text: Žák pro konkrétní situaci vyhodnotí podmínku a určí další průběh programu.
      - uroven: analyza
        text: Žák určí chování programu pro oba možné výsledky podmínky a ověří, jak podmíněný příkaz zachází se všemi situacemi, které mohou nastat.
      - uroven: tvorba
        text: Žák vytvoří podmíněný příkaz odpovídající požadovanému chování programu.
    kriteria:
      - text: Žák pro konkrétní situaci určí, zda je podmínka splněna.
      - text: Žák podle výsledku podmínky určí, které příkazy se vykonají, které se přeskočí a kde bude program pokračovat.
      - text: Žák rozliší podmíněný příkaz s jednou větví a podmíněný příkaz se dvěma větvemi a vhodně je použije.
      - text: Žák vytvoří podmínku a podmíněný příkaz odpovídající požadovanému chování programu.
      - text: Žák ověří, že podmíněný příkaz správně zachází se všemi možnými případy, včetně hraničních hodnot.
    duraz: Pokud podmíněný příkaz nemá větev pro nesplněnou podmínku, nesplnění podmínky neznamená ukončení programu. Program pouze přeskočí příkazy určené pro splněnou podmínku a pokračuje dál.
