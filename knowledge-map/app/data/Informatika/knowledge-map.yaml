  - id: programovani-testovani
    nazev: Testování
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: |-
      Testování je záměrné ověřování programu pomocí vhodně zvolených testů. Pro každý test předem určíme vstup nebo situaci a očekávaný výsledek či chování programu. Očekávaný výsledek potom porovnáme se skutečným.

      Jeden úspěšný test nestačí. Volíme různé testy tak, aby zahrnovaly běžné, hraniční i méně obvyklé situace. Vhodný výběr testů zvyšuje šanci, že chyby odhalíme.

      Ani důkladné testování však nezaručuje odhalení všech chyb. Program může obsahovat chybu, která se projeví v situaci, kterou jsme při testování nevyzkoušeli.
    rvp:
      - kod: INF-INF-002-ZV9-008
        vystup: Průběžně ověřuje správnost vytvářeného postupu, zkouší program, opravuje chyby, posoudí efektivitu postupu, programu.
        poznamka: přímá vazba na „zkouší program“. Metodika dále explicitně uvádí testování s různými vstupy včetně neobvyklých a nesprávných.
    cile:
      - uroven: porozumeni
        text: Žák chápe účel testování a rozumí tomu, že úspěšné provedení zvolených testů nezaručuje, že program neobsahuje chybu.
      - uroven: aplikace
        text: Žák provede test a porovná očekávaný výsledek nebo chování programu se skutečným.
      - uroven: analyza
        text: Žák volí různé testy tak, aby ověřil běžné, hraniční i méně obvyklé situace, které mohou při používání programu nastat.
      - uroven: hodnoceni
        text: Žák posoudí, zda zvolená sada testů dostatečně pokrývá různé podstatné situace, a uvědomuje si její omezení.
    kriteria:
      - text: Žák pro test určí vstup nebo situaci a očekávaný výsledek či chování programu.
      - text: Žák provede test a porovná očekávaný výsledek se skutečným.
      - text: Žák zvolí testy zahrnující běžné, hraniční a méně obvyklé situace.
      - text: Žák posoudí, zda zvolená sada testů pokrývá různé podstatné situace, které mohou nastat.
      - text: Žák vysvětlí, proč ani úspěšné provedení všech zvolených testů nezaručuje, že program neobsahuje chybu.
