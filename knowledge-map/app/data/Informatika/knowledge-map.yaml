  - id: programovani-sekvence-prikazu
    nazev: Sekvence příkazů
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: Sekvence je posloupnost příkazů, které se vykonávají v pořadí, v jakém jsou zapsány. Počítač toto pořadí svévolně nemění ani tehdy, když by pro dosažení výsledku bylo možné některé příkazy provést v jiném pořadí. Další příkaz se začne vykonávat až po dokončení předchozího. To platí i tehdy, když vykonávání příkazu trvá delší dobu nebo je jeho součástí čekání po stanovenou dobu.
    rvp:
      - kod: INF-INF-002-ZV9-007
        vystup: v blokově orientovaném programovacím jazyce vytvoří přehledný program, používá opakování, větvení programu, proměnné
        poznamka: metodická podpora výslovně pracuje s programem s více kroky a se správným pořadím kroků.
    cile:
      - uroven: porozumeni
        text: Žák chápe, že příkazy v sekvenci se vykonávají postupně v pořadí určeném zápisem programu a že další příkaz následuje až po dokončení předchozího.
      - uroven: aplikace
        text: Žák sleduje vykonávání sekvence příkazů přesně v pořadí, v jakém jsou příkazy zapsány.
      - uroven: analyza
        text: Žák posoudí, jak změna pořadí příkazů ovlivní průběh nebo výsledek programu.
    kriteria:
      - text: Žák z kódu programu určí pořadí, ve kterém se příkazy vykonají.
      - text: Žák při určování průběhu programu zohlední, že další příkaz začne až po dokončení předchozího, a to i tehdy, když jeho vykonávání určitou dobu trvá.
      - text: Žák posoudí, zda změna pořadí příkazů ovlivní výsledek programu, avšak ví, že příkazy se vždy vykonávají v zapsaném pořadí a program toto pořadí svévolně nemění.
    duraz: |-
      Počítač nevykonává příkazy v pořadí, které se mu „zdá vhodné“. Pořadí je určeno kódem programu, a to i tehdy, když by jiné pořadí vedlo ke stejnému výsledku.

      Tento model popisuje vykonávání příkazů v jedné sekvenci. Program může mít více částí, které se vykonávají současně. Pak nelze obecně určit vzájemné pořadí příkazů z různých současně vykonávaných částí pouze podle jejich zápisu v kódu programu.
