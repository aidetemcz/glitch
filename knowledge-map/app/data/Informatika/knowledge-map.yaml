        text: Žák navrhne vhodnou strukturu, která umožní z nestrukturovaných dat udělat strukturovaná (například na základě textu zapsaného ve větách navrhne tabulku a tu naplní daty získanými z textu)
    kriteria:
      - uroven: porozumeni
        text: Žák uvede aspoň dva příklady ke každému typu dat a popíše, čím se jejich ukládání liší.
      - uroven: analyza
        text: Žák správně zařadí předložené vzorky dat do kategorií strukturovaná a nestrukturovaná.
