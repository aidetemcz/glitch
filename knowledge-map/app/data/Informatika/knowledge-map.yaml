  - id: programovani-promenne-a-datove-typy
    nazev: Proměnná
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: |-
      Proměnná umožňuje v programu uchovávat hodnotu pod určitým názvem. V jednom okamžiku má proměnná právě jednu hodnotu. Při přiřazení nové hodnoty se předchozí hodnota nahradí a již není v proměnné dostupná.

      Název proměnné by měl vystihovat význam hodnoty, kterou v ní chceme uchovávat. Vhodné pojmenování zvyšuje čitelnost kódu programu, ale neurčuje hodnotu proměnné. Hodnota se změní pouze tehdy, když program vykoná příkaz, který ji nastaví nebo změní.

      Hodnoty mohou být různých typů, například číslo nebo text. Typ hodnoty ovlivňuje, jaké operace lze s hodnotou provádět.
    rvp:
      - kod: INF-INF-002-ZV9-007
        vystup: v blokově orientovaném programovacím jazyce vytvoří přehledný program, používá opakování, větvení programu, proměnné
        poznamka: proměnné jsou přímo součástí závazného OVU. Metodika dále požaduje nastavení počátečních hodnot, průběžné změny a využívání hodnot proměnných.
    cile:
      - uroven: porozumeni
        text: Žák chápe rozdíl mezi názvem proměnné a její aktuální hodnotou. Chápe, že název vyjadřuje význam proměnné, ale nezajišťuje, že její hodnota bude tomuto významu odpovídat nebo se podle něj automaticky aktualizovat.
      - uroven: porozumeni
        text: Žák chápe, že proměnná má v jednom okamžiku právě jednu hodnotu. Při nastavení nové hodnoty se předchozí hodnota nahradí.
      - uroven: aplikace
        text: Žák pomocí příkazů nastaví, použije a změní hodnotu proměnné.
      - uroven: analyza
        text: Žák podle vykonávaných příkazů sleduje změny hodnoty proměnné a určí její hodnotu v konkrétním okamžiku.
      - uroven: tvorba
        text: Žák použije vhodně pojmenovanou proměnnou k uchování hodnoty potřebné při běhu programu.
    kriteria:
      - text: Žák z kódu programu určí aktuální hodnotu proměnné.
      - text: Žák pomocí příkazů nastaví počáteční hodnotu proměnné a podle potřeby ji během programu mění.
      - text: Žák použije hodnotu proměnné v dalších příkazech nebo podmínkách.
      - text: Žák pojmenuje proměnnou tak, aby název vystihoval význam uchovávané hodnoty a zvyšoval čitelnost kódu programu.
      - text: Žák rozlišuje alespoň číselné a textové hodnoty a pracuje s nimi odpovídajícím způsobem.
    duraz: Název proměnné neurčuje její hodnotu ani nezajišťuje její automatickou aktualizaci. Například proměnná pojmenovaná `pocetBodu` nebude sama sledovat počet získaných bodů. Kód programu musí zajistit, aby byla její hodnota ve správných okamžicích nastavena nebo změněna.
    prerekvizity:
      - programovani-cyklus-s-podminkou
