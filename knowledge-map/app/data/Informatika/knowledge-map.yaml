  - id: programovani-uzivatelske-rozhrani
    nazev: Uživatelské rozhraní
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: |-
      Uživatelské rozhraní je způsob, kterým uživatel komunikuje s programem. Umožňuje uživateli zadávat vstupy, ovládat program a získávat jeho výstupy. Při návrhu uživatelského rozhraní je důležité dívat se na program z pohledu jeho uživatele.

      Uživatelské rozhraní lze pro stejný program navrhnout různými způsoby. Jednotlivé varianty mohou mít různé výhody a nevýhody. Při návrhu uživatelského rozhraní je třeba zohlednit různé skupiny uživatelů a jejich potřeby.

      Uživatelské rozhraní by mělo být navrženo tak, aby uživatel poznal, co může udělat, jak to má udělat a co se po jeho akci stalo. Program by měl uživateli poskytovat srozumitelnou zpětnou vazbu a vhodně reagovat i na neočekávané nebo méně obvyklé vstupy.

      Při návrhu programu je třeba uvažovat také o tom, jaké důsledky může mít jeho použití pro uživatele, včetně použití, které neodpovídá původnímu účelu programu.
    rvp:
      - kod: INF-INF-002-ZV9-007
        vystup: v blokově orientovaném programovacím jazyce vytvoří přehledný program, používá opakování, větvení programu, proměnné
        poznamka: metodická podpora požaduje uživatelsky přívětivé programy a zvažování dopadů programů na jejich uživatele.
      - kod: INF-INF-002-ZV9-008
        vystup: Průběžně ověřuje správnost vytvářeného postupu, zkouší program, opravuje chyby, posoudí efektivitu postupu, programu.
        poznamka: metodika požaduje testování prototypů s uživateli za účelem ověřování a zlepšování použitelnosti.
    cile:
      - uroven: porozumeni
        text: Žák chápe uživatelské rozhraní jako způsob komunikace mezi uživatelem a programem. Chápe, že při jeho návrhu je potřeba uvažovat z pohledu uživatele.
      - uroven: analyza
        text: Žák porovná různé možnosti uživatelského rozhraní a pojmenuje jejich výhody a nevýhody s ohledem na způsob použití programu a jeho uživatele.
      - uroven: hodnoceni
        text: Žák posoudí uživatelské rozhraní z pohledu uživatele, zohlední cílovou skupinu uživatelů a možné důsledky použití programu a zdůvodní, v čem jsou různé možnosti řešení vhodné nebo nevhodné.
      - uroven: tvorba
        text: Žák navrhne a vytvoří jednoduché uživatelské rozhraní odpovídající účelu programu a cílové skupině uživatelů.
    kriteria:
      - text: Žák v programu rozpozná prvky, kterými uživatel zadává vstupy a ovládá program, a prvky, kterými program poskytuje výstupy.
      - text: Žák diskutuje různé možnosti uživatelského rozhraní, pojmenuje jejich výhody a nevýhody a posoudí jejich vhodnost pro různé skupiny uživatelů.
