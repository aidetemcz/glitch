    popis: Obrázek, text, video, hudba — každý soubor má typ a ten poznáš podle přípony (jpg, pdf, mp4). Podle typu se vybírá program, který soubor otevře. Počítač i mobil přípony často skrývají, aby nepletly; zobrazit se dají v nastavení.
