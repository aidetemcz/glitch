  - id: programovani-cykly-v-kodu
    nazev: Opakování s pevným počtem opakování
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: |-
      Pokud se má určitá činnost provést vícekrát, lze použít cyklus. Příkazy, které se v cyklu vykonávají, tvoří tělo cyklu.

      U opakování s pevným počtem je počet opakování určen před zahájením vykonávání cyklu. Při každém průchodu cyklem se vykoná celé jeho tělo.

      Použití cyklu umožňuje zapsat opakující se činnost pouze jednou místo vícenásobného zápisu stejných nebo odpovídajících příkazů.
    rvp:
      - kod: INF-INF-002-ZV9-007
        vystup: v blokově orientovaném programovacím jazyce vytvoří přehledný program, používá opakování, větvení programu, proměnné
        poznamka: opakování je přímo součástí závazného OVU; metodika explicitně uvádí opakování s pevným počtem.
    cile:
      - uroven: porozumeni
        text: Žák chápe, která část kódu programu tvoří tělo cyklu, a rozumí tomu, co určuje počet jeho vykonání.
      - uroven: aplikace
        text: Žák určí průběh programu obsahujícího cyklus s pevným počtem opakování.
      - uroven: analyza
        text: Žák v zadání rozpozná činnost, která se má vícekrát provést a je vhodné ji řešit pomocí cyklu.
      - uroven: tvorba
        text: Žák vytvoří cyklus s vhodným tělem a počtem opakování.
    kriteria:
      - text: Žák z kódu programu určí tělo cyklu a počet jeho vykonání.
      - text: Žák určí pořadí vykonávání příkazů v programu obsahujícím cyklus.
      - text: Žák v zadání rozpozná činnost, kterou je vhodné řešit pomocí cyklu, a určí příkazy tvořící jeho tělo.
      - text: Žák upraví uspořádání příkazů tak, aby bylo možné vhodnou část kódu programu nahradit cyklem.
      - text: Žák vytvoří cyklus s takovým počtem opakování, aby program dosáhl požadovaného výsledku.
    duraz: |-
      Opakující se činnost nemusí být v již zapsaném kódu programu na první pohled patrná. Vhodné použití cyklu vychází především z rozpoznání struktury řešeného problému, nikoli jen z hledání několikrát za sebou zapsaných stejných příkazů.

      Při návrhu programu může být potřeba příkazy vhodně uspořádat, aby činnost, která se má provádět vícekrát, tvořila souvislé tělo cyklu.
    prerekvizity:
      - programovani-funkce-a-procedury
    souvisi: []
    tagy:
      - teoretický základ
    zdroj:
      - RVP_revidované_2024-03-28.pdf, s. 54–55
      - 'Garant: Hnízdo Programování (2026-10)'
    pokryti_glitchem: []
    stav: garant
  - id: programovani-funkce-a-procedury
    nazev: Podprogram (bez parametrů)
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: |-
      Podprogram je pojmenovaná část kódu programu, která obsahuje příkazy pro určitou ucelenou činnost.

      Název podprogramu by měl vystihovat jeho činnost, aby bylo možné poznat, co má program v daném místě udělat, aniž bychom museli zkoumat příkazy uvnitř podprogramu. Podprogram lze volat z různých míst programu. Pomocí podprogramů můžeme program rozdělit na menší, srozumitelně pojmenované části a stejný kód nemusíme zapisovat na více místech.

      Použití podprogramů zvyšuje čitelnost kódu programu a usnadňuje jeho úpravy. Pokud je potřeba danou činnost změnit, upravíme podprogram na jednom místě a změna se projeví při všech jeho voláních.
    rvp:
      - kod: INF-INF-002-ZV9-007
        vystup: v blokově orientovaném programovacím jazyce vytvoří přehledný program, používá opakování, větvení programu, proměnné
        poznamka: metodická podpora výslovně uvádí podprogramy, opakované využívání hotových částí kódu a vhodné pojmenování podprogramů.
    cile:
      - uroven: porozumeni
        text: Žák chápe vztah mezi definicí podprogramu a jeho voláním a určí, které příkazy se při volání podprogramu vykonají.
      - uroven: porozumeni
        text: Žák vysvětlí účel podprogramu – co podprogram dělá – bez popisu jednotlivých příkazů, kterými je činnost realizována.
      - uroven: porozumeni
        text: Žák chápe význam vhodného pojmenování podprogramů pro členění a čitelnost kódu programu.
      - uroven: aplikace
        text: Žák použije vytvořený podprogram na vhodných místech programu.
      - uroven: analyza
        text: Žák rozpozná části kódu programu, které je vhodné vyčlenit do samostatného podprogramu, a určí jejich společný účel.
      - uroven: tvorba
        text: Žák rozdělí program na vhodné podprogramy pro jednotlivé ucelené činnosti a pojmenuje je tak, aby jejich názvy vystihovaly jejich účel.
    kriteria:
      - text: Žák v kódu programu rozliší definici podprogramu a jeho volání.
      - text: Žák určí, které příkazy se při volání podprogramu vykonají a kde bude program po jeho dokončení pokračovat.
      - text: Žák vlastními slovy popíše, co podprogram dělá, aniž by pouze převyprávěl jednotlivé příkazy jeho definice.
      - text: Žák podle účelu podprogramu navrhne výstižný název.
      - text: Žák rozpozná části kódu programu, které je vhodné vyčlenit do podprogramu, a nahradí je jeho voláním.
      - text: Žák vysvětlí, proč vhodné použití a pojmenování podprogramů zvyšuje čitelnost a usnadňuje úpravy kódu programu.
      - text: Žák při změně požadované činnosti upraví její definici v podprogramu, místo aby prováděl stejnou změnu na všech místech jeho použití.
    duraz: |-
      Podprogram představuje ucelenou činnost, kterou můžeme pojmenovat a používat jako celek. Při čtení programu proto nemusíme pokaždé sledovat, jak je tato činnost provedena; pro pochopení struktury programu často stačí vědět, co daný podprogram dělá.

      Podprogramy tak neslouží jen ke zkrácení kódu programu. Umožňují program rozčlenit na smysluplné části, zpřehlednit jej a usnadnit jeho pozdější změny.
