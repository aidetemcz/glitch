    stav: garant
  - id: programovani-efektivita
    nazev: Efektivita
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: |-
      Stejnou úlohu lze často naprogramovat různými způsoby. Jednotlivá řešení mohou vést ke stejnému výsledku, ale lišit se například množstvím vykonávaných činností, složitostí, čitelností nebo snadností dalších úprav.

      Jedním z hledisek efektivity je množství činností, které program vykoná, aby dosáhl požadovaného výsledku. Dvě řešení mohou vést ke stejnému výsledku, ale jedno může například provést méně příkazů, použít kratší cestu k cíli nebo se vyhnout činnostem, které pro dosažení výsledku nejsou potřeba.

      Délka kódu programu sama o sobě neurčuje jeho efektivitu. Kratší zápis nemusí znamenat, že program při svém běhu vykoná méně činností.

      Při posuzování řešení zohledňujeme také čitelnost kódu programu a snadnost jeho dalších úprav. Jednodušší a přehlednější řešení se obvykle snáze kontroluje, upravuje a opravuje.

      Neexistuje vždy jedno nejlepší řešení. Při porovnávání různých řešení záleží na účelu programu a na tom, co je v dané situaci důležité.
    rvp:
      - kod: INF-INF-002-ZV9-008
        vystup: Průběžně ověřuje správnost vytvářeného postupu, zkouší program, opravuje chyby, posoudí efektivitu postupu, programu.
        poznamka: závazný OVU přímo požaduje, aby žák posoudil efektivitu postupu a programu. Metodika pracuje s hodnocením efektivity, hledáním vylepšení a porovnáváním různých řešení.
    cile:
      - uroven: porozumeni
        text: Žák chápe, že stejnou úlohu lze naprogramovat různými způsoby a že řešení se mohou lišit svou efektivitou a dalšími vlastnostmi.
      - uroven: porozumeni
        text: Žák chápe rozdíl mezi délkou kódu programu a množstvím činností, které program při svém běhu skutečně vykoná.
      - uroven: analyza
        text: Žák porovná různá řešení stejné úlohy a rozpozná rozdíly v množství vykonávaných činností, čitelnosti a snadnosti dalších úprav.
      - uroven: hodnoceni
        text: Žák posoudí výhody a nevýhody různých řešení a zdůvodní, které vlastnosti řešení jsou v dané situaci důležité.
      - uroven: tvorba
        text: Žák upraví řešení tak, aby odstranil zbytečné činnosti nebo zbytečně složitý zápis a zachoval jeho srozumitelnost.
    kriteria:
      - text: Žák porovná dvě řešení stejné úlohy a pojmenuje jejich podstatné rozdíly.
      - text: Žák porovná řešení podle množství činností, které program při svém běhu vykoná, například podle počtu vykonaných příkazů nebo délky cesty k cíli.
      - text: Žák v programu rozpozná činnosti, které nejsou pro dosažení požadovaného výsledku potřeba, a navrhne jejich odstranění.
      - text: Žák rozlišuje mezi délkou zápisu kódu programu a množstvím vykonávaných činností.
      - text: Žák při posuzování řešení zohlední také čitelnost kódu programu a snadnost jeho dalších úprav.
      - text: Žák porovná výhody a nevýhody různých řešení a svou volbu vzhledem k dané situaci zdůvodní.
    prerekvizity:
      - programovani-overovani
    souvisi: []
    tagy:
      - praktická dovednost
    zdroj:
      - 'Garant: Hnízdo Programování (2026-10)'
