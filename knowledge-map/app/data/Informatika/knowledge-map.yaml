  - id: data-databaze-statisticka-gramotnost
    nazev: Statistická gramotnost
    tema: data-databaze
    oblast: data-modelovani
    kompetence: kdi-dat
    vrstva: navazujici
    popis: 'Aby tě čísla nezmátla: korelace (dvě věci jdou spolu) neznamená kauzalitu (jedna způsobuje druhou), malý nebo nereprezentativní vzorek klame a graf jde snadno „natáhnout" k požadovanému závěru. Klíčová občanská dovednost.'
    rvp:
      - kod: INF-INF-001-ZV9-001
        vystup: získá z dat informace, interpretuje data získaná pro řešení konkrétního problému
    cile:
      - uroven: porozumeni
        text: Žák na příkladu vysvětlí rozdíl mezi korelací a kauzalitou.
        rocnik: 9
      - uroven: hodnoceni
        text: Žák posoudí u předloženého tvrzení, zda ho nezkresluje malý či nereprezentativní vzorek nebo záměna korelace a kauzality.
        rocnik: 9
    kriteria:
      - uroven: porozumeni
        text: Žák uvede příklad dvou jevů, které spolu souvisejí, aniž jeden způsobuje druhý.
      - uroven: hodnoceni
        text: Žák u tvrzení opřeného o statistiku pojmenuje aspoň jedno riziko zkreslení závěru.
    prerekvizity:
      - data-databaze-vizualizace-a-volba-grafu
    souvisi: []
    tagy:
      - důvěra a ověřování
      - férovost a předpojatost
      - teoretický základ
    zdroj:
      - RVP_revidované_2024-03-28.pdf, s. 54–55
      - 'Garant: Hnízdo Data, Lenka Blehová (2026-10)'
    pokryti_glitchem: []
    stav: hotovo
  - id: data-databaze-cisteni-realnych-dat
    nazev: Čištění reálných dat
    tema: data-databaze
    oblast: informacni-systemy
    kompetence: kdi-dat
    vrstva: navazujici
    popis: Skutečná data jsou „špinavá" — chybí hodnoty, opakují se, jsou v různých formátech. Jejich úklid zabere většinu práce a je nudný, ale bez něj vyjde ze sebelepší analýzy nesmysl.
    rvp:
      - kod: INF-INF-003-ZV9-011
        vystup: v evidenci dat nastavuje zobrazení dat a používá funkce pro automatické zpracování dat s cílem řešit potřeby uživatelů
    cile:
      - uroven: porozumeni
        text: Žák dokáže vyjmenovat, jaké typy nečistot se v datech mohou vyskytovat a co je tedy vhodné kontrolovat.
      - uroven: analyza
        text: Žák v reálné (špinavé) sadě dat najde chyby jako chybějící hodnoty, duplicity a různé formáty zápisu.
        rocnik: 9
      - uroven: aplikace
        text: Žák upraví zadanou tabulku tak, aby měla ve sloupcích jednotný formát a byla bez duplicit.
        rocnik: 9
    kriteria:
      - uroven: analyza
        text: Žák v ukázkových datech označí aspoň tři typy nečistot.
      - uroven: aplikace
        text: Žák výsledná tabulka je bez duplicit a hodnoty v každém sloupci mají jednotný formát.
    prerekvizity:
      - data-databaze-datovy-cyklus
