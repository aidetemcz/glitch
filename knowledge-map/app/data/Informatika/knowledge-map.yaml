      - kod: INF-INF-002-ZV9-007
        vystup: v blokově orientovaném programovacím jazyce vytvoří přehledný program, používá opakování, větvení programu, proměnné
        poznamka: metodická podpora výslovně požaduje různé formy opakování, zejména opakování s pevným počtem a opakování s ukončovací podmínkou.
    cile:
      - uroven: porozumeni
        text: Žák chápe, že podmínka řídí vykonávání cyklu a že počet vykonání těla cyklu nemusí být předem znám.
      - uroven: porozumeni
        text: Žák chápe, že o průběhu cyklu rozhoduje výsledek podmínky v okamžiku jejího vyhodnocení.
      - uroven: aplikace
        text: Žák určí průběh programu obsahujícího cyklus s podmínkou.
      - uroven: analyza
        text: Žák sleduje změny hodnot ovlivňujících podmínku a určí, jak se projeví při dalším vyhodnocení podmínky.
      - uroven: tvorba
        text: Žák vytvoří cyklus s podmínkou pro situaci, ve které počet vykonání těla cyklu není předem znám.
    kriteria:
      - text: Žák v kódu programu určí tělo cyklu a podmínku, která cyklus řídí.
      - text: Žák pro konkrétní hodnoty vyhodnotí podmínku a určí další průběh cyklu.
      - text: Žák určí, kdy se podmínka vyhodnocuje, a podle výsledku podmínky v tomto okamžiku určí, jak bude cyklus pokračovat.
      - text: Žák rozpozná situaci, kdy se tělo cyklu neprovede ani jednou.
      - text: Žák rozliší situace vhodné pro cyklus s pevným počtem opakování a pro cyklus s podmínkou.
      - text: Žák vytvoří cyklus s podmínkou odpovídající zadané situaci.
      - text: Žák rozpozná případ, kdy cyklus nemusí skončit.
    duraz: Změna hodnoty během vykonávání těla cyklu neznamená okamžité nové vyhodnocení podmínky. O průběhu cyklu rozhoduje výsledek podmínky v okamžiku jejího vyhodnocení.
