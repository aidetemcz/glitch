- id: k-cloud
  nazev: Cloud
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Cloud (česky „mrak“) je souhrn služeb, které umožňují ukládat soubory a používat programy na serverech poskytovatele přes internet, odkudkoli a z jakéhokoli zařízení. Za cloudem se skrývají datová centra – haly plné nepřetržitě běžících serverů velkých technologických firem, které spotřebovávají hodně elektřiny a vody na chlazení. Cloudové služby se dělí na hotové aplikace (SaaS), prostředí pro vývoj aplikací (PaaS) a pronájem serverů a úložišť (IaaS). V cloudu běží i chatboti s velkými jazykovými modely, jako je ChatGPT, a v datových centrech se tyto modely také trénují. Například fotografie uložená „do cloudu“ se přenese na disk v datovém centru, často vzdáleném tisíce kilometrů.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-cloudove-uloziste
  nazev: Cloudové úložiště
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-cloud
  stupne:
    zs1: true
    zs2: true
  popis: Cloudové úložiště je služba pro ukládání souborů na serverech poskytovatele, například Google Disk, OneDrive, iCloud nebo Dropbox. Soubory lze otevírat z různých zařízení, synchronizovat mezi nimi a sdílet s ostatními; kapacita zdarma bývá omezená. Uživatel přitom svěřuje data cizí firmě, a měl by proto znát její podmínky. Například žák uloží rozpracovanou prezentaci ve škole na cloudové úložiště a doma na ní pokračuje na jiném počítači.
  zdroj_popisu: nový
  stav: draft
- id: k-cloudova-aplikace
  nazev: Cloudová aplikace
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-cloud
  stupne:
    zs1: false
    zs2: true
  popis: Cloudová aplikace je aplikace, která běží na serverech poskytovatele a používá se přes webový prohlížeč nebo jednoduchou aplikaci v telefonu, například Google Dokumenty nebo Canva. Výpočty i data jsou v cloudu, takže aplikaci není nutné instalovat ani aktualizovat a lze s ní pracovat z různých zařízení; bez připojení ale funguje jen omezeně, nebo vůbec. Například grafiku vytvořenou v online editoru lze otevřít na školním počítači i na telefonu doma.
  zdroj_popisu: nový
  stav: draft
- id: k-sdileny-dokument
  nazev: Sdílený dokument
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-cloud
  stupne:
    zs1: true
    zs2: false
  popis: Sdílený dokument je dokument uložený v cloudu, se kterým může pracovat více lidí najednou, každý ze svého zařízení. Změny se ukládají průběžně a ostatní je vidí téměř okamžitě; historie verzí ukazuje, kdo co změnil, a umožňuje vrátit starší verzi. Vlastník dokumentu určuje, kdo ho smí jen číst, komentovat nebo upravovat, a může sdílení kdykoli zrušit. Například skupina žáků může společně psát referát, ve kterém každý zpracovává jinou kapitolu.
  zdroj_popisu: nový
  stav: draft
- id: k-komunikacni-platformy
  nazev: Komunikační platformy
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  poznamka: '2. st.: jen sociální sítě'
  popis: Komunikační platformy jsou služby, které lidem umožňují komunikovat přes internet textem, hlasem, obrazem nebo sdíleným obsahem, například e-mail, chat, videokonference, sociální sítě nebo diskusní fóra. Liší se tím, zda komunikace probíhá v reálném čase, kolik lidí se jí účastní, kdo ji může vidět a jak dlouho zůstává dostupná. Pro každou situaci se hodí jiný nástroj a s každým se pojí jiná pravidla slušného a bezpečného chování. Například omluvu z vyučování je vhodné poslat e-mailem nebo přes školní systém, zatímco rychlou domluvu se spolužáky usnadní skupinový chat.
  zdroj_popisu: nový
  stav: draft
- id: k-e-mail
  nazev: E‑mail
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-komunikacni-platformy
  stupne:
    zs1: true
    zs2: false
  popis: E-mail (elektronická pošta) je služba pro posílání zpráv na e-mailovou adresu ve tvaru jméno@doména. Zprávy ukládá poštovní server a příjemce si je může přečíst kdykoli později v e-mailové aplikaci nebo v prohlížeči; komunikace je tedy asynchronní. Ke zprávě lze připojit přílohu a poslat ji více příjemcům najednou. Jméno i adresu odesílatele lze podvrhnout, a proto je u neočekávaných zpráv s odkazy nebo přílohami namístě opatrnost.
  zdroj_popisu: nový
  stav: draft
- id: k-chat
  nazev: Chat
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-komunikacni-platformy
  stupne:
    zs1: true
    zs2: false
  popis: Chat je výměna krátkých textových zpráv, obvykle téměř v reálném čase, mezi dvěma lidmi nebo ve skupině. Kromě textu umožňuje posílat obrázky, hlasové zprávy, emoji nebo soubory a často ukazuje, zda si příjemce zprávu přečetl. Zprávy zůstávají uložené v historii konverzace a příjemce si je může uložit nebo přeposlat dál. Například třída může mít skupinový chat pro domluvu na školním výletě.
  zdroj_popisu: nový
  stav: draft
- id: k-videokonference
  nazev: Videokonference
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-komunikacni-platformy
  stupne:
    zs1: true
    zs2: false
  popis: Videokonference je hovor s obrazem a zvukem mezi dvěma nebo více účastníky přes internet, například v aplikaci Teams, Zoom nebo Google Meet. Účastníci se vidí a slyší v reálném čase a mohou sdílet obrazovku nebo psát do chatu. Kvalitu hovoru ovlivňuje rychlost připojení a je dobré myslet i na to, co je v pozadí vidět a slyšet. Například při online výuce učitel sdílí prezentaci a žáci kladou otázky přes mikrofon nebo chat.
  zdroj_popisu: nový
  stav: draft
- id: k-socialni-sit
  nazev: Sociální síť
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-komunikacni-platformy
  stupne:
    zs1: false
    zs2: true
  popis: Sociální síť je platforma, na které mají uživatelé svůj profil, sdílejí obsah a sledují ostatní, například Instagram nebo TikTok. Co uživatel uvidí ve svém přehledu (feedu), do velké míry vybírá doporučovací algoritmus podle jeho dřívějšího chování, obvykle s cílem, aby na platformě strávil co nejvíce času. Většina velkých sociálních sítí vyžaduje podle svých pravidel věk alespoň 13 let. Například po několika zhlédnutých videích o fotbale nabízí aplikace další podobná.
  zdroj_popisu: nový
  stav: draft
- id: k-diskusni-forum
  nazev: Diskusní fórum
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-komunikacni-platformy
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Diskusní fórum je webové místo, kde lidé vedou písemné diskuse rozdělené podle témat do vláken. Příspěvky zůstávají uložené a dostupné, takže na ně lze odpovídat i po dnech nebo letech a vyhledávat v nich řešení dřívějších dotazů. Na dodržování pravidel obvykle dohlížejí moderátoři, kteří mohou nevhodné příspěvky skrýt nebo smazat. Například na fóru o programování lze najít odpověď na chybové hlášení, se kterým se už dříve potýkal někdo jiný.
  zdroj_popisu: nový
  stav: draft
- id: k-synchronni-a-asynchronni-komunikace
  nazev: Synchronní a asynchronní komunikace
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: navazujici
  nadrazeny: k-komunikacni-platformy
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Synchronní komunikace probíhá v reálném čase a účastníci jsou přítomni současně, například při videokonferenci nebo telefonátu. Asynchronní komunikace současnou přítomnost nevyžaduje: příjemce odpoví, až bude mít čas, například u e-mailu nebo diskusního fóra. Chat může být obojím podle toho, zda účastníci odpovídají hned, nebo později. Asynchronní komunikace dává čas na rozmyšlení odpovědi, synchronní umožňuje rychlou domluvu.'
  zdroj_popisu: nový
  stav: draft
- id: k-porucha-pripojeni
  nazev: Porucha připojení
  tema: o-systemy-a-bezpecnost
  podoblast: s-site-a-internet
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  poznamka: '1. st.: Činnosti'
  popis: 'Porucha připojení je stav, kdy se zařízení nemůže připojit k síti nebo k internetu, případně ke konkrétní službě. Příčina může být v zařízení (vypnutá Wi‑Fi, zapnutý režim letadlo, špatně zadané heslo), v místní síti (slabý signál, nefunkční router) nebo mimo ni (výpadek u poskytovatele, nedostupný server). Při řešení je dobré postupovat od nejbližší příčiny: zkontrolovat nastavení a signál, vyzkoušet jinou stránku nebo zařízení a případně restartovat zařízení či router. Například když nefunguje jen jedna aplikace, ale ostatní stránky se načítají, problém je nejspíš na straně serveru dané služby.'
  zdroj_popisu: nový
  stav: draft
- id: k-bezpecnostni-riziko
  nazev: Bezpečnostní riziko
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Bezpečnostní riziko je možnost, že dojde ke škodě na datech, zařízeních nebo lidech. Velikost rizika závisí na tom, jak je škoda pravděpodobná a jak závažná by byla; ochranná opatření se proto volí podle toho, co je v sázce. U dat se rozlišuje riziko jejich ztráty, poškození a zneužití, kterým odpovídá ochrana jejich dostupnosti, neporušenosti a důvěrnosti. Ke škodě může vést útok, ale stejně tak porucha nebo lidská chyba. Například ztráta neuložené domácí úlohy je pravděpodobná, ale méně závažná než zneužití hesla k e-mailu, přes který lze obnovit přístup k dalším účtům.
  zdroj_popisu: nový
  stav: draft
- id: k-ztrata-dat
  nazev: Ztráta dat
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-bezpecnostni-riziko
  stupne:
    zs1: true
    zs2: true
  popis: Ztráta dat je situace, kdy data přestanou být dostupná, například po poruše disku, ztrátě nebo krádeži telefonu, nechtěném smazání, přepsání souboru nebo útoku ransomwaru. Riziko se zvyšuje, když jsou data uložená jen na jednom místě. Proti ztrátě chrání hlavně pravidelná záloha a průběžné ukládání práce. Například kdo má fotografie jen v telefonu, po jeho ztrátě o ně přijde, pokud je předtím nezálohoval do cloudu nebo do počítače.
  zdroj_popisu: nový
  stav: draft
- id: k-poskozeni-dat
  nazev: Poškození dat
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-bezpecnostni-riziko
  stupne:
    zs1: true
    zs2: true
  popis: Poškození dat je situace, kdy jsou data změněná, neúplná nebo nečitelná, takže už neodpovídají původnímu stavu. Může vzniknout chybou při ukládání nebo přenosu, například při vytažení flash disku během zápisu, vadou úložiště, chybou programu, škodlivým softwarem nebo nechtěnou úpravou. Poškozený soubor často nejde otevřít, nebo se otevře s chybami. Například fotografie poškozená při kopírování se může zobrazit jen zčásti nebo s barevnými pruhy.
  zdroj_popisu: nový
  stav: draft
- id: k-zneuziti-dat
  nazev: Zneužití dat
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-bezpecnostni-riziko
  stupne:
    zs1: true
    zs2: true
  popis: Zneužití dat je situace, kdy data použije někdo bez oprávnění nebo k jinému účelu, než pro který byla poskytnuta. Mohou to být přihlašovací údaje, osobní údaje, fotografie nebo soukromé zprávy, které někdo získá a použije k podvodu, krádeži identity, vydírání nebo zesměšnění. Na rozdíl od ztráty dat vlastník o data nepřijde a o zneužití nemusí ani vědět. Například fotografie poslaná jen kamarádovi může být bez svolení přeposlána dalším lidem.
  zdroj_popisu: nový
  stav: draft
- id: k-zaloha
  nazev: Záloha
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Záloha je kopie důležitých dat uložená jinde než originál, například na externím disku nebo v cloudovém úložišti. Při ztrátě nebo poškození dat umožní jejich obnovu, proto je potřeba zálohovat pravidelně a občas ověřit, že lze data ze zálohy skutečně obnovit. Osvědčené je pravidlo 3-2-1: tři kopie dat na dvou různých typech úložiště, z nichž jedna je uložená na jiném místě. Samotná synchronizace s cloudem nemusí být zálohou, protože smazání nebo zašifrování souboru se může přenést i do cloudu. Například fotografie z telefonu se mohou automaticky zálohovat do cloudu a jednou za čas i na externí disk.'
  zdroj_popisu: nový
  stav: draft
- id: k-autentizace
  nazev: Autentizace
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Autentizace je ověření, že uživatel je skutečně tím, za koho se vydává, například při přihlášení k účtu nebo odemčení telefonu. Může se opírat o něco, co uživatel zná (heslo, PIN), co má (telefon, čipová karta), nebo čím je (otisk prstu, obličej); spojení dvou různých druhů je dvoufaktorové ověření. Od autentizace se odlišuje autorizace, tedy rozhodnutí, co smí ověřený uživatel dělat. Například po přihlášení do školního systému autentizace ověří, že jde o konkrétního žáka, a jeho přístupová práva určí, že vidí jen své známky.
  zdroj_popisu: nový
  stav: draft
- id: k-heslo-pin-a-gesto
  nazev: Heslo, PIN a gesto
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-autentizace
  stupne:
    zs1: true
    zs2: true
  popis: 'Heslo, PIN a gesto jsou tajné údaje, kterými uživatel prokazuje svou totožnost: heslo je řetězec znaků, PIN krátký číselný kód a gesto obrazec, který se tahem prstu spojí z bodů na displeji. Silné heslo je dlouhé, nedá se uhodnout ani odvodit z osobních údajů a pro každý účet je jiné. Například heslo „Pes2012“ útočník snadno uhodne, kdežto spojení několika náhodných slov, jako „kopec-lampa-žirafa-déšť“, je mnohem silnější a dá se zapamatovat.'
  zdroj_popisu: nový
  stav: draft
- id: k-biometrie
  nazev: Biometrie
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-autentizace
  stupne:
    zs1: true
    zs2: false
  popis: Biometrie je ověření totožnosti podle jedinečných tělesných znaků, například otisku prstu, tvaru obličeje nebo duhovky oka. Je rychlá a pohodlná, na rozdíl od hesla však tělesný znak nelze změnit, kdyby byl zneužit. V telefonu proto obvykle doplňuje PIN nebo heslo, které zůstávají záložním způsobem, a údaje o otisku či obličeji zůstávají jen v zařízení. Například telefon lze odemknout přiložením prstu na snímač nebo pohledem do kamery.
  zdroj_popisu: nový
  stav: draft
- id: k-dvoufaktorove-overeni
  nazev: Dvoufaktorové ověření
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-autentizace
  stupne:
    zs1: false
    zs2: true
  popis: Dvoufaktorové ověření je způsob přihlášení, který vyžaduje dva různé druhy důkazu totožnosti, typicky heslo a kód z telefonu, potvrzení v aplikaci nebo bezpečnostní klíč. Útočník, který zná jen heslo, se tak do účtu bez druhého faktoru nedostane. Ověřovací kód se proto nesděluje nikomu, ani údajnému pracovníkovi banky. Například banka po zadání hesla do internetového bankovnictví požaduje ještě potvrzení přihlášení v mobilní aplikaci.
  zdroj_popisu: nový
  stav: draft
- id: k-spravce-hesel
  nazev: Správce hesel
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-autentizace
  stupne:
    zs1: false
    zs2: true
  popis: Správce hesel je aplikace, která šifrovaně uchovává hesla k různým účtům, umí vytvářet silná náhodná hesla a při přihlášení je sama vyplní. Uživatel si tak pamatuje jen jedno hlavní heslo, které musí být silné a nejlépe chráněné i dvoufaktorovým ověřením. Správce hesel bývá součástí prohlížeče nebo operačního systému a heslo vyplní jen na stránce se správnou adresou, což pomáhá i proti phishingu.
  zdroj_popisu: nový
  stav: draft
- id: k-pristupova-prava-cist-upravovat-spravovat
  nazev: Přístupová práva (číst, upravovat, spravovat)
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Přístupová práva jsou oprávnění, která určují, kdo smí s daty, soubory nebo systémem co dělat: jen je číst, upravovat, nebo spravovat, tedy i mazat a přidělovat práva ostatním. Nastavuje je vlastník nebo správce, a to jednotlivým uživatelům, skupinám nebo komukoli, kdo má odkaz. Platí zásada nejnižších nutných oprávnění: každý má mít jen ta práva, která skutečně potřebuje, protože každé nadbytečné oprávnění zvyšuje riziko chyby nebo zneužití. Například učitel může třídě sdílet pracovní list jen ke čtení, aby si ho žáci nemohli navzájem přepsat.'
  zdroj_popisu: nový
  stav: draft
- id: k-sifrovani
  nazev: Šifrování
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  poznamka: navazuje na Kód a kódování (Data)
  popis: 'Šifrování je proces převodu čitelné informace (takzvaného otevřeného textu) do podoby, která je pro nepovolané osoby nesrozumitelná (takzvaného šifrovaného textu). Převod se provádí pomocí šifrovacího algoritmu a/nebo klíče. Zpětný převod do čitelné podoby (dešifrování) je možný s použitím inverzní procedury. Účelem šifrování je chránit obsah dat před neoprávněným přístupem, a to dat uložených v zařízeních i dat přenášených sítí. Například u Caesarovy šifry je algoritmem posun každého písmene v abecedě a klíčem počet míst posunu: při posunu o 3 se ze slova „PES“ stane „SHV“.'
  zdroj_popisu: garant Data (jazykově upraveno) – karta „Šifrování dat“
  stav: draft
- id: k-sifrovani-ulozenych-dat
  nazev: Šifrování uložených dat
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-sifrovani
  stupne:
    zs1: false
    zs2: true
  popis: Při šifrování uložených dat jsou data na disku, v telefonu nebo v záloze uložená v zašifrované podobě a zpřístupní se až po zadání hesla nebo PINu. Při ztrátě nebo krádeži zařízení je tak nelze přečíst ani po vyjmutí disku a jeho připojení k jinému počítači. Například moderní telefony obvykle šifrují svá data automaticky, jakmile je nastaven zámek obrazovky. Kdo ale zapomene heslo a ztratí i obnovovací klíč, nepřečte zašifrovaná data ani sám.
  zdroj_popisu: nový
  stav: draft
- id: k-sifrovana-komunikace-https
  nazev: Šifrovaná komunikace (HTTPS)
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-sifrovani
  stupne:
    zs1: true
    zs2: true
  popis: 'Při šifrované komunikaci se data před odesláním zašifrují a dešifruje je až příjemce, takže je cestou nikdo nemůže přečíst ani nepozorovaně změnit, ani útočník na veřejné Wi‑Fi. U webu šifrované spojení označuje adresa začínající https://. Neříká ale nic o tom, zda je stránka sama důvěryhodná: HTTPS používají i podvodné stránky. Například přihlašovací údaje do školního systému je proto bezpečné zadávat jen na stránce s HTTPS a se správnou doménou v adrese.'
  zdroj_popisu: nový
  stav: draft
- id: k-utok
  nazev: Útok
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Útok je úmyslná snaha získat neoprávněný přístup k datům, zařízením nebo účtům, poškodit je, zablokovat nebo z nich mít prospěch, například peníze nebo osobní údaje. Útočníci využívají technické chyby v programech, slabá hesla a škodlivý software, velmi často ale také důvěřivost, strach nebo spěch lidí. Mnoho útoků není namířeno na konkrétního člověka, ale rozesílá se hromadně v naději, že se někdo nachytá. Například útočník, který získá heslo k jednomu účtu, ho zkouší i na dalších službách, protože mnoho lidí používá stejné heslo opakovaně.
  zdroj_popisu: nový
  stav: draft
- id: k-phishing
  nazev: Phishing
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-utok
  stupne:
    zs1: true
    zs2: true
  popis: Phishing (z anglického fishing, „rybaření“) je podvod, při kterém se útočník vydává za důvěryhodnou osobu nebo instituci, například banku nebo dopravce, a snaží se vylákat hesla, platební údaje nebo přístup k účtům. Zpráva přichází e-mailem, SMS (smishing), telefonem (vishing), přes QR kód (quishing) nebo na sociální síti a může cílit i na konkrétního člověka (spear phishing). Napodobuje vzhled instituce, vyvolává časový tlak nebo strach a vede na falešnou stránku s nenápadně pozměněnou adresou, například paypa1.com místo paypal.com. Díky generativní AI bývají zprávy bezchybné a osobně laděné, nebo dokonce napodobují hlas blízké osoby, takže chyby v textu už nejsou spolehlivým varovným signálem.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-podvod-scam-a-falesny-profil
  nazev: Podvod (scam) a falešný profil
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-utok
  stupne:
    zs1: true
    zs2: false
  popis: Podvod (scam) je obecné označení pro podvodné jednání na internetu, jehož cílem je vylákat z oběti peníze, citlivé údaje nebo přístup k účtům; na rozdíl od phishingu, zaměřeného hlavně na přihlašovací údaje, zahrnuje širší škálu podvodů a často staví na slibu zisku, citovém tlaku nebo zneužití důvěry. Patří sem falešné výhry, e-shopy, které zboží nikdy nedodají, prosby „přítele v nouzi“ z napadeného účtu, investiční a kryptoměnové podvody s doporučeními známých osobností vytvořenými pomocí AI, romantické podvody, falešná technická podpora nebo výzvy k platbě jménem úřadů a dopravců. Podvodník často používá falešný profil a vydává se za vrstevníka, známou osobu nebo firmu, aby získal důvěru, peníze, osobní údaje nebo fotografie, které může zneužít k vydírání.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-socialni-inzenyrstvi
  nazev: Sociální inženýrství
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-utok
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Sociální inženýrství je manipulace lidí, aby sami prozradili důvěrné údaje, umožnili přístup nebo udělali něco, co útočníkovi pomůže. Nevyužívá technickou chybu, ale lidské vlastnosti: důvěru, ochotu pomoci, strach, spěch nebo respekt k autoritě. Je základem phishingu i mnoha podvodů, odehrává se ale i osobně nebo po telefonu. Například volající se představí jako technik školy a požádá žáka o heslo, aby mohl „opravit jeho účet“.'
  zdroj_popisu: nový
  stav: draft
- id: k-prompt-injection
  nazev: Prompt injection
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-utok
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Prompt injection je útok, při kterém útočník upraví vstup (prompt) pro model umělé inteligence tak, aby model obešel bezpečnostní pravidla, prozradil citlivé informace nebo jednal proti zájmu uživatele. Při přímém útoku zadá manipulativní pokyny přímo do dotazu, při nepřímém je ukryje do obsahu, který model zpracovává, například do webové stránky nebo dokumentu, který si uživatel nechá shrnout. Útok funguje, protože současné modely neumějí spolehlivě rozlišit pokyn uživatele od textu, který jen zpracovávají, a spolehlivá obrana zatím neexistuje. Důsledky sahají od podsouvání reklamy a dezinformací po únik dat nebo škodlivé akce AI, která má přístup k souborům či e-mailu.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-skodlivy-software-malware
  nazev: Škodlivý software (malware)
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Škodlivý software (malware) je program vytvořený proto, aby bez vědomí nebo proti vůli uživatele škodil: poškozoval nebo mazal data, špehoval, kradl hesla, zašifroval soubory nebo převzal kontrolu nad zařízením. Patří sem například viry, trojské koně, ransomware, keyloggery nebo spyware, které se liší způsobem šíření a tím, co v zařízení dělají. Nejčastěji se šíří přílohami e-mailů, odkazy, programy a hrami stahovanými z neověřených zdrojů nebo přes neaktualizované programy s bezpečnostními chybami. Například falešná „aktualizace přehrávače“ nabízená na pochybné stránce s filmy může do počítače nainstalovat malware.'
  zdroj_popisu: nový
  stav: draft
- id: k-pocitacovy-virus
  nazev: Počítačový virus
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-skodlivy-software-malware
  stupne:
    zs1: true
    zs2: false
  poznamka: RVP jen částečně
  popis: 'Počítačový virus je druh škodlivého softwaru, který se připojuje k jiným souborům nebo programům a šíří se spolu s nimi: aktivuje se, když uživatel napadený soubor spustí, a pak napadá další soubory. Na rozdíl od červa se sám po síti nešíří, potřebuje k tomu přenos souboru, například na flash disku nebo v příloze. Slovo virus se v běžné řeči často používá pro jakýkoli škodlivý software.'
  zdroj_popisu: nový
  stav: draft
- id: k-trojsky-kun
  nazev: Trojský kůň
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-skodlivy-software-malware
  stupne:
    zs1: false
    zs2: true
  popis: Trojský kůň je škodlivý program, který se tváří jako užitečná aplikace nebo hra, a uživatel ho proto sám nainstaluje. Po spuštění skrytě umožní útočníkovi přístup do zařízení, krade data nebo stáhne další škodlivý software; na rozdíl od viru se sám nekopíruje do dalších souborů. Název odkazuje na řeckou báji o dřevěném koni, ve kterém se do Tróje dostali ukrytí vojáci. Například „zdarma“ nabízený cheat do hry může ukrást přihlašovací údaje k herním účtům.
  zdroj_popisu: nový
  stav: draft
- id: k-ransomware
  nazev: Ransomware
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-skodlivy-software-malware
  stupne:
    zs1: false
    zs2: true
  popis: Ransomware je škodlivý software, který zašifruje data v zařízení nebo v celé síti a za jejich odšifrování požaduje výkupné, obvykle v kryptoměně. Zaplacení nezaručuje, že útočník data skutečně vrátí. Proti ztrátě dat nejlépe chrání pravidelná záloha uložená odděleně od zařízení; proti samotnému napadení pomáhají aktualizace a opatrnost u příloh a odkazů. Útoky ransomwaru například opakovaně na několik dní ochromily i nemocnice a úřady.
  zdroj_popisu: nový
  stav: draft
- id: k-keylogger
  nazev: Keylogger
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-skodlivy-software-malware
  stupne:
    zs1: false
    zs2: true
  popis: Keylogger je škodlivý software nebo malé zařízení, které tajně zaznamenává stisknuté klávesy, a tím i hesla, čísla karet a psané zprávy, a posílá je útočníkovi. Softwarový keylogger se do zařízení dostane jako jiný malware, hardwarový se nenápadně vloží mezi klávesnici a počítač; proto je rozumné nepřihlašovat se k důležitým účtům na veřejně přístupných počítačích, například v knihovně. Proti zneužití odposlechnutého hesla pomáhá dvoufaktorové ověření.
  zdroj_popisu: nový
  stav: draft
- id: k-zabezpeceni-zarizeni
  nazev: Zabezpečení zařízení
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Zabezpečení zařízení je soubor opatření, která snižují riziko útoku, ztráty a zneužití dat. Patří k nim technická opatření, jako jsou aktualizace, antivirus, firewall, zámek obrazovky a instalace aplikací jen z důvěryhodných zdrojů, i chování uživatele: odhlašování ze sdílených zařízení, opatrnost u neznámých odkazů, příloh a nevyžádaných e-mailů a kontrola oprávnění, která si aplikace vyžadují. Žádné jednotlivé opatření nechrání úplně, proto se kombinují. Například ztracený telefon se zámkem obrazovky a zapnutou funkcí vyhledání zařízení lze najít nebo na dálku vymazat, aniž by se k datům dostal nálezce.'
  zdroj_popisu: nový
  stav: draft
- id: k-aktualizace-bezpecnost
  nazev: Aktualizace
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-zabezpeceni-zarizeni
  stupne:
    zs1: false
    zs2: true
  popis: Aktualizace je nová verze softwaru, která kromě nových funkcí opravuje nalezené chyby, včetně bezpečnostních, které by mohli zneužít útočníci. Neaktualizované zařízení zůstává zranitelné vůči už známým útokům; starší zařízení po skončení podpory výrobce aktualizace nedostávají vůbec. Proto je vhodné zapnout automatické aktualizace operačního systému i aplikací.
  zdroj_popisu: nový
  stav: draft
- id: k-antivirus
  nazev: Antivirus
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-zabezpeceni-zarizeni
  stupne:
    zs1: true
    zs2: true
  popis: Antivirus je program, který vyhledává, blokuje a odstraňuje škodlivý software. Porovnává soubory se seznamem známých hrozeb a sleduje podezřelé chování programů, proto se musí pravidelně aktualizovat; ani tak ale nezachytí všechny hrozby, zejména zcela nové. Ve Windows je základní antivirus součástí systému (Microsoft Defender). Například antivirus může zablokovat staženou přílohu e-mailu, ve které rozpozná známý škodlivý kód.
  zdroj_popisu: nový
  stav: draft
- id: k-firewall
  nazev: Firewall
  tema: o-systemy-a-bezpecnost
  podoblast: s-bezpecnost
  vrstva: navazujici
  nadrazeny: k-zabezpeceni-zarizeni
  stupne:
    zs1: false
    zs2: true
  popis: Firewall je ochrana, která sleduje síťovou komunikaci zařízení nebo celé sítě a podle nastavených pravidel povoluje nebo blokuje spojení, například pokusy o připojení zvenčí nebo komunikaci neznámých programů. Může být součástí operačního systému nebo routeru. Sám nerozpozná škodlivý soubor, který uživatel stáhne a spustí; k tomu slouží antivirus. Například firewall ve Windows se může zeptat, zda nově nainstalovanému programu povolit komunikaci v síti.
  zdroj_popisu: nový
  stav: draft
- id: k-osobni-udaje
  nazev: Osobní údaje
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Osobní údaje jsou jakékoli informace o konkrétním člověku, kterého lze podle nich přímo nebo nepřímo určit. Patří sem údaje, podle kterých lze člověka poznat, například jméno, adresa, fotografie, telefonní číslo, poloha nebo přihlašovací jméno, ale i další informace o něm, například známky, nákupy nebo zájmy. Zvlášť chráněné jsou citlivé údaje, například o zdraví, náboženství nebo biometrické údaje. Jejich ochranu v Evropské unii upravuje nařízení GDPR. Například i kombinace třídy, školy a přezdívky může stačit k tomu, aby bylo jasné, o kterého žáka jde.
  zdroj_popisu: nový
  stav: draft
- id: k-digitalni-stopa
  nazev: Digitální stopa
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: Digitální stopa je souhrn všech informací a záznamů, které člověk vytváří nebo zanechává při používání digitálních technologií. Patří sem obsah, který sám sdílí, jako jsou komentáře, příspěvky, fotografie, videa nebo e-maily, i záznamy, které vznikají automaticky, například vyhledávací dotazy, historie prohlížení, přihlášení nebo údaje o poloze. Tyto stopy lze často dohledat, propojovat mezi sebou a používat k posouzení identity, zájmů a chování člověka, což využívají mimo jiné inzerenti nebo zaměstnavatelé. Například z veřejných příspěvků s označením místa lze vyčíst, kam člověk pravidelně chodí.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-logy
  nazev: Logy
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: navazujici
  nadrazeny: k-digitalni-stopa
  stupne:
    zs1: false
    zs2: true
  popis: Logy jsou záznamy, které systémy automaticky vytvářejí o své činnosti a o činnosti uživatelů, například kdy a odkud se uživatel přihlásil, které stránky navštívil nebo jaká chyba nastala. Ukládají je servery, operační systémy i aplikace a slouží k řešení problémů a odhalování útoků. Tvoří tak část digitální stopy, kterou uživatel obvykle nevidí a nemůže smazat. Například e-mailová služba ukazuje v nastavení účtu seznam posledních přihlášení s časem a zařízením.
  zdroj_popisu: nový
  stav: draft
- id: k-cookies
  nazev: Cookies
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: navazujici
  nadrazeny: k-digitalni-stopa
  stupne:
    zs1: false
    zs2: true
  popis: Cookies jsou malé textové údaje, které si web ukládá do prohlížeče uživatele a při další návštěvě je čte zpět. Díky nim si stránka pamatuje přihlášení, zvolený jazyk nebo obsah nákupního košíku. Cookies třetích stran ukládají jiné firmy než provozovatel stránky, například reklamní systémy, a slouží ke sledování uživatele napříč weby. Na ukládání cookies, které nejsou nezbytné pro fungování webu, se proto weby v EU musí ptát, obvykle v cookie liště.
  zdroj_popisu: nový
  stav: draft
- id: k-metadata
  nazev: Metadata
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: navazujici
  nadrazeny: k-digitalni-stopa
  stupne:
    zs1: false
    zs2: true
  popis: 'Metadata jsou „data o datech“: skryté informace uložené uvnitř souboru, které popisují jeho obsah nebo okolnosti vzniku a putují spolu se souborem při sdílení. U fotografií (údaje EXIF) jde o datum a čas pořízení, model telefonu, nastavení fotoaparátu a někdy i GPS souřadnice místa, u dokumentů o jméno autora, datum vytvoření a úprav nebo historii změn. Z původní fotografie tak lze zjistit, kde člověk bydlí nebo kam chodí do školy. Velké sociální sítě je z veřejně zobrazených fotografií obvykle odstraňují, riziko se tedy týká hlavně přímého posílání souborů; před sdílením je lze zobrazit a odstranit, například ve vlastnostech souboru.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-sledovani-polohy
  nazev: Sledování polohy
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: navazujici
  nadrazeny: k-digitalni-stopa
  stupne:
    zs1: false
    zs2: true
  popis: Sledování polohy je zjišťování a zaznamenávání místa, kde se zařízení nachází, pomocí GPS, okolních sítí Wi‑Fi nebo vysílačů mobilní sítě. Aplikace mohou polohu používat a sdílet jen s oprávněním, které lze v nastavení povolit, omezit na dobu používání aplikace nebo zakázat. Historie polohy, ukládaná i do fotografií, může prozradit, kde člověk bydlí a kudy chodí. Například sdílení polohy s rodiči může být užitečné, trvalé sdílení s neznámými lidmi je ale rizikové.
  zdroj_popisu: nový
  stav: draft
- id: k-anonymni-rezim-prohlizece
  nazev: Anonymní režim prohlížeče
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: navazujici
  nadrazeny: k-digitalni-stopa
  stupne:
    zs1: false
    zs2: true
  popis: Anonymní režim prohlížeče (také soukromé nebo inkognito okno) je režim, ve kterém prohlížeč po zavření okna nezachová historii, cookies ani údaje vyplněné do formulářů. Hodí se například při přihlášení na cizím nebo sdíleném počítači. Uživatele ale neskryje před navštívenými weby, správcem školní sítě ani poskytovatelem připojení, kteří jeho činnost mohou dál zaznamenávat. Stažené soubory a vytvořené záložky v počítači zůstávají.
  zdroj_popisu: nový
  stav: draft
- id: k-osint
  nazev: OSINT
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: navazujici
  nadrazeny: k-digitalni-stopa
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: OSINT (z anglického Open Source Intelligence) je shromažďování, vyhodnocování a využívání informací výhradně z veřejně dostupných zdrojů, jako jsou webové stránky, sociální sítě, diskusní fóra, média, veřejné databáze, obchodní rejstříky, vědecké publikace nebo úřední dokumenty. Cílem je získat z nich hodnotné informace pro rozhodování, například odhalit skryté vazby nebo hrozby. Uplatňuje se v kybernetické bezpečnosti, žurnalistice, obchodním zpravodajství i ve státních bezpečnostních složkách. Například novináři pomocí OSINT ověřují, kde a kdy byla pořízena fotografie zveřejněná na sociálních sítích.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-trvalost-dat
  nazev: Trvalost dat
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Trvalost dat je vlastnost digitálního obsahu: co se jednou objeví online, nemusí jít úplně odstranit. Obsah mohou ostatní uložit, zachytit snímkem obrazovky, přeposlat nebo sdílet dál a weby archivují i specializované služby; i po smazání originálu tak mohou kopie zůstat dostupné déle a širšímu okruhu lidí, než autor předpokládal. Před zveřejněním je proto dobré zvážit, zda by autorovi nevadilo, kdyby obsah i za několik let viděl kdokoli. Například zpráva v chatu, která měla po zobrazení zmizet, může u příjemce zůstat jako snímek obrazovky.'
  zdroj_popisu: nový
  stav: draft
- id: k-webovy-archiv-wayback-machine
  nazev: Webový archiv (Wayback Machine)
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: navazujici
  nadrazeny: k-trvalost-dat
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Webový archiv je služba, která průběžně ukládá kopie webových stránek a umožňuje zobrazit, jak vypadaly v určitý den v minulosti. Nejznámější je bezplatná Wayback Machine (web.archive.org) neziskové organizace Internet Archive, která pořizuje automatické snímky webů; kdokoli si může nechat archivovat i aktuální stránku tlačítkem „Save Page Now“. Archiv slouží k ověřování informací, dohledání smazaného nebo změněného obsahu, citování zdrojů, které mohou zmizet, i ke sledování proměn webu v čase. Je tak konkrétní ukázkou toho, že internet má paměť a smazat něco z webu není tak jednoduché, jak se může zdát.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-digitalni-identita
  nazev: Digitální identita
  tema: o-systemy-a-bezpecnost
  podoblast: s-soukromi
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Digitální identita je obraz člověka v digitálním prostředí: jeho účty, profily, přezdívky, údaje a obsah, který o něm existuje, včetně toho, co o něm zveřejnili jiní. Vytváří se z jeho digitální stopy a ovlivňuje, jak ho vnímají ostatní; člověk ji může utvářet tím, co a kde sdílí, ale zcela ji pod kontrolou nemá. V užším smyslu se digitální (elektronickou) identitou rozumí ověřený způsob, jak online prokázat svou totožnost, jako je bankovní identita nebo eObčanka při přihlášení k portálu státní správy. Například vyhledání jména a příjmení ve vyhledávači ukáže část digitální identity daného člověka.'
  zdroj_popisu: nový
  stav: draft
- id: k-technologie-a-digitalni-technologie
  nazev: Technologie a digitální technologie
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: core
  stupne:
    zs1: true
    zs2: true
  popis: 'Technologie je v obecné rovině využití vědeckých poznatků pro praktický účel: věci, zařízení nebo systémy vyvinuté k usnadnění nebo zlepšení lidské činnosti. Technologií je tak pazourek, knihtisk i parní stroj. Digitální technologie jsou zařízení a programy, které zaznamenávají a zpracovávají informace pomocí čísel, v počítači zapsaných jako nuly a jedničky; patří sem například počítače, chytré telefony nebo internetové aplikace. Například papírová mapa i navigace v mobilu pomáhají najít cestu, digitální technologií je ale jen navigace, která polohu i mapu zpracovává jako čísla.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-historie-informatiky
  nazev: Historie informatiky
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Historie informatiky je vývoj výpočetní techniky a automatického zpracování informací od mechanických počítacích strojů po současnost. Na mechanické kalkulátory, jako byla Pascalova sčítačka ze 17. století, navázaly ve 40. letech 20. století první elektronické počítače velké jako místnost; v Československu vznikl v 50. letech počítač SAPO. Díky tranzistorům a integrovaným obvodům se počítače zmenšily a zlevnily, od 70. a 80. let se rozšířily osobní počítače, v 90. letech internet a web, po roce 2007 chytré telefony a v posledních letech umělá inteligence. Například běžný chytrý telefon má mnohonásobně vyšší výkon než počítač, který řídil lety Apolla na Měsíc.
  zdroj_popisu: nový
  stav: draft
- id: k-vyvoj-internetu-z-pohledu-uzivatelu
  nazev: Vývoj internetu z pohledu uživatelů
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: navazujici
  nadrazeny: k-historie-informatiky
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Vývoj internetu z pohledu uživatelů popisuje, jak se měnila role lidí na webu. Web 1.0 fungoval jako velká knihovna, ve které stránky psalo málo autorů a ostatní je jen pasivně četli. Ve webu 2.0 se kolem roku 2004 lidé stali spolutvůrci obsahu, například Wikipedie, blogů nebo sociálních sítí, a mimo jiné díky tomu vzniklo obrovské množství dat, ze kterých se učí i umělá inteligence. Dnes se web postupně vyvíjí do podoby webu 3.0, který propojuje různá zařízení včetně internetu věcí, spoléhá na cloud a využívá sémantický web, tedy technologie, které lépe pracují s významem informací.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-nove-technologie
  nazev: Nové technologie
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Nové technologie jsou technologie, které se v současnosti rychle rozvíjejí a teprve pronikají do běžného života, takže jejich přínosy, rizika i budoucí podoba ještě nejsou plně známé. Většina z nich je založená na datech a jejich zpracování a často na sebe navazují: chytrá zařízení tvoří internet věcí a ten je základem ambientní inteligence. Co je „nové“, se v čase mění, protože dnešní novinka se během několika let může stát samozřejmostí, nebo naopak zapadnout. Například auta bez řidiče už v některých městech v USA a Číně jezdí jako taxi, v Česku ale zatím běžně nejezdí.'
  zdroj_popisu: nový
  stav: draft
- id: k-3d-tisk
  nazev: 3D tisk
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: navazujici
  nadrazeny: k-nove-technologie
  stupne:
    zs1: false
    zs2: true
  popis: 3D tisk je výroba trojrozměrného předmětu postupným nanášením materiálu vrstvu po vrstvě podle digitálního 3D modelu. Na rozdíl od obrábění, při kterém se materiál z většího kusu odebírá, se materiál přidává jen tam, kde má být, takže lze vyrobit i složité tvary nebo kusy na míru, například v medicíně, strojírenství nebo stavebnictví. Například ve škole lze navrhnout vlastní klíčenku nebo náhradní díl a vytisknout je z plastu.
  zdroj_popisu: nový
  stav: draft
- id: k-chytra-zarizeni
  nazev: Chytrá zařízení
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: navazujici
  nadrazeny: k-nove-technologie
  stupne:
    zs1: false
    zs2: true
  popis: Chytrá zařízení jsou běžné předměty – hodinky, prsteny, žárovky, zámky nebo reproduktory – vybavené senzory, malým vestavěným počítačem a připojením k síti, které lze ovládat přes aplikaci nebo hlasem. Přinášejí pohodlí, ale sbírají data o každodenním životě, například o spánku, pohybu nebo o tom, kdy je kdo doma, a často je posílají na servery výrobce; rizikem jsou i slabá hesla a chybějící aktualizace. Například chytrý prsten měří tep a délku spánku a výsledky ukazuje v aplikaci.
  zdroj_popisu: nový
  stav: draft
- id: k-internet-veci
  nazev: Internet věcí
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: navazujici
  nadrazeny: k-nove-technologie
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Internet věcí (Internet of Things, IoT) je síť fyzických zařízení propojených přes internet, která shromažďují data a vyměňují si je mezi sebou i s dalšími systémy. Díky senzorům a softwaru reagují na okolí, řídí se pokyny a mohou bez zásahu člověka optimalizovat procesy v domácnostech, průmyslu, zdravotnictví, dopravě i zemědělství, například šetřit energii nebo zlepšovat péči o pacienty. Propojenost ale přináší riziko útoků, úniků citlivých dat a zneužití zařízení, proto je důležitá kybernetická bezpečnost. Například čidla vlhkosti v poli posílají data a zavlažování se podle nich samo spustí.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-ambientni-inteligence
  nazev: Ambientní inteligence
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: navazujici
  nadrazeny: k-nove-technologie
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Ambientní inteligence (AmI) je elektronické prostředí, které vnímá přítomnost lidí a přizpůsobuje se jejich potřebám a chování. Pomocí nenápadných senzorů a umělé inteligence na lidi samo reaguje, aniž by ho museli ovládat, a staví přitom na internetu věcí. Usnadňuje život v domácnostech, kancelářích i ve zdravotnictví, kvůli sběru osobních dat ale otevírá otázky bezpečnosti a soukromí. Například chytrá domácnost podle zvyklostí obyvatel sama nastaví světlo a teplotu.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-kvantovy-pocitac
  nazev: Kvantový počítač
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: navazujici
  nadrazeny: k-nove-technologie
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Kvantový počítač je počítač, který k výpočtům využívá jevy kvantové mechaniky, jako je superpozice a kvantové provázání. Místo bitů pracuje s qubity, které mohou být v kombinaci stavů 0 a 1 a teprve při měření z nich vyjde 0, nebo 1. Některé úlohy, například simulaci molekul nebo rozklad velkých čísel, by mohl řešit mnohem rychleji, běžný počítač ale nenahradí a dnešní kvantové počítače jsou zatím pokusné. Například výkonné kvantové počítače by v budoucnu mohly prolomit dnes běžné šifrování, proto se už vyvíjejí odolnější šifry.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-digitalizace
  nazev: Digitalizace
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Digitalizace je převod informací nebo celých procesů do digitální podoby, aby je bylo možné zpracovávat, ukládat a přenášet pomocí digitálních technologií. Digitalizovat lze obsah, například naskenovat dokument nebo starou knihu, i postupy, například vyřizování žádostí na úřadě nebo vedení známek v elektronické žákovské knížce. Zrychluje vyhledávání a sdílení a zpřístupňuje služby odkudkoli, vytváří ale závislost na technice a může znevýhodnit lidi bez připojení nebo dovedností; bývá také předpokladem automatizace. Například lékař místo papírového receptu vystaví eRecept a lékárna lék vydá podle kódu, který pacient dostane třeba v SMS.
  zdroj_popisu: nový
  stav: draft
- id: k-automatizace
  nazev: Automatizace
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Automatizace je převedení činnosti, kterou dříve vykonával člověk, na stroj nebo program, který ji pak provádí sám podle zadaného postupu nebo naučeného modelu. Předpokladem bývá digitalizace, protože stroj potřebuje informace v podobě, kterou dokáže zpracovat. Automatizace zrychluje práci a přebírá monotónní nebo nebezpečné úkoly, s umělou inteligencí i úlohy vyžadující úsudek, jako je překlad; mění ale trh práce, protože některá povolání ubývají a jiná vznikají, a vyžaduje lidský dohled pro případ selhání. Například v třídicím centru čtečky načtou kód na zásilce a pásy ji samy pošlou správným směrem.
  zdroj_popisu: nový
  stav: draft
- id: k-zivotni-cyklus-technologie
  nazev: Životní cyklus technologie
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Životní cyklus technologie je sled fází, kterými technologie prochází: vznik a vývoj, zavádění mezi první uživatele, masové rozšíření, nasycení a nakonec útlum a nahrazení novější technologií. Zpočátku bývá technologie drahá a používá ji málo lidí, s rozšířením zlevňuje a stává se samozřejmostí. U softwaru a zařízení končí cyklus obvykle ukončením podpory, kdy výrobce přestane vydávat bezpečnostní aktualizace. Například hudba se poslouchala z gramofonových desek, kazet, CD a přehrávačů MP3 a dnes hlavně ze streamovacích služeb; desky si přitom dál kupují sběratelé, takže stará technologie nemusí úplně zmizet.'
  zdroj_popisu: nový
  stav: draft
- id: k-hype-krivka
  nazev: Hype křivka
  tema: o-informatika-a-spolecnost
  podoblast: s-technologie-a-jejich-vyvoj
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Hype křivka je model společnosti Gartner, který popisuje, jak se v čase mění očekávání a pozornost spojené s novou technologií; anglické slovo hype označuje přehnaný humbuk. Model rozlišuje pět fází: technologický spouštěč, vrchol přehnaných očekávání, propad deziluze, svah osvícení a plató produktivity, kdy se technologie začne běžně a smysluplně používat. Křivka nepopisuje skutečný technický vývoj, ale to, jak technologii vnímají lidé, a ne každá technologie projde všemi fázemi. Například o metaverzu se kolem roku 2021 mluvilo jako o budoucnosti internetu, brzy však zájem veřejnosti i investorů výrazně opadl.'
  zdroj_popisu: nový
  stav: draft
- id: k-dopady-technologii-prinosy-rizika
  nazev: Dopady technologií (přínosy, rizika)
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Dopady technologií jsou změny, které zavedení a používání technologie přináší jednotlivcům, společnosti a životnímu prostředí, a to jak přínosy, tak rizika. Tatáž technologie může jedněm pomáhat a druhé znevýhodňovat, její dopady se často projeví až s odstupem a mohou být nezamýšlené, tedy jiné, než s jakými počítali její tvůrci. Zda převáží přínosy, nebo rizika, závisí i na tom, jak lidé technologii používají a jaká pravidla pro ni platí. Například online výuka během uzavření škol v letech 2020 a 2021 umožnila pokračovat ve vzdělávání, žáci bez počítače nebo připojení ale byli znevýhodnění.
  zdroj_popisu: nový
  stav: draft
- id: k-technologie-postavene-na-datech
  nazev: Technologie postavené na datech
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: Technologie postavené na datech jsou technologie, jejichž fungování a hodnota závisí na průběžném sběru a analýze velkého množství dat, často o uživatelích. Patří sem například navigace, doporučování obsahu, cílená reklama, chytrá zařízení i umělá inteligence, která se z dat učí. Čím víc dat služba má, tím lépe obvykle funguje a přiláká další uživatele, a tím i další data; kdo má data, získává ekonomickou výhodu i vliv, což otevírá otázky soukromí a soustředění moci v rukou několika velkých firem. Například navigace v mobilu pozná dopravní zácpu tak, že vyhodnocuje polohu a rychlost tisíců telefonů v daném úseku.
  zdroj_popisu: nový
  stav: draft
- id: k-role-informacnich-systemu-ve-spolecnosti
  nazev: Role informačních systémů ve společnosti
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  popis: 'Role informačních systémů ve společnosti spočívá v tom, že informační systémy řídí chod škol, nemocnic, úřadů, bank, dopravy i energetiky: evidují data, propojují instituce a umožňují vyřizovat služby online. Usnadňují práci a zpřístupňují služby odkudkoli, společnost se na nich ale stává závislou, takže výpadek, chyba nebo kybernetický útok může ochromit důležité služby. Výzvou je také, aby se ke službám dostali i lidé bez připojení nebo potřebných dovedností. Například po kybernetickém útoku na nemocnici v Benešově v roce 2019 přestal fungovat její informační systém a nemocnice musela odkládat plánované operace.'
  zdroj_popisu: nový
  stav: draft
- id: k-ekonomika-pozornosti
  nazev: Ekonomika pozornosti
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'Ekonomika pozornosti je model, ve kterém je lidská pozornost vzácným zdrojem, o který soutěží digitální služby, protože čas, který v nich uživatelé stráví, lze zpeněžit, především prodejem reklamy. Myšlenku popsal už v roce 1971 ekonom Herbert Simon: nadbytek informací vytváří nedostatek pozornosti. Služby se proto často navrhují a hodnotí podle toho, jak dlouho a jak často je lidé používají, k čemuž slouží algoritmy sociálních sítí i návykový design. Například bezplatná aplikace s krátkými videi vydělává tím víc, čím víc reklam uživatel zhlédne, a proto je navržená tak, aby v ní trávil co nejvíc času.'
  zdroj_popisu: nový
  stav: draft
- id: k-algoritmy-socialnich-siti
  nazev: Algoritmy sociálních sítí
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: navazujici
  nadrazeny: k-ekonomika-pozornosti
  stupne:
    zs1: false
    zs2: true
  popis: 'Algoritmy sociálních sítí jsou doporučovací systémy, které vybírají a řadí, co uživatel na sociální síti uvidí, podle toho, jak se chová on i podobní uživatelé: co sledují, jak dlouho, co lajkují, komentují nebo sdílejí. Protože bývají nastavené tak, aby uživatele udržely na platformě co nejdéle, upřednostňují obsah, který vyvolá silnou reakci, například pobouření nebo údiv. Například na síti s krátkými videi stačí, aby se uživatel u několika videí na určité téma zastavil, a feed mu začne nabízet další podobná.'
  zdroj_popisu: nový
  stav: draft
- id: k-navykovy-design
  nazev: Návykový design
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: navazujici
  nadrazeny: k-ekonomika-pozornosti
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Návykový design jsou prvky návrhu aplikací, které mají uživatele co nejdéle udržet v aplikaci nebo ho přimět, aby se do ní často vracel. Patří sem nekonečné posouvání, automatické přehrávání, upozornění, série dní v řadě nebo nepředvídatelné odměny, které podobně jako výherní automat lákají zkoušet to znovu. Prvky, které uživatele klamou nebo manipulují jeho rozhodováním, se označují jako temné vzory (dark patterns) a nařízení EU o digitálních službách je online platformám zakazuje. Například když po skončení videa samo naběhne další, je mnohem těžší aplikaci zavřít.
  zdroj_popisu: nový
  stav: draft
- id: k-obchodni-modely-platforem
  nazev: Obchodní modely platforem
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Obchodní model platformy je způsob, jakým digitální služba vydělává peníze. Nejčastěji jde o reklamu, předplatné nebo zpeněžení dat, dále například o model freemium, kdy je základní verze zdarma a za rozšíření se platí, o nákupy v aplikaci nebo o provize z prodeje, které si berou online tržiště. Obchodní model ovlivňuje, jak je služba navržená a co o uživatelích sleduje: služba placená z reklamy se snaží uživatele udržet co nejdéle a sbírat o nich data, předplatné motivuje k tomu, aby byli spokojení a platit nepřestali. Například mobilní hra zdarma může vydělávat na reklamách mezi koly i na prodeji herních předmětů za skutečné peníze.'
  zdroj_popisu: nový
  stav: draft
- id: k-reklama
  nazev: Reklama
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: navazujici
  nadrazeny: k-obchodni-modely-platforem
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Reklama jako obchodní model znamená, že služba je pro uživatele zdarma a platí za ni inzerenti. Platforma jim prodává pozornost uživatelů a možnost cílit reklamu podle dat o nich, například podle věku, polohy, zájmů nebo toho, co hledali, a proto má zájem uživatele co nejdéle udržet a co nejvíc o nich vědět. Online platformy v EU nesmějí zobrazovat reklamu cílenou na základě profilování uživatelům, o kterých vědí, že jsou nezletilí. Například po vyhledání tenisek se uživateli na různých webech začnou zobrazovat reklamy na tenisky.
  zdroj_popisu: nový
  stav: draft
- id: k-predplatne
  nazev: Předplatné
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: navazujici
  nadrazeny: k-obchodni-modely-platforem
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Předplatné je obchodní model, ve kterém uživatel pravidelně, například měsíčně nebo ročně, platí za přístup ke službě, třeba ke streamování hudby a filmů, ke cloudovému úložišti nebo k rozšířené verzi chatbota. Služba pak nemusí být závislá na reklamě, takže bývá bez ní, nebo nabízí levnější variantu s reklamou. Platby se ale snadno sčítají a předplatné se obvykle samo obnovuje, dokud ho uživatel nezruší. Například zkušební měsíc zdarma se po skončení často automaticky změní na placené předplatné.
  zdroj_popisu: nový
  stav: draft
- id: k-zpenezeni-dat
  nazev: Zpeněžení dat
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: navazujici
  nadrazeny: k-obchodni-modely-platforem
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Zpeněžení dat je získávání peněz z dat o uživatelích. Firma je může využít k personalizaci služeb a cílené reklamě nebo je prodat či sdílet s jinými firmami, například s datovými makléři, kteří z údajů z mnoha zdrojů skládají podrobné profily lidí. Podle GDPR k tomu firma potřebuje právní důvod a musí uživatele informovat, z podmínek používání to ale bývá těžké vyčíst. Například bezplatná aplikace s počasím může sbírat polohu telefonu a prodávat ji dál.
  zdroj_popisu: nový
  stav: draft
- id: k-udrzitelnost-a-environmentalni-stopa
  nazev: Udržitelnost a environmentální stopa
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Postoje a hodnoty'
  popis: 'Environmentální stopa digitálních technologií je souhrn jejich dopadů na životní prostředí během celého životního cyklu: výroba spotřebovává suroviny včetně vzácných kovů, energii a vodu, provoz zařízení, sítí a datových center potřebuje elektřinu a z vyřazených zařízení vzniká elektroodpad. Udržitelnost znamená používat technologie tak, aby tyto dopady byly co nejmenší, například zařízení déle používat, opravovat je, kupovat repasovaná a nakonec je odevzdat k recyklaci. Například u chytrého telefonu vzniká většina emisí už při výrobě, takže když slouží o několik let déle, oddálí se výroba nového a celková stopa se výrazně sníží.'
  zdroj_popisu: nový
  stav: draft
- id: k-energeticka-narocnost-datova-centra-ai
  nazev: Energetická náročnost (datová centra, AI)
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: navazujici
  nadrazeny: k-udrzitelnost-a-environmentalni-stopa
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: 'Energetická náročnost digitálních technologií je spotřeba energie potřebná k jejich provozu, která nejrychleji roste v datových centrech, tedy v budovách s tisíci servery, na kterých běží cloud, weby, streamování i umělá inteligence. Datová centra spotřebovávají velké množství elektřiny a často i vody na chlazení: podle Mezinárodní energetické agentury na ně v roce 2024 připadlo asi 1,5 % světové spotřeby elektřiny a do roku 2030 se má jejich spotřeba více než zdvojnásobit, hlavně kvůli AI. Například vygenerování krátkého videa pomocí AI spotřebuje mnohem víc energie než krátká textová odpověď chatbota.'
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-elektroodpad
  nazev: Elektroodpad
  tema: o-informatika-a-spolecnost
  podoblast: s-dopady
  vrstva: navazujici
  nadrazeny: k-udrzitelnost-a-environmentalni-stopa
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Elektroodpad jsou vyřazená elektrická a elektronická zařízení, například telefony, počítače, nabíječky, sluchátka nebo spotřebiče. Obsahují cenné suroviny, jako je měď nebo zlato, i nebezpečné látky, jako je olovo nebo rtuť, proto patří k recyklaci, a ne do běžného odpadu; lithiové baterie v koši mohou navíc způsobit požár. Podle OSN ho v roce 2022 vzniklo přes 60 milionů tun a prokazatelně se recyklovala méně než čtvrtina. Například starý mobil lze odevzdat do červeného kontejneru na drobný elektroodpad nebo v obchodě s elektronikou.
  zdroj_popisu: nový
  stav: draft
- id: k-propaganda
  nazev: Propaganda
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Propaganda je v širokém pojetí, které používá AI dětem (autorem definice je Josef Holý), jakákoli snaha šířit vlastní vidění světa. Z tohoto pohledu do ní patří celé spektrum veřejné komunikace, například strategická komunikace, politický marketing, populismus, dezinformace i černá propaganda, která se vydává za sdělení jiného zdroje, než ze kterého skutečně pochází. V užším, běžnějším smyslu se propagandou označuje cílené, jednostranné až manipulativní působení na názory lidí, typicky ze strany státu nebo politického hnutí. Například volební plakát i válečné letáky, které mají oslabit morálku nepřítele, jsou v širokém pojetí propagandou, liší se ale mírou manipulace.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-dezinformace
  nazev: Dezinformace
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: Dezinformace je záměrně nepravdivá nebo zavádějící informace šířená s cílem ovlivnit názory, postoje nebo jednání lidí; klíčový je úmysl, protože autor ví, že informace je nepravdivá, a šíří ji kvůli politickému, ideologickému, ekonomickému nebo zpravodajskému cíli. Odlišuje se od ní misinformace, tedy nepravdivý obsah šířený bez zlého úmyslu, a malinformace, tedy pravdivá informace použitá ke škodě, například zveřejnění cizích soukromých údajů. Typickými technikami jsou vytržení z kontextu, lživá ekvivalence, falešné autority, zmanipulované snímky a videa, astroturfing (falešné zdání občanské podpory vytvořené sítí falešných účtů) a trollí farmy; generativní AI výrobu dezinformací zlevňuje a mizí dřívější varovné znaky, jako je chybná čeština. Kampaně mají oslabit důvěru v instituce, rozdělit společnost, ovlivnit volby nebo přinést zisk a v Česku se dlouhodobě týkají třeba migrace, EU, NATO, války na Ukrajině, očkování a změny klimatu. Například kdo v dobré víře přepošle vymyšlenou
    zprávu, šíří misinformaci.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-hoax
  nazev: Hoax
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Hoax je záměrně nepravdivá zpráva šířená internetem, e-mailem nebo sociálními sítěmi, která má vyvolat strach, soucit, pobouření nebo údiv a přimět příjemce ke sdílení. Na rozdíl od dezinformace nemá nutně politický nebo ideologický cíl, často jde o mystifikaci, žert nebo trolling; mnoho hoaxů ale přerůstá v dezinformační kampaně, zvlášť o zdraví, očkování, migraci nebo volbách. Typické jsou poplašné zprávy o zdraví, falešná varování před únosy dětí, řetězové zprávy („přepošli deseti lidem, jinak…“), falešné sbírky pro nemocné dítě, smyšlená úmrtí celebrit nebo vymyšlené citáty slavných osobností. Hoax působí na emoce, vyzývá ke sdílení, odvolává se na neurčité autority („lékaři“, „policie“) a přidává věrohodné detaily, jako jsou jména měst nebo data; s generativní AI mizí i varovné znaky, jako je špatná čeština. Například zpráva „voda v PET lahvi se na slunci mění na jed, varuj své blízké“ je typický zdravotní hoax.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-digitalni-manipulace
  nazev: Digitální manipulace
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: 'Digitální manipulace je úprava digitálního obrazu, videa nebo zvuku – od jemných změn, jako je potlačení šumu nebo úprava jasu, přes přidávání a odstraňování částí záznamu až po vytváření zcela syntetických médií. Slouží umění, zábavě nebo marketingu, ale také dezinformacím a podvodům. Úpravy fotografií jsou starší než digitální technologie: v Sovětském svazu se ve 30. letech 20. století ze snímků ruční retuší odstraňovali lidé, kteří u Stalina upadli v nemilost. Dnes je pojem úzce spjatý s deepfaky, protože umělá inteligence umožňuje přesvědčivé úpravy rychle a bez odborných znalostí. Například reklamní fotografie bývá upravená tak, že modelka má hladší pleť a štíhlejší postavu než ve skutečnosti.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-bot
  nazev: Bot
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Bot je program, který na internetu automaticky spouští a vykonává úlohy, obvykle jednoduché a opakující se, mnohem rychleji, než by to zvládl člověk; na rozdíl od robota nemá fyzické tělo. Užiteční boti například procházejí weby pro vyhledávače nebo odpovídají v zákaznické podpoře jako chatboti; jiní rozesílají spam, zkoušejí hesla, hromadně skupují vstupenky nebo jako falešné účty na sociálních sítích zesilují určitá sdělení a vytvářejí dojem, že je podporuje mnoho lidí. Například když web před odesláním formuláře žádá označit obrázky se semafory, ověřuje takzvaným testem CAPTCHA, že formulář nevyplňuje bot.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-synteticka-media
  nazev: Syntetická média
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Činnosti'
  popis: 'Syntetická média jsou digitální obsah – obrázky, videa, zvuk, text, hudba nebo 3D modely –, který byl vytvořen nebo podstatně upraven umělou inteligencí, typicky generativními modely. Sahají od zjevně umělých ilustrací po obsah k nerozeznání od skutečného záznamu, jako jsou fotorealistické portréty nebo napodobené hlasy. Legitimně slouží ve filmu a hrách, při dabingu a překladu, ve vzdělávání, marketingu, při tvorbě prototypů, v pomůckách pro lidi se zrakovým nebo sluchovým postižením nebo k oživení historických postav v muzeích; zneužívají se k deepfakům, podvodům, obcházení biometrického ověřování, falšování dokladů a důkazů nebo k zahlcování sítí nekvalitním obsahem. Typické chyby, jako deformované ruce nebo nečitelný text, s novými modely ubývají, proto evropský AI Act od roku 2026 ukládá obsah vytvořený AI označovat a deepfaky přiznat. Pro děti je důležité vědět, že vidět už neznamená věřit: například i fotografie sdílené na vlastním profilu mohou být zneužity k vytvoření
    syntetického obsahu.'
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-deepfake
  nazev: Deepfake
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: navazujici
  nadrazeny: k-synteticka-media
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Deepfake je obrázek, video nebo zvukový záznam, který byl pomocí generativní umělé inteligence zmanipulován nebo celý vytvořen, nejčastěji tak, aby v něm skutečný člověk vypadal nebo zněl, jako by říkal nebo dělal něco, co se nestalo. Název spojuje anglická slova „deep“ (podle hlubokých neuronových sítí) a „fake“ (falešný). Zneužívá se k dezinformacím a podvodům; zvlášť závažné jsou falešné intimní snímky skutečných lidí, včetně dětí, které slouží ke kyberšikaně nebo vydírání – jejich vytvoření i šíření je trestné a obětem závažně ubližuje. Například podvodník může napodobit hlas vnučky a telefonem žádat babičku o peníze.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-face-swap
  nazev: Face swap
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: navazujici
  nadrazeny: k-synteticka-media
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Face swap (záměna obličeje) je technika, která na fotografii nebo ve videu rychle nahradí obličej jednoho člověka obličejem jiného. Počítačové vidění v obraze rozpozná obličeje a algoritmy umělé inteligence zmapují jejich rysy, aby nový obličej přesně seděl na místo původního. Používá se hlavně pro zábavu v aplikacích a na sociálních sítích, zneužívá se ale i k falešným intimním snímkům lidí bez jejich souhlasu. Například filtr, který na společném selfie prohodí obličeje dvou kamarádů, je jednoduchý face swap.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-ai-influencer
  nazev: AI influencer
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: navazujici
  nadrazeny: k-synteticka-media
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: AI influencer je virtuální postava vytvořená generativní umělou inteligencí, která na sociálních sítích vystupuje jako skutečný influencer. Působí, jako by měla vlastní osobnost, zájmy a život, zveřejňuje fotky, videa, hudbu nebo texty a v komentářích komunikuje se sledujícími; často slouží k propagaci značek, produktů nebo služeb. Například jednou z nejznámějších virtuálních influencerek je Lil Miquela, která ale vznikla už v roce 2016 pomocí počítačové grafiky, tedy ještě před rozšířením generativní AI.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-ai-slop
  nazev: AI slop
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: navazujici
  nadrazeny: k-synteticka-media
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: AI slop (z anglického slop, pomyje) je slangové označení, rozšířené v letech 2024–2025, pro nekvalitní obrázky, videa, články nebo příspěvky masově vyráběné umělou inteligencí bez tvůrčího záměru a často i bez ohledu na pravdivost, hlavně kvůli výdělku z reklam, sledovanosti nebo obelstění doporučovacích algoritmů. Zaplavuje sociální sítě i vyhledávače, vytlačuje lidskou tvorbu a šíří smyšlené zprávy, falešné recenze nebo zdravotní rady; děti a starší lidé ho kvůli profesionálnímu vzhledu často těžko rozpoznají. Například dojemné vygenerované obrázky, které na Facebooku sbírají tisíce lajků od lidí, kteří je považují za skutečné fotky, jsou typickým AI slopem.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-synteticka-realita
  nazev: Syntetická realita
  tema: o-informatika-a-spolecnost
  podoblast: s-informace-a-manipulace
  vrstva: navazujici
  nadrazeny: k-synteticka-media
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Syntetická realita je stav online prostoru, ve kterém už nelze spolehlivě rozlišit, co je autentické, tedy vytvořené lidmi, a co syntetické, vygenerované umělou inteligencí. Dříve se pojem spojoval hlavně s virtuálními světy takzvaného metaverza, dnes zahrnuje vše od upravených fotografií po zcela vygenerovaná videa, texty nebo virtuální postavy. Například ve feedu se mohou střídat skutečná videa, upravené fotky a vygenerované klipy, aniž by bylo poznat, které je které.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-digitalni-wellbeing
  nazev: Digitální wellbeing
  tema: o-informatika-a-spolecnost
  podoblast: s-clovek-a-technologie
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Postoje a hodnoty'
  popis: 'Digitální wellbeing je zdravý vztah k digitálním technologiím: používat je tak, aby člověku pomáhaly a nenarušovaly jeho spánek, soustředění, pohyb, vztahy a duševní pohodu. Nejde jen o to, kolik času člověk u obrazovky stráví, ale také co při tom dělá a jak se potom cítí; tvořit, učit se nebo mluvit s přáteli působí jinak než bezcílné posouvání feedu. Digitální wellbeing ztěžuje návykový design aplikací, pomáhají naopak vědomá pravidla a nastavení, například časové limity, vypnutá upozornění nebo režim spánku. Například odložení telefonu mimo ložnici před spaním může pomoci lépe usnout.'
  zdroj_popisu: nový
  stav: draft
- id: k-brainrot
  nazev: Brainrot
  tema: o-informatika-a-spolecnost
  podoblast: s-clovek-a-technologie
  vrstva: navazujici
  nadrazeny: k-digitalni-wellbeing
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Brainrot (doslova „hnití mozku“) je slangový výraz pro krátká, opakující se, často absurdní nebo úmyslně nesmyslná videa, memy a zvuky, které nevyžadují soustředění a snadno se konzumují v nekonečném posouvání, a zároveň pro otupělost a zhoršenou koncentraci po dlouhém sledování takového obsahu. Oxfordský slovník ho vyhlásil slovem roku 2024. Sdílený jazyk memů funguje mezi vrstevníky jako pojítko, dlouhodobá konzumace ale souvisí s roztříštěnou pozorností, horším spánkem, menší trpělivostí pro čtení či výuku a nutkavým používáním telefonu; mladí lidé proto slovo často používají sebeironicky. Například videa se Skibidi Toilet nebo s postavičkami takzvaného italského brainrotu jsou srozumitelná jen zasvěceným.
  zdroj_popisu: slovníček AI dětem
  stav: draft
- id: k-kybersikana
  nazev: Kyberšikana
  tema: o-informatika-a-spolecnost
  podoblast: s-clovek-a-technologie
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Kyberšikana je šikana probíhající pomocí digitálních technologií, například ve zprávách, na sociálních sítích nebo ve hrách, tedy záměrné a obvykle opakované ubližování, zesměšňování nebo zastrašování druhého. Patří sem urážlivé zprávy, zveřejnění ztrapňujících nebo upravených fotek, falešné profily, vydírání nebo vylučování ze skupin. Na rozdíl od šikany tváří v tvář může pokračovat kdykoli, i doma, útočník může být anonymní a obsah se rychle šíří k velkému publiku a dlouho přetrvává. Pomáhá neodpovídat, ponižující obsah nešířit dál, uložit si důkazy, útočníka zablokovat a nahlásit a svěřit se dospělému nebo Lince bezpečí (116 111). Například spolužáci založí třídní skupinu bez jednoho žáka a sdílejí v ní jeho zesměšňující fotky.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-pravo
  nazev: Právo
  tema: o-informatika-a-spolecnost
  podoblast: s-clovek-a-technologie
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: Právo v digitálním prostředí je soubor pravidel, která upravují používání digitálních technologií, dat a obsahu; platí online stejně jako offline. Patří sem ochrana osobních údajů, autorské právo a licence, které chrání duševní vlastnictví, tedy výtvory lidské mysli, ale také zákazy pomluvy, vydírání, podvodů nebo šíření cizích intimních snímků. Evropská unie navíc stanovuje pravidla pro online platformy v nařízení o digitálních službách (DSA) a pro umělou inteligenci v nařízení AI Act. Například pomluva spolužáka na sociální síti může být stejně protiprávní jako pomluva vyslovená ve škole.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-ochrana-osobnich-udaju-gdpr
  nazev: Ochrana osobních údajů (GDPR)
  tema: o-informatika-a-spolecnost
  podoblast: s-clovek-a-technologie
  vrstva: navazujici
  nadrazeny: k-pravo
  stupne:
    zs1: false
    zs2: true
  poznamka: RVP jen částečně
  popis: 'GDPR (obecné nařízení o ochraně osobních údajů) je evropské nařízení, které od roku 2018 určuje, jak smějí firmy, školy a další instituce zpracovávat osobní údaje: jen z právního důvodu, například na základě souhlasu, smlouvy nebo zákona, pro určený účel a v nezbytném rozsahu. Lidem dává právo vědět, jaké údaje se o nich zpracovávají, a žádat jejich opravu nebo výmaz. V Česku může souhlas se zpracováním údajů pro online službu udělit sám až člověk od 15 let, za mladší ho dává rodič. Například žák může požádat školu, aby mu sdělila, jaké údaje o něm vede.'
  zdroj_popisu: nový
  stav: draft
- id: k-autorske-pravo
  nazev: Autorské právo
  tema: o-informatika-a-spolecnost
  podoblast: s-clovek-a-technologie
  vrstva: navazujici
  nadrazeny: k-pravo
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Postoje a hodnoty'
  popis: Autorské právo chrání díla, tedy jedinečné výsledky tvůrčí činnosti, jako jsou texty, fotografie, hudba, videa nebo programy, a dává autorovi právo rozhodovat o jejich použití. Vzniká automaticky vytvořením díla, bez registrace i bez značky ©, v Česku trvá po život autora a 70 let po jeho smrti a volná dostupnost díla na internetu neznamená, že ho lze volně použít; zákon ale povoluje výjimky, například citaci. Autorem může být jen člověk, takže obsah vytvořený čistě umělou inteligencí obvykle autorským dílem není. Například fotku z vyhledávače nelze bez svolení autora nebo vhodné licence použít ve vlastním videu.
  zdroj_popisu: nový
  stav: draft
- id: k-licence-creative-commons-open-source
  nazev: Licence (Creative Commons, open source)
  tema: o-informatika-a-spolecnost
  podoblast: s-clovek-a-technologie
  vrstva: navazujici
  nadrazeny: k-pravo
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Licence je svolení autora nebo jiného držitele práv, za jakých podmínek lze dílo použít. Licence Creative Commons kombinují podmínky uvést autora, šířit úpravy pod stejnou licencí, nepoužívat dílo komerčně nebo ho neupravovat; licencí CC0 se autor vzdává práv, jak nejvíc to zákon dovoluje. Open source licence zpřístupňují zdrojový kód programu k volnému používání, úpravám a šíření, například u prohlížeče Firefox. Například fotografii z Wikimedia Commons s licencí CC BY lze použít v prezentaci, pokud se uvede autor a licence.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
- id: k-etika-ai
  nazev: Etika AI
  tema: o-informatika-a-spolecnost
  podoblast: s-clovek-a-technologie
  vrstva: core
  stupne:
    zs1: false
    zs2: true
  poznamka: 'RVP: Postoje a hodnoty'
  popis: 'Etika umělé inteligence se zabývá tím, jak AI vytvářet a používat odpovědně, aby lidem prospívala a neubližovala. Řeší férovost a předpojatost (bias), průhlednost rozhodování, soukromí, odpovědnost za chyby, práva k trénovacím datům, lidský dohled i dopady na práci a životní prostředí. V EU platí od roku 2024 nařízení AI Act, které se uplatňuje postupně: zakazuje například rozpoznávání emocí ve školách, na systémy s vysokým rizikem, třeba pro hodnocení žáků, klade přísné požadavky a ukládá, aby lidé věděli, že komunikují s AI. Například pokud by AI hodnotila přijímací zkoušky, je třeba ověřit, že posuzuje uchazeče férově, a určit, kdo odpovídá za její chyby.'
  zdroj_popisu: nový
  stav: draft
- id: k-profese-v-informatice
  nazev: Profese v informatice
  tema: o-informatika-a-spolecnost
  podoblast: s-clovek-a-technologie
  vrstva: core
  stupne:
    zs1: false
    zs2: false
  poznamka: nad rámec RVP
  popis: Profese v informatice jsou povolání, ve kterých lidé navrhují, vytvářejí, provozují, zabezpečují a zkoumají digitální technologie. Patří sem například programátor, tester softwaru, datový analytik, specialista na umělou inteligenci, správce sítí, specialista na kybernetickou bezpečnost, UX designér, který navrhuje, aby se aplikace dobře používaly, nebo vývojář her; informatici ve výzkumu zkoumají teoretické základy výpočtů a algoritmů. Informatika se uplatňuje i v medicíně, biologii nebo umění a práce většinou probíhá v týmech. Například na vývoji mobilní hry se podílejí programátoři, grafici, herní designéři, testeři i správci serverů.
  zdroj_popisu: nový (podle glosáře Wikipedie)
  stav: draft
