  - id: data-databaze-nosql-a-dokumentove-databaze
    nazev: NoSQL a dokumentové databáze
    tema: data-databaze
    oblast: informacni-systemy
    kompetence: kdi-vin
    vrstva: navazujici
    popis: Ne všechno se hodí do tabulek — NoSQL databáze ukládají data volněji (třeba jako dokumenty), což se hodí pro obsah, který nemá pevný tvar. Jiný nástroj na jiný druh dat.
    rvp: []
    cile:
      - uroven: porozumeni
        text: Žák vysvětlí, čím se dokumentová (NoSQL) databáze liší od tabulkové a pro jaký druh dat se hodí.
        rocnik: 9
