  - id: data-databaze-kodovani-dat
    nazev: Kódování dat, jejich účel a přenos
    tema: data-databaze
    oblast: data-modelovani
    kompetence: null
    vrstva: core
    popis: Kódování je způsob, jak podle daných pravidel reprezentovat data, aby je počítač mohl ukládat, přenášet a zpracovávat. Například určuje, jak jsou pomocí bitů reprezentovány znaky, barvy nebo zvuk. Různé typy kódování volíme podle toho, zda potřebujeme ušetřit místo, zachovat kvalitu, nebo data zabezpečit. Speciálním případem je komprese dat, která může být bezeztrátová, kdy lze původní data přesně obnovit, nebo ztrátová, kdy se část informace vypouští.
    rvp:
      - kod: INF-INF-001-ZV9-002
        vystup: navrhuje a porovnává různé způsoby kódování dat s cílem jejich uložení a přenosu
    cile:
      - uroven: porozumeni
        text: Žák vysvětlí účel a princip kódování dat (pro uložení a přenos) a uvede příklady různých způsobů kódování (např. text, obrázky, zvuk, binární kód).
        rocnik: 6–7
      - uroven: analyza
        text: Žák u předložené sady dat zdůvodní výhody a nevýhody použitých způsobů kódování pro jejich přenos či uložení.
        rocnik: 8–9
      - uroven: tvorba
        text: Žák navrhne vhodný způsob kódování dat pro konkrétní situaci (např. úspora místa, bezpečnost přenosu, reprezentace informací).
        rocnik: 9
    kriteria:
      - uroven: porozumeni
        text: Žák objasní, proč se data kódují, a popíše alespoň dva různé způsoby kódování dat pro uložení nebo přenos.
      - uroven: analyza
        text: Žák porovná různé způsoby kódování (např. textové formáty vs. binární, komprimované vs. nekomprimované) z hlediska efektivity uložení a přenosu a zdůvodní výběr nejvhodnějšího řešení.
    prerekvizity:
      - data-databaze-strukturovana-vs-nestrukturovana-data
    souvisi: []
    tagy: []
    zdroj:
      - 'Garant: Hnízdo Data, Lenka Blehová (2026-10)'
    pokryti_glitchem: []
    stav: garant
  - id: data-databaze-sifrovani-dat
    nazev: Šifrování dat
    tema: data-databaze
    oblast: data-modelovani
    kompetence: null
    vrstva: navazujici
    popis: Šifrování je proces převodu čitelné informace (tzv. otevřeného textu) do podoby, která je nesrozumitelná pro nepovolané osoby (tzv. šifrovaného textu). Převod se provádí pomocí šifrovacího algoritmu a/nebo klíče. Zpětný převod do čitelné podoby (dešifrování) je možný s použitím inverzní procedury. Účelem šifrování je chránit obsah dat před neoprávněným přístupem.
    rvp:
      - kod: INF-INF-001-ZV9-002
        vystup: navrhuje a porovnává různé způsoby kódování dat s cílem jejich uložení a přenosu
        poznamka: rozšířeno o bezpečnostní aspekt a šifrování
      - kod: INF-INF-004-ZV9-013
        vystup: navrhne základní způsoby zabezpečení zařízení a systémů, se kterými pracuje, na základě posouzení rizik ztráty, poškození či zneužití dat
    cile:
      - uroven: porozumeni
        text: Žák vysvětlí účel šifrování dat a popíše základní princip šifrování a dešifrování pomocí algoritmu se zadaným klíčem (převod otevřeného textu na šifrovaný).
        rocnik: 7–8
      - uroven: analyza
        text: Žák posoudí situace, ve kterých je nutné data šifrovat (např. komunikace na internetu, ukládání citlivých údajů), a zhodnotí význam tajnosti klíče.
        rocnik: 8–9
      - uroven: tvorba
        text: Žák navrhne a vyzkouší jednoduchý princip utajení zprávy (např. vlastní transpoziční nebo substituční šifru) a vysvětlí jeho slabiny.
        rocnik: 9
    kriteria:
      - uroven: porozumeni
        text: Žák definuje, co je šifrovaný a nešifrovaný text, a popíše roli klíče v procesu šifrování a dešifrování.
      - uroven: analyza
        text: Žák zdůvodní, proč běžné kódování dat (např. binární zápis) nestačí k ochraně soukromí a kdy je bezpodmínečně nutné použít šifrování.
      - uroven: tvorba
        text: Žák zašifruje data podle zadaného algoritmu s daným klíčem. Žák navrhne inverzní proceduru pro dešifrování.
    prerekvizity:
      - data-databaze-kodovani-dat
    souvisi: []
    tagy: []
    zdroj:
      - 'Garant: Hnízdo Data, Lenka Blehová (2026-10)'
    pokryti_glitchem: []
    stav: garant
  - id: data-databaze-tabulky-a-relacni-model
    nazev: Tabulková evidence dat
    tema: data-databaze
    oblast: informacni-systemy
    kompetence: kdi-vin
    vrstva: core
    popis: 'Nejběžnější způsob, jak evidovat data: tabulky s řádky (záznamy) a sloupci. Každý sloupec představuje atribut (= vlastnost, kterou sledujeme – například jméno, věk nebo datum narození). Konkrétní buňka v tabulce pak ukazuje hodnotu atributu. Abys mohl s daty správně pracovat (a později je třeba efektivně čistit), je nutné rozlišovat typy dat (např. text, celé číslo, desetinné číslo, datum nebo pravdivostní hodnotu ano/ne). Tak fungují školní systémy, e-shopy i většina aplikací „na pozadí“.'
    rvp:
      - kod: INF-INF-003-ZV9-010
        vystup: pro řešení problému vytvoří tabulku evidence dat a stanoví pravidla pro práci se záznamy
    cile:
      - uroven: porozumeni
        text: Žák popíše stavbu tabulky (řádek = záznam, sloupec = vlastnost) a vysvětlí, k čemu slouží klíč propojující tabulky.
        rocnik: 8
      - uroven: aplikace
        text: Žák pro zadaný problém vytvoří tabulku evidence dat s vhodnými sloupci a stanoví pravidla pro zápis záznamů.
        rocnik: 8
    kriteria:
      - uroven: porozumeni
        text: Žák u ukázkové tabulky správně označí, co je záznam, atribut, jeho hodnota a u vybraných sloupců správně určí a odůvodní jejich datový typ.
      - uroven: aplikace
        text: Žákem vytvořená tabulka má smysluplné sloupce, jednotný formát záznamů a určený klíč pro práci se záznamy.
    prerekvizity:
      - data-databaze-strukturovana-vs-nestrukturovana-data
    souvisi: []
    tagy:
      - teoretický základ
    zdroj:
      - RVP_revidované_2024-03-28.pdf, s. 54–55
      - 'Garant: Hnízdo Data, Lenka Blehová (2026-10)'
    pokryti_glitchem: []
    stav: garant
  - id: data-databaze-provazanost-tabulek
    nazev: Provázanost tabulek a relační model
    tema: data-databaze
    oblast: informacni-systemy
    kompetence: kdi-vin
    vrstva: navazujici
    popis: Reálné informační systémy zřídka vystačí s jedinou tabulkou. Abychom nemuseli data opakovat (redundance) a předešli chybám, rozvolňujeme data do více specializovaných tabulek. Tyto tabulky mezi sebou propojujeme pomocí klíčů (jedinečných identifikátorů záznamu, např. ID žáka, Číslo objednávky). Vzniká tak relační model, který tvoří základ složitějších databází školních systémů či e-shopů.
    rvp:
      - kod: INF-INF-003-ZV9-010
        vystup: Pro řešení problému vytvoří tabulku evidence dat a stanoví pravidla pro práci se záznamy.
        poznamka: případně navazující výstupy pro databáze/informační systémy
    cile:
      - uroven: porozumeni
        text: Žák vysvětlí, proč je výhodnější rozdělit rozsáhlá data do více tabulek, a popíše princip klíče jako nástroje pro propojování záznamů mezi tabulkami.
        rocnik: 8
      - uroven: aplikace
        text: Žák na jednoduchém příkladu z praxe (např. Žák – Třída nebo Zákazník – Objednávka) navrhne propojení dvou tabulek pomocí společného klíče.
        rocnik: 8
    kriteria:
      - uroven: porozumeni
        text: Žák v modelu dvou propojených tabulek správně ukáže klíčové sloupce a vysvětlí, který záznam z jedné tabulky odpovídá záznamu v druhé tabulce.
      - uroven: aplikace
        text: Žák doplní do tabulek vhodný identifikační klíč tak, aby bylo možné jednoznačně propojit související data bez nutnosti opakovat celé textové informace.
    prerekvizity:
      - data-databaze-tabulky-a-relacni-model
    souvisi: []
    tagy: []
    zdroj:
      - 'Garant: Hnízdo Data, Lenka Blehová (2026-10)'
    pokryti_glitchem: []
    stav: garant
  - id: data-databaze-vizualizace-a-volba-grafu
    nazev: Vizualizace a tvorba grafu
    tema: data-databaze
    oblast: data-modelovani
    kompetence: kdi-dat
    vrstva: core
    popis: Cílem vizualizace dat je čitelnější a srozumitelnější náhled na data – lepší porozumění, odhalení souvislostí a případných chyb. Důležitá je přehlednost a čitelnost grafu. Dobrý graf udělá z dat srozumitelný příběh – je-li přehledný a dobře čitelný. Je třeba zvolit správný typ grafu (procesní a strukturální na postupy a hierarchie, relační a síťový na vztahy, spojnicový na vývoj v čase, sloupcový na porovnání) a popisky, vazby, osy, měřítka. Špatně zvolený nebo zmanipulovaný graf umí naopak klamat.
    rvp:
      - kod: INF-INF-001-ZV9-003
        vystup: modeluje situace různými způsoby, včetně grafů nebo obdobných schémat
    cile:
      - uroven: aplikace
        text: Žák pro daná data vytvoří graf vhodného typu a vysvětlí důvody volby.
        rocnik: 8
      - uroven: analyza
        text: Žák u předloženého grafu najde zavádějící prvek (například špatná vazba, nelogické uspořádání, useknutá osa, špatné měřítko, …) a předpoví, k jakému mylnému závěru čtenáře svede.
        rocnik: 9
    kriteria:
      - uroven: aplikace
        text: Žák zvolí typ grafu odpovídající povaze dat a správně popíše prvky grafu (vazby, osy, měřítka, …)
      - uroven: analyza
        text: Žák v zavádějícím grafu označí konkrétní manipulaci a předpoví její účinek na čtení.
      - uroven: tvorba
        text: Žák pro daná data zformuluje výzkumnou otázku, zkontroluje, že data poskytují potřebné informace a ty pak vizualizuje pomocí grafu. Svoje volby grafického znázornění zdůvodní.
    prerekvizity:
      - data-databaze-datovy-cyklus
    souvisi: []
    tagy:
      - důvěra a ověřování
      - praktická dovednost
    zdroj:
      - RVP_revidované_2024-03-28.pdf, s. 54–55
      - 'Garant: Hnízdo Data, Lenka Blehová (2026-10)'
    pokryti_glitchem: []
    stav: garant
  - id: data-databaze-dotazovani-sql
    nazev: Dotazování (SQL)
    tema: data-databaze
    oblast: informacni-systemy
    kompetence: kdi-vin
    vrstva: navazujici
    popis: SQL je jazyk, kterým se databáze ptáš na to, co potřebuješ („vyber všechny žáky z 8.A"). Základní příkazy (SELECT, WHERE, JOIN) umí data filtrovat, propojovat a vybírat z tabulek.
    rvp:
      - kod: INF-INF-003-ZV9-011
        vystup: v evidenci dat nastavuje zobrazení dat a používá funkce pro automatické zpracování dat s cílem řešit potřeby uživatelů
    cile:
      - uroven: porozumeni
        text: Žák popíše, k čemu slouží příkazy SELECT, WHERE a JOIN při práci s tabulkovými daty.
        rocnik: 9
      - uroven: aplikace
        text: Žák pomocí jednoduchého dotazu (SELECT, WHERE) vybere z tabulky záznamy splňující zadanou podmínku a nastaví tak požadované zobrazení dat.
        rocnik: 9
    kriteria:
      - uroven: porozumeni
        text: Žák u každého ze tří příkazů (SELECT, WHERE, JOIN) uvede, co s daty dělá.
      - uroven: aplikace
        text: Žák sestaví dotaz, který vrátí právě požadované záznamy (např. všechny žáky z 8.A).
    prerekvizity:
      - data-databaze-tabulky-a-relacni-model
      - data-databaze-strukturovana-vs-nestrukturovana-data
    souvisi: []
    tagy:
      - praktická dovednost
    zdroj:
      - RVP_revidované_2024-03-28.pdf, s. 54–55
    pokryti_glitchem: []
    stav: draft
  - id: data-databaze-ucel-informacnich-systemu
    nazev: Informační systémy
    tema: data-databaze
    oblast: informacni-systemy
    kompetence: kdi-vin
    vrstva: core
    popis: Informační systém je software, který eviduje a zpracovává data pro určitou potřebu — například školní matrika, rezervační systém nebo e-shop. K datům přistupují různí uživatelé v různých rolích (např. žák, učitel, rodič, zákazník, administrátor), přičemž každá role má nastavená jiná přístupová práva (co může vidět, vkládat nebo upravovat). Umět posoudit, k čemu systém slouží, kdo a jak v něm s daty pracuje a zda je systém pro svůj účel opravdu užitečný, patří k základní digitální gramotnosti.
    rvp:
      - kod: INF-INF-003-ZV9-009
        vystup: Posoudí účel a užitečnost informačních systémů, které používá.
    cile:
      - uroven: porozumeni
        text: Žák na příkladu konkrétního informačního systému (např. Bakaláři/Edookit, e-shop) vysvětlí jeho účel, popíše, jaké druhy dat eviduje, a rozliší různé uživatelské role a jejich práva k datům (co která role vidí a může měnit).
        rocnik: 8
      - uroven: hodnoceni
        text: Žák posoudí účel a užitečnost vybraného informačního systému i z pohledu jeho různých uživatelů (zda systém usnadňuje práci/přístup k informacím všem cílovým rolím).
        rocnik: 9
    kriteria:
      - uroven: porozumeni
        text: Žák u konkrétního informačního systému uvede jeho hlavní účel, typy uchovávaných dat, způsob jejich použití a správně pojmenuje alespoň dvě uživatelské role včetně rozdílu v jejich oprávněních (např. žák známky pouze vidí, učitel je může i zapisovat).
      - uroven: hodnoceni
        text: Žák zformuluje alespoň jeden argument pro a jeden proti užitečnosti daného systému s ohledem na jeho uživatele a jejich potřeby.
    prerekvizity:
      - data-databaze-tabulky-a-relacni-model
    souvisi: []
    tagy:
      - dopad na společnost
      - teoretický základ
    zdroj:
      - RVP_revidované_2024-03-28.pdf, s. 54–55
      - 'Garant: Hnízdo Data, Lenka Blehová (2026-10)'
