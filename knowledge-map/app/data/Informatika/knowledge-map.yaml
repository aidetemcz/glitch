  - id: programovani-ladeni-a-testovani
    nazev: Ladění
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: |-
      Pokud se program nechová podle očekávání, hledáme příčinu problému a opravujeme ji. Tento postup označujeme jako ladění.

      Příčina problému může být v jiné části programu, než kde se problém projeví. Při ladění proto nestačí odstranit pouze viditelný projev problému. Je potřeba najít jeho příčinu a opravit ji.

      Při ladění můžeme sledovat vykonávání programu krok po kroku, hodnoty proměnných nebo si nechat zobrazovat pomocné informace – ladicí výstupy. Porovnáváme přitom skutečný průběh programu s tím, co jsme očekávali.

      Po provedení opravy je potřeba program znovu důkladně otestovat. Nestačí zopakovat pouze test, který chybu odhalil. Provedená oprava mohla ovlivnit i jiné části programu.
    rvp:
      - kod: INF-INF-002-ZV9-008
        vystup: Průběžně ověřuje správnost vytvářeného postupu, zkouší program, opravuje chyby, posoudí efektivitu postupu, programu.
        poznamka: přímá vazba na „opravuje chyby“. Metodická podpora požaduje systematické hledání chybných míst, jejich opravu a přepracování částí programu; uvádí také krokování programu.
    cile:
      - uroven: porozumeni
        text: Žák chápe, že příčina problému může být v jiné části programu, než kde se problém projeví, a že při ladění je potřeba příčinu problému najít a opravit.
      - uroven: aplikace
        text: Žák používá jednoduché postupy ladění ke sledování průběhu programu.
      - uroven: analyza
        text: Žák sleduje průběh programu, porovnává jej s očekávaným průběhem a na základě zjištěných rozdílů hledá příčinu problému.
      - uroven: tvorba
        text: Žák nalezenou chybu opraví a následně program znovu otestuje.
    kriteria:
      - text: Žák sleduje průběh programu, porovnává jej s očekávaným průběhem a hledá příčinu problému, která může být jinde než jeho projev.
      - text: Žák při hledání chyby použije vhodný způsob ladění, například krokování, sledování hodnot proměnných nebo ladicí výstupy.
      - text: Žák nalezenou příčinu problému opraví.
      - text: Žák po opravě program znovu otestuje různými testy, aby ověřil nejen odstranění nalezené chyby, ale i to, zda oprava nezpůsobila problém jinde.
    prerekvizity:
      - programovani-testovani
