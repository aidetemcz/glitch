    kompetence: kdi-dat
    vrstva: core
    popis: Strukturovaná data mají jasný řád (tabulka s řádky a sloupci), nestrukturovaná ho nemají (volný text, fotky, videa). Každý druh se ukládá i zpracovává jinak — a nestrukturovaných dat je dnes většina.
    rvp:
      - kod: INF-INF-001-ZV9-001
        vystup: získá z dat informace, interpretuje data získaná pro řešení konkrétního problému
      - kod: INF-INF-001-ZV9-003
        vystup: modeluje situace různými způsoby, včetně grafů nebo obdobných schémat
      - kod: INF-INF-001-ZV9-004
        vystup: natrénuje model strojového učení
    cile:
      - uroven: porozumeni
        text: Žák porovná strukturovaná a nestrukturovaná data a ke každému typu uvede příklad a způsob uložení (místo, formát nebo datovou strukturu, ve které jsou data fyzicky či logicky uspořádána a uložena, aby se s nimi dalo dále pracovat).
        rocnik: 7
      - uroven: analyza
        text: Žák u předložené sady dat (tabulka, fotka, volný text) rozliší, která data jsou strukturovaná a která nestrukturovaná.
        rocnik: 8
