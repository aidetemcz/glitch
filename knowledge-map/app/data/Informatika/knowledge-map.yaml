  - id: programovani-zapis-programu
    nazev: Zápis programu
    tema: programovani
    oblast: algoritmizace
    kompetence: null
    vrstva: core
    popis: Program zapisujeme v programovacím jazyce. Zápis programu označujeme jako kód programu. Existují různé programovací jazyky, které se liší způsobem zápisu i tím, pro jaké účely jsou vhodné. Každý programovací jazyk má pravidla, podle kterých se kód programu zapisuje. Pravidla určující správný zápis označujeme jako syntaxi. Pokud nejsou pravidla zápisu dodržena, počítač nedokáže kód programu správně zpracovat.
    rvp:
      - kod: INF-INF-002-ZV9-007
        vystup: v blokově orientovaném programovacím jazyce vytvoří přehledný program, používá opakování, větvení programu, proměnné
        poznamka: tvorba programu v programovacím jazyce.
    cile:
      - uroven: porozumeni
        text: Žák chápe, že program se zapisuje v programovacím jazyce a že různé programovací jazyky se mohou lišit způsobem zápisu a být vhodné pro různé účely.
      - uroven: porozumeni
        text: Žák chápe, že každý programovací jazyk má pravidla zápisu – syntaxi – která je nutné dodržovat, aby mohl být program vykonán.
      - uroven: aplikace
        text: Žák vyhledá v dostupné nápovědě informace o správném zápisu v používaném programovacím jazyce.
    kriteria:
      - text: Žák vysvětlí, co označujeme jako kód programu.
      - text: Žák uvede příklady různých programovacích jazyků a chápe, že se mohou lišit způsobem zápisu a vhodností pro různé účely.
      - text: Žák vysvětlí, proč je při zápisu programu nutné dodržovat syntaktická pravidla.
      - text: Žák ví, kde může vyhledat pravidla používaného programovacího jazyka.
      - text: Žák v nápovědě vyhledá informaci potřebnou ke správnému zápisu konkrétní části kódu programu.
    duraz: |-
      Není cílem učit definici syntaxe ani podrobně porovnávat programovací jazyky. Podstatné je, aby žák chápal, že programovací jazyk má přesně stanovená pravidla zápisu, která při tvorbě kódu programu musí respektovat. Pojem syntaxe slouží k pojmenování těchto pravidel.

      Žák se nemusí pravidla zápisu učit zpaměti. Důležité je, aby věděl, kde potřebné informace najít a jak s nápovědou pracovat.
