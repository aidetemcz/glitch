areas:
- id: data-modelovani
  nazev: Data, informace a modelování
  kod: INF-INF-001
  popis: 'S daty pracují počítače i my, když přemýšlíme. Informace zpřesňují naše představy o světě a tím nám pomáhají správně se rozhodovat. Řadu podrobností přitom pomíjíme a pracujeme jen s tím, co je pro danou situaci důležité. Vznikají tak zjednodušující reprezentace, modely. Abychom je mohli ukládat a spolehlivě a levně přenášet a kopírovat, kódujeme je do posloupností znaků – písmen, nul a jedniček atp.


    V informatice se žák učí nejen využívat hotové modely, ale také vytvářet nové. Postupuje při tom cílevědomě, sleduje záměr vyřešit daný problém, hledá rovnováhu mezi rozsahem a složitostí modelu a jednoduchostí jeho použití. Hodnotí spolehlivost získávaných informací a míru jistoty, s jakou se podle nich může rozhodovat. Nalézání efektivních reprezentací složitých skutečností je předpokladem úspěšné komunikace, učení i řešení problémů.


    Na 1. stupni si žák začíná všímat dat kolem sebe a reflektuje, jak mu mohou být užitečná. Tvoří první schematické modely situací a využívá je k získání informací.


    Na 2. stupni už se žák seznamuje s pokročilejším kódováním a modely, které sám tvoří, včetně grafů a trénování modelů strojového učení. Zvyká si na to, že informace jsou správné jen s určitou pravděpodobností.'
  barva: '#ffff00'
- id: algoritmizace
  nazev: Algoritmizace a programování
  kod: INF-INF-002
  popis: 'Žák se prováděním postupů učí získávat výsledky konkrétních úloh. V informatice pak zaměřuje pozornost na postupy jako takové. Zjišťuje, jak se postupy vedoucí ke stejným výsledkům mohou mezi sebou lišit, tvoří a popisuje postupy vlastní. Všímá si toho, že některé jsou spolehlivější než jiné a co tu spolehlivost určuje. Jejich kvalitní formulace může vyřešit celou skupinu podobných problémů.


    Postupy žák zapisuje i jako programy, čímž se učí pracovat s omezenou sadou instrukcí a doslovnou interpretací svých výstupů. Kromě toho získává povědomí o základech fungování běžně používaných aplikací. Cílevědomé plánování pracovních postupů je příležitost k rozvoji strukturovaného přístupu k řešení problémů. Jejich jednoznačný a úsporný popis vyžaduje komunikační dovednosti. Automatizovatelnost postupů je předpokladem uplatnitelnosti v práci a podnikání.


    Na 1. stupni žák zkoumá souvislosti vstupů, podmínek, postupů a výstupů, navrhuje jednoduché posloupnosti kroků a zažívá, jak může programováním určovat chování stroje.


    Na 2. stupni se žák setkává se složitějšími problémy, do programování přibývají další řídicí struktury. Všímá si výhod a důsledků automatizace svých postupů.'
  barva: '#ffffff'
- id: informacni-systemy
  nazev: Informační systémy
  kod: INF-INF-003
  popis: 'Řadu potřeb společnosti pomáhají plnit informační systémy. Lidé je nevyhnutelně využívají, vypořádávají se s jejich nedostatky, mají požadavky na jejich chování. Většina lidí také nějaké evidence sama tvoří, v osobním i pracovním životě (seznam k balení na výlet, evidence zakázek k vyřízení). Výhodu v tom mají ti, kteří mají na základě praktické zkušenosti představu o tom, jak takové systémy vnitřně fungují, jak se vyvíjejí, co mohou pomoci řešit a co už nikoli. Iterativní vývoj a testování řešení se zaměřením na potřeby klienta je znakem užitečných podniků. Uživatelské rozhraní informačních systémů je komunikačním kanálem. Důsledky fungování řady systémů ovlivňují celou občanskou společnost.


    Na 1. stupni žák začíná informační systémy zkoumat. Kromě práce s uživatelským rozhraním se učí orientovat i přímo v tabulkách a podobných strukturách.


    Na 2. stupni žák svůj průzkum prohlubuje a kromě významu pro uživatele precizněji popisuje, co přesně systémy dělají. Pro řešení konkrétních problémů tvoří také vlastní evidence dat.'
  barva: '#ffff00'
- id: digitalni-technologie
  nazev: Digitální technologie
  kod: INF-INF-004
  popis: 'Digitální technologie poskytují konkrétní příklady principů, které žák zkoumá v ostatních okruzích. Dohromady se tak žák učí rozumět tomu, jak technologie a svět kolem něj fungují a jaké to má praktické důsledky. Je to jedním z předpokladů pro to, aby je mohl bezpečně a efektivně využívat v běžném životě. Porozumění principům fungování technologií mimo jiné umožňuje hodnotit, jak ovlivňují společnost a jak jejich provoz dopadá na životní prostředí. Rozšiřuje možnosti žáků využívat je k rutinní i tvořivé práci.


    Na 1. stupni se žák zaměřuje na základní porozumění funkcím digitálních technologií, jejich vhodné využití pro řešení problémů a na pravidla bezpečného používání aplikací a sítí.


    Na 2. stupni se výuka prohlubuje o další technické znalosti a dovednosti, které umožní poučeně vybírat hardware, software a propojení do sítě a řešit pokročilejší problémy. Kromě bezpečnosti se žák v bohatých souvislostech věnuje také inovacím.'
  barva: '#ffffff'
temata:
- id: digitalni-zaklady
  nazev: Digitální základy
  vrstva_mapy: 0
  popis: 'Digitální základy jsou vstupní vrstva celé mapy — vysvětlují, jak vlastně funguje svět, ve kterém se všechno ostatní odehrává. Žák tu získá mentální model počítače (hardware a software), internetu a sítí (klient–server), cloudu a serverů i toho, jak spolu programy mluví přes API a jak se data kódují, aby šla uložit a přenášet. Nejde o to stát se technikem, ale o demystifikaci: když víš, že „cloud" je jen cizí počítač a že appka volá službu přes API, přestává být digitální svět kouzelná černá skříňka. Na těchto základech pak stojí Tvorba webů, Tvorba aplikací, Data i Umělá inteligence — proto je téma v mapě úplně na začátku.'
  barva: '#ffffff'
  navazuje_na: []
- id: informaticke-mysleni
  nazev: Informatické myšlení a algoritmizace
  vrstva_mapy: 0
  popis: Tohle téma učí univerzální způsob přemýšlení, který je jádrem celé informatiky a nezávisí na žádném programovacím jazyce. Žák se učí rozložit velký problém na menší části (dekompozice), odfiltrovat nepodstatné detaily (abstrakce), všímat si opakujících se vzorů a popsat řešení jako jednoznačný postup krok za krokem (algoritmus) složený ze sekvence, větvení a opakování. Tyhle dovednosti se v mapě vracejí prakticky všude — v programování, práci s daty, robotice i při přemýšlení o AI — proto stojí hned vedle Digitálních základů jako druhý pilíř, na kterém teprve začíná skutečná tvorba.
  barva: '#ffff00'
  navazuje_na: []
- id: programovani
  nazev: Programování
  vrstva_mapy: 1
  popis: Programování je krok od myšlenky ke kódu, který počítač skutečně vykoná. Žák tu poznává stavební kameny každého programu — proměnné, podmínky, cykly a funkce — a hlavně dovednost ladit, tedy hledat a opravovat chyby. Postupuje od blokového prostředí (Scratch) k textovému jazyku (Python) a učí se pracovat s verzováním i s cizím, dnes často AI vygenerovaným kódem; v éře AI se totiž těžiště přesouvá od „napiš každý řádek ručně" k „rozuměj, uprav a odlaď". Programování navazuje na Informatické myšlení a je branou k tvůrčím tématům mapy — webům, aplikacím, hrám i robotice.
  barva: '#ffffff'
  navazuje_na:
  - informaticke-mysleni
  - digitalni-zaklady
- id: umela-inteligence
  nazev: Umělá inteligence
  vrstva_mapy: 2
  popis: Umělá inteligence je v mapě samostatné téma, protože prostupuje celou dnešní informatikou — a zároveň se jako průřezová vrstva vrací u mnoha dalších témat. Žák se tu učí, co AI je a co není, jak se učí z dat a proč generativní modely umí „halucinovat", jak s AI účelně pracovat (prompty, ověřování výstupů) a jak ji používat kriticky a eticky (bias, soukromí, kdy AI raději nepoužít). Řídící myšlenkou je „ověřuj, ale využívej" a vědomí, že rozhoduje pořád člověk, ne nástroj. Téma staví na Digitálních základech a úzce se prolíná s Daty, protože kvalita dat určuje, co z AI vypadne.
  barva: '#ffff00'
  navazuje_na:
  - digitalni-zaklady
  - data-databaze
- id: data-databaze
  nazev: Data, databáze a datová gramotnost
  vrstva_mapy: 1
  popis: 'Data jsou surovinou informací i palivem umělé inteligence, a tohle téma učí s nimi zacházet — od kritického čtení až po technické uložení. Žák pochopí datový cyklus (sběr → čištění → analýza → vizualizace → interpretace), naučí se volit správný graf, evidovat data v tabulkách a databázích a klást jim otázky (SQL). Velký důraz je na datové gramotnosti: poznat zavádějící graf, rozdíl mezi korelací a kauzalitou i to, odkud data pocházejí a co v nich chybí. Právě datová gramotnost je předstupněm gramotnosti v AI, takže tohle téma tvoří s Umělou inteligencí provázané jádro celé mapy.'
  barva: '#ffff00'
  navazuje_na:
  - digitalni-zaklady
- id: tvorba-webu
  nazev: Tvorba webů
  vrstva_mapy: 1
  popis: 'Tvorba webů je jedno z nejvděčnějších témat, protože vede k hmatatelnému, sdílitelnému výsledku — vlastní stránce na internetu. Žák pozná, jak web funguje (klient–server), i tři základní vrstvy stránky: strukturu (HTML), vzhled (CSS) a interaktivitu (JavaScript), a naučí se web publikovat přes doménu a hosting. V éře AI k tomu přibývá dovednost pracovat s nástroji, které web vytvoří z popisu — a umět jejich výstup přečíst, upravit a posoudit. Téma staví na Programování a přirozeně vede k Tvorbě aplikací.'
  barva: '#ffffff'
  navazuje_na:
  - programovani
- id: tvorba-aplikaci
  nazev: Tvorba aplikací a vibecoding
  vrstva_mapy: 1
  popis: 'Tvorba aplikací ukazuje, jak z nápadu vznikne funkční appka — a je to možná nejsilnější motivační téma éry AI. Žák pochopí rozdíl mezi tím, co vidí (frontend) a co běží na pozadí (backend), vyzkouší no-code nástroje i „vibecoding", kdy popíše záměr přirozenou řečí a AI napíše kód. Klíčové poselství tématu je, že AI je programovací parťák, ne náhrada porozumění: bez znalosti základů snadno vznikne „iluze, že to umím", dokud se něco nerozbije. Téma spojuje Programování, Tvorbu webů a Umělou inteligenci dohromady.'
  barva: '#ffffff'
  navazuje_na:
  - programovani
  - tvorba-webu
  - umela-inteligence
- id: tvorba-obsahu
  nazev: Tvorba digitálního obsahu s AI
  vrstva_mapy: 1
  popis: 'Tohle téma je o tvorbě obrazu, videa, hudby a hlasu s generativními nástroji — o oblasti, kterou AI proměnila nejdramatičtěji. Žák se učí „mluvit" s nástroji přes prompt, ale i to, že vkus a základ vizuálního jazyka (kompozice, barva, typografie) AI nenahradí — pořád musíš umět posoudit, jestli je výsledek dobrý. Neoddělitelnou součástí je etika a autorství: na čích dílech se model učil, komu patří výstup a jak poctivě označit AI obsah, plus obezřetnost kvůli deepfakes. Téma staví na Umělé inteligenci a s ohledem na bezpečí nezletilých se dotýká i Kyberbezpečnosti.'
  barva: '#ffff00'
  navazuje_na:
  - umela-inteligence
- id: herni-vyvoj
  nazev: Herní vývoj
  vrstva_mapy: 1
  popis: 'Herní vývoj je vnitřně motivující téma — žák tvoří to, co sám hraje, a výsledek jde hned sdílet. Od blokového Scratche se posouvá k lehkým i skutečným enginům (Godot, Unity) a poznává základní stavbu hry: herní smyčku, objekty, kolize, stavy a hlavně herní design (pravidla, obtížnost, zpětná vazba, „flow"). AI dnes umí generovat grafiku i kód, takže se těžiště přesouvá od ruční výroby k návrhu a kurátorství. Téma staví na Informatickém myšlení a Programování a je skvělým „hřištěm", kde se tyhle dovednosti spojí do konkrétního výtvoru.'
  barva: '#ffffff'
  navazuje_na:
  - informaticke-mysleni
  - programovani
- id: fyzicky-computing
  nazev: Fyzický computing, robotika a IoT
  vrstva_mapy: 1
  popis: 'Fyzický computing je programování, které hýbe skutečným světem — kód tu má okamžitý hmatatelný efekt. Na destičce micro:bit se žák naučí číst senzory a ovládat výstupy (LED, motory), postoupí k robotům, Arduinu a Raspberry Pi a k internetu věcí (IoT), kde zařízení posílají data do cloudu. Zvlášť cenné je, že si tu AI osahá fyzicky: v micro:bit CreateAI si sám natrénuje model přímo na zařízení (TinyML). Téma staví na Programování a propojuje ho s Daty i Umělou inteligencí; jeho přirozeným omezením je hardware, takže doma se leccos nahradí simulátory.'
  barva: '#ffffff'
  navazuje_na:
  - informaticke-mysleni
  - programovani
- id: kyberbezpecnost
  nazev: Kyberbezpečnost a digitální bezpečí
  vrstva_mapy: 3
  popis: 'Kyberbezpečnost učí, jak chránit sebe, svá data a zařízení — a v mapě má zvláštní váhu, protože bezpečí nezletilých je priorita. Žák si osvojí základní hygienu (silná hesla, 2FA, poznat phishing, chránit soukromí) a pochopí i to, jak AI posunula podvody na novou úroveň: deepfake, klonování hlasu a dokonalý phishing bez chyb, takže stará rada „poznáš to podle chyb v textu" už neplatí. Novou obranou je ověřovat informace jinou cestou a zdravá skepse. Téma se úzce prolíná s Digitálním občanstvím a s Umělou inteligencí.'
  barva: '#ffff00'
  navazuje_na:
  - digitalni-zaklady
- id: digitalni-obcanstvi
  nazev: Digitální občanství, média a wellbeing
  vrstva_mapy: 3
  popis: 'Tohle téma je „severní směr" celého Glitche: učí rozumět tomu, jak fungují sítě a algoritmy, kriticky číst obsah a udržet si zdravý vztah k technologiím. Žák pozná, jak doporučovací algoritmy tvarují, co vidí (bublina, ekonomika pozornosti), jak rozpoznat dezinformace a manipulaci, jakou hodnotu mají jeho data a jak nepodlehnout návykovému designu. Patří sem i občanské minimum o AI (proč modely halucinují a mají bias) a etika jejího používání ve škole. Cílem není technologie zavrhnout, ale používat je vědomě a tak, aby sloužily člověku — což je hodnota, na které stojí celá mapa.'
  barva: '#ffff00'
  navazuje_na: []
