concepts:
  - id: digitalni-zaklady-hardware-a-software
    nazev: Hardware a software
    tema: digitalni-zaklady
    oblast: digitalni-technologie
    kompetence: null
    vrstva: core
    popis: 'Hardware jsou fyzické součástky, na které si můžeš sáhnout (procesor, paměť, displej); software jsou programy, které v nich běží. Každý počítač i telefon přitom pracuje ve smyčce vstup → zpracování → výstup: dostane data, něco s nimi udělá a vrátí výsledek.'
    rvp:
      - kod: INF-INF-004-ZV9-011
        vystup: vybírá pro své potřeby hardware, software a způsob připojení digitálních zařízení do sítě na základě porozumění jejich vlastnostem
    cile:
      - uroven: porozumeni
        text: Žák vysvětlí vlastními slovy rozdíl mezi hardwarem a softwarem na konkrétním příkladu zařízení.
        rocnik: 6
      - uroven: hodnoceni
        text: Žák podle zadaných potřeb doporučí vhodný hardware a software a svůj výběr zdůvodní jejich vlastnostmi.
        rocnik: 8
    kriteria:
      - uroven: porozumeni
        text: Žák u konkrétního zařízení určí, které části jsou hardware a které software, a doplní příklad smyčky vstup → zpracování → výstup.
      - uroven: hodnoceni
        text: Žák pro zadanou situaci vybere zařízení a v jedné větě zdůvodní volbu jeho vlastností.
