<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>Mapa informatických konceptů</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/map.css?v=28">
</head>
<body>
  <div id="app">

    <!-- Ovládací panel: hledání + filtry -->
    <aside id="controls">
      <header class="controls-head">
        <div class="controls-head-text">
          <h1>Mapa informatických konceptů</h1>
          <p class="subtitle">Informatika · 2. stupeň ZŠ</p>
        </div>
        <button id="about-btn" class="info-btn" aria-label="O mapě informatických konceptů" title="O mapě informatických konceptů">i</button>
      </header>

      <div class="control-block">
        <div class="viewtoggle" id="viewtoggle">
          <button class="vt-btn active" data-view="tema">Témata</button>
          <button class="vt-btn" data-view="oblast">RVP oblasti</button>
          <button class="vt-btn" data-view="kompetence">Digitální kompetence</button>
        </div>
      </div>

      <div class="control-block">
        <input type="search" id="search" placeholder="Hledej koncept…" autocomplete="off">
      </div>

      <div class="control-block">
        <div class="control-label" id="group-label">Téma</div>
        <div id="filter-group" class="chips"></div>
      </div>

      <div class="control-block">
        <div class="control-label">Vrstva</div>
        <div id="filter-vrstva" class="chips">
          <button class="chip" data-filter="vrstva" data-val="core" aria-pressed="true">Core</button>
          <button class="chip" data-filter="vrstva" data-val="navazujici" aria-pressed="true">Navazující</button>
        </div>
      </div>

      <div class="control-block">
        <div class="control-label">Stav</div>
        <div id="filter-stav" class="chips">
          <button class="chip" data-filter="stav" data-val="draft" aria-pressed="true">Draft</button>
          <button class="chip" data-filter="stav" data-val="hotovo" aria-pressed="true">Hotovo</button>
        </div>
      </div>

      <div class="control-block">
        <div class="control-label">Vazby</div>
        <div id="filter-edge" class="chips">
          <button class="chip" data-filter="edge" data-val="prereq" aria-pressed="true">Prerekvizity</button>
          <button class="chip" data-filter="edge" data-val="related" aria-pressed="true">Souvisí</button>
        </div>
      </div>

      <div class="control-block">
        <div class="control-label">Optika — proč na tom záleží</div>
        <div id="filter-tagy-optika" class="chips"></div>
        <div class="control-label" style="margin-top:12px">Povaha konceptu</div>
        <div id="filter-tagy-povaha" class="chips"></div>
      </div>

      <div class="control-block">
        <button id="reset" class="reset-btn">Zrušit filtry</button>
      </div>

      <div class="legend">
        <div class="legend-row"><span class="legend-line dashed"></span> prerekvizita</div>
        <div class="legend-row"><span class="legend-line dotted"></span> souvisí</div>
        <div class="legend-row"><span class="legend-outline"></span> cluster (téma / oblast)</div>
        <div class="legend-row"><span class="legend-dot"></span> core koncept</div>
        <div class="legend-row"><span class="legend-dot ring"></span> navazující</div>
      </div>
    </aside>

    <!-- Graf -->
    <main id="cy"></main>

    <!-- Detail bubliny -->
    <aside id="detail" class="hidden" aria-live="polite">
      <button id="detail-close" aria-label="Zavřít">✕</button>
      <div id="detail-body"></div>
    </aside>

    <div id="status" class="status">Načítám mapu…</div>
  </div>

  <script src="js/vendor/cytoscape.min.js"></script>
  <script src="js/vendor/js-yaml.min.js"></script>
  <script src="js/map.js?v=28"></script>
</body>
</html>
